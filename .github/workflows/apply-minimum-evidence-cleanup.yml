name: Apply Minimum Evidence Cleanup

on:
  push:
    paths:
      - ".github/workflows/apply-minimum-evidence-cleanup.yml"
      - "mcp/scripts/apply-minimum-evidence-cleanup.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Repair temporary helper quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("mcp/scripts/apply-minimum-evidence-cleanup.py")
          text = p.read_text(encoding="utf-8")
          for old in [
              'completion claim."\n)',
              'conflicting views require it."\n)',
              'stage is actually reached."\n)',
              'a different format as shortcuts."\n)',
              'full-project validation ceremony."\n)',
              'acceptance scenarios exercise them."\n)',
          ]:
              new = old.replace('."\n)', '."""\n)')
              if old not in text:
                  raise SystemExit(f"Missing helper repair target: {old}")
              text = text.replace(old, new, 1)
          if text.count('"""') % 2 != 0:
              raise SystemExit("Temporary helper still has an unmatched triple-quote delimiter")
          p.write_text(text, encoding="utf-8")
          PY
      - name: Apply guarded cleanup
        run: python3 mcp/scripts/apply-minimum-evidence-cleanup.py
      - name: Install
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Tests
        working-directory: mcp
        run: bun run test
      - name: Build
        working-directory: mcp
        run: bun run build
      - name: Generate docs
        working-directory: mcp
        run: bun run ./build/docs.ts
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .agents/skills/blockit-bedrock-entity-mcp/SKILL.md \
            .agents/skills/blockbench-bedrock-modelling/SKILL.md \
            docs/foundation/03-modelling-workflow.md \
            docs/knowledge/next-action.md \
            docs/knowledge/reviews/model-creation-effectiveness-audit-2026-08-10.md \
            mcp/prompts/bedrock_entity_workflow.md \
            mcp/prompts/manifest.json \
            mcp/docs/api.json \
            mcp/docs/index.html \
            mcp/tests/model-effectiveness-sequencing.test.ts \
            mcp/tests/model-effectiveness-minimum-evidence.test.ts
          git diff --cached --quiet && { echo "No minimum-evidence changes"; exit 1; }
          git commit -m "docs: minimize modelling evidence overhead"
          git push origin HEAD:Local
