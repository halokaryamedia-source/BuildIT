name: Record P1.4 Transport Decision

on:
  push:
    paths:
      - ".github/workflows/record-p1-4-decision.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - name: Apply decision snapshot
        run: python .github/p1_4_record.py

      - name: Commit decision state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/knowledge/decision-log.md docs/knowledge/next-action.md
          git diff --cached --check
          git commit -m "docs: record MCP stateless v1 transport decision"
          git push origin Local
