name: Apply Material Instance Identity

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/apply-material-instance-identity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply deterministic Cube identity ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('mcp/server/tools/material-instances.ts')
          text = source_path.read_text(encoding='utf-8')
          old_import = 'import { findElementOrThrow } from "@/lib/util";'
          new_import = 'import { resolveCoreCube } from "@/lib/coreIdentity";'
          if text.count(old_import) != 1:
              raise SystemExit('Unexpected material instance identity import')
          text = text.replace(old_import, new_import, 1)

          old_helper = 'function findCubeOrThrow(id: string): Cube {\n  const element = findElementOrThrow(id);\n  if (!(element instanceof Cube)) {\n    throw new Error(`Element "${id}" is not a cube. Material instances are only supported on cube faces.`);\n  }\n  return element;\n}'
          new_helper = 'function findCubeOrThrow(id: string): Cube {\n  return resolveCoreCube(\n    id,\n    "Use list_outline or find_elements_by_criteria to confirm the intended Cube UUID before changing material instances."\n  );\n}'
          if text.count(old_helper) != 1:
              raise SystemExit('Unexpected findCubeOrThrow helper shape')
          text = text.replace(old_helper, new_helper, 1)

          text = text.replace('"ID or name of the cube. If not provided, uses the first selected cube."', '"Exact Cube UUID or exact unique Cube name. If omitted, uses the first selected Cube."', 1)
          text = text.replace('"ID or name of the cube. If not provided, applies to all selected cubes."', '"Exact Cube UUID or exact unique Cube name. If omitted, applies to all selected Cubes."', 1)
          text = text.replace('"ID or name of the cube. If not provided, clears from all selected cubes."', '"Exact Cube UUID or exact unique Cube name. If omitted, clears from all selected Cubes."', 1)
          source_path.write_text(text, encoding='utf-8')

          test_path = Path('mcp/tests/p1-core-ownership.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old_read = '      readFile(new URL("../server/tools/animation.ts", import.meta.url), "utf8"),\n      readFile(new URL("../lib/util.ts", import.meta.url), "utf8"),'
          new_read = '      readFile(new URL("../server/tools/animation.ts", import.meta.url), "utf8"),\n      readFile(new URL("../server/tools/material-instances.ts", import.meta.url), "utf8"),\n      readFile(new URL("../lib/util.ts", import.meta.url), "utf8"),'
          if test.count(old_read) != 1:
              raise SystemExit('Unexpected core ownership caller list')
          test = test.replace(old_read, new_read, 1)
          test = test.replace('    const [cubes, elements, texture, animation, util] = await Promise.all([', '    const [cubes, elements, texture, animation, materialInstances, util] = await Promise.all([', 1)
          anchor = '    expect(animation).toContain("return resolveCoreGroup(");\n'
          addition = anchor + '    expect(materialInstances).toContain("return resolveCoreCube(");\n    expect(materialInstances).not.toContain("findElementOrThrow");\n'
          if test.count(anchor) != 1:
              raise SystemExit('Unexpected core ownership assertion anchor')
          test = test.replace(anchor, addition, 1)
          test_path.write_text(test, encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = 'Element discovery now avoids misleading or unbounded result payloads: `find_elements_by_criteria` sets `truncated=true` only after a real extra match exists, and `filter_by_material` returns at most 200 matching Cubes by default (explicitly raisable to 1000) with the same accurate truncation signal. No cursor/pagination framework was added.'
          extra = '\n\nMaterial-instance Cube targeting now uses the shared core identity contract instead of the legacy first-match helper: explicit UUID wins, exact names must be unique, and ambiguous Cube names fail before read/mutation. The change is limited to material-instance tools; the generic legacy helper was not broadened without auditing its other callers.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected element discovery continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-material-instance-identity.yml
          git add mcp/server/tools/material-instances.ts mcp/tests/p1-core-ownership.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'fix: make material instance targeting deterministic'
          git push origin HEAD:Local
