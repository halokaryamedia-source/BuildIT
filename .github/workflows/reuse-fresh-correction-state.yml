name: "Reuse Fresh Correction State"

on:
  push:
    branches: [Local]
    paths:
      - ".github/workflows/reuse-fresh-correction-state.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Replace ritual correction read with state-aware rule
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('mcp/prompts/bedrock_entity_workflow.md')
          workflow = workflow_path.read_text(encoding='utf-8')
          old = '2. `inspect_element` before numeric correction and use the authored state it returns.'
          new = '2. Reuse fresh authored state already returned for that exact target when it contains the needed fields; otherwise use `inspect_element` once before numeric correction.'
          if workflow.count(old) != 1:
              raise SystemExit('canonical correction-read anchor changed')
          workflow_path.write_text(workflow.replace(old, new, 1), encoding='utf-8')

          modelling_path = Path('.agents/skills/blockbench-bedrock-modelling/SKILL.md')
          modelling = modelling_path.read_text(encoding='utf-8')
          old = 'Before a numeric local correction, use `inspect_element` once to obtain exact authored state, then declare the smallest **invariant**:'
          new = 'Before a numeric local correction, reuse fresh exact authored state already returned for that target when sufficient; otherwise use `inspect_element` once. Then declare the smallest **invariant**:'
          if modelling.count(old) != 1:
              raise SystemExit('modelling correction-read anchor changed')
          modelling_path.write_text(modelling.replace(old, new, 1), encoding='utf-8')

          test_path = Path('mcp/tests/model-effectiveness-minimum-evidence.test.ts')
          test = test_path.read_text(encoding='utf-8')
          anchor = '    expect(foundation).toContain("no per-Cube inspect by default");\n'
          addition = '''    expect(modelling).toContain("reuse fresh exact authored state already returned for that target when sufficient");\n    expect(workflow).toContain("Reuse fresh authored state already returned for that exact target");\n    expect(workflow).not.toContain("`inspect_element` before numeric correction and use the authored state it returns");\n'''
          if test.count(anchor) != 1:
              raise SystemExit('minimum-evidence test anchor changed')
          test_path.write_text(test.replace(anchor, anchor + addition, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          anchor = 'Shared optional Texture/Animation/Cube identity inputs now require non-empty strings when explicitly supplied; only omission activates the documented selected/current fallback. This closes empty-string fallback broadening in `get_texture`/Painter and material-instance targeting while leaving the fallback capability intact. `create_texture.layer_name` is also non-empty when supplied, so `fill_color` requests cannot satisfy the layer-name requirement with a value runtime would skip. No identity framework or mutation redesign was added.'
          note = '\n\nNumeric local correction routing now reuses fresh exact authored state already returned for the target when it contains the fields required by the correction; `inspect_element` remains the one focused read when that state is absent/stale/incomplete. This replaces the old unconditional wording rather than adding another prompt exception, so the canonical prompt remains under its hard compactness budget and no cache/session state was introduced.'
          if next_text.count(anchor) != 1:
              raise SystemExit('next-action fresh-state anchor changed')
          next_path.write_text(next_text.replace(anchor, anchor + note, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate prompt manifest
        working-directory: mcp
        run: bun run prompts:build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit routing fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reuse-fresh-correction-state.yml
          git add mcp/prompts/bedrock_entity_workflow.md mcp/prompts/manifest.json .agents/skills/blockbench-bedrock-modelling/SKILL.md mcp/tests/model-effectiveness-minimum-evidence.test.ts mcp/docs/api.json mcp/docs/index.html docs/knowledge/next-action.md
          git commit -m 'docs: reuse fresh authored correction state'
          git push origin HEAD:Local
