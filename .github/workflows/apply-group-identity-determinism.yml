name: Apply Generic Group Identity Determinism

on:
  push:
    paths:
      - ".github/workflows/apply-group-identity-determinism.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Harden generic Group identity mutations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          element_path = Path("mcp/server/tools/element.ts")
          text = element_path.read_text(encoding="utf-8")

          helper_marker = "function isDescendantOf(el: { parent?: unknown }, targetGroup: Group): boolean {\n"
          helper = "\n".join([
              "export function hasCaseInsensitiveGroupNameCollision(",
              "  groups: readonly { uuid: string; name: string }[],",
              "  requestedName: string,",
              "  excludeUuid?: string",
              "): boolean {",
              "  const normalizedName = requestedName.toLowerCase();",
              "  return groups.some(",
              "    (group) =>",
              "      group.uuid !== excludeUuid && group.name.toLowerCase() === normalizedName",
              "  );",
              "}",
              "",
              "export function hasInternalCaseInsensitiveNameCollision(",
              "  names: readonly string[]",
              "): boolean {",
              "  const normalizedNames = names.map((name) => name.toLowerCase());",
              "  return new Set(normalizedNames).size !== normalizedNames.length;",
              "}",
              "",
          ])
          if text.count(helper_marker) != 1:
              raise SystemExit("Unexpected element helper insertion point")
          text = text.replace(helper_marker, helper + helper_marker, 1)

          old_add_preflight = "\n".join([
              "    }) {",
              "      const parentGroup = resolveParentGroup(parent);",
              "",
              "      Undo.initEdit({",
          ])
          new_add_preflight = "\n".join([
              "    }) {",
              "      if (hasCaseInsensitiveGroupNameCollision(Group.all, name)) {",
              "        throw new Error(",
              "          `Group name \"${name}\" collides case-insensitively with an existing Group. Bedrock animation matching is case-insensitive; use a distinct Group/bone name.`",
              "        );",
              "      }",
              "      const parentGroup = resolveParentGroup(parent);",
              "",
              "      Undo.initEdit({",
          ])
          if text.count(old_add_preflight) != 1:
              raise SystemExit("Unexpected add_group preflight shape")
          text = text.replace(old_add_preflight, new_add_preflight, 1)

          old_duplicate_header = "\n".join([
              "      function cloneCube(cube: Cube, parent: any) {",
              "        const dupe = new Cube({",
              "          name: newName || `${cube.name}_copy`,",
          ])
          new_duplicate_header = "\n".join([
              "      const rootName = (sourceName: string) =>",
              "        newName !== undefined ? newName : `${sourceName}_copy`;",
              "      const childName = (sourceName: string) => `${sourceName}_copy`;",
              "",
              "      if (element instanceof Group) {",
              "        const plannedGroupNames: string[] = [];",
              "        const collectPlannedGroupNames = (group: Group, root: boolean) => {",
              "          plannedGroupNames.push(root ? rootName(group.name) : childName(group.name));",
              "          group.children.forEach((child: any) => {",
              "            if (child instanceof Group) collectPlannedGroupNames(child, false);",
              "          });",
              "        };",
              "        collectPlannedGroupNames(element, true);",
              "",
              "        if (hasInternalCaseInsensitiveNameCollision(plannedGroupNames)) {",
              "          throw new Error(",
              "            \"Duplicating this Group would create case-insensitively duplicate Group names inside the cloned subtree. Rename the source hierarchy before duplicating.\"",
              "          );",
              "        }",
              "        const conflictingName = plannedGroupNames.find((plannedName) =>",
              "          hasCaseInsensitiveGroupNameCollision(Group.all, plannedName)",
              "        );",
              "        if (conflictingName) {",
              "          throw new Error(",
              "            `Duplicating this Group would create Group name \"${conflictingName}\", which collides case-insensitively with an existing Group. Rename the conflict or use a distinct root newName.`",
              "          );",
              "        }",
              "      }",
              "",
              "      function cloneCube(cube: Cube, parent: any, root: boolean) {",
              "        const dupe = new Cube({",
              "          name: root ? rootName(cube.name) : childName(cube.name),",
          ])
          if text.count(old_duplicate_header) != 1:
              raise SystemExit("Unexpected duplicate Cube helper shape")
          text = text.replace(old_duplicate_header, new_duplicate_header, 1)

          old_clone_group = "\n".join([
              "      function cloneGroup(group: Group, parent: any) {",
              "        const dupeGroup = new Group({",
              "          name: newName || `${group.name}_copy`,",
          ])
          new_clone_group = "\n".join([
              "      function cloneGroup(group: Group, parent: any, root: boolean) {",
              "        const dupeGroup = new Group({",
              "          name: root ? rootName(group.name) : childName(group.name),",
          ])
          if text.count(old_clone_group) != 1:
              raise SystemExit("Unexpected duplicate Group helper shape")
          text = text.replace(old_clone_group, new_clone_group, 1)

          old_recursive = "\n".join([
              "        group.children.forEach((child: any) => cloneElement(child, dupeGroup));",
              "        return dupeGroup;",
              "      }",
              "",
              "      function cloneElement(el: any, parent: any) {",
              "        if (el instanceof Cube) return cloneCube(el, parent);",
              "        if (el instanceof Group) return cloneGroup(el, parent);",
          ])
          new_recursive = "\n".join([
              "        group.children.forEach((child: any) =>",
              "          cloneElement(child, dupeGroup, false)",
              "        );",
              "        return dupeGroup;",
              "      }",
              "",
              "      function cloneElement(el: any, parent: any, root: boolean) {",
              "        if (el instanceof Cube) return cloneCube(el, parent, root);",
              "        if (el instanceof Group) return cloneGroup(el, parent, root);",
          ])
          if text.count(old_recursive) != 1:
              raise SystemExit("Unexpected duplicate recursion shape")
          text = text.replace(old_recursive, new_recursive, 1)

          old_root_clone = "        dup = cloneElement(element, element.parent ?? Outliner);"
          new_root_clone = "        dup = cloneElement(element, element.parent ?? Outliner, true);"
          if text.count(old_root_clone) != 1:
              raise SystemExit("Unexpected duplicate root invocation")
          text = text.replace(old_root_clone, new_root_clone, 1)

          old_rename = "\n".join([
              "    async execute({ id, new_name }) {",
              "      const element = resolveUniqueDestructiveElement(id);",
              "      Undo.initEdit({",
          ])
          new_rename = "\n".join([
              "    async execute({ id, new_name }) {",
              "      const element = resolveUniqueDestructiveElement(id);",
              "      if (new_name === element.name) {",
              "        throw new Error(",
              "          `Element \"${element.name}\" already has that exact name; rename requires an authored name change.`",
              "        );",
              "      }",
              "      if (",
              "        element instanceof Group &&",
              "        hasCaseInsensitiveGroupNameCollision(Group.all, new_name, element.uuid)",
              "      ) {",
              "        throw new Error(",
              "          `Group name \"${new_name}\" collides case-insensitively with another Group. Bedrock animation matching is case-insensitive; choose a distinct Group/bone name.`",
              "        );",
              "      }",
              "      Undo.initEdit({",
          ])
          if text.count(old_rename) != 1:
              raise SystemExit("Unexpected rename_element mutation shape")
          text = text.replace(old_rename, new_rename, 1)

          text = text.replace(
              '  newName: z.string().optional(),',
              '  newName: z.string().min(1).optional().describe("Optional name for the duplicated target root only; descendant names are derived from their own source names."),',
              1,
          )
          text = text.replace(
              '  new_name: z.string().describe("New name to assign."),',
              '  new_name: z.string().min(1).describe("New name to assign; exact no-op renames are rejected."),',
              1,
          )

          old_add_description = "      \"Adds a Group with neutral pivot/rotation defaults. Optional explicit parent must resolve uniquely before mutation; use non-zero pivot/rotation only for a real joint/attachment/transform reason.\"," 
          new_add_description = "      \"Adds a Group with neutral pivot/rotation defaults. Group names must remain unique under the case-insensitive matching used by Bedrock animation import. Optional explicit parent must resolve uniquely before mutation; use non-zero pivot/rotation only for a real joint/attachment/transform reason.\"," 
          if text.count(old_add_description) != 1:
              raise SystemExit("Unexpected add_group description")
          text = text.replace(old_add_description, new_add_description, 1)

          old_duplicate_description = "      \"Duplicates one explicit Cube/Group by UUID or unique exact name, with optional offset/name. Use only for established repetition/symmetry; duplication is not a shortcut for deciding primary geometry.\"," 
          new_duplicate_description = "      \"Duplicates one explicit Cube/Group by UUID or unique exact name, with optional offset/root name. Group subtree names are preflighted for case-insensitive Bedrock animation identity collisions; `newName` applies only to the duplicated target root. Use only for established repetition/symmetry.\"," 
          if text.count(old_duplicate_description) != 1:
              raise SystemExit("Unexpected duplicate description")
          text = text.replace(old_duplicate_description, new_duplicate_description, 1)

          old_rename_description = "      \"Renames one explicit outliner element or Group target. UUID is resolved first; an exact name is accepted only when unique. Ambiguous names fail before mutation.\"," 
          new_rename_description = "      \"Renames one explicit outliner element or Group target. Exact no-op renames are rejected; Group renames also preserve case-insensitive uniqueness required by Bedrock animation matching. UUID is resolved first and ambiguous targets fail before mutation.\"," 
          if text.count(old_rename_description) != 1:
              raise SystemExit("Unexpected rename description")
          element_path.write_text(text.replace(old_rename_description, new_rename_description, 1), encoding="utf-8")

          test_path = Path("mcp/tests/p1-core-ownership.test.ts")
          test = test_path.read_text(encoding="utf-8")
          old_import = "\n".join([
              "import {",
              "  resolveTextureIdentity,",
              "  resolveUuidOrUniqueName,",
              "} from \"@/lib/coreIdentity\";",
          ])
          new_import = "\n".join([
              "import {",
              "  resolveTextureIdentity,",
              "  resolveUuidOrUniqueName,",
              "} from \"@/lib/coreIdentity\";",
              "import {",
              "  hasCaseInsensitiveGroupNameCollision,",
              "  hasInternalCaseInsensitiveNameCollision,",
              "} from \"@/server/tools/element\";",
          ])
          if test.count(old_import) != 1:
              raise SystemExit("Unexpected core ownership import block")
          test = test.replace(old_import, new_import, 1)

          addition = "\n".join([
              "",
              "  test(\"generic Group mutations preserve case-insensitive Bedrock animation identity\", async () => {",
              "    const groups = [",
              "      { uuid: \"arm-id\", name: \"Arm\" },",
              "      { uuid: \"leg-id\", name: \"Leg\" },",
              "    ];",
              "    expect(hasCaseInsensitiveGroupNameCollision(groups, \"arm\")).toBe(true);",
              "    expect(",
              "      hasCaseInsensitiveGroupNameCollision(groups, \"ARM\", \"arm-id\")",
              "    ).toBe(false);",
              "    expect(hasInternalCaseInsensitiveNameCollision([\"Arm_copy\", \"arm_COPY\"])).toBe(true);",
              "    expect(hasInternalCaseInsensitiveNameCollision([\"Arm_copy\", \"Leg_copy\"])).toBe(false);",
              "",
              "    const elements = await source(\"server/tools/element.ts\");",
              "    expect(elements).toContain(\"newName !== undefined ? newName : `${sourceName}_copy`\");",
              "    expect(elements).toContain(\"cloneElement(child, dupeGroup, false)\");",
              "    expect(elements).toContain(\"cloneElement(element, element.parent ?? Outliner, true)\");",
              "    expect(elements).not.toContain(\"name: newName || `${group.name}_copy`\");",
              "  });",
          ])
          close_marker = "});\n"
          position = test.rfind(close_marker)
          if position == -1:
              raise SystemExit("Core ownership test closing marker not found")
          test = test[:position] + addition + "\n" + test[position:]
          test_path.write_text(test, encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          rig_note = "A bounded GitHub-only rigging contract correction now rejects empty `set_ik` updates, prevents target-only IK edits from implicitly forcing `ik_enabled=false`, rejects parent operations whose self/descendant/existing parent chain would create or extend a hierarchy cycle before Undo, and keeps create/rename/mirror bone identities unique under the case-insensitive matching used by Bedrock animation import. Mirror derives and validates its intended counterpart name before duplication; exact no-op renames are rejected while case-only self renames remain valid. Omitted `ik_enabled` preserves the existing authored state. IK target resolution and local runtime proof requirements are unchanged.\n"
          note = "\nGeneric Group creation/rename/duplication now preserves that same case-insensitive Bedrock animation identity boundary outside `bone_rigging`. `add_group` and Group rename reject conflicting names before Undo, Group duplication preflights all cloned Group names against existing/internal collisions, and `newName` applies only to the duplicated target root rather than every descendant.\n"
          if next_text.count(rig_note) != 1:
              raise SystemExit("Unexpected rigging continuity anchor")
          next_path.write_text(next_text.replace(rig_note, rig_note + note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit Group identity hardening and remove temporary workflow
        run: |
          git rm .github/workflows/apply-group-identity-determinism.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: preserve deterministic Group identity across element tools"
          git push origin HEAD:Local
