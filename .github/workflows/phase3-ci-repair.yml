name: Phase 3 CI Repair

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/phase3-ci-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Apply bounded CI repairs
        run: python3 .github/scripts/phase3_ci_repair.py

      - name: Regenerate tracked prompt and API artifacts
        working-directory: mcp
        run: |
          bun run prompts:build
          bun run docs:build

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Default MCP surface measurement
        working-directory: mcp
        run: bun run measure:surface

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Generated docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Commit bounded repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md mcp/server/tools/cubes.ts mcp/prompts/bedrock_entity_workflow.md mcp/prompts/manifest.json mcp/docs/api.json mcp/docs/index.html mcp/tests/context-payload-cleanup.test.ts mcp/tests/documentation-handoff.test.ts mcp/tests/reference-generator-buildability.test.ts mcp/tests/asset-authoring-usage-slimming.test.ts
          git commit -m "fix: restore Phase 3 verification contracts"
          git push origin HEAD:Local
