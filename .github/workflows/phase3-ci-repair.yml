name: Phase 3 Finalize

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/phase3-ci-repair.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Synchronize Phase 3 proof docs
        run: python3 .github/scripts/phase3_finalize.py

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Default MCP surface measurement
        working-directory: mcp
        run: bun run measure:surface

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Generated docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Commit proof sync and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/knowledge/implementation-map.md docs/foundation/validation-report.md
          git rm .github/workflows/phase3-ci-repair.yml .github/scripts/phase3_ci_repair.py .github/scripts/phase3_ci_repair_followup.py .github/scripts/phase3_finalize.py
          git commit -m "docs: finalize Phase 3 verified state"
          git push origin HEAD:Local
