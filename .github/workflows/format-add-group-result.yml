name: Format Add Group Result Block

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/format-add-group-result.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Normalize add_group indentation only
        run: |
          cp mcp/server/tools/element.ts /tmp/element-before.ts
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mcp/server/tools/element.ts')
          text = path.read_text(encoding='utf-8')
          old = '\n'.join([
              '      const result = {',
              '        group: {',
              'uuid: group.uuid,',
              'name: group.name,',
              'origin: [...group.origin],',
              'rotation: [...group.rotation],',
              'parent: group.parent instanceof Group ? group.parent.uuid : "root",',
              '        },',
              '      };',
              '      return {',
              '        content: [',
              '{',
              '  type: "text" as const,',
              '  text: `Added Group ${group.name} (${group.uuid}).`,',
              '},',
              '        ],',
              '        structuredContent: result,',
              '      };',
          ])
          new = '\n'.join([
              '      const result = {',
              '        group: {',
              '          uuid: group.uuid,',
              '          name: group.name,',
              '          origin: [...group.origin],',
              '          rotation: [...group.rotation],',
              '          parent: group.parent instanceof Group ? group.parent.uuid : "root",',
              '        },',
              '      };',
              '      return {',
              '        content: [',
              '          {',
              '            type: "text" as const,',
              '            text: `Added Group ${group.name} (${group.uuid}).`,',
              '          },',
              '        ],',
              '        structuredContent: result,',
              '      };',
          ])
          if text.count(old) != 1:
              raise SystemExit('Unexpected add_group result formatting block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cp mcp/server/tools/element.ts /tmp/element-after.ts
          git diff --no-index --ignore-all-space --ignore-blank-lines --exit-code /tmp/element-before.ts /tmp/element-after.ts
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Generated docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit whitespace-only cleanup and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-add-group-result.yml
          git add mcp/server/tools/element.ts
          git commit -m 'style: format add_group result block'
          git push origin HEAD:Local
