name: Rework P0-P2 Hardening

on:
  push:
    branches:
      - Rework
    paths:
      - ".github/scripts/apply_rework_hardening.py"
      - ".github/workflows/rework-hardening.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/apply_rework_hardening.py"
      - ".github/workflows/rework-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rework-p0-p2-hardening
  cancel-in-progress: true

jobs:
  harden-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Rework
        uses: actions/checkout@v4
        with:
          ref: Rework
          fetch-depth: 0

      - name: Apply hardening patch
        run: python .github/scripts/apply_rework_hardening.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: mcp-blockbench
        run: bun install --frozen-lockfile

      - name: Synchronize production skills
        working-directory: mcp-blockbench
        run: bun run skills:sync

      - name: Verify synchronized skills
        working-directory: mcp-blockbench
        run: bun run skills:check

      - name: Typecheck
        working-directory: mcp-blockbench
        run: bun run typecheck

      - name: Test
        working-directory: mcp-blockbench
        run: bun test

      - name: Build canonical plugin
        working-directory: mcp-blockbench
        run: bun run build

      - name: Verify generated bundle
        working-directory: mcp-blockbench
        run: |
          bun -e 'const pkg = await Bun.file("package.json").json(); const text = await Bun.file("dist/mcp.js").text(); for (const marker of [`/* v${pkg.version} */`, `version:\"${pkg.version}\"`, "STABLE_FULL_LIBRARY", "ACTIVE_PROFILE_GUARDED", "current_session_continues", "SYMMETRY_POLICY_MISSING", "TEXTURE_PALETTE_DRIFT", "ANIMATION_HAS_NO_KEYFRAMES"]) { if (!text.includes(marker)) throw new Error(`Missing hardened bundle marker: ${marker}`); }'

      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Hardening patch already applied."
            exit 0
          fi
          git commit -m "refactor: harden MCP quality routing and usage"
          git push origin HEAD:Rework
