name: Rework P0-P2 Hardening

on:
  push:
    branches:
      - Rework
    paths:
      - ".github/scripts/apply_rework_hardening.py"
      - ".github/scripts/fix_rework_hardening.py"
      - ".github/workflows/rework-hardening.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/apply_rework_hardening.py"
      - ".github/scripts/fix_rework_hardening.py"
      - ".github/workflows/rework-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rework-p0-p2-hardening
  cancel-in-progress: true

jobs:
  harden-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Rework
        uses: actions/checkout@v4
        with:
          ref: Rework
          fetch-depth: 0

      - name: Apply hardening patch
        run: |
          python .github/scripts/apply_rework_hardening.py
          python .github/scripts/fix_rework_hardening.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: mcp-blockbench
        run: bun install --frozen-lockfile

      - name: Synchronize production skills
        working-directory: mcp-blockbench
        run: bun run skills:sync

      - name: Verify synchronized skills
        id: skills
        continue-on-error: true
        working-directory: mcp-blockbench
        run: |
          set -o pipefail
          bun run skills:check 2>&1 | tee "$GITHUB_WORKSPACE/hardening-skills.log"

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        working-directory: mcp-blockbench
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee "$GITHUB_WORKSPACE/hardening-typecheck.log"

      - name: Test
        id: test
        continue-on-error: true
        working-directory: mcp-blockbench
        run: |
          set -o pipefail
          bun test 2>&1 | tee "$GITHUB_WORKSPACE/hardening-test.log"

      - name: Build canonical plugin
        id: build
        continue-on-error: true
        working-directory: mcp-blockbench
        run: |
          set -o pipefail
          bun run build 2>&1 | tee "$GITHUB_WORKSPACE/hardening-build.log"

      - name: Verify generated bundle
        id: bundle
        continue-on-error: true
        working-directory: mcp-blockbench
        run: |
          set -o pipefail
          bun -e 'const pkg = await Bun.file("package.json").json(); const text = await Bun.file("dist/mcp.js").text(); for (const marker of [`/* v${pkg.version} */`, `version:\"${pkg.version}\"`, "STABLE_FULL_LIBRARY", "ACTIVE_PROFILE_GUARDED", "current_session_continues", "SYMMETRY_POLICY_MISSING", "TEXTURE_PALETTE_DRIFT", "ANIMATION_HAS_NO_KEYFRAMES"]) { if (!text.includes(marker)) throw new Error(`Missing hardened bundle marker: ${marker}`); }' 2>&1 | tee "$GITHUB_WORKSPACE/hardening-bundle.log"

      - name: Capture patched source and diagnostics
        if: always()
        run: |
          git diff --binary > "$GITHUB_WORKSPACE/hardening.patch"
          tar -czf "$GITHUB_WORKSPACE/hardening-source.tar.gz" \
            engines/chatgpt/skills/blockbench-reference-studio \
            engines/shared/skills \
            .agents/skills/blockbench-* \
            .codex/skills/blockbench-* \
            mcp-blockbench/src \
            mcp-blockbench/tests \
            openspec/changes/codex-local-workflow-rework/tasks.md

      - name: Upload hardening diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rework-hardening-diagnostics
          path: |
            hardening-*.log
            hardening.patch
            hardening-source.tar.gz
          retention-days: 3

      - name: Enforce verification
        if: always()
        env:
          SKILLS: ${{ steps.skills.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BUNDLE: ${{ steps.bundle.outcome }}
        run: |
          printf 'skills=%s\ntypecheck=%s\ntest=%s\nbuild=%s\nbundle=%s\n' \
            "$SKILLS" "$TYPECHECK" "$TEST" "$BUILD" "$BUNDLE"
          if [[ "$SKILLS" != "success" || \
                "$TYPECHECK" != "success" || \
                "$TEST" != "success" || \
                "$BUILD" != "success" || \
                "$BUNDLE" != "success" ]]; then
            exit 1
          fi

      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Hardening patch already applied."
            exit 0
          fi
          git commit -m "refactor: harden MCP quality routing and usage"
          git push origin HEAD:Rework
