name: Execute P1.3 Core Ownership Once

on:
  push:
    paths:
      - ".github/workflows/p1-core-ownership-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Apply core identity and result ownership consolidation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              start_i = text.find(start)
              if start_i < 0:
                  raise SystemExit(f"{label}: start marker not found")
              end_i = text.find(end, start_i)
              if end_i < 0:
                  raise SystemExit(f"{label}: end marker not found")
              return text[:start_i] + replacement + "\n\n" + text[end_i:]

          core_identity = r'''/// <reference types="blockbench-types" />

export interface CoreIdentityRecord {
  uuid: string;
  name: string;
}

export interface CoreTextureIdentityRecord extends CoreIdentityRecord {
  id: string;
}

export interface CoreIdentityResolveOptions<T extends CoreIdentityRecord> {
  kind: string;
  notFoundHint: string;
  describeCandidate?: (item: T) => string;
}

function describeIdentity(item: CoreIdentityRecord): string {
  return `${item.name} (${item.uuid})`;
}

/**
 * Shared deterministic identity contract for the retained Bedrock Entity core.
 * Explicit references resolve exact UUID first, then exact name only when unique.
 * No prefix matching, selection fallback, or silent default target is performed.
 */
export function resolveUuidOrUniqueName<T extends CoreIdentityRecord>(
  items: readonly T[],
  reference: string,
  options: CoreIdentityResolveOptions<T>
): T {
  const uuidMatch = items.find((item) => item.uuid === reference);
  if (uuidMatch) return uuidMatch;

  const nameMatches = items.filter((item) => item.name === reference);
  if (nameMatches.length === 1) return nameMatches[0];

  const describe = options.describeCandidate ?? describeIdentity;
  if (nameMatches.length > 1) {
    throw new Error(
      `${options.kind} name "${reference}" is ambiguous. Use an exact UUID. Candidates: ${nameMatches
        .map(describe)
        .join(", ")}`
    );
  }

  throw new Error(
    `${options.kind} "${reference}" not found. ${options.notFoundHint}`
  );
}

/**
 * Texture identity adds one intentional intermediate key: exact texture ID.
 * Resolution order is UUID -> unique ID -> unique name.
 */
export function resolveTextureIdentity<T extends CoreTextureIdentityRecord>(
  items: readonly T[],
  reference: string,
  notFoundHint: string
): T {
  const uuidMatch = items.find((item) => item.uuid === reference);
  if (uuidMatch) return uuidMatch;

  const describe = (item: T) =>
    `${item.name} (id: ${item.id}, uuid: ${item.uuid})`;

  const idMatches = items.filter((item) => item.id === reference);
  if (idMatches.length === 1) return idMatches[0];
  if (idMatches.length > 1) {
    throw new Error(
      `Texture ID "${reference}" is ambiguous. Use an exact UUID. Candidates: ${idMatches
        .map(describe)
        .join(", ")}`
    );
  }

  const nameMatches = items.filter((item) => item.name === reference);
  if (nameMatches.length === 1) return nameMatches[0];
  if (nameMatches.length > 1) {
    throw new Error(
      `Texture name "${reference}" is ambiguous. Use an exact UUID or texture ID. Candidates: ${nameMatches
        .map(describe)
        .join(", ")}`
    );
  }

  throw new Error(`Texture "${reference}" not found. ${notFoundHint}`);
}

export function resolveCoreCube(
  reference: string,
  notFoundHint =
    "Use list_outline or find_elements_by_criteria, then inspect_element to confirm the intended Cube UUID."
) {
  return resolveUuidOrUniqueName(Cube.all ?? [], reference, {
    kind: "Cube",
    notFoundHint,
  });
}

export function resolveCoreGroup(
  reference: string,
  notFoundHint = "Use list_outline to confirm the intended Group UUID."
) {
  return resolveUuidOrUniqueName(Group.all ?? [], reference, {
    kind: "Group",
    notFoundHint,
  });
}

export function resolveCoreCubeOrGroup(
  reference: string,
  notFoundHint =
    "Use list_outline or find_elements_by_criteria to confirm the intended Cube/Group UUID."
) {
  return resolveUuidOrUniqueName(
    [...(Cube.all ?? []), ...(Group.all ?? [])] as Array<Cube | Group>,
    reference,
    {
      kind: "Element",
      notFoundHint,
      describeCandidate: (item) =>
        `${item instanceof Cube ? "cube" : "group"} ${item.name} (${item.uuid})`,
    }
  );
}

export function resolveCoreTexture(
  reference: string,
  notFoundHint = "Use list_textures to confirm the intended UUID or texture ID."
) {
  return resolveTextureIdentity(
    (Project?.textures ?? Texture.all ?? []) as Texture[],
    reference,
    notFoundHint
  );
}

export function resolveCoreAnimation(
  reference?: string,
  options: {
    allowSelected?: boolean;
    notFoundHint?: string;
  } = {}
) {
  if (reference === undefined) {
    if (options.allowSelected && AnimationItem.selected) {
      return AnimationItem.selected;
    }
    throw new Error(
      "No animation target was provided. Pass an exact Animation UUID or exact unique Animation name."
    );
  }

  return resolveUuidOrUniqueName(AnimationItem.all ?? [], reference, {
    kind: "Animation",
    notFoundHint:
      options.notFoundHint ??
      "Pass an exact Animation UUID or exact unique Animation name.",
  });
}
'''
          Path("mcp/lib/coreIdentity.ts").write_text(core_identity)

          test_source = r'''import { describe, expect, test } from "bun:test";
import { readFile } from "node:fs/promises";
import {
  resolveTextureIdentity,
  resolveUuidOrUniqueName,
} from "@/lib/coreIdentity";

type Item = { uuid: string; name: string };
type TextureItem = Item & { id: string };

const options = {
  kind: "Cube",
  notFoundHint: "Inspect first.",
};

describe("P1.3 core identity ownership", () => {
  test("UUID wins before exact unique name and names never prefix-match", () => {
    const items: Item[] = [
      { uuid: "cube-1", name: "arm" },
      { uuid: "cube-2", name: "cube-1" },
      { uuid: "cube-3", name: "arm_long" },
    ];

    expect(resolveUuidOrUniqueName(items, "cube-1", options)).toEqual(items[0]);
    expect(resolveUuidOrUniqueName(items, "arm_long", options)).toEqual(items[2]);
    expect(() => resolveUuidOrUniqueName(items, "arm_", options)).toThrow(
      'Cube "arm_" not found.'
    );
  });

  test("ambiguous exact names fail instead of selecting the first item", () => {
    const items: Item[] = [
      { uuid: "a", name: "leg" },
      { uuid: "b", name: "leg" },
    ];

    expect(() => resolveUuidOrUniqueName(items, "leg", options)).toThrow(
      'Cube name "leg" is ambiguous.'
    );
  });

  test("texture identity is UUID then unique ID then unique name", () => {
    const textures: TextureItem[] = [
      { uuid: "tex-u1", id: "albedo", name: "Stone" },
      { uuid: "tex-u2", id: "normal", name: "Normal" },
      { uuid: "tex-u3", id: "tex-u1", name: "Other" },
    ];

    expect(resolveTextureIdentity(textures, "tex-u1", "List textures.")).toEqual(
      textures[0]
    );
    expect(resolveTextureIdentity(textures, "normal", "List textures.")).toEqual(
      textures[1]
    );
    expect(resolveTextureIdentity(textures, "Other", "List textures.")).toEqual(
      textures[2]
    );
  });

  test("ambiguous texture IDs and names fail deterministically", () => {
    const textures: TextureItem[] = [
      { uuid: "a", id: "shared", name: "Stone" },
      { uuid: "b", id: "shared", name: "Stone" },
    ];

    expect(() => resolveTextureIdentity(textures, "shared", "List textures.")).toThrow(
      'Texture ID "shared" is ambiguous.'
    );
    expect(() => resolveTextureIdentity(textures, "Stone", "List textures.")).toThrow(
      'Texture name "Stone" is ambiguous.'
    );
  });

  test("retained core callers consume shared identity ownership", async () => {
    const [cubes, elements, texture, animation, util] = await Promise.all([
      readFile(new URL("../server/tools/cubes.ts", import.meta.url), "utf8"),
      readFile(new URL("../server/tools/element.ts", import.meta.url), "utf8"),
      readFile(new URL("../server/tools/texture.ts", import.meta.url), "utf8"),
      readFile(new URL("../server/tools/animation.ts", import.meta.url), "utf8"),
      readFile(new URL("../lib/util.ts", import.meta.url), "utf8"),
    ]);

    expect(cubes).toContain("resolveCoreCube(reference");
    expect(cubes).toContain("resolveCoreGroup(reference");
    expect(cubes).toContain("resolveCoreTexture(reference");
    expect(elements).toContain("resolveCoreGroup(reference");
    expect(elements).toContain("resolveCoreTexture(reference");
    expect(texture).toContain("resolveCoreCubeOrGroup(reference");
    expect(texture.match(/resolveCoreTexture\(reference/g)?.length).toBeGreaterThanOrEqual(7);
    expect(animation).toContain("resolveCoreAnimation(reference, {");
    expect(animation).toContain("resolveCoreGroup(reference");
    expect(util).toContain("const texture = resolveCoreTexture(id,");
  });

  test("identity-returning core mutations expose structured continuation state", async () => {
    const [cubes, elements] = await Promise.all([
      readFile(new URL("../server/tools/cubes.ts", import.meta.url), "utf8"),
      readFile(new URL("../server/tools/element.ts", import.meta.url), "utf8"),
    ]);

    expect(cubes).toContain("structuredContent: result");
    expect(cubes).toContain("added: cubes.length");
    expect(cubes).toContain("cube: finalCubeState(cubes[0])");
    expect(elements).toContain("structuredContent: result");
    expect(elements).toContain("group: {");
  });
});
'''
          Path("mcp/tests/p1-core-ownership.test.ts").write_text(test_source)

          # Cubes: centralize Cube/Group/Texture resolution and expose deterministic results.
          path = Path("mcp/server/tools/cubes.ts")
          text = path.read_text()
          text = replace_once(
              text,
              'import { STATUS_STABLE } from "@/lib/constants";\n',
              'import { STATUS_STABLE } from "@/lib/constants";\nimport { resolveCoreCube, resolveCoreGroup, resolveCoreTexture } from "@/lib/coreIdentity";\n',
              "cubes import",
          )
          text = replace_between(
              text,
              "function resolveUniqueCube(",
              "function resolvePlacementGroup(",
              '''function resolveUniqueCube(reference: string): Cube {
  return resolveCoreCube(
    reference,
    "Use list_outline or find_elements_by_criteria, then inspect_element to confirm the intended UUID."
  );
}''',
              "cubes unique resolver",
          )
          text = replace_between(
              text,
              "function resolvePlacementGroup(",
              "function resolvePlacementTexture(",
              '''function resolvePlacementGroup(reference?: string): Group | "root" {
  if (reference === undefined || reference === "root") return "root";
  return resolveCoreGroup(
    reference,
    'Use list_outline to confirm the intended Group UUID. Omit group or pass "root" only when root placement is intentional.'
  );
}''',
              "cubes group resolver",
          )
          text = replace_between(
              text,
              "function resolvePlacementTexture(",
              "export function registerCubesTools()",
              '''function resolvePlacementTexture(reference?: string): Texture | null {
  if (reference === undefined) return Texture.getDefault() ?? null;
  return resolveCoreTexture(
    reference,
    "Use list_textures to confirm the intended UUID or texture ID before placing Cubes."
  );
}''',
              "cubes texture resolver",
          )
          text = replace_once(
              text,
              '''    Canvas.updateAll();
    return await Promise.resolve(
      JSON.stringify(
        cubes.map((cube: Cube) => `Added cube ${cube.name} with ID ${cube.uuid}`)
      )
    );''',
              '''    Canvas.updateAll();
    const result = {
      added: cubes.length,
      cubes: cubes.map((cube: Cube) => finalCubeState(cube)),
    };
    return {
      content: [
        {
          type: "text" as const,
          text: `Added ${cubes.length} Cube${cubes.length === 1 ? "" : "s"}.`,
        },
      ],
      structuredContent: result,
    };''',
              "place_cube result",
          )
          text = replace_once(
              text,
              '''    Canvas.updateAll();
    return `Modified cubes ${cubes
      .map((cube) => cube.name)
      .join(", ")} with IDs ${cubes.map((cube) => cube.uuid).join(", ")}`;''',
              '''    Canvas.updateAll();
    const result = {
      modified: cubes.length,
      cube: finalCubeState(cubes[0]),
    };
    return {
      content: [
        {
          type: "text" as const,
          text: `Modified Cube ${cubes[0].name} (${cubes[0].uuid}).`,
        },
      ],
      structuredContent: result,
    };''',
              "modify_cube result",
          )
          path.write_text(text)

          # Elements: share Group/Texture identity while preserving broader native Outliner element behavior.
          path = Path("mcp/server/tools/element.ts")
          text = path.read_text()
          text = replace_once(
              text,
              'import { STATUS_EXPERIMENTAL, STATUS_STABLE } from "@/lib/constants";\n',
              'import { STATUS_EXPERIMENTAL, STATUS_STABLE } from "@/lib/constants";\nimport { resolveCoreGroup, resolveCoreTexture } from "@/lib/coreIdentity";\n',
              "element import",
          )
          text = replace_between(
              text,
              "function resolveParentGroup(",
              "function resolveOptionalGroupScope(",
              '''function resolveParentGroup(reference: string): Group | "root" {
  if (reference === "root") return "root";
  return resolveCoreGroup(
    reference,
    'Use list_outline to confirm the intended Group UUID. Use "root" only when root parenting is intentional.'
  );
}''',
              "element parent resolver",
          )
          text = replace_between(
              text,
              "function resolveOptionalGroupScope(",
              "type ResolvedElement",
              '''function resolveOptionalGroupScope(reference?: string): Group | null {
  if (!reference) return null;
  return resolveCoreGroup(
    reference,
    "Use list_outline to confirm the intended Group UUID, or omit parent_group when no scope is intended."
  );
}''',
              "element optional group resolver",
          )
          text = replace_between(
              text,
              "function resolveUniqueTextureForDiscovery(",
              "function isDescendantOf(",
              '''function resolveUniqueTextureForDiscovery(reference: string): Texture {
  return resolveCoreTexture(
    reference,
    "Use list_textures to confirm the intended UUID or texture ID before retrying material discovery."
  );
}''',
              "element texture resolver",
          )
          text = replace_once(
              text,
              '      Canvas.updateAll();\n      return `Added group ${group.name} with ID ${group.uuid}`;',
              '''      Canvas.updateAll();
      const result = {
        group: {
          uuid: group.uuid,
          name: group.name,
          origin: [...group.origin],
          rotation: [...group.rotation],
          visibility: group.visibility !== false,
          parent: group.parent instanceof Group ? group.parent.uuid : "root",
        },
      };
      return {
        content: [
          {
            type: "text" as const,
            text: `Added Group ${group.name} (${group.uuid}).`,
          },
        ],
        structuredContent: result,
      };''',
              "add_group result",
          )
          path.write_text(text)

          # Texture: centralize Cube/Group and Texture identity algorithms; preserve all PBR behavior.
          path = Path("mcp/server/tools/texture.ts")
          text = path.read_text()
          text = replace_once(
              text,
              '''import {
  imageContent,
  findElementOrThrow,
  getChannelTextureInfo,
} from "@/lib/util";''',
              'import { imageContent, getChannelTextureInfo } from "@/lib/util";',
              "texture util import",
          )
          text = replace_once(
              text,
              'import { STATUS_EXPERIMENTAL, STATUS_STABLE } from "@/lib/constants";\n',
              'import { STATUS_EXPERIMENTAL, STATUS_STABLE } from "@/lib/constants";\nimport { resolveCoreCubeOrGroup, resolveCoreTexture } from "@/lib/coreIdentity";\n',
              "texture core import",
          )
          text = replace_between(
              text,
              "function resolveApplyTextureElement(",
              "function resolveApplyTextureTexture(",
              '''function resolveApplyTextureElement(reference: string): ApplyTextureElement {
  return resolveCoreCubeOrGroup(
    reference,
    "Use list_outline or find_elements_by_criteria to confirm the intended Cube/Group UUID before applying a texture."
  );
}''',
              "texture apply element resolver",
          )

          texture_wrappers = [
              ("resolveApplyTextureTexture", "resolveActivateTextureTexture", "Use list_textures to confirm the intended UUID or texture ID before applying it."),
              ("resolveActivateTextureTexture", "resolveGetTextureTexture", "Use list_textures to confirm the intended UUID or texture ID before activating it."),
              ("resolveGetTextureTexture", "resolveAddTextureGroupTexture", "Use list_textures to confirm the intended UUID or texture ID before reading image data."),
              ("resolveAddTextureGroupTexture", "resolveCreatePbrMaterialTexture", "Use list_textures to confirm the intended UUID or texture ID before adding the texture group."),
              ("resolveCreatePbrMaterialTexture", "resolveConfigureMaterialTexture", "Use list_textures to confirm the intended UUID or texture ID before creating the PBR material."),
              ("resolveConfigureMaterialTexture", "resolveAssignTextureChannelTexture", "Use list_textures to confirm the intended UUID or texture ID before configuring the material."),
              ("resolveAssignTextureChannelTexture", "resolveTextureToolMaterial", "Use list_textures to confirm the intended UUID or texture ID before assigning the PBR channel."),
          ]
          for name, next_name, hint in texture_wrappers:
              text = replace_between(
                  text,
                  f"function {name}(",
                  f"function {next_name}(",
                  f'''function {name}(reference: string): Texture {{
  return resolveCoreTexture(reference, "{hint}");
}}''',
                  f"texture resolver {name}",
              )
          path.write_text(text)

          # Animation: share exact Animation and Group identity; leave Bedrock codec case-insensitive creation semantics local.
          path = Path("mcp/server/tools/animation.ts")
          text = path.read_text()
          text = replace_once(
              text,
              'import { STATUS_EXPERIMENTAL, STATUS_STABLE } from "@/lib/constants";\n',
              'import { STATUS_EXPERIMENTAL, STATUS_STABLE } from "@/lib/constants";\nimport { resolveCoreAnimation, resolveCoreGroup } from "@/lib/coreIdentity";\n',
              "animation core import",
          )
          text = replace_between(
              text,
              "function resolveAnimation(",
              "function resolveRigGroup(",
              '''function resolveAnimation(reference?: string) {
  return resolveCoreAnimation(reference, {
    allowSelected: true,
    notFoundHint: "Pass an exact Animation UUID or exact unique Animation name.",
  });
}''',
              "animation resolver",
          )
          text = replace_between(
              text,
              "function resolveRigGroup(",
              "function resolveRigElement(",
              '''function resolveRigGroup(reference: string): Group {
  return resolveCoreGroup(
    reference,
    "Use list_outline to confirm the intended Group UUID."
  );
}''',
              "animation group resolver",
          )
          path.write_text(text)

          # Paint helper: explicit texture references now consume the same strict Texture identity owner.
          path = Path("mcp/lib/util.ts")
          text = path.read_text()
          if not text.startswith('import { resolveCoreTexture } from "@/lib/coreIdentity";'):
              text = 'import { resolveCoreTexture } from "@/lib/coreIdentity";\n\n' + text
          text = replace_between(
              text,
              "export function getAndActivateTexture(",
              "// ============================================================================\n// Lookup Helpers",
              '''export function getAndActivateTexture(id?: string): Texture {
  if (!id) {
    const active = Texture.selected ?? Texture.getDefault();
    if (!active) {
      throw new Error(
        "No texture available. Use create_texture first, or pass texture_id explicitly."
      );
    }
    if (Texture.selected?.uuid !== active.uuid) {
      active.select();
    }
    return active;
  }

  const texture = resolveCoreTexture(
    id,
    "Use list_textures to confirm the intended UUID or texture ID before painting."
  );
  if (Texture.selected?.uuid !== texture.uuid) {
    texture.select();
  }
  return texture;
}''',
              "util active texture resolver",
          )
          path.write_text(text)
          PY

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Generated docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Commit P1.3 source and tests
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mcp/lib/coreIdentity.ts \
            mcp/lib/util.ts \
            mcp/server/tools/cubes.ts \
            mcp/server/tools/element.ts \
            mcp/server/tools/texture.ts \
            mcp/server/tools/animation.ts \
            mcp/tests/p1-core-ownership.test.ts
          git diff --cached --check
          git commit -m "refactor: consolidate Bedrock core identity ownership"
          git push origin Local

      - name: Trigger canonical MCP verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mcp-verify.yml --ref Local
