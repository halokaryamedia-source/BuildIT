name: Apply Rig Create Child Cycle Guard V2

on:
  push:
    paths:
      - ".github/workflows/apply-rigging-create-child-cycle-guard-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reuse create-child cycle transform
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-rigging-create-child-cycle-guard.yml").read_text(encoding="utf-8")
          opener = "          python3 - <<'PY'\n"
          closer = "          PY\n"
          start = workflow.index(opener) + len(opener)
          end = workflow.index(closer, start)
          body = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          ) + "\n"
          Path("/tmp/apply-rig-create-child-cycle.py").write_text(script, encoding="utf-8")
          PY
          python3 /tmp/apply-rig-create-child-cycle.py

      - name: Narrow create parent Group for callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("mcp/server/tools/animation.ts")
          text = path.read_text(encoding="utf-8")
          old = "\n".join([
              "          if (parentBone instanceof Group) {",
              "            const createParentByUuid = new Map<string, string | null>(",
          ])
          new = "\n".join([
              "          if (parentBone instanceof Group) {",
              "            const createParentBone = parentBone;",
              "            const createParentByUuid = new Map<string, string | null>(",
          ])
          if text.count(old) != 1:
              raise SystemExit("Unexpected create parent narrowing block")
          text = text.replace(old, new, 1)
          text = text.replace("                  parentBone.uuid,", "                  createParentBone.uuid,", 1)
          text = text.replace("under \"${parentBone.name}\"", "under \"${createParentBone.name}\"", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit create child cycle guard and remove temporary workflows
        run: |
          git rm .github/workflows/apply-rigging-create-child-cycle-guard.yml
          git rm .github/workflows/apply-rigging-create-child-cycle-guard-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: reject cyclic child adoption during bone create"
          git push origin HEAD:Local
