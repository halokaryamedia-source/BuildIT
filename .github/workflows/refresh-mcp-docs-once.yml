name: Refresh MCP Generated Docs Once

on:
  push:
    paths:
      - ".github/workflows/refresh-mcp-docs-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Regenerate MCP documentation
        working-directory: mcp
        run: bun run docs:build

      - name: Commit generated output
        run: |
          git status --short -- mcp/docs/api.json mcp/docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/docs/api.json mcp/docs/index.html
          if git diff --cached --quiet; then
            echo "Generated MCP docs were already current."
          else
            git commit -m "docs: refresh generated MCP reference"
            git push origin Local
          fi

      - name: Trigger canonical MCP verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mcp-verify.yml --ref Local

      # Final one-shot P0.5 run. Remove this workflow after canonical verification passes.
