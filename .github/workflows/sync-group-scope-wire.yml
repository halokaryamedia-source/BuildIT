name: Sync Group Scope Wire Measurement

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/sync-group-scope-wire.yml'

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Measure and sync current wire
        working-directory: mcp
        run: |
          cat > .measure-group-scope-wire.ts <<'TS'
          import { McpServer } from "@modelcontextprotocol/sdk/server/mcp.js";
          import { WebStandardStreamableHTTPServerTransport } from "@modelcontextprotocol/sdk/server/webStandardStreamableHttp.js";
          import { registerToolsOnServer } from "./lib/factories";
          import "./server/tools";

          const server = new McpServer({ name: "blockit-group-scope-wire", version: "1.0.0" });
          registerToolsOnServer(server);
          const transport = new WebStandardStreamableHTTPServerTransport({
            sessionIdGenerator: undefined,
            enableJsonResponse: true,
          });
          await server.connect(transport);
          try {
            const response = await transport.handleRequest(new Request("http://127.0.0.1:3000/bb-mcp", {
              method: "POST",
              headers: {
                accept: "application/json, text/event-stream",
                "content-type": "application/json",
                "mcp-protocol-version": "2025-06-18",
              },
              body: JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} }),
            }));
            const raw = await response.text();
            if (response.status !== 200) throw new Error(raw);
            const parsed = JSON.parse(raw) as { result?: { tools?: Array<{ name?: string; description?: string; inputSchema?: unknown }> } };
            const tools = parsed.result?.tools ?? [];
            await Bun.write("../.group-scope-wire-metrics.json", JSON.stringify({
              enabled_tools: tools.length,
              response_characters: raw.length,
              input_schema_characters: tools.reduce((sum, tool) => sum + JSON.stringify(tool.inputSchema ?? {}).length, 0),
              description_characters: tools.reduce((sum, tool) => sum + (tool.description ?? "").length, 0),
            }));
          } finally {
            await server.close();
          }
          TS
          bun .measure-group-scope-wire.ts
          rm .measure-group-scope-wire.ts
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          import json

          metrics_path = Path('.group-scope-wire-metrics.json')
          m = json.loads(metrics_path.read_text())
          metrics_path.unlink()
          def n(value): return f'{value:,}'

          next_path = Path('docs/knowledge/next-action.md')
          text = next_path.read_text(encoding='utf-8')
          old = '**62 enabled tools / 72,164 response characters**, including **48,063 characters of input schemas** and **11,800 characters of tool descriptions**'
          new = f'**{m["enabled_tools"]} enabled tools / {n(m["response_characters"])} response characters**, including **{n(m["input_schema_characters"])} characters of input schemas** and **{n(m["description_characters"])} characters of tool descriptions**'
          if text.count(old) != 1:
              raise SystemExit('Current next-action wire measurement anchor not found')
          next_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          review_path = Path('docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md')
          review = review_path.read_text(encoding='utf-8')
          old = '**62 tools / 72,164 response characters / 48,063 input-schema characters / 11,800 description characters**'
          new = f'**{m["enabled_tools"]} tools / {n(m["response_characters"])} response characters / {n(m["input_schema_characters"])} input-schema characters / {n(m["description_characters"])} description characters**'
          if review.count(old) != 1:
              raise SystemExit('Current review wire measurement anchor not found')
          review_path.write_text(review.replace(old, new, 1), encoding='utf-8')
          print(json.dumps(m))
          PY
      - name: Diff hygiene
        run: git diff --check
      - name: Commit evidence and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-group-scope-wire.yml
          git add docs/knowledge/next-action.md docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md
          git commit -m 'docs: sync group scope wire measurement'
          git push origin HEAD:Local
