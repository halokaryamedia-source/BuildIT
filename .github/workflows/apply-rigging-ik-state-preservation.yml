name: Apply IK State Preservation Guard

on:
  push:
    paths:
      - ".github/workflows/apply-rigging-ik-state-preservation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Preserve omitted IK enabled state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          animation_path = Path("mcp/server/tools/animation.ts")
          text = animation_path.read_text(encoding="utf-8")

          old_schema_tail = "\n".join([
              "    })",
              "    .describe(\"Bone configuration data.\"),",
              "});",
              "",
              "const animationTimelineRangeSchema = z",
          ])
          new_schema_tail = "\n".join([
              "    })",
              "    .describe(\"Bone configuration data.\"),",
              "}).superRefine((params, ctx) => {",
              "  if (",
              "    params.action === \"set_ik\" &&",
              "    params.bone_data.ik_enabled === undefined &&",
              "    params.bone_data.ik_target === undefined",
              "  ) {",
              "    ctx.addIssue({",
              "      code: z.ZodIssueCode.custom,",
              "      path: [\"bone_data\"],",
              "      message:",
              "        \"set_ik requires ik_enabled and/or ik_target; an empty IK update is not a mutation.\"",
              "    });",
              "  }",
              "});",
              "",
              "const animationTimelineRangeSchema = z",
          ])
          if text.count(old_schema_tail) != 1:
              raise SystemExit("Unexpected bone rigging schema tail")
          text = text.replace(old_schema_tail, new_schema_tail, 1)

          old_mutation = "            targetBone!.ik_enabled = bone_data.ik_enabled ?? false;"
          new_mutation = "\n".join([
              "            if (bone_data.ik_enabled !== undefined) {",
              "              targetBone!.ik_enabled = bone_data.ik_enabled;",
              "            }",
          ])
          if text.count(old_mutation) != 1:
              raise SystemExit("Unexpected set_ik mutation shape")
          text = text.replace(old_mutation, new_mutation, 1)

          old_description = "      \"Creates or edits Group bones with preflighted explicit targets. `set_pivot` requires origin and preserves visual contents; `mirror` requires an axis. Missing/ambiguous targets fail before mutation. The tool does not infer joints, pivots, rotation, or hierarchy from appearance.\"," 
          new_description = "      \"Creates or edits Group bones with preflighted explicit targets. `set_pivot` requires origin and preserves visual contents; `mirror` requires an axis; `set_ik` requires an explicit IK field and preserves the existing enabled state when only the target is changed. Missing/ambiguous targets fail before mutation. The tool does not infer joints, pivots, rotation, or hierarchy from appearance.\"," 
          if text.count(old_description) != 1:
              raise SystemExit("Unexpected bone rigging tool description")
          animation_path.write_text(text.replace(old_description, new_description, 1), encoding="utf-8")

          test_path = Path("mcp/tests/animation-mutation-contract.test.ts")
          test = test_path.read_text(encoding="utf-8")
          old_import = "\n".join([
              "  animationTimelineParameters,",
              "  batchKeyframeOperationsParameters,",
              "  countAnimationClipboardKeyframes,",
              "  manageKeyframesParameters,",
          ])
          new_import = "\n".join([
              "  animationTimelineParameters,",
              "  batchKeyframeOperationsParameters,",
              "  boneRiggingParameters,",
              "  countAnimationClipboardKeyframes,",
              "  manageKeyframesParameters,",
          ])
          if test.count(old_import) != 1:
              raise SystemExit("Unexpected animation mutation import block")
          test = test.replace(old_import, new_import, 1)

          addition = "\n".join([
              "",
              "  test(\"set_ik rejects empty updates while allowing target-only state preservation\", async () => {",
              "    expect(",
              "      boneRiggingParameters.safeParse({",
              "        action: \"set_ik\",",
              "        bone_data: { name: \"arm\" },",
              "      }).success",
              "    ).toBe(false);",
              "    expect(",
              "      boneRiggingParameters.safeParse({",
              "        action: \"set_ik\",",
              "        bone_data: { name: \"arm\", ik_target: \"hand_target\" },",
              "      }).success",
              "    ).toBe(true);",
              "    expect(",
              "      boneRiggingParameters.safeParse({",
              "        action: \"set_ik\",",
              "        bone_data: { name: \"arm\", ik_enabled: false },",
              "      }).success",
              "    ).toBe(true);",
              "",
              "    const source = await Bun.file(\"server/tools/animation.ts\").text();",
              "    expect(source).toContain(\"if (bone_data.ik_enabled !== undefined)\");",
              "    expect(source).not.toContain(\"bone_data.ik_enabled ?? false\");",
              "  });",
          ])
          close_marker = "});\n"
          position = test.rfind(close_marker)
          if position == -1:
              raise SystemExit("Animation mutation test closing marker not found")
          test = test[:position] + addition + "\n" + test[position:]
          test_path.write_text(test, encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          anchor = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload, rejects empty `manage_keyframes` requests, requires an explicit `loop_mode` for the timeline loop mutation, rejects incomplete/effective no-op batch offset/scale requests, prevents empty animation copy/paste clipboard operations, and keeps the structured create result while compacting its duplicate text serialization. AnimationCodec behavior and playback semantics are unchanged.\n"
          note = "\nA bounded GitHub-only rigging contract correction now rejects empty `set_ik` updates and prevents target-only IK edits from implicitly forcing `ik_enabled=false`; omitted `ik_enabled` preserves the existing authored state. IK target resolution and local runtime proof requirements are unchanged.\n"
          if next_text.count(anchor) != 1:
              raise SystemExit("Unexpected animation continuity anchor")
          next_path.write_text(next_text.replace(anchor, anchor + note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit IK guard and remove temporary workflow
        run: |
          git rm .github/workflows/apply-rigging-ik-state-preservation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: preserve IK enabled state on target-only updates"
          git push origin HEAD:Local
