name: Apply Model Effectiveness Verdict

on:
  push:
    paths:
      - ".github/workflows/apply-model-effectiveness-verdict.yml"
      - "mcp/scripts/apply-model-effectiveness-verdict.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply guarded patch
        run: python3 mcp/scripts/apply-model-effectiveness-verdict.py
      - name: Install
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Tests
        working-directory: mcp
        run: bun run test
      - name: Build
        working-directory: mcp
        run: bun run build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .agents/skills/blockbench-bedrock-modelling/SKILL.md \
            .agents/skills/blockit-bedrock-entity-mcp/SKILL.md \
            docs/foundation/07-visual-validation.md \
            docs/knowledge/decisions/reference-fidelity-loop.md \
            docs/knowledge/next-action.md \
            mcp/prompts/bedrock_entity_workflow.md \
            mcp/prompts/manifest.json \
            mcp/tests/prelocal-prompt-skill-surface.test.ts
          git diff --cached --quiet && { echo "No hardening changes"; exit 1; }
          git commit -m "docs: harden model reference verdict"
          git push origin HEAD:Local
