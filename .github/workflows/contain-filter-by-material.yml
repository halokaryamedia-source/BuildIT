name: Contain Generic Texture Material Filter

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/contain-filter-by-material.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Disable raw per-face texture discovery for Bedrock single-texture format
        run: |
          python3 - <<'PY'
          from pathlib import Path

          element_path = Path('mcp/server/tools/element.ts')
          text = element_path.read_text(encoding='utf-8')
          old_desc = '      "Returns a bounded list of Cubes that reference one explicit texture. Texture identity resolves UUID/ID/unique exact name; matching face keys are optional and truncation is reported only when an additional match exists. Read-only; it does not activate, paint, or mutate textures.",'
          new_desc = '      "Legacy generic raw face.texture discovery. Disabled from the Bedrock Entity MCP surface because native Bedrock Entity is single_texture and effective face texture comes from Texture.getDefault(), not per-face texture identity.",'
          if text.count(old_desc) != 1:
              raise SystemExit('Unexpected filter_by_material description')
          text = text.replace(old_desc, new_desc, 1)
          registration = '  }, elementToolDocs[7].status);'
          disabled = '  }, elementToolDocs[7].status, false);'
          if text.count(registration) != 1:
              raise SystemExit('Unexpected filter_by_material registration')
          element_path.write_text(text.replace(registration, disabled, 1), encoding='utf-8')

          test_path = Path('mcp/tests/default-registration-import-safe.test.ts')
          test = test_path.read_text(encoding='utf-8')
          anchor = '    expect(exposed.some((tool) => tool.name === "apply_texture")).toBe(false);'
          replacement = anchor + '\n    expect(exposed.some((tool) => tool.name === "filter_by_material")).toBe(false);'
          if test.count(anchor) != 1:
              raise SystemExit('Unexpected default-registration apply_texture assertion')
          test_path.write_text(test.replace(anchor, replacement, 1), encoding='utf-8')

          generic_test_path = Path('mcp/tests/prelocal-generic-semantics.test.ts')
          generic_test = generic_test_path.read_text(encoding='utf-8')
          marker = '  test("validator inferred element references declare their non-authoritative source", async () => {'
          addition = '\n'.join([
              '  test("raw per-face texture discovery is disabled for Bedrock single-texture authoring", async () => {',
              '    const elements = await source("server/tools/element.ts");',
              '    const start = elements.indexOf(\'name: "filter_by_material"\');',
              '    const registration = elements.indexOf("elementToolDocs[7].status, false");',
              '    expect(start).toBeGreaterThan(-1);',
              '    expect(registration).toBeGreaterThan(start);',
              '    expect(elements).toContain("effective face texture comes from Texture.getDefault()");',
              '  });',
              '',
          ])
          if generic_test.count(marker) != 1:
              raise SystemExit('Unexpected generic-semantics insertion point')
          generic_test_path.write_text(generic_test.replace(marker, addition + marker, 1), encoding='utf-8')

          audit_path = Path('docs/knowledge/reviews/mcp-prelocal-generic-semantics-audit-2026-08-10.md')
          audit = audit_path.read_text(encoding='utf-8')
          anchor = '### validator references\n'
          section = '\n'.join([
              '### `filter_by_material`',
              '',
              '**DEFAULT-DISABLE** raw per-face texture discovery for Bedrock Entity.',
              '',
              'The retained implementation resolves one Texture but matches Cubes by raw `face.texture === texture.uuid/id`. Official Blockbench Bedrock Entity is `single_texture`, and native `Face.getTexture()` uses `Texture.getDefault()` for non-null faces in that format. Raw per-face texture identity therefore does not own effective Bedrock texture selection and can preserve stale/generic metadata after `apply_texture` is removed from the default surface.',
              '',
              'Normal Bedrock texture discovery remains `list_textures` + active/default texture state, while native per-face authored differentiation remains `material_instance`. Keeping `filter_by_material` callable would expose a misleading generic concept rather than a Bedrock capability.',
              '',
          ])
          if audit.count(anchor) != 1:
              raise SystemExit('Unexpected generic-semantics audit anchor')
          audit_path.write_text(audit.replace(anchor, section + anchor, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = 'Generic `apply_texture` is now default-disabled from the Bedrock Entity MCP surface. Official Blockbench defines Bedrock Entity as `single_texture`, hides native per-face Texture.apply actions for that format, and resolves non-null face textures through `Texture.getDefault()`. `activate_texture` remains the explicit active/default texture owner. This removes one misleading generic tool and its nested-Undo path without removing Bedrock texture creation, painting, PBR, or material-instance capability.'
          extra = '\n\n`filter_by_material` is default-disabled for the same native boundary: its retained generic implementation searches raw per-face `face.texture` identities, but those do not own effective texture selection in Bedrock `single_texture`. `list_textures`/active-default texture state remain the texture owner and `material_instance` remains the native per-face authored differentiation path.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected apply_texture continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Measure callable tools-list after containment
        working-directory: mcp
        run: |
          cat > .measure.ts <<'TS'
          import { McpServer } from "@modelcontextprotocol/sdk/server/mcp.js";
          import { WebStandardStreamableHTTPServerTransport } from "@modelcontextprotocol/sdk/server/webStandardStreamableHttp.js";
          import { registerToolsOnServer } from "./lib/factories";
          import "./server/tools";
          const server = new McpServer({ name: "blockit-filter-audit", version: "1.0.0" });
          registerToolsOnServer(server);
          const transport = new WebStandardStreamableHTTPServerTransport({ sessionIdGenerator: undefined, enableJsonResponse: true });
          await server.connect(transport);
          try {
            const response = await transport.handleRequest(new Request("http://127.0.0.1:3000/bb-mcp", {
              method: "POST",
              headers: { accept: "application/json, text/event-stream", "content-type": "application/json", "mcp-protocol-version": "2025-06-18" },
              body: JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} }),
            }));
            const raw = await response.text();
            if (response.status !== 200) throw new Error(raw);
            const parsed = JSON.parse(raw) as { result?: { tools?: Array<{ name?: string; description?: string; inputSchema?: unknown }> } };
            const tools = parsed.result?.tools ?? [];
            const metrics = {
              enabled_tools: tools.length,
              response_characters: raw.length,
              input_schema_characters: tools.reduce((sum, tool) => sum + JSON.stringify(tool.inputSchema ?? {}).length, 0),
              description_characters: tools.reduce((sum, tool) => sum + (tool.description ?? "").length, 0),
              has_apply_texture: tools.some((tool) => tool.name === "apply_texture"),
              has_filter_by_material: tools.some((tool) => tool.name === "filter_by_material"),
              has_activate_texture: tools.some((tool) => tool.name === "activate_texture"),
              has_list_textures: tools.some((tool) => tool.name === "list_textures"),
              has_material_instances: tools.some((tool) => tool.name === "get_face_material_instances"),
            };
            console.log(JSON.stringify(metrics));
            await Bun.write(".filter-wire.json", JSON.stringify(metrics));
            if (metrics.enabled_tools !== 63 || metrics.has_apply_texture || metrics.has_filter_by_material || !metrics.has_activate_texture || !metrics.has_list_textures || !metrics.has_material_instances) {
              throw new Error(`Unexpected Bedrock callable surface: ${JSON.stringify(metrics)}`);
            }
          } finally {
            await server.close();
          }
          TS
          bun .measure.ts
          rm .measure.ts

      - name: Record current wire measurement
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          metrics = json.loads(Path('mcp/.filter-wire.json').read_text(encoding='utf-8'))
          Path('mcp/.filter-wire.json').unlink()

          next_path = Path('docs/knowledge/next-action.md')
          text = next_path.read_text(encoding='utf-8')
          old_prefix = 'The actual stateless MCP `tools/list` wire surface has been re-measured after Bedrock semantic containment: **64 enabled tools / '
          start = text.find(old_prefix)
          if start < 0:
              raise SystemExit('Current 64-tool measurement paragraph not found')
          end = text.find('\n\n', start)
          old = text[start:end]
          new = f"The actual stateless MCP `tools/list` wire surface has been re-measured after Bedrock semantic containment: **{metrics['enabled_tools']} enabled tools / {metrics['response_characters']:,} response characters**, including **{metrics['input_schema_characters']:,} characters of input schemas** and **{metrics['description_characters']:,} characters of tool descriptions**. The previous 65-tool / 72,817-character value and later 64-tool measurement remain historical evidence from earlier source states; byte totals are not treated as a same-state performance benchmark. A geometry-only lane is still **not** adopted as the default because it would remove retained texture/animation/Locator paths. The next large usage lever remains real Codex native lazy/deferred MCP tool loading proof before any BlockIT router/profile architecture."
          text = text[:start] + new + text[end:]
          next_path.write_text(text, encoding='utf-8')

          review_path = Path('docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md')
          review = review_path.read_text(encoding='utf-8')
          anchor = '`activate_texture` remains exposed; `apply_texture` is absent from the callable tools list. This is a Bedrock semantics correction, not a geometry benchmark profile or arbitrary context cut.'
          extra = '\n\nA later Bedrock semantics audit also default-disabled `filter_by_material`, because it searched raw per-face `face.texture` identities that do not own effective texture selection in native `single_texture`. Current callable measurement after both containments: **' + str(metrics['enabled_tools']) + ' tools / ' + f"{metrics['response_characters']:,}" + ' response characters / ' + f"{metrics['input_schema_characters']:,}" + ' input-schema characters / ' + f"{metrics['description_characters']:,}" + ' description characters**. Historical byte totals are retained as evidence, not compared as a controlled performance benchmark across different source states.'
          if review.count(anchor) != 1:
              raise SystemExit('Unexpected deferred-loading review anchor')
          review_path.write_text(review.replace(anchor, anchor + extra, 1), encoding='utf-8')
          PY

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/contain-filter-by-material.yml
          git add mcp/server/tools/element.ts mcp/tests/default-registration-import-safe.test.ts mcp/tests/prelocal-generic-semantics.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/reviews/mcp-prelocal-generic-semantics-audit-2026-08-10.md docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md docs/knowledge/next-action.md
          git commit -m 'refactor: contain raw texture material filter'
          git push origin HEAD:Local