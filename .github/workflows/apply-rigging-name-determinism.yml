name: Apply Rig Bone Name Determinism

on:
  push:
    paths:
      - ".github/workflows/apply-rigging-name-determinism.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Enforce case-insensitive rig bone identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          animation_path = Path("mcp/server/tools/animation.ts")
          text = animation_path.read_text(encoding="utf-8")

          helper_marker = "export function wouldCreateRigHierarchyCycle(\n"
          helper = "\n".join([
              "export function hasCaseInsensitiveRigNameCollision(",
              "  groups: readonly { uuid: string; name: string }[],",
              "  requestedName: string,",
              "  excludeUuid?: string",
              "): boolean {",
              "  const normalizedName = requestedName.toLowerCase();",
              "  return groups.some(",
              "    (group) =>",
              "      group.uuid !== excludeUuid && group.name.toLowerCase() === normalizedName",
              "  );",
              "}",
              "",
          ])
          if text.count(helper_marker) != 1:
              raise SystemExit("Unexpected rig helper insertion point")
          text = text.replace(helper_marker, helper + helper_marker, 1)

          old_create = "\n".join([
              "        case \"create\":",
              "          if (Group.all.some((group: Group) => group.name === bone_data.name)) {",
              "            throw new Error(",
              "              `Bone name \"${bone_data.name}\" already exists. Use a unique bone name so future animation/rig targets stay unambiguous.`",
              "            );",
              "          }",
          ])
          new_create = "\n".join([
              "        case \"create\":",
              "          if (hasCaseInsensitiveRigNameCollision(Group.all, bone_data.name)) {",
              "            throw new Error(",
              "              `Bone name \"${bone_data.name}\" collides case-insensitively with an existing Group. Bedrock animation matching is case-insensitive; use a distinct bone name.`",
              "            );",
              "          }",
          ])
          if text.count(old_create) != 1:
              raise SystemExit("Unexpected rig create name guard")
          text = text.replace(old_create, new_create, 1)

          old_rename = "\n".join([
              "          if (",
              "            Group.all.some(",
              "              (group: Group) =>",
              "                group !== targetBone && group.name === bone_data.new_name",
              "            )",
              "          ) {",
              "            throw new Error(",
              "              `Bone name \"${bone_data.new_name}\" already exists. Choose a unique name.`",
              "            );",
              "          }",
              "          break;",
          ])
          new_rename = "\n".join([
              "          if (bone_data.new_name === targetBone.name) {",
              "            throw new Error(",
              "              `Bone \"${targetBone.name}\" already has that exact name; rename requires an authored name change.`",
              "            );",
              "          }",
              "          if (",
              "            hasCaseInsensitiveRigNameCollision(",
              "              Group.all,",
              "              bone_data.new_name,",
              "              targetBone.uuid",
              "            )",
              "          ) {",
              "            throw new Error(",
              "              `Bone name \"${bone_data.new_name}\" collides case-insensitively with another Group. Bedrock animation matching is case-insensitive; choose a distinct name.`",
              "            );",
              "          }",
              "          break;",
          ])
          if text.count(old_rename) != 1:
              raise SystemExit("Unexpected rig rename name guard")
          text = text.replace(old_rename, new_rename, 1)

          old_description = "      \"Creates or edits Group bones with preflighted explicit targets. `parent` rejects self/descendant hierarchy cycles before Undo; `set_pivot` requires origin and preserves visual contents; `mirror` requires an axis; `set_ik` requires an explicit IK field and preserves the existing enabled state when only the target is changed. Missing/ambiguous targets fail before mutation. The tool does not infer joints, pivots, rotation, or hierarchy from appearance.\"," 
          new_description = "      \"Creates or edits Group bones with preflighted explicit targets. Create/rename preserve case-insensitive bone-name uniqueness required by Bedrock animation matching; `parent` rejects self/descendant hierarchy cycles before Undo; `set_pivot` requires origin and preserves visual contents; `mirror` requires an axis; `set_ik` requires an explicit IK field and preserves the existing enabled state when only the target is changed. Missing/ambiguous targets fail before mutation. The tool does not infer joints, pivots, rotation, or hierarchy from appearance.\"," 
          if text.count(old_description) != 1:
              raise SystemExit("Unexpected rig description")
          animation_path.write_text(text.replace(old_description, new_description, 1), encoding="utf-8")

          test_path = Path("mcp/tests/animation-mutation-contract.test.ts")
          test = test_path.read_text(encoding="utf-8")
          old_import = "\n".join([
              "  boneRiggingParameters,",
              "  countAnimationClipboardKeyframes,",
          ])
          new_import = "\n".join([
              "  boneRiggingParameters,",
              "  countAnimationClipboardKeyframes,",
              "  hasCaseInsensitiveRigNameCollision,",
          ])
          if test.count(old_import) != 1:
              raise SystemExit("Unexpected animation mutation import area")
          test = test.replace(old_import, new_import, 1)

          addition = "\n".join([
              "",
              "  test(\"rig bone names reject case-insensitive collisions while allowing self case-only rename\", async () => {",
              "    const groups = [",
              "      { uuid: \"arm-id\", name: \"Arm\" },",
              "      { uuid: \"leg-id\", name: \"Leg\" },",
              "    ];",
              "    expect(hasCaseInsensitiveRigNameCollision(groups, \"arm\")).toBe(true);",
              "    expect(hasCaseInsensitiveRigNameCollision(groups, \"ARM\")).toBe(true);",
              "    expect(",
              "      hasCaseInsensitiveRigNameCollision(groups, \"arm\", \"arm-id\")",
              "    ).toBe(false);",
              "    expect(hasCaseInsensitiveRigNameCollision(groups, \"hand\")).toBe(false);",
              "",
              "    const source = await Bun.file(\"server/tools/animation.ts\").text();",
              "    expect(source).toContain(\"hasCaseInsensitiveRigNameCollision(Group.all, bone_data.name)\");",
              "    expect(source).toContain(\"bone_data.new_name === targetBone.name\");",
              "    expect(source).not.toContain(\"group.name === bone_data.new_name\");",
              "  });",
          ])
          close_marker = "});\n"
          position = test.rfind(close_marker)
          if position == -1:
              raise SystemExit("Animation mutation test closing marker not found")
          test = test[:position] + addition + "\n" + test[position:]
          test_path.write_text(test, encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          old_note = "A bounded GitHub-only rigging contract correction now rejects empty `set_ik` updates, prevents target-only IK edits from implicitly forcing `ik_enabled=false`, and rejects parent operations whose self/descendant/existing parent chain would create or extend a hierarchy cycle before Undo. Omitted `ik_enabled` preserves the existing authored state. IK target resolution and local runtime proof requirements are unchanged."
          new_note = "A bounded GitHub-only rigging contract correction now rejects empty `set_ik` updates, prevents target-only IK edits from implicitly forcing `ik_enabled=false`, rejects parent operations whose self/descendant/existing parent chain would create or extend a hierarchy cycle before Undo, and keeps create/rename bone identities unique under the case-insensitive matching used by Bedrock animation import. Exact no-op renames are rejected while case-only self renames remain valid. Omitted `ik_enabled` preserves the existing authored state. IK target resolution and local runtime proof requirements are unchanged."
          if next_text.count(old_note) != 1:
              raise SystemExit("Unexpected rigging continuity note")
          next_path.write_text(next_text.replace(old_note, new_note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit name guard and remove temporary workflow
        run: |
          git rm .github/workflows/apply-rigging-name-determinism.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: preserve deterministic rig bone names"
          git push origin HEAD:Local
