name: One-time Geometry Typecheck Fix

on:
  push:
    branches:
      - Rework
    paths:
      - ".github/workflows/fix-geometry-typecheck-once.yml"

permissions:
  contents: write

concurrency:
  group: one-time-geometry-typecheck-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Rework
        uses: actions/checkout@v4
        with:
          ref: Rework
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply targeted TypeScript fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, expected: int = 1) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s) of {old!r}, found {count}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")

          analyzer = Path("mcp-blockbench/src/server/tools/geometry-analyzer.ts")
          replace_exact(
              analyzer,
              "for (const view of views) {",
              "for (const view of views as StandardGeometryView[]) {",
              expected=2,
          )

          feedback = Path("mcp-blockbench/src/server/tools/geometry-feedback.ts")
          replace_exact(
              feedback,
              'if (!Project) throw new Error("No Blockbench project is open.");\n        if (expected_project_uuid && Project.uuid !== expected_project_uuid) {',
              'if (!Project) throw new Error("No Blockbench project is open.");\n        const activeProject = Project;\n        if (expected_project_uuid && activeProject.uuid !== expected_project_uuid) {',
          )
          replace_exact(
              feedback,
              '`PROJECT_UUID_MISMATCH: active ${Project.uuid}, expected ${expected_project_uuid}.`',
              '`PROJECT_UUID_MISMATCH: active ${activeProject.uuid}, expected ${expected_project_uuid}.`',
          )
          replace_exact(
              feedback,
              "const result = captureScreenshot(Project.uuid);",
              "const result = captureScreenshot(activeProject.uuid);",
          )
          replace_exact(
              feedback,
              "const cubes = elements.map((element) => {",
              "const cubes = elements.map((element: z.infer<typeof safeCubeSchema>) => {",
          )
          replace_exact(
              feedback,
              "cubes.map((cube) => cube.uuid)",
              "cubes.map((cube: Cube) => cube.uuid)",
          )
          replace_exact(
              feedback,
              "cubes.map((cube) => ({ name: cube.name, uuid: cube.uuid }))",
              "cubes.map((cube: Cube) => ({ name: cube.name, uuid: cube.uuid }))",
          )
          replace_exact(
              feedback,
              "const resolved = changes.map((change) => {",
              "const resolved = changes.map((change: z.infer<typeof cubeChangeSchema>) => {",
          )
          replace_exact(
              feedback,
              "resolved.map(({ cube }) => cube)",
              "resolved.map(({ cube }: { cube: Cube }) => cube)",
          )
          replace_exact(
              feedback,
              "resolved.map(({ cube }) => cube.uuid)",
              "resolved.map(({ cube }: { cube: Cube }) => cube.uuid)",
          )
          replace_exact(
              feedback,
              "resolved.map(({ cube }) => ({ name: cube.name, uuid: cube.uuid }))",
              "resolved.map(({ cube }: { cube: Cube }) => ({ name: cube.name, uuid: cube.uuid }))",
          )

          visual = Path("mcp-blockbench/src/server/tools/visual-compare.ts")
          replace_exact(
              visual,
              "for (const view of views) {",
              "for (const view of views as StandardView[]) {",
          )
          replace_exact(
              visual,
              "const view = views[index];",
              "const view = views[index] as StandardView;",
          )

      - name: Install dependencies
        working-directory: mcp-blockbench
        run: bun install --frozen-lockfile

      - name: Verify synchronized skills
        working-directory: mcp-blockbench
        run: bun run skills:check

      - name: Typecheck
        working-directory: mcp-blockbench
        run: bun run typecheck

      - name: Test
        working-directory: mcp-blockbench
        run: bun test

      - name: Build
        working-directory: mcp-blockbench
        run: bun run build

      - name: Verify plugin output
        shell: bash
        run: |
          test -s mcp-blockbench/dist/mcp.js
          sha256sum mcp-blockbench/dist/mcp.js

      - name: Commit verified fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-geometry-typecheck-once.yml
          git add \
            mcp-blockbench/src/server/tools/geometry-analyzer.ts \
            mcp-blockbench/src/server/tools/geometry-feedback.ts \
            mcp-blockbench/src/server/tools/visual-compare.ts \
            mcp-blockbench/dist/mcp.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: resolve Geometry TypeScript inference"
          git push origin HEAD:Rework
