name: Record P1.3 Completion Payload

on:
  push:
    paths:
      - ".github/workflows/advance-p1-core-doc-runner.yml"

permissions:
  contents: write

jobs:
  update-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - name: Update next-action snapshot
        run: |
          echo '' | base64 -d > /tmp/update_next_action.py
          python /tmp/update_next_action.py

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/knowledge/next-action.md
          git diff --cached --check
          git commit -m "docs: advance MCP stabilization to transport decision"
          git push origin Local
