name: Fix Synchronization Typecheck

on:
  push:
    branches: [Local]
    paths:
      - ".github/workflows/fix-sync-typecheck.yml"

permissions:
  contents: write

jobs:
  fix-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install exact dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Align Gateway status fixtures and readonly contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixture_paths = [
              'mcp/scripts/measure-control-context.ts',
              'mcp/tests/gateway-control-active-contract.test.ts',
              'mcp/tests/gateway-control-development.test.ts',
              'mcp/tests/gateway-control-lifecycle-readiness.test.ts',
              'mcp/tests/gateway-control-reference-readiness.test.ts',
              'mcp/tests/gateway-control-routing.test.ts',
              'mcp/tests/gateway-control.test.ts',
          ]
          connection = '''  connection: {\n    state: "ready",\n    generation: 1,\n    reconnect_count: 0,\n    catalog_refresh_count: 1,\n    last_ready_at: "2026-09-12T00:00:00.000Z",\n    last_transition_at: "2026-09-12T00:00:00.000Z",\n    reconnect: { failures: 0, retry_after_ms: 0 },\n  },\n'''
          for path in fixture_paths:
              p = Path(path)
              s = p.read_text()
              if 'connection:' in s:
                  continue
              marker = '  operations:' if path != 'mcp/tests/gateway-control-lifecycle-readiness.test.ts' else '    operations:'
              if marker not in s:
                  raise SystemExit(f'operations marker missing in {path}')
              indent_connection = connection if marker.startswith('  ') and not marker.startswith('    ') else ''.join('  '+line if line.strip() else line for line in connection.splitlines(True))
              s = s.replace(marker, indent_connection + marker, 1)
              if path.endswith('gateway-control-lifecycle-readiness.test.ts'):
                  s = s.replace('phase === "animation" ? 20 : 47', 'phase === "animation" ? 18 : 47')
              p.write_text(s)

          p = Path('mcp/scripts/verify-stateless-local.ts')
          s = p.read_text()
          s = s.replace('getMcpSurfaceToolNames(EXPECTED_PROFILE, phase).sort()', '[...getMcpSurfaceToolNames(EXPECTED_PROFILE, phase)].sort()')
          s = s.replace('expectedNames.filter((name) => !names.includes(name))', 'expectedNames.filter((name: string) => !names.includes(name))')
          s = s.replace('names.filter((name) => !expectedNames.includes(name))', 'names.filter((name: string) => !expectedNames.includes(name))')
          p.write_text(s)

          p = Path('mcp/tests/p1-transport-stateless.test.ts')
          s = p.read_text().replace('expect(registered).toEqual(animationSurface);', 'expect(registered).toEqual([...animationSurface]);')
          p.write_text(s)
          PY

      - name: Typecheck synchronized source
        working-directory: mcp
        run: |
          bun run typecheck
          bun run typecheck:gateway

      - name: Remove transient workflow and commit type closure
        run: |
          rm .github/workflows/fix-sync-typecheck.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align synchronization type contracts"
          git push origin HEAD:Local
