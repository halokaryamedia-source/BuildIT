name: MCP Verify

on:
  push:
    branches:
      - Local
    paths:
      - "mcp/**"
      - "!mcp/AGENTS.md"
      - "!mcp/README.md"
      - "!mcp/about.md"
      - "!mcp/gateway/README.md"
      - "!mcp/llms.txt"
      - "!mcp/tests/repository/**"
      - "!mcp/tests/authoring/**"
      - "!mcp/prompts/blockbench_code_eval_safety.md"
      - "!mcp/prompts/blockbench_native_apis.md"
      # Runtime contract tests read these semantic skill owners directly.
      - ".agents/skills/blockit-bedrock-entity-mcp/**"
      - ".agents/skills/blockbench-bedrock-modelling/**"
      - ".agents/skills/blockit-bedrock-texturing/**"
      - ".agents/skills/blockit-bedrock-animation/**"
      - "Experimental/three-d-assisted-hunyuan-poc/**"
      - "Experimental/primitiveanything-poc/**"
      - ".bun-version"
      - ".github/workflows/mcp-verify.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Verify executable MCP contract
        run: bun run verify:mcp

      - name: Record exact-SHA build provenance
        run: bun run ./scripts/verified-build-artifact.ts write-ci

      - name: Upload verified BlockIT bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blockit-mcp-verified
          path: |
            mcp/dist/blockit_mcp.js
            mcp/dist/blockit-build-provenance.json
          if-no-files-found: error
          retention-days: 14
