name: MCP Verify

on:
  push:
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-verify.yml"
  pull_request:
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-verify.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck

      - name: Contract tests
        id: tests
        continue-on-error: true
        run: bun run test

      - name: Production build
        id: build
        continue-on-error: true
        run: bun run build

      - name: Generated docs freshness
        id: docs
        continue-on-error: true
        run: bun run docs:check

      - name: Regenerate generated MCP output
        if: always()
        run: bun run docs:build

      - name: Commit generated MCP output once
        if: github.event_name == 'push' && github.ref_name == 'Local'
        working-directory: .
        run: |
          if git diff --quiet -- mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json; then
            echo "Generated MCP output already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json
          git commit -m "docs: sync generated MCP output"
          git push origin HEAD:Local

      - name: Enforce verification result
        if: always()
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
        run: |
          failed=0
          for gate in TYPECHECK TESTS BUILD DOCS; do
            outcome_var="${gate}_OUTCOME"
            outcome="${!outcome_var}"
            if [ "$outcome" != "success" ]; then
              echo "${gate} gate failed: ${outcome}"
              failed=1
            fi
          done
          exit "$failed"
