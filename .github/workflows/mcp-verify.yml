name: MCP Verify

on:
  push:
    paths:
      - "mcp/**"
      - "AGENTS.md"
      - "README.md"
      - "CONTEXT.md"
      - ".agents/skills/**"
      - "docs/knowledge/**"
      - "docs/foundation/**"
      - ".bun-version"
      - ".github/workflows/mcp-verify.yml"
  pull_request:
    paths:
      - "mcp/**"
      - "AGENTS.md"
      - "README.md"
      - "CONTEXT.md"
      - ".agents/skills/**"
      - "docs/knowledge/**"
      - "docs/foundation/**"
      - ".bun-version"
      - ".github/workflows/mcp-verify.yml"
  workflow_dispatch:

# TEMPORARY ONE-SHOT CLOSURE: this revision may push only regenerated docs after
# every source gate succeeds. The generated commit restores this workflow to
# contents:read and removes the closure step itself.
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck

      - name: Contract tests
        id: tests
        continue-on-error: true
        run: bun run test

      - name: Default MCP surface measurement
        id: surface
        continue-on-error: true
        run: bun run measure:surface

      - name: Production build
        id: build
        continue-on-error: true
        run: bun run build

      - name: Generated docs freshness
        id: docs
        continue-on-error: true
        run: bun run docs:check

      - name: One-shot generated docs closure
        if: github.event_name == 'push' && steps.typecheck.outcome == 'success' && steps.tests.outcome == 'success' && steps.surface.outcome == 'success' && steps.build.outcome == 'success' && steps.docs.outcome == 'failure'
        run: |
          bun run docs:build
          cat > ../.github/workflows/mcp-verify.yml <<'NORMAL_WORKFLOW'
          name: MCP Verify

          on:
            push:
              paths:
                - "mcp/**"
                - "AGENTS.md"
                - "README.md"
                - "CONTEXT.md"
                - ".agents/skills/**"
                - "docs/knowledge/**"
                - "docs/foundation/**"
                - ".bun-version"
                - ".github/workflows/mcp-verify.yml"
            pull_request:
              paths:
                - "mcp/**"
                - "AGENTS.md"
                - "README.md"
                - "CONTEXT.md"
                - ".agents/skills/**"
                - "docs/knowledge/**"
                - "docs/foundation/**"
                - ".bun-version"
                - ".github/workflows/mcp-verify.yml"
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              defaults:
                run:
                  working-directory: mcp

              steps:
                - name: Checkout
                  uses: actions/checkout@v6

                - name: Setup Bun
                  uses: oven-sh/setup-bun@v2
                  with:
                    bun-version-file: ".bun-version"

                - name: Install dependencies from lockfile
                  run: bun install --frozen-lockfile

                - name: Typecheck
                  id: typecheck
                  continue-on-error: true
                  run: bun run typecheck

                - name: Contract tests
                  id: tests
                  continue-on-error: true
                  run: bun run test

                - name: Default MCP surface measurement
                  id: surface
                  continue-on-error: true
                  run: bun run measure:surface

                - name: Production build
                  id: build
                  continue-on-error: true
                  run: bun run build

                - name: Generated docs freshness
                  id: docs
                  continue-on-error: true
                  run: bun run docs:check

                - name: Enforce verification result
                  if: always()
                  env:
                    TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
                    TESTS_OUTCOME: ${{ steps.tests.outcome }}
                    SURFACE_OUTCOME: ${{ steps.surface.outcome }}
                    BUILD_OUTCOME: ${{ steps.build.outcome }}
                    DOCS_OUTCOME: ${{ steps.docs.outcome }}
                  run: |
                    failed=0
                    for gate in TYPECHECK TESTS SURFACE BUILD DOCS; do
                      outcome_var="${gate}_OUTCOME"
                      outcome="${!outcome_var}"
                      if [ "$outcome" != "success" ]; then
                        echo "${gate} gate failed: ${outcome}"
                        failed=1
                      fi
                    done
                    exit "$failed"
          NORMAL_WORKFLOW
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add mcp/docs/api.json mcp/docs/index.html .github/workflows/mcp-verify.yml
          git -C .. diff --cached --quiet && exit 0
          git -C .. commit -m "docs: refresh generated MCP docs"
          git -C .. push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Enforce verification result
        if: always()
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          SURFACE_OUTCOME: ${{ steps.surface.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
        run: |
          failed=0
          for gate in TYPECHECK TESTS SURFACE BUILD DOCS; do
            outcome_var="${gate}_OUTCOME"
            outcome="${!outcome_var}"
            if [ "$outcome" != "success" ]; then
              echo "${gate} gate failed: ${outcome}"
              failed=1
            fi
          done
          exit "$failed"
