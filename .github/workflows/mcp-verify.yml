name: MCP Verify

on:
  push:
    paths:
      - "mcp/**"
      - ".bun-version"
      - ".github/workflows/mcp-verify.yml"
  pull_request:
    paths:
      - "mcp/**"
      - ".bun-version"
      - ".github/workflows/mcp-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck

      - name: Contract tests
        id: tests
        continue-on-error: true
        run: bun run test

      - name: Default MCP surface measurement
        id: surface
        continue-on-error: true
        run: bun run measure:surface

      - name: Production build
        id: build
        continue-on-error: true
        run: bun run build

      - name: Generated docs freshness
        id: docs
        continue-on-error: true
        run: bun run docs:check

      - name: Enforce verification result
        if: always()
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          SURFACE_OUTCOME: ${{ steps.surface.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
        run: |
          failed=0
          for gate in TYPECHECK TESTS SURFACE BUILD DOCS; do
            outcome_var="${gate}_OUTCOME"
            outcome="${!outcome_var}"
            if [ "$outcome" != "success" ]; then
              echo "${gate} gate failed: ${outcome}"
              failed=1
            fi
          done
          exit "$failed"
