name: MCP Verify

on:
  push:
    branches:
      - Rework
    paths:
      - "mcp-blockbench/**"
      - "engines/shared/**"
      - "engines/chatgpt/skills/blockbench-reference-studio/**"
      - ".agents/skills/blockbench-*/**"
      - ".codex/skills/blockbench-*/**"
      - ".github/workflows/mcp-verify.yml"
  pull_request:
    paths:
      - "mcp-blockbench/**"
      - "engines/shared/**"
      - "engines/chatgpt/skills/blockbench-reference-studio/**"
      - ".agents/skills/blockbench-*/**"
      - ".codex/skills/blockbench-*/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-blockbench

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify synchronized skills
        id: skills
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/verification-logs"
          set -o pipefail
          bun run skills:check 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/skills-check.log"

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/verification-logs"
          set -o pipefail
          bun run typecheck 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/typecheck.log"

      - name: Test
        id: test
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/verification-logs"
          set -o pipefail
          bun test 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/test.log"

      - name: Build
        id: build
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/verification-logs"
          set -o pipefail
          bun run build 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/build.log"

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-verification-logs
          path: verification-logs/
          retention-days: 7

      - name: Enforce verification result
        if: always()
        env:
          SKILLS_OUTCOME: ${{ steps.skills.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          printf 'skills=%s\ntypecheck=%s\ntest=%s\nbuild=%s\n' \
            "$SKILLS_OUTCOME" "$TYPECHECK_OUTCOME" "$TEST_OUTCOME" "$BUILD_OUTCOME"
          if [[ "$SKILLS_OUTCOME" != "success" || \
                "$TYPECHECK_OUTCOME" != "success" || \
                "$TEST_OUTCOME" != "success" || \
                "$BUILD_OUTCOME" != "success" ]]; then
            exit 1
          fi
