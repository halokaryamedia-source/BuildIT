name: MCP Verify

on:
  push:
    branches:
      - Local
    paths:
      - "mcp/**"
      - "!mcp/AGENTS.md"
      - "!mcp/README.md"
      - "!mcp/tests/repository-*.test.ts"
      - "!mcp/tests/documentation-handoff.test.ts"
      - "!mcp/tests/experimental-authoring-contract.test.ts"
      - "!mcp/tests/active-routing-integrity.test.ts"
      - "!mcp/tests/static-footprint-budget.test.ts"
      - "!mcp/tests/*authoring*.test.ts"
      - "!mcp/tests/asset-tool-routing.test.ts"
      - "!mcp/tests/reference-generator-buildability.test.ts"
      - "!mcp/tests/model-effectiveness-*.test.ts"
      - "!mcp/tests/texture-design-reasoning.test.ts"
      - "!mcp/tests/texture-production-discipline.test.ts"
      - "!mcp/tests/texture-visual-convergence.test.ts"
      - "!mcp/tests/animation-professional-reasoning.test.ts"
      - "!mcp/tests/codex-agent-legibility-contract.test.ts"
      - "!mcp/tests/prelocal-prompt-skill-surface.test.ts"
      - "!mcp/tests/prelocal-usage-optimization.test.ts"
      - "!mcp/tests/route1-hunyuan-reproducibility.test.ts"
      - "!mcp/prompts/blockbench_code_eval_safety.md"
      - "!mcp/prompts/blockbench_native_apis.md"
      - ".bun-version"
      - ".github/workflows/mcp-verify.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Verify executable MCP contract
        run: bun run verify:mcp
