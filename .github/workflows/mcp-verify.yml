name: MCP Verify

on:
  push:
    branches:
      - Rework
    paths:
      - "mcp-blockbench/**"
      - "engines/shared/**"
      - "engines/chatgpt/skills/blockbench-reference-studio/**"
      - ".agents/skills/blockbench-*/**"
      - ".codex/skills/blockbench-*/**"
      - ".github/workflows/mcp-verify.yml"
  pull_request:
    paths:
      - "mcp-blockbench/**"
      - "engines/shared/**"
      - "engines/chatgpt/skills/blockbench-reference-studio/**"
      - ".agents/skills/blockbench-*/**"
      - ".codex/skills/blockbench-*/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-blockbench

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify synchronized skills
        run: bun run skills:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
