name: MCP Verify

on:
  push:
    branches:
      - Local
    paths:
      - "mcp/**"
      - "!mcp/*.md"
      - "!mcp/**/*.md"
      - "!mcp/docs/**"
      - "!mcp/llms.txt"
      - ".bun-version"
  pull_request:
    branches:
      - Local
    paths:
      - "mcp/**"
      - "!mcp/*.md"
      - "!mcp/**/*.md"
      - "!mcp/docs/**"
      - "!mcp/llms.txt"
      - ".bun-version"
  workflow_dispatch:

concurrency:
  group: mcp-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Contract tests
        run: bun run test

      - name: Default MCP surface measurement
        run: bun run measure:surface

      - name: Production build
        run: bun run build

      - name: Generated docs freshness
        run: bun run docs:check
