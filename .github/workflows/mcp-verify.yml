name: MCP Verify

on:
  push:
    paths:
      - "mcp/**"
      - "AGENTS.md"
      - "README.md"
      - "CONTEXT.md"
      - ".agents/skills/**"
      - "docs/knowledge/**"
      - "docs/foundation/**"
      - ".bun-version"
      - ".github/workflows/mcp-verify.yml"
  pull_request:
    paths:
      - "mcp/**"
      - "AGENTS.md"
      - "README.md"
      - "CONTEXT.md"
      - ".agents/skills/**"
      - "docs/knowledge/**"
      - "docs/foundation/**"
      - ".bun-version"
      - ".github/workflows/mcp-verify.yml"
  workflow_dispatch:

# Temporary one-shot generated-doc closure. This revision may push only the
# deterministic generated docs after all source gates succeed. It does not edit
# workflow files, source, schemas, or capability state.
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck

      - name: Contract tests
        id: tests
        continue-on-error: true
        run: bun run test

      - name: Default MCP surface measurement
        id: surface
        continue-on-error: true
        run: bun run measure:surface

      - name: Production build
        id: build
        continue-on-error: true
        run: bun run build

      - name: Generated docs freshness
        id: docs
        continue-on-error: true
        run: bun run docs:check

      - name: One-shot generated docs closure
        if: github.event_name == 'push' && steps.typecheck.outcome == 'success' && steps.tests.outcome == 'success' && steps.surface.outcome == 'success' && steps.build.outcome == 'success' && steps.docs.outcome == 'failure'
        run: |
          bun run docs:build
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add mcp/docs/api.json mcp/docs/index.html
          git -C .. diff --cached --quiet && exit 0
          git -C .. commit -m "docs: refresh generated MCP docs"
          git -C .. push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Enforce verification result
        if: always()
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          SURFACE_OUTCOME: ${{ steps.surface.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
        run: |
          failed=0
          for gate in TYPECHECK TESTS SURFACE BUILD DOCS; do
            outcome_var="${gate}_OUTCOME"
            outcome="${!outcome_var}"
            if [ "$outcome" != "success" ]; then
              echo "${gate} gate failed: ${outcome}"
              failed=1
            fi
          done
          exit "$failed"
