name: MCP Verify

on:
  push:
    branches:
      - Local
    paths:
      - "mcp/**"
      - "!mcp/AGENTS.md"
      - "!mcp/README.md"
      - "!mcp/prompts/blockbench_code_eval_safety.md"
      - "!mcp/prompts/blockbench_native_apis.md"
      - ".agents/skills/blockit-bedrock-entity-mcp/SKILL.md"
      - ".agents/skills/blockit-bedrock-texturing/SKILL.md"
      - "docs/foundation/06-texture-standard.md"
      - ".agents/skills/blockit-bedrock-animation/SKILL.md"
      - "docs/foundation/08-animation-standard.md"
      - ".bun-version"
      - ".github/workflows/mcp-verify.yml"
  pull_request:
    branches:
      - Local
      - main
    paths:
      - "mcp/**"
      - "!mcp/AGENTS.md"
      - "!mcp/README.md"
      - "!mcp/prompts/blockbench_code_eval_safety.md"
      - "!mcp/prompts/blockbench_native_apis.md"
      - ".agents/skills/blockit-bedrock-entity-mcp/SKILL.md"
      - ".agents/skills/blockit-bedrock-texturing/SKILL.md"
      - "docs/foundation/06-texture-standard.md"
      - ".agents/skills/blockit-bedrock-animation/SKILL.md"
      - "docs/foundation/08-animation-standard.md"
      - ".bun-version"
      - ".github/workflows/mcp-verify.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Contract tests
        run: bun run test

      - name: Default MCP surface measurement
        run: bun run measure:surface

      - name: Production build
        run: bun run build

      - name: Generated docs freshness
        run: bun run docs:check
