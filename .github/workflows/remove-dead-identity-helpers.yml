name: Remove Dead Identity Helpers

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/remove-dead-identity-helpers.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Remove dead ambiguous helpers and stale guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          util_path = Path('mcp/lib/util.ts')
          util = util_path.read_text(encoding='utf-8')
          start_marker = '// ============================================================================\n// Lookup Helpers with Actionable Error Messages\n// ============================================================================\n\n'
          end_marker = '/**\n * Helper to find a TextureGroup by name or UUID\n */\n'
          start = util.index(start_marker)
          end = util.index(end_marker, start)
          replacement = '// ============================================================================\n// Texture-group / channel helpers\n// ============================================================================\n\n'
          util_path.write_text(util[:start] + replacement + util[end:], encoding='utf-8')

          prompt_path = Path('mcp/.github/prompts/implement-feature-request.prompt.md')
          prompt = prompt_path.read_text(encoding='utf-8')
          old_lookup = '- Use helper functions like `findTextureOrThrow()`, `findElementOrThrow()` for lookups\n- Throw descriptive errors with actionable suggestions\n- Validate inputs before performing operations'
          new_lookup = '- Reuse `lib/coreIdentity.ts` resolvers for retained Cube/Group/Texture/Animation targets; UUID wins and explicit names must be unique\n- Throw descriptive errors with actionable suggestions\n- Validate inputs before performing operations'
          if prompt.count(old_lookup) != 1:
              raise SystemExit('Unexpected maintainer lookup guidance')
          prompt = prompt.replace(old_lookup, new_lookup, 1)
          old_test = '1. Run `bun run build` to verify compilation\n2. Use `blockbench_risky_eval` to test the feature in Blockbench\n3. Verify the output matches the expected format from the issue'
          new_test = '1. Run the focused contract tests plus `bun run typecheck` and `bun run build`\n2. For runtime-sensitive behavior, use the normal MCP tool/Inspector path in Blockbench when local proof is available; do not re-enable quarantined risky evaluation for convenience\n3. Verify the output matches the expected contract and keep runtime/visual proof separate from CI proof'
          if prompt.count(old_test) != 1:
              raise SystemExit('Unexpected maintainer testing guidance')
          prompt_path.write_text(prompt.replace(old_test, new_test, 1), encoding='utf-8')

          test_path = Path('mcp/tests/p1-core-ownership.test.ts')
          test = test_path.read_text(encoding='utf-8')
          anchor = '    expect(util).toContain("const texture = resolveCoreTexture(");\n'
          addition = anchor + '    expect(util).not.toContain("export function findGroupOrThrow");\n    expect(util).not.toContain("export function findElementOrThrow");\n    expect(util).not.toContain("export function findTextureOrThrow");\n'
          if test.count(anchor) != 1:
              raise SystemExit('Unexpected core identity util assertion anchor')
          test_path.write_text(test.replace(anchor, addition, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = 'Material-instance Cube targeting now uses the shared core identity contract instead of the legacy first-match helper: explicit UUID wins, exact names must be unique, and ambiguous Cube names fail before read/mutation. The change is limited to material-instance tools; the generic legacy helper was not broadened without auditing its other callers.'
          extra = '\n\nA repository-wide caller audit then proved the old `findGroupOrThrow` / `findElementOrThrow` / `findTextureOrThrow` exports had no active MCP callers, so those ambiguous first-match helpers were removed instead of preserved as dead alternatives. The stale maintainer prompt now points new work to `coreIdentity` and no longer recommends quarantined risky evaluation.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected identity continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified cleanup and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-dead-identity-helpers.yml
          git add mcp/lib/util.ts mcp/.github/prompts/implement-feature-request.prompt.md mcp/tests/p1-core-ownership.test.ts docs/knowledge/next-action.md
          git commit -m 'refactor: remove dead ambiguous identity helpers'
          git push origin HEAD:Local
