name: Audit Remaining MCP Risks

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/audit-remaining-mcp-risks.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - name: Audit legacy identity and payload patterns
        run: |
          echo '=== LEGACY IDENTITY HELPERS ==='
          grep -R -n -E 'find(Element|Group|Texture)OrThrow' mcp --exclude-dir=node_modules || true
          echo '=== IMAGE CONTENT TOOL CALLERS ==='
          grep -R -n 'imageContent' mcp/server/tools mcp/server/resources --exclude-dir=node_modules || true
          echo '=== PRETTY JSON SERIALIZERS ==='
          grep -R -n -E 'JSON\.stringify\([^;]*(null|undefined),[[:space:]]*2' mcp/server mcp/lib --exclude-dir=node_modules || true
          echo '=== READONLY HINTS IN PAINT ==='
          grep -n -B4 -A5 'readOnlyHint: true' mcp/server/tools/paint.ts || true
      - name: Remove temporary audit workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-remaining-mcp-risks.yml
          git commit -m 'chore: remove temporary MCP risk audit'
          git push origin HEAD:Local
