name: Make Capture Screenshot Readonly

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/make-capture-screenshot-readonly.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Remove hidden project-selection side effect
        run: |
          python3 - <<'PY'
          from pathlib import Path

          camera_path = Path('mcp/server/tools/camera.ts')
          camera = camera_path.read_text(encoding='utf-8')
          old_schema = 'export const captureScreenshotParameters = z.object({\n  project: z.string().optional().describe("Project name or UUID."),\n});'
          new_schema = 'export const captureScreenshotParameters = z.object({});'
          if camera.count(old_schema) != 1:
              raise SystemExit('Unexpected capture_screenshot schema')
          camera = camera.replace(old_schema, new_schema, 1)
          old_execute = '    async execute({ project }) {\n      return captureScreenshot(project);\n    },'
          new_execute = '    async execute() {\n      return captureScreenshot();\n    },'
          if camera.count(old_execute) != 1:
              raise SystemExit('Unexpected capture_screenshot execute shape')
          camera_path.write_text(camera.replace(old_execute, new_execute, 1), encoding='utf-8')

          util_path = Path('mcp/lib/util.ts')
          util = util_path.read_text(encoding='utf-8')
          old = 'export function captureScreenshot(project?: string) {\n  let selectedProject: ModelProject | undefined = Project || undefined;\n\n  if (!selectedProject || project !== undefined) {\n    selectedProject = ModelProject.all.find(\n      (p) => p.name === project || p.uuid === project || p.selected\n    );\n  }\n\n  if (!selectedProject) {\n    throw new Error("No project found in the Blockbench editor.");\n  }\n\n  // Select the project if needed\n  if (!selectedProject.selected) {\n    selectedProject.select();\n  }\n\n  const preview = Preview.selected;'
          new = 'export function captureScreenshot() {\n  if (!Project) {\n    throw new Error("No active project found in the Blockbench editor.");\n  }\n\n  const preview = Preview.selected;'
          if util.count(old) != 1:
              raise SystemExit('Unexpected captureScreenshot helper shape')
          util_path.write_text(util.replace(old, new, 1), encoding='utf-8')

          test_path = Path('mcp/tests/context-payload-cleanup.test.ts')
          test = test_path.read_text(encoding='utf-8')
          if 'captureScreenshotParameters' not in test:
              anchor = 'import { inspectAnimationParameters } from "@/server/tools/animation-inspection";\n'
              replacement = anchor + 'import { captureScreenshotParameters } from "@/server/tools/camera";\n'
              if test.count(anchor) != 1:
                  raise SystemExit('Unexpected payload cleanup import anchor')
              test = test.replace(anchor, replacement, 1)
          marker = '  test("context cleanup changes payload, not Bedrock capability/profile architecture", async () => {'
          addition = '  test("capture_screenshot is current-view only and does not select projects", async () => {\n    expect(captureScreenshotParameters.parse({})).toEqual({});\n    const camera = await source("server/tools/camera.ts");\n    const util = await source("lib/util.ts");\n    const start = camera.indexOf("createTool(cameraToolDocs[0].name");\n    const end = camera.indexOf("createTool(cameraToolDocs[1].name", start);\n    const block = camera.slice(start, end);\n    expect(block).toContain("async execute()");\n    expect(block).toContain("captureScreenshot()");\n    expect(block).not.toContain("project");\n    expect(util).toContain("export function captureScreenshot()");\n    expect(util).not.toContain("ModelProject.all.find");\n    expect(util).not.toContain("selectedProject.select()");\n  });\n\n'
          if test.count(marker) != 1:
              raise SystemExit('Unexpected payload cleanup test insertion point')
          test_path.write_text(test.replace(marker, addition + marker, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = 'Cube authoring inputs now keep identity and face writes deterministic: create/rename Cube names cannot be empty, simple face lists contain at most the six native faces without duplicates, and custom-UV face lists cannot write the same face twice in one request. Empty face lists remain allowed because they are not inherently invalid authored geometry; no arbitrary Cube-batch size cap was added.'
          extra = '\n\n`capture_screenshot` is now a truthful current-editor-view read: the project selector was removed from its public schema and the helper no longer selects another ModelProject before capture. Canonical multi-view capture remains owned by `capture_model_views`; screenshot capability is preserved without a hidden state mutation.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected Cube continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/make-capture-screenshot-readonly.yml
          git add mcp/lib/util.ts mcp/server/tools/camera.ts mcp/tests/context-payload-cleanup.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'refactor: keep screenshot capture read-only'
          git push origin HEAD:Local
