name: BlockIT Generate Docs Once

on:
  push:
    branches: [Local]
    paths:
      - .github/workflows/_blockit-generate-docs-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: Local
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Generate MCP docs
        working-directory: mcp
        run: bun run docs:build
      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/docs/api.json mcp/docs/index.html
          if git diff --cached --quiet; then
            echo "Generated docs are already fresh."
            exit 0
          fi
          git commit -m "docs: regenerate MCP API"
          git push origin HEAD:Local
