name: Final Repo Hygiene
# final rerun: helper self-removal only

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/final-repo-hygiene.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify repository hygiene and sync proof notes
        run: |
          sed -i "s/'H12', //" .github/scripts/final_repo_hygiene.py
          sed -i "s/'mcp\/llms-install.md', 'mcp\/docs\/llms\/install.md', 'mcp\/.gitignore'/'mcp\/llms-install.md', 'mcp\/.gitignore'/" .github/scripts/final_repo_hygiene.py
          python3 .github/scripts/final_repo_hygiene.py

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate generated docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Verify callable wire unchanged
        working-directory: mcp
        run: bun .verify-final-hygiene-wire.ts

      - name: Diff hygiene
        run: git diff --check

      - name: Commit final hygiene state and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/final-repo-hygiene.yml
          git rm -f .github/scripts/final_repo_hygiene.py
          git rm mcp/.verify-final-hygiene-wire.ts
          git add docs/foundation/validation-report.md docs/knowledge/next-action.md
          git add mcp/docs/api.json mcp/docs/index.html
          git commit -m 'docs: finalize clean pre-local repository state'
          git push origin HEAD:Local
