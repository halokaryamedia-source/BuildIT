name: Finalize Codex Handoff

on:
  push:
    branches: [Local]
    paths:
      - ".github/workflows/finalize-codex-handoff.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch and verify active documentation
        run: python3 .github/scripts/finalize_codex_handoff.py
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Verify callable wire unchanged
        working-directory: mcp
        run: bun .verify-handoff-wire.ts
      - name: Diff hygiene
        run: git diff --check
      - name: Commit final historical marker and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-codex-handoff.yml
          git rm .github/scripts/finalize_codex_handoff.py
          git rm mcp/.verify-handoff-wire.ts
          git add docs/knowledge/operations/mcp-reduction-stabilization-plan.md
          git commit -m 'docs: finalize Codex local acceptance handoff'
          git push origin HEAD:Local
