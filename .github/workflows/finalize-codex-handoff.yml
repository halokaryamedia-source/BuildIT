name: Finalize Codex Handoff

on:
  push:
    branches: [Local]
    paths:
      - ".github/workflows/finalize-codex-handoff.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Mark completed stabilization plan historical
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/knowledge/operations/mcp-reduction-stabilization-plan.md')
          text = path.read_text(encoding='utf-8')
          old = '''# MCP Reduction & Stabilization Plan

Updated: 2026-08-10

Status: **Approved planning direction — source implementation not started**
'''
          new = '''# MCP Reduction & Stabilization Plan

Updated: 2026-08-11

Status: **Historical/completed — the bounded non-local stabilization pass was implemented and this plan no longer controls current execution.**

Current status is owned by `docs/knowledge/next-action.md`. Current local procedure is `docs/knowledge/operations/local-acceptance-runbook.md`. Keep the body below as implementation provenance; do not restart unchecked items solely because they remain in this historical plan.
'''
          if text.count(old) != 1:
              raise SystemExit('stabilization plan header anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Verify active documentation handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          expected_skills = sorted([
              'blockbench-bedrock-modelling',
              'blockbench-runtime-development',
              'blockit-bedrock-animation',
              'blockit-bedrock-entity-mcp',
              'blockit-bedrock-texturing',
              'bun-tooling',
              'development-brief',
              'mcp-server-development',
              'typescript-type-safety',
          ])
          actual_skills = sorted(p.name for p in Path('.agents/skills').iterdir() if p.is_dir())
          if actual_skills != expected_skills:
              raise SystemExit(f'skill inventory mismatch: {actual_skills}')

          active = [
              Path('README.md'),
              Path('CONTEXT.md'),
              Path('AGENTS.md'),
              Path('docs/README.md'),
              Path('docs/foundation/README.md'),
              Path('docs/foundation/validation-report.md'),
              Path('docs/knowledge/index.md'),
              Path('docs/knowledge/minimal-nav.md'),
              Path('docs/knowledge/next-action.md'),
              Path('docs/knowledge/flow.md'),
              Path('docs/knowledge/workspace-map.md'),
              Path('docs/knowledge/implementation-map.md'),
              Path('docs/knowledge/modules/module-map.md'),
              Path('docs/knowledge/modules/skill-ownership.md'),
              Path('docs/knowledge/skills/activation-matrix.md'),
              Path('docs/knowledge/skills/skill-map.md'),
              Path('docs/knowledge/sources/source-map.md'),
              Path('docs/knowledge/operations/README.md'),
              Path('docs/knowledge/operations/local-acceptance-runbook.md'),
              Path('docs/knowledge/operations/task-board.md'),
              Path('docs/knowledge/operations/roadmap.md'),
              Path('docs/knowledge/operations/documentation-audit.md'),
              Path('docs/knowledge/reviews/review-graph.md'),
              Path('mcp/README.md'),
              Path('mcp/AGENTS.md'),
          ]
          for path in active:
              if not path.exists():
                  raise SystemExit(f'missing active owner: {path}')

          joined = '\n'.join(path.read_text(encoding='utf-8') for path in active)
          stale = [
              'mcp/prompts/bedrock.md',
              'exactly six canonical skills',
              'Local Blockbench testing is intentionally deferred',
              'When local testing becomes the priority',
              'omitted/empty scope means no Group scope',
              'omitted/empty pattern means no regex filter',
          ]
          for phrase in stale:
              if phrase in joined:
                  raise SystemExit(f'stale active documentation phrase: {phrase}')

          next_text = Path('docs/knowledge/next-action.md').read_text(encoding='utf-8')
          runbook = Path('docs/knowledge/operations/local-acceptance-runbook.md').read_text(encoding='utf-8')
          validation = Path('docs/foundation/validation-report.md').read_text(encoding='utf-8')
          operations = Path('docs/knowledge/operations/README.md').read_text(encoding='utf-8')
          plan = Path('docs/knowledge/operations/mcp-reduction-stabilization-plan.md').read_text(encoding='utf-8')

          required = {
              'next status': ('NON_LOCAL_PRELOCAL_READINESS_COMPLETE_LOCAL_ACCEPTANCE_REQUIRED', next_text),
              'next runbook': ('LOCAL — follow operations/local-acceptance-runbook.md', next_text),
              'baseline no-edit': ('Do not edit source while establishing the baseline', runbook),
              'failure classification': ('Failure Classification Before Fix', runbook),
              'validation local status': ('LOCAL PROOF REQUIRED', validation),
              'operations history': ('historical/completed', operations),
              'plan history': ('Historical/completed', plan),
              'current prompt': ('mcp/prompts/bedrock_entity_workflow.md', joined),
          }
          for name, (needle, haystack) in required.items():
              if needle not in haystack:
                  raise SystemExit(f'missing handoff invariant {name}: {needle}')

          if len(next_text) >= 8_000:
              raise SystemExit(f'next-action too large: {len(next_text)}')
          if len(runbook) >= 18_000:
              raise SystemExit(f'local runbook unexpectedly bloated: {len(runbook)}')

          link_re = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          broken = []
          repo = Path.cwd().resolve()
          for path in active:
              text = path.read_text(encoding='utf-8')
              for target in link_re.findall(text):
                  if '://' in target or target.startswith('#'):
                      continue
                  raw = target.split('#', 1)[0]
                  if not raw:
                      continue
                  resolved = (path.parent / raw).resolve()
                  try:
                      resolved.relative_to(repo)
                  except ValueError:
                      continue
                  if not resolved.exists():
                      broken.append(f'{path} -> {target}')
          if broken:
              raise SystemExit('broken active documentation links:\n' + '\n'.join(broken))

          print(f'active_docs={len(active)}')
          print(f'next_action_chars={len(next_text)}')
          print(f'runbook_chars={len(runbook)}')
          print(f'skills={len(actual_skills)}')
          PY
          git diff --check

      - name: Verify callable wire is unchanged
        working-directory: mcp
        run: |
          cat > .verify-handoff-wire.ts <<'TS'
          import { McpServer } from "@modelcontextprotocol/sdk/server/mcp.js";
          import { WebStandardStreamableHTTPServerTransport } from "@modelcontextprotocol/sdk/server/webStandardStreamableHttp.js";
          import { registerToolsOnServer } from "./lib/factories";
          import "./server/tools";

          const server = new McpServer({ name: "handoff-check", version: "1" });
          registerToolsOnServer(server);
          const transport = new WebStandardStreamableHTTPServerTransport({
            sessionIdGenerator: undefined,
            enableJsonResponse: true,
          });
          await server.connect(transport);
          try {
            const response = await transport.handleRequest(new Request("http://127.0.0.1:3000/bb-mcp", {
              method: "POST",
              headers: {
                accept: "application/json, text/event-stream",
                "content-type": "application/json",
                "mcp-protocol-version": "2025-06-18",
              },
              body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/list", params: {} }),
            }));
            const raw = await response.text();
            const parsed = JSON.parse(raw) as { result?: { tools?: Array<{ name?: string; description?: string; inputSchema?: unknown }> } };
            const tools = parsed.result?.tools ?? [];
            const names = tools.map((tool) => tool.name ?? "");
            const metrics = {
              tools: tools.length,
              response: raw.length,
              schemas: tools.reduce((n, tool) => n + JSON.stringify(tool.inputSchema ?? {}).length, 0),
              descriptions: tools.reduce((n, tool) => n + (tool.description ?? "").length, 0),
            };
            const expected = { tools: 62, response: 72775, schemas: 48674, descriptions: 11800 };
            if (JSON.stringify(metrics) !== JSON.stringify(expected)) {
              throw new Error(`wire changed during documentation handoff: ${JSON.stringify(metrics)}`);
            }
            if (!names.includes("export_model") || names.includes("list_export_formats") || names.includes("apply_texture") || names.includes("filter_by_material")) {
              throw new Error(`default containment changed: ${JSON.stringify(names)}`);
            }
            console.log(metrics);
          } finally {
            await server.close();
          }
          TS
          bun .verify-handoff-wire.ts
          rm .verify-handoff-wire.ts

      - name: Commit historical plan marker and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-codex-handoff.yml
          git add docs/knowledge/operations/mcp-reduction-stabilization-plan.md
          git commit -m 'docs: finalize Codex local acceptance handoff'
          git push origin HEAD:Local
