name: Harden Create Identity Names

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/harden-create-identity-names.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reject empty authored identities
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project_path = Path('mcp/server/tools/project.ts')
          project = project_path.read_text(encoding='utf-8')
          old = '  name: z.string(),'
          new = '  name: z.string().min(1).describe("Non-empty project name."),'
          if project.count(old) != 1:
              raise SystemExit('Unexpected create_project name schema')
          project_path.write_text(project.replace(old, new, 1), encoding='utf-8')

          texture_path = Path('mcp/server/tools/texture.ts')
          texture = texture_path.read_text(encoding='utf-8')
          replacements = [
            ('    name: z.string(),', '    name: z.string().min(1).describe("Non-empty texture name."),'),
            ('  name: z.string(),\n  textures:', '  name: z.string().min(1).describe("Non-empty TextureGroup name."),\n  textures:'),
            ('  name: z.string().describe("Name of the material."),', '  name: z.string().min(1).describe("Non-empty material name."),'),
          ]
          for old, new in replacements:
              if texture.count(old) != 1:
                  raise SystemExit('Unexpected texture identity name schema')
              texture = texture.replace(old, new, 1)
          texture_path.write_text(texture, encoding='utf-8')

          animation_path = Path('mcp/server/tools/animation.ts')
          animation = animation_path.read_text(encoding='utf-8')
          old = '  name: z.string().describe("Name of the animation"),'
          new = '  name: z.string().min(1).describe("Non-empty animation name."),'
          if animation.count(old) != 1:
              raise SystemExit('Unexpected create_animation name schema')
          animation_path.write_text(animation.replace(old, new, 1), encoding='utf-8')

          test_path = Path('mcp/tests/p1-core-ownership.test.ts')
          test = test_path.read_text(encoding='utf-8')
          import_anchor = 'import { describe, expect, test } from "bun:test";\n'
          imports = import_anchor + 'import { createProjectParameters } from "@/server/tools/project";\nimport { createAnimationParameters } from "@/server/tools/animation";\nimport {\n  addTextureGroupParameters,\n  createPbrMaterialParameters,\n  createTextureParameters,\n} from "@/server/tools/texture";\n'
          if 'createProjectParameters' not in test:
              if test.count(import_anchor) != 1:
                  raise SystemExit('Unexpected p1 ownership import anchor')
              test = test.replace(import_anchor, imports, 1)
          marker = 'describe("P1.3 core identity ownership", () => {'
          addition = marker + '\n  test("identity-bearing create tools reject empty names", () => {\n    expect(createProjectParameters.safeParse({ name: "" }).success).toBe(false);\n    expect(createTextureParameters.safeParse({ name: "" }).success).toBe(false);\n    expect(addTextureGroupParameters.safeParse({ name: "" }).success).toBe(false);\n    expect(createPbrMaterialParameters.safeParse({ name: "" }).success).toBe(false);\n    expect(\n      createAnimationParameters.safeParse({ name: "", bones: {} }).success\n    ).toBe(false);\n  });\n'
          if test.count(marker) != 1:
              raise SystemExit('Unexpected p1 ownership describe marker')
          test_path.write_text(test.replace(marker, addition, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = 'A repository-wide caller audit then proved the old `findGroupOrThrow` / `findElementOrThrow` / `findTextureOrThrow` exports had no active MCP callers, so those ambiguous first-match helpers were removed instead of preserved as dead alternatives. The stale maintainer prompt now points new work to `coreIdentity` and no longer recommends quarantined risky evaluation.'
          extra = '\n\nA create-identity schema audit found that project, texture, TextureGroup/PBR material, and animation creation still accepted the empty string even though those values become later lookup identities. Those five create contracts now require a non-empty name, matching the existing Group/Locator/Null Object boundary. No new uniqueness, normalization, or naming framework was added.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected identity cleanup continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-create-identity-names.yml
          git add mcp/server/tools/project.ts mcp/server/tools/texture.ts mcp/server/tools/animation.ts mcp/tests/p1-core-ownership.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'fix: reject empty authored identity names'
          git push origin HEAD:Local
