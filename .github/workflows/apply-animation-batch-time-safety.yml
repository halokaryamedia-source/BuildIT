name: Apply Batch Keyframe Time Safety

on:
  push:
    paths:
      - ".github/workflows/apply-animation-batch-time-safety.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Preflight batch keyframe times
        run: |
          python3 - <<'PY'
          from pathlib import Path

          animation_path = Path("mcp/server/tools/animation.ts")
          text = animation_path.read_text(encoding="utf-8")

          register_marker = "export function registerAnimationTools() {\n"
          helper = "\n".join([
              "export function requireValidPlannedKeyframeTimes(",
              "  times: readonly number[],",
              "  context: string,",
              "  rejectExactDuplicates = false",
              "): void {",
              "  times.forEach((time, index) => {",
              "    if (!Number.isFinite(time) || time < 0 || time > 10000) {",
              "      throw new Error(",
              "        `${context} would place keyframe ${index} at invalid time ${time}; Blockbench authored keyframe time must stay within 0..10000 seconds.`",
              "      );",
              "    }",
              "  });",
              "",
              "  if (rejectExactDuplicates && new Set(times).size !== times.length) {",
              "    throw new Error(",
              "      `${context} would collapse multiple selected keyframes onto the same effective time. Use a different scale factor/pivot or reduce the selection.`",
              "    );",
              "  }",
              "}",
              "",
          ])
          if text.count(register_marker) != 1:
              raise SystemExit("Unexpected animation registration marker")
          text = text.replace(register_marker, helper + register_marker, 1)

          old_offset_entry = "\n".join([
              "      if (operation === \"offset\" || operation === \"mirror\") {",
              "        Undo.initEdit({",
          ])
          new_offset_entry = "\n".join([
              "      if (operation === \"offset\" || operation === \"mirror\") {",
              "        if (operation === \"offset\" && parameters.offset_time !== undefined) {",
              "          requireValidPlannedKeyframeTimes(",
              "            keyframes.map(",
              "              (keyframe: _Keyframe) => keyframe.time + parameters.offset_time!",
              "            ),",
              "            \"Batch keyframe offset\"",
              "          );",
              "        }",
              "",
              "        Undo.initEdit({",
          ])
          if text.count(old_offset_entry) != 1:
              raise SystemExit("Unexpected batch offset entry")
          text = text.replace(old_offset_entry, new_offset_entry, 1)

          old_scale_state = "\n".join([
              "        const stretchStates = keyframes.map((keyframe: _Keyframe) => ({",
              "          keyframe,",
              "          time: keyframe.time,",
              "          bezierLeftTime:",
              "            keyframe.interpolation === \"bezier\"",
              "              ? [...keyframe.bezier_left_time]",
              "              : undefined,",
              "          bezierRightTime:",
              "            keyframe.interpolation === \"bezier\"",
              "              ? [...keyframe.bezier_right_time]",
              "              : undefined,",
              "        }));",
              "",
              "        Undo.initEdit({",
          ])
          new_scale_state = "\n".join([
              "        const stretchStates = keyframes.map((keyframe: _Keyframe) => ({",
              "          keyframe,",
              "          time: keyframe.time,",
              "          bezierLeftTime:",
              "            keyframe.interpolation === \"bezier\"",
              "              ? [...keyframe.bezier_left_time]",
              "              : undefined,",
              "          bezierRightTime:",
              "            keyframe.interpolation === \"bezier\"",
              "              ? [...keyframe.bezier_right_time]",
              "              : undefined,",
              "        }));",
              "        const plannedTimes = stretchStates.map(({ time }) =>",
              "          Timeline.snapTime(pivot + (time - pivot) * factor, animation)",
              "        );",
              "        requireValidPlannedKeyframeTimes(",
              "          plannedTimes,",
              "          \"Batch keyframe scale\",",
              "          true",
              "        );",
              "",
              "        Undo.initEdit({",
          ])
          if text.count(old_scale_state) != 1:
              raise SystemExit("Unexpected scale state block")
          text = text.replace(old_scale_state, new_scale_state, 1)

          old_scale_loop = "\n".join([
              "          stretchStates.forEach(",
              "            ({ keyframe, time, bezierLeftTime, bezierRightTime }) => {",
              "              keyframe.time = Timeline.snapTime(",
              "                pivot + (time - pivot) * factor,",
              "                animation",
              "              );",
          ])
          new_scale_loop = "\n".join([
              "          stretchStates.forEach(",
              "            ({ keyframe, bezierLeftTime, bezierRightTime }, index) => {",
              "              keyframe.time = plannedTimes[index];",
          ])
          if text.count(old_scale_loop) != 1:
              raise SystemExit("Unexpected scale mutation loop")
          text = text.replace(old_scale_loop, new_scale_loop, 1)

          old_description = "    description: \"Performs bounded batch keyframe operations and rejects incomplete or effective no-op offset/scale requests before mutation.\"," 
          new_description = "    description: \"Performs bounded batch keyframe operations and rejects incomplete/no-op requests plus offset/scale plans that would leave the native 0..10000 keyframe-time range; scale also rejects selected-keyframe time collapse before Undo.\"," 
          if text.count(old_description) != 1:
              raise SystemExit("Unexpected batch keyframe tool description")
          animation_path.write_text(text.replace(old_description, new_description, 1), encoding="utf-8")

          test_path = Path("mcp/tests/animation-mutation-contract.test.ts")
          test = test_path.read_text(encoding="utf-8")
          old_import = "\n".join([
              "  manageKeyframesParameters,",
              "  resolveUniqueKeyframeMatchIndexes,",
          ])
          new_import = "\n".join([
              "  manageKeyframesParameters,",
              "  requireValidPlannedKeyframeTimes,",
              "  resolveUniqueKeyframeMatchIndexes,",
          ])
          if test.count(old_import) != 1:
              raise SystemExit("Unexpected animation mutation import area")
          test = test.replace(old_import, new_import, 1)

          addition = "\n".join([
              "",
              "  test(\"batch offset/scale plans stay inside native keyframe time bounds\", async () => {",
              "    expect(() =>",
              "      requireValidPlannedKeyframeTimes([0, 1.5, 10000], \"test\")",
              "    ).not.toThrow();",
              "    expect(() => requireValidPlannedKeyframeTimes([-0.001], \"test\")).toThrow(",
              "      \"0..10000\"",
              "    );",
              "    expect(() => requireValidPlannedKeyframeTimes([10000.001], \"test\")).toThrow(",
              "      \"0..10000\"",
              "    );",
              "    expect(() =>",
              "      requireValidPlannedKeyframeTimes([1, 1], \"test scale\", true)",
              "    ).toThrow(\"collapse multiple selected keyframes\");",
              "",
              "    const source = await Bun.file(\"server/tools/animation.ts\").text();",
              "    expect(source).toContain(\"keyframe.time + parameters.offset_time!\");",
              "    expect(source).toContain(\"keyframe.time = plannedTimes[index]\");",
              "    expect(source).toContain(\"\\\"Batch keyframe scale\\\",\");",
              "  });",
          ])
          close_marker = "});\n"
          position = test.rfind(close_marker)
          if position == -1:
              raise SystemExit("Animation mutation test closing marker not found")
          test = test[:position] + addition + "\n" + test[position:]
          test_path.write_text(test, encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          old_note = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload, rejects empty `manage_keyframes` requests, preserves existing interpolation on partial keyframe edits, requires every edit/delete/select time to resolve to exactly one existing keyframe before mutation/selection, requires an explicit `loop_mode` for the timeline loop mutation, rejects incomplete/effective no-op batch offset/scale requests, prevents empty animation copy/paste clipboard operations, requires action-specific copy/paste source/target state, removes the implicit X-axis fallback from `mirror_paste`, and keeps the structured create result while compacting its duplicate text serialization. AnimationCodec behavior and playback semantics are unchanged."
          new_note = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload, rejects empty `manage_keyframes` requests, preserves existing interpolation on partial keyframe edits, requires every edit/delete/select time to resolve to exactly one existing keyframe before mutation/selection, requires an explicit `loop_mode` for the timeline loop mutation, rejects incomplete/effective no-op batch offset/scale requests, preflights batch offset/scale times against the native 0..10000 authored-time range and prevents selected-keyframe collapse during scale, prevents empty animation copy/paste clipboard operations, requires action-specific copy/paste source/target state, removes the implicit X-axis fallback from `mirror_paste`, and keeps the structured create result while compacting its duplicate text serialization. AnimationCodec behavior and playback semantics are unchanged."
          if next_text.count(old_note) != 1:
              raise SystemExit("Unexpected animation continuity note")
          next_path.write_text(next_text.replace(old_note, new_note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit batch time safety and remove temporary workflow
        run: |
          git rm .github/workflows/apply-animation-batch-time-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: preflight batch keyframe authored times"
          git push origin HEAD:Local
