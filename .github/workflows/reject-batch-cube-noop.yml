name: Reject Batch Cube No-op

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/reject-batch-cube-noop.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reject no-op batch targets before Undo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mcp/server/tools/cubes.ts')
          text = path.read_text(encoding='utf-8')

          schema_start = text.index('const cubeCorrectionUpdateSchema = z')
          schema_end = text.index('\n\nexport const placeCubeParameters', schema_start)
          schema = text[schema_start:schema_end]
          if schema.count('  .refine(') != 1:
              raise SystemExit('Unexpected batch update refine boundary')
          schema = schema.replace('  .refine(', '  .strict()\n  .refine(', 1)
          text = text[:schema_start] + schema + text[schema_end:]

          batch_start = text.index('export const modifyCubesBatchParameters = z.object({')
          batch_end = text.index('\n\nexport const cubeToolDocs', batch_start)
          batch = text[batch_start:batch_end]
          if not batch.rstrip().endswith('});'):
              raise SystemExit('Unexpected batch parameters tail')
          batch = batch.rstrip()[:-3] + '}).strict();'
          text = text[:batch_start] + batch + text[batch_end:]

          old_desc = '      "Applies 1-32 explicit UUID-targeted Cube corrections in one recoverable Undo unit after full preflight. Origin-only preserves visual position; activating non-zero rotation requires origin. Returns per-Cube before/after state and `geometry_effect`. It performs no planning or visual judgement; success does not mean the geometry was corrected visually.",'
          new_desc = '      "Applies 1-32 unique UUID-targeted Cube corrections in one Undo unit after full preflight. Unsupported fields and same-value targets fail before Undo; pivot, rotation, finite-span, and per-Cube before/after `geometry_effect` rules remain explicit. Execution success does not mean the geometry was corrected visually.",'
          if text.count(old_desc) != 1:
              raise SystemExit('Unexpected modify_cubes_batch description')
          text = text.replace(old_desc, new_desc, 1)

          anchor = '\n'.join([
              '      requireFiniteCubeSpan(',
              '        update.from ?? cube.from,',
              '        update.to ?? cube.to,',
              '        `Cube ${cube.name} (${cube.uuid}) batch update`',
              '      );',
              '',
              '      const pivotOnly = isPivotOnlyCorrection(update);',
          ])
          replacement = '\n'.join([
              '      requireFiniteCubeSpan(',
              '        update.from ?? cube.from,',
              '        update.to ?? cube.to,',
              '        `Cube ${cube.name} (${cube.uuid}) batch update`',
              '      );',
              '      if (!modifyCubeRequestWouldChange(cube, update)) {',
              '        throw new Error(',
              '          `Batch update for Cube ${cube.name} (${cube.uuid}) has no authored effect; every supplied value already matches current state.`',
              '        );',
              '      }',
              '',
              '      const pivotOnly = isPivotOnlyCorrection(update);',
          ])
          if text.count(anchor) != 1:
              raise SystemExit('Unexpected batch runtime preflight anchor')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          test_path = Path('mcp/tests/model-effectiveness-correction-accuracy.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old_import = 'import { modifyCubeParameters, placeCubeParameters } from "@/server/tools/cubes";'
          new_import = 'import { modifyCubeParameters, modifyCubesBatchParameters, placeCubeParameters } from "@/server/tools/cubes";'
          if test.count(old_import) != 1:
              raise SystemExit('Unexpected Cube test import')
          test = test.replace(old_import, new_import, 1)

          marker = '  test("Cube authoring rejects finite endpoints that produce non-finite size", () => {'
          addition = '\n'.join([
              '  test("batch Cube correction rejects duplicate/unsupported inputs at schema boundary", () => {',
              '    expect(',
              '      modifyCubesBatchParameters.safeParse({',
              '        updates: [',
              '          { id: "cube-1", from: [0, 0, 0] },',
              '          { id: "cube-1", to: [1, 1, 1] },',
              '        ],',
              '      }).success',
              '    ).toBe(false);',
              '    expect(',
              '      modifyCubesBatchParameters.safeParse({',
              '        updates: [{ id: "cube-1", from: [0, 0, 0], name: "unsupported" }],',
              '      }).success',
              '    ).toBe(false);',
              '    expect(',
              '      modifyCubesBatchParameters.safeParse({',
              '        updates: [{ id: "cube-1", visibility: false }],',
              '        extra: true,',
              '      }).success',
              '    ).toBe(false);',
              '  });',
              '',
          ])
          if test.count(marker) != 1:
              raise SystemExit('Unexpected Cube batch test insertion point')
          test = test.replace(marker, addition + marker, 1)

          effect_marker = '    expect(cubes).toContain("modifyCubeRequestWouldChange");'
          effect_extra = '\n'.join([
              effect_marker,
              '    const batchRuntimeStart = cubes.indexOf("createTool(cubeToolDocs[2].name");',
              '    const batchRuntime = cubes.slice(batchRuntimeStart);',
              '    expect(batchRuntime).toContain("!modifyCubeRequestWouldChange(cube, update)");',
              '    expect(batchRuntime).toContain("Batch update for Cube");',
              '    expect(batchRuntime.indexOf("!modifyCubeRequestWouldChange(cube, update)")).toBeLessThan(batchRuntime.indexOf("Undo.initEdit"));',
          ])
          if test.count(effect_marker) != 1:
              raise SystemExit('Unexpected Cube effect assertion marker')
          test_path.write_text(test.replace(effect_marker, effect_extra, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = '`modify_cube` now matches the same Bedrock boundary: `uv_offset` and `inflate` must be finite, generic Java-only `shade` and editor palette `color` inputs are rejected, and exact same-value requests fail before Undo. Single-Cube before/after state and `geometry_effect.changed_fields` now include the Bedrock-relevant UV/inflate controls the tool can actually change, preventing successful UV/inflate edits from being misreported as “no geometry/visibility change”. Batch correction capability is unchanged.'
          replacement = '`modify_cube` now matches the same Bedrock boundary: `uv_offset` and `inflate` must be finite, generic Java-only `shade` and editor palette `color` inputs are rejected, and exact same-value requests fail before Undo. Single-Cube before/after state and `geometry_effect.changed_fields` now include the Bedrock-relevant UV/inflate controls the tool can actually change, preventing successful UV/inflate edits from being misreported as “no geometry/visibility change”. Batch correction now applies the same actual-effect rule: each UUID remains unique, update objects are strict, and any same-value target rejects the whole batch before Undo. Batch geometry capability and the 32-target limit are unchanged.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected Cube batch continuity marker')
          next_path.write_text(next_text.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reject-batch-cube-noop.yml
          git add mcp/server/tools/cubes.ts mcp/tests/model-effectiveness-correction-accuracy.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'fix: reject batch Cube no-op updates'
          git push origin HEAD:Local