name: Run Final MCP Typecheck Patch

on:
  push:
    paths:
      - ".github/workflows/run-final-mcp-typecheck-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
      - name: Apply final patch
        run: python .github/scripts/finalize_mcp_typecheck.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/server/tools/paint.ts mcp/server/tools/texture.ts
          git diff --cached --check
          git commit -m "fix: finish retained MCP type contracts"
          git push origin Local
