name: Audit Mutation Schema Gaps

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/audit-mutation-schema-gaps.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Audit mutation schemas
        working-directory: mcp
        run: |
          cat > .audit-mutation-schema-gaps.ts <<'TS'
          import { zodToJsonSchema } from "zod-to-json-schema";
          import { toolManifest } from "./build/docs-manifest.ts";

          type PathIssue = { path: string; kind: string };

          function findUnboundedArrays(value: unknown, path = "$", out: PathIssue[] = []): PathIssue[] {
            if (!value || typeof value !== "object") return out;
            if (Array.isArray(value)) {
              value.forEach((entry, index) => findUnboundedArrays(entry, `${path}[${index}]`, out));
              return out;
            }
            const obj = value as Record<string, unknown>;
            if (obj.type === "array" && obj.minItems === undefined) {
              out.push({ path, kind: "array_accepts_empty" });
            }
            for (const [key, child] of Object.entries(obj)) {
              findUnboundedArrays(child, `${path}.${key}`, out);
            }
            return out;
          }

          console.log("=== MUTATION TOOLS ACCEPTING EMPTY OBJECT ===");
          for (const group of toolManifest) {
            for (const tool of group.tools) {
              if (!tool.annotations?.destructiveHint) continue;
              const parsed = await tool.parameters.safeParseAsync({});
              if (parsed.success) {
                console.log(JSON.stringify({ category: group.category, tool: tool.name, parsed: parsed.data }));
              }
            }
          }

          console.log("=== MUTATION ARRAY INPUTS WITHOUT MINITEMS ===");
          for (const group of toolManifest) {
            for (const tool of group.tools) {
              if (!tool.annotations?.destructiveHint) continue;
              const schema = zodToJsonSchema(tool.parameters, {
                $refStrategy: "none",
                errorMessages: true,
                markdownDescription: false,
              });
              const issues = findUnboundedArrays(schema);
              if (issues.length) {
                console.log(JSON.stringify({ category: group.category, tool: tool.name, issues }));
              }
            }
          }
          TS
          bun .audit-mutation-schema-gaps.ts
          rm .audit-mutation-schema-gaps.ts
      - name: Remove temporary audit workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-mutation-schema-gaps.yml
          git commit -m 'chore: remove temporary mutation schema audit'
          git push origin HEAD:Local
