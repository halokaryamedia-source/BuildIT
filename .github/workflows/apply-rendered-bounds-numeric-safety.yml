name: Apply Rendered Bounds Numeric Safety

on:
  push:
    paths:
      - ".github/workflows/apply-rendered-bounds-numeric-safety.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Harden rendered bounds math
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("mcp/lib/renderedModelBounds.ts")
          text = path.read_text(encoding="utf-8")

          marker = "\n".join([
              "function normalizeNumber(value: number): number {",
              "  return Object.is(value, -0) ? 0 : value;",
              "}",
              "",
          ])
          addition = "\n".join([
              "export function summarizeFiniteBounds(",
              "  min: Vec3,",
              "  max: Vec3",
              "): { center: Vec3; size: Vec3 } {",
              "  const size: Vec3 = [",
              "    normalizeNumber(max[0] - min[0]),",
              "    normalizeNumber(max[1] - min[1]),",
              "    normalizeNumber(max[2] - min[2]),",
              "  ];",
              "  if (size.some((value) => !Number.isFinite(value))) {",
              "    throw new Error(\"Rendered model bounds span is non-finite and cannot be trusted.\");",
              "  }",
              "",
              "  const center: Vec3 = [",
              "    normalizeNumber(min[0] + size[0] / 2),",
              "    normalizeNumber(min[1] + size[1] / 2),",
              "    normalizeNumber(min[2] + size[2] / 2),",
              "  ];",
              "  if (center.some((value) => !Number.isFinite(value))) {",
              "    throw new Error(\"Rendered model bounds center is non-finite and cannot be trusted.\");",
              "  }",
              "",
              "  return { center, size };",
              "}",
              "",
          ])
          if text.count(marker) != 1:
              raise SystemExit("Unexpected normalizeNumber insertion point")
          text = text.replace(marker, marker + addition, 1)

          old = "\n".join([
              "  const center: Vec3 = [",
              "    normalizeNumber((min[0] + max[0]) / 2),",
              "    normalizeNumber((min[1] + max[1]) / 2),",
              "    normalizeNumber((min[2] + max[2]) / 2),",
              "  ];",
              "  const size: Vec3 = [",
              "    normalizeNumber(max[0] - min[0]),",
              "    normalizeNumber(max[1] - min[1]),",
              "    normalizeNumber(max[2] - min[2]),",
              "  ];",
          ])
          new = "  const { center, size } = summarizeFiniteBounds(min, max);"
          if text.count(old) != 1:
              raise SystemExit("Unexpected rendered bounds summary shape")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("mcp/tests/rendered-model-bounds-numeric-safety.test.ts")
          if test_path.exists():
              raise SystemExit("rendered bounds numeric safety test already exists")
          test_lines = [
              "import { describe, expect, test } from \"bun:test\";",
              "import { summarizeFiniteBounds } from \"@/lib/renderedModelBounds\";",
              "",
              "describe(\"rendered model bounds numeric safety\", () => {",
              "  test(\"derives a finite midpoint without summing large same-sign endpoints\", () => {",
              "    const { center, size } = summarizeFiniteBounds(",
              "      [1e308, 0, 0],",
              "      [1.5e308, 16, 8]",
              "    );",
              "    expect(Number.isFinite(size[0])).toBe(true);",
              "    expect(Number.isFinite(center[0])).toBe(true);",
              "    expect(center[0]).toBe(1.25e308);",
              "  });",
              "",
              "  test(\"rejects finite endpoints whose derived span overflows\", () => {",
              "    expect(() =>",
              "      summarizeFiniteBounds([-1e308, 0, 0], [1e308, 16, 8])",
              "    ).toThrow(\"Rendered model bounds span is non-finite\");",
              "  });",
              "});",
          ]
          test_path.write_text("\n".join(test_lines) + "\n", encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          old_note = "A bounded GitHub-only **canonical framing input hardening** now rejects non-finite explicit target-envelope coordinates and finite endpoints whose subtraction would produce a non-finite span before camera math runs, then derives the target center from that validated span instead of summing endpoints so accepted finite envelopes cannot overflow during midpoint calculation. This closes the MCP framing boundary defect without changing canonical camera behavior, framing policy, or the local visual-proof requirement."
          new_note = "A bounded GitHub-only **canonical framing numeric hardening** now rejects non-finite explicit target-envelope coordinates and finite endpoints whose subtraction would produce a non-finite span, derives explicit-envelope midpoints from validated spans, and applies the same finite-span/overflow-safe midpoint rule to rendered model bounds used by model framing. This closes the framing numeric boundary without changing canonical camera behavior, framing policy, or the local visual-proof requirement."
          if next_text.count(old_note) != 1:
              raise SystemExit("Unexpected framing continuity note")
          next_path.write_text(next_text.replace(old_note, new_note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit bounds hardening and remove temporary workflow
        run: |
          git rm .github/workflows/apply-rendered-bounds-numeric-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: harden rendered bounds numeric derivation"
          git push origin HEAD:Local
