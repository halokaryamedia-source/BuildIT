name: Patch Retained Core Types

on:
  push:
    paths:
      - ".github/workflows/patch-retained-core-types.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local

      - name: Apply exact retained-core patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match for {old!r}, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Camera: official Preview API exposes isOrtho + camOrtho.
          replace_once(
              "mcp/server/tools/camera.ts",
              "preview.camera.isOrthographicCamera",
              "preview.isOrtho",
          )
          replace_once(
              "mcp/server/tools/camera.ts",
              "preview.camera.zoom = angle.zoom;",
              "preview.camOrtho.zoom = angle.zoom;",
          )
          replace_once(
              "mcp/server/tools/camera.ts",
              "preview.camera.updateProjectionMatrix();",
              "preview.camOrtho.updateProjectionMatrix();",
          )

          # Cube batch: retain full validation contract while typing the inferred item.
          replace_once(
              "mcp/server/tools/cubes.ts",
              "}> = updates.map((update) => {",
              "}> = updates.map((update: BatchUpdate) => {",
          )

          # Element resolver must preserve all native Bedrock outliner elements plus Group.
          replace_once(
              "mcp/server/tools/element.ts",
              "function resolveUniqueDestructiveElement(reference: string): OutlinerElement {",
              "type ResolvedElement = OutlinerElement | Group;\n\nfunction resolveUniqueDestructiveElement(reference: string): ResolvedElement {",
          )
          replace_once(
              "mcp/server/tools/element.ts",
              "const candidates = new Map<string, OutlinerElement>();",
              "const candidates = new Map<string, ResolvedElement>();",
          )

          # Explicit 3-tuples satisfy Blockbench Cube/Group constructor contracts.
          replace_once(
              "mcp/server/tools/element.ts",
              "from: cube.from.map((v, i) => v + offset[i]),",
              "from: [cube.from[0] + offset[0], cube.from[1] + offset[1], cube.from[2] + offset[2]],",
          )
          replace_once(
              "mcp/server/tools/element.ts",
              "to: cube.to.map((v, i) => v + offset[i]),",
              "to: [cube.to[0] + offset[0], cube.to[1] + offset[1], cube.to[2] + offset[2]],",
          )
          replace_once(
              "mcp/server/tools/element.ts",
              "origin: cube.origin.map((v, i) => v + offset[i]),",
              "origin: [cube.origin[0] + offset[0], cube.origin[1] + offset[1], cube.origin[2] + offset[2]],",
          )
          replace_once(
              "mcp/server/tools/element.ts",
              "origin: group.origin.map((v, i) => v + offset[i]),",
              "origin: [group.origin[0] + offset[0], group.origin[1] + offset[1], group.origin[2] + offset[2]],",
          )

          # Group and OutlinerElement use different Undo aspects; direct name assignment is shared.
          replace_once(
              "mcp/server/tools/element.ts",
              "Undo.initEdit({ elements: [element], outliner: true, collections: [] });",
              "Undo.initEdit({\n        elements: element instanceof Group ? [] : [element],\n        groups: element instanceof Group ? [element] : [],\n        outliner: true,\n        collections: [],\n      });",
          )
          replace_once(
              "mcp/server/tools/element.ts",
              "element.extend({ name: new_name });",
              "element.name = new_name;",
          )

          # Cube.select expects a real Event in current official typings.
          replace_once(
              "mcp/server/tools/element.ts",
              'el.select?.({ shiftKey: true });',
              'el.select?.(new MouseEvent("click", { shiftKey: true }));',
          )
          PY

      - name: Commit exact retained-core patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/server/tools/camera.ts mcp/server/tools/cubes.ts mcp/server/tools/element.ts
          git diff --cached --check
          git commit -m "fix: align retained Bedrock core types"
          git push origin Local
