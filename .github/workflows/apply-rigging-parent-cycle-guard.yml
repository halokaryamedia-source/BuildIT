name: Apply Rig Hierarchy Cycle Guard

on:
  push:
    paths:
      - ".github/workflows/apply-rigging-parent-cycle-guard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reject rig hierarchy cycles before mutation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          animation_path = Path("mcp/server/tools/animation.ts")
          text = animation_path.read_text(encoding="utf-8")

          helper_marker = "export function countAnimationClipboardKeyframes(\n"
          helper = "\n".join([
              "export function wouldCreateRigHierarchyCycle(",
              "  targetUuid: string,",
              "  candidateParentUuid: string,",
              "  parentByUuid: ReadonlyMap<string, string | null>",
              "): boolean {",
              "  let currentUuid: string | null = candidateParentUuid;",
              "  const visited = new Set<string>();",
              "",
              "  while (currentUuid !== null) {",
              "    if (currentUuid === targetUuid) return true;",
              "    if (visited.has(currentUuid)) return true;",
              "    visited.add(currentUuid);",
              "    currentUuid = parentByUuid.get(currentUuid) ?? null;",
              "  }",
              "",
              "  return false;",
              "}",
              "",
          ])
          if text.count(helper_marker) != 1:
              raise SystemExit("Unexpected animation helper insertion point")
          text = text.replace(helper_marker, helper + helper_marker, 1)

          old_parent_guard = "\n".join([
              "          parentBone = resolveRigGroup(bone_data.parent);",
              "          if (targetBone === parentBone) {",
              "            throw new Error(\"A bone cannot be parented to itself.\");",
              "          }",
              "          break;",
          ])
          new_parent_guard = "\n".join([
              "          parentBone = resolveRigGroup(bone_data.parent);",
              "          const parentByUuid = new Map<string, string | null>(",
              "            Group.all.map((group: Group) =>",
              "              [",
              "                group.uuid,",
              "                group.parent instanceof Group ? group.parent.uuid : null,",
              "              ] as [string, string | null]",
              "            )",
              "          );",
              "          if (",
              "            wouldCreateRigHierarchyCycle(",
              "              targetBone.uuid,",
              "              parentBone.uuid,",
              "              parentByUuid",
              "            )",
              "          ) {",
              "            throw new Error(",
              "              `Cannot parent \"${targetBone.name}\" under \"${parentBone.name}\" because the requested hierarchy would create or extend a parent cycle.`",
              "            );",
              "          }",
              "          break;",
          ])
          if text.count(old_parent_guard) != 1:
              raise SystemExit("Unexpected bone parent guard shape")
          text = text.replace(old_parent_guard, new_parent_guard, 1)

          old_description = "      \"Creates or edits Group bones with preflighted explicit targets. `set_pivot` requires origin and preserves visual contents; `mirror` requires an axis; `set_ik` requires an explicit IK field and preserves the existing enabled state when only the target is changed. Missing/ambiguous targets fail before mutation. The tool does not infer joints, pivots, rotation, or hierarchy from appearance.\"," 
          new_description = "      \"Creates or edits Group bones with preflighted explicit targets. `parent` rejects self/descendant hierarchy cycles before Undo; `set_pivot` requires origin and preserves visual contents; `mirror` requires an axis; `set_ik` requires an explicit IK field and preserves the existing enabled state when only the target is changed. Missing/ambiguous targets fail before mutation. The tool does not infer joints, pivots, rotation, or hierarchy from appearance.\"," 
          if text.count(old_description) != 1:
              raise SystemExit("Unexpected bone rigging description")
          animation_path.write_text(text.replace(old_description, new_description, 1), encoding="utf-8")

          test_path = Path("mcp/tests/animation-mutation-contract.test.ts")
          test = test_path.read_text(encoding="utf-8")
          old_import = "\n".join([
              "  countAnimationClipboardKeyframes,",
              "  manageKeyframesParameters,",
              "} from \"@/server/tools/animation\";",
          ])
          new_import = "\n".join([
              "  countAnimationClipboardKeyframes,",
              "  manageKeyframesParameters,",
              "  wouldCreateRigHierarchyCycle,",
              "} from \"@/server/tools/animation\";",
          ])
          if test.count(old_import) != 1:
              raise SystemExit("Unexpected animation mutation import tail")
          test = test.replace(old_import, new_import, 1)

          addition = "\n".join([
              "",
              "  test(\"rig parent preflight rejects self, descendant, and already-cyclic parent chains\", () => {",
              "    const hierarchy = new Map<string, string | null>([",
              "      [\"root-bone\", null],",
              "      [\"mid-bone\", \"root-bone\"],",
              "      [\"leaf-bone\", \"mid-bone\"],",
              "    ]);",
              "    expect(",
              "      wouldCreateRigHierarchyCycle(\"root-bone\", \"root-bone\", hierarchy)",
              "    ).toBe(true);",
              "    expect(",
              "      wouldCreateRigHierarchyCycle(\"root-bone\", \"leaf-bone\", hierarchy)",
              "    ).toBe(true);",
              "    expect(",
              "      wouldCreateRigHierarchyCycle(\"leaf-bone\", \"root-bone\", hierarchy)",
              "    ).toBe(false);",
              "",
              "    const corruptHierarchy = new Map<string, string | null>([",
              "      [\"a\", \"b\"],",
              "      [\"b\", \"a\"],",
              "    ]);",
              "    expect(wouldCreateRigHierarchyCycle(\"target\", \"a\", corruptHierarchy)).toBe(true);",
              "  });",
          ])
          close_marker = "});\n"
          position = test.rfind(close_marker)
          if position == -1:
              raise SystemExit("Animation mutation test closing marker not found")
          test = test[:position] + addition + "\n" + test[position:]
          test_path.write_text(test, encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          old_note = "A bounded GitHub-only rigging contract correction now rejects empty `set_ik` updates and prevents target-only IK edits from implicitly forcing `ik_enabled=false`; omitted `ik_enabled` preserves the existing authored state. IK target resolution and local runtime proof requirements are unchanged."
          new_note = "A bounded GitHub-only rigging contract correction now rejects empty `set_ik` updates, prevents target-only IK edits from implicitly forcing `ik_enabled=false`, and rejects parent operations whose self/descendant/existing parent chain would create or extend a hierarchy cycle before Undo. Omitted `ik_enabled` preserves the existing authored state. IK target resolution and local runtime proof requirements are unchanged."
          if next_text.count(old_note) != 1:
              raise SystemExit("Unexpected rigging continuity note")
          next_path.write_text(next_text.replace(old_note, new_note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit hierarchy guard and remove temporary workflow
        run: |
          git rm .github/workflows/apply-rigging-parent-cycle-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: reject rig hierarchy parent cycles"
          git push origin HEAD:Local
