name: Apply Paint Contract Cleanup

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/apply-paint-contract-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply bounded Paint input and annotation corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('mcp/server/tools/paint.ts')
          text = source_path.read_text(encoding='utf-8')

          eraser_anchor = '  coordinates: z\n    .array(\n      coordinateSchema.extend({\n        x: z.number().describe("X coordinate to erase at."),\n        y: z.number().describe("Y coordinate to erase at."),\n      })\n    )\n    .describe("Array of coordinates to erase at."),'
          eraser_new = '  coordinates: z\n    .array(\n      coordinateSchema.extend({\n        x: z.number().describe("X coordinate to erase at."),\n        y: z.number().describe("Y coordinate to erase at."),\n      })\n    )\n    .min(1)\n    .describe("One or more coordinates to erase at."),'
          if text.count(eraser_anchor) != 1:
              raise SystemExit('Unexpected eraser coordinate schema')
          text = text.replace(eraser_anchor, eraser_new, 1)

          brush_anchor = '  coordinates: z\n    .array(\n      coordinateSchema.extend({\n        x: z.number().describe("X coordinate on texture."),\n        y: z.number().describe("Y coordinate on texture."),\n      })\n    )\n    .describe("Array of coordinates to paint at."),'
          brush_new = '  coordinates: z\n    .array(\n      coordinateSchema.extend({\n        x: z.number().describe("X coordinate on texture."),\n        y: z.number().describe("Y coordinate on texture."),\n      })\n    )\n    .min(1)\n    .describe("One or more coordinates to paint at."),'
          if text.count(brush_anchor) != 1:
              raise SystemExit('Unexpected brush coordinate schema')
          text = text.replace(brush_anchor, brush_new, 1)

          paint_schema_start = text.index('export const paintSettingsParameters = z.object({')
          paint_schema_end = text.index('\n});\n\nexport const paintWithBrushParameters', paint_schema_start)
          paint_schema = text[paint_schema_start:paint_schema_end + 4]
          if '.refine(' in paint_schema:
              raise SystemExit('paint_settings already refined')
          refined = paint_schema[:-2] + '.refine(\n  (params) => Object.values(params).some((value) => value !== undefined),\n  { message: "paint_settings requires at least one setting change." }\n);'
          text = text[:paint_schema_start] + refined + text[paint_schema_end + 4:]

          old_annotation = '    annotations: {\n      title: "Color Picker Tool",\n      readOnlyHint: true,\n    },'
          new_annotation = '    annotations: {\n      title: "Color Picker Tool",\n      destructiveHint: false,\n    },'
          if text.count(old_annotation) != 1:
              raise SystemExit('Unexpected color picker annotation')
          text = text.replace(old_annotation, new_annotation, 1)
          source_path.write_text(text, encoding='utf-8')

          test_path = Path('mcp/tests/context-payload-cleanup.test.ts')
          test = test_path.read_text(encoding='utf-8')
          import_anchor = 'import {\n  facesArrayOptionalSchema,\n  facesArrayWithDefaultSchema,\n  listMaterialInstancesParametersSchema,\n  materialInstanceAssignmentSchema,\n} from "@/server/tools/material-instances";\n'
          import_add = import_anchor + 'import {\n  eraserToolParameters,\n  paintSettingsParameters,\n  paintWithBrushParameters,\n} from "@/server/tools/paint";\n'
          if 'paintSettingsParameters' not in test:
              if test.count(import_anchor) != 1:
                  raise SystemExit('Unexpected payload cleanup import anchor')
              test = test.replace(import_anchor, import_add, 1)

          marker = '  test("context cleanup changes payload, not Bedrock capability/profile architecture", async () => {'
          addition = '  test("Paint mutations reject empty work and color picker is not read-only", async () => {\n    expect(\n      eraserToolParameters.safeParse({\n        coordinates: [],\n        brush_size: 1,\n        opacity: 255,\n        softness: 0,\n      }).success\n    ).toBe(false);\n    expect(\n      paintWithBrushParameters.safeParse({\n        coordinates: [],\n        brush_settings: { size: 1, opacity: 255, softness: 0, color: "#000000" },\n      }).success\n    ).toBe(false);\n    expect(paintSettingsParameters.safeParse({}).success).toBe(false);\n    expect(paintSettingsParameters.safeParse({ lock_alpha: true }).success).toBe(true);\n\n    const paint = await source("server/tools/paint.ts");\n    const pickerStart = paint.indexOf(\'name: "color_picker_tool"\');\n    const pickerEnd = paint.indexOf(\'name: "copy_brush_tool"\', pickerStart);\n    const picker = paint.slice(pickerStart, pickerEnd);\n    expect(picker).not.toContain("readOnlyHint: true");\n    expect(picker).toContain("destructiveHint: false");\n  });\n\n'
          if test.count(marker) != 1:
              raise SystemExit('Unexpected payload cleanup test insertion point')
          test_path.write_text(test.replace(marker, addition + marker, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = 'Material-instance payload/mutation contracts are also bounded: empty face arrays are rejected before mutation, and `list_material_instances` now returns names + usage counts by default. Explicit `include_usages=true` returns at most 100 locations per instance by default (raiseable to 1000) with `usages_truncated` indicating omitted locations. No pagination/state framework was added.'
          extra = '\n\nPaint contract cleanup rejects empty eraser/brush coordinate arrays and empty `paint_settings` requests before editor mutation. `color_picker_tool` no longer advertises `readOnlyHint` because it changes active paint color and can update brush opacity; it is marked non-destructive instead. Painter behavior and visual proof requirements are unchanged.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected material payload continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-paint-contract-cleanup.yml
          git add mcp/server/tools/paint.ts mcp/tests/context-payload-cleanup.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'fix: reject empty Paint mutations'
          git push origin HEAD:Local
