name: Smart Rotation Fix

on:
  push:
    branches:
      - Rework
    paths:
      - ".github/scripts/fix_smart_rotation_types.py"
      - ".github/workflows/smart-rotation-fix.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/fix_smart_rotation_types.py"
      - ".github/workflows/smart-rotation-fix.yml"
      - "mcp-blockbench/src/server/tools/geometry-rotation.ts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-rotation-fix-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Rework
        uses: actions/checkout@v4
        with:
          ref: Rework
          fetch-depth: 0

      - name: Apply type patch
        run: python .github/scripts/fix_smart_rotation_types.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: mcp-blockbench
        run: bun install --frozen-lockfile

      - name: Verify synchronized skills
        working-directory: mcp-blockbench
        run: bun run skills:check

      - name: Typecheck
        working-directory: mcp-blockbench
        run: bun run typecheck

      - name: Test
        working-directory: mcp-blockbench
        run: bun test

      - name: Build
        working-directory: mcp-blockbench
        run: bun run build

      - name: Verify smart rotation bundle
        working-directory: mcp-blockbench
        run: |
          bun -e 'const text = await Bun.file("dist/mcp.js").text(); for (const marker of ["SNAP_RESIZE_ROTATE", "attachment_fit.json", "ROTATION_NOT_VISIBLE", "PRIMARY_ROTATION_PIVOT_NOT_APPLIED", "automatic_angle_solver"]) { if (!text.includes(marker)) throw new Error(`Missing smart rotation marker: ${marker}`); }'

      - name: Commit verified source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp-blockbench/src/server/tools/geometry-rotation.ts
          if git diff --cached --quiet; then
            echo "Smart rotation type fix already applied."
            exit 0
          fi
          git commit -m "fix: finalize smart pivot and attachment rotation runtime"
          git pull --rebase origin Rework
          git push origin HEAD:Rework
