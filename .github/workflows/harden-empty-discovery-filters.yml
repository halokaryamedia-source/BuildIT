name: Harden Empty Discovery Filters

on:
  push:
    branches: [Local]
    paths:
      - ".github/workflows/harden-empty-discovery-filters.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reject empty explicit discovery filters
        run: |
          python3 - <<'PY'
          from pathlib import Path

          element_path = Path('mcp/server/tools/element.ts')
          text = element_path.read_text(encoding='utf-8')

          old_pattern = '\n'.join([
              '  name_pattern: z',
              '    .string()',
              '    .optional()',
              '    .describe(',
              '      "Optional case-sensitive name regex; invalid/oversized/unsafe patterns are rejected."',
              '    ),',
          ])
          new_pattern = '\n'.join([
              '  name_pattern: z',
              '    .string()',
              '    .min(1)',
              '    .optional()',
              '    .describe(',
              '      "Optional non-empty case-sensitive name regex; invalid/oversized/unsafe patterns are rejected."',
              '    ),',
          ])
          if text.count(old_pattern) != 1:
              raise SystemExit('Unexpected name_pattern schema')
          text = text.replace(old_pattern, new_pattern, 1)

          old_contains = '\n'.join([
              '  name_contains: z',
              '    .string()',
              '    .optional()',
              '    .describe("Substring to match element names. Case-insensitive."),',
          ])
          new_contains = '\n'.join([
              '  name_contains: z',
              '    .string()',
              '    .min(1)',
              '    .optional()',
              '    .describe("Optional non-empty substring to match element names. Case-insensitive."),',
          ])
          if text.count(old_contains) != 1:
              raise SystemExit('Unexpected name_contains schema')
          text = text.replace(old_contains, new_contains, 1)

          old_regex = '\n'.join([
              'function safeCompileRegex(pattern: string | undefined): RegExp | null {',
              '  if (!pattern) return null;',
              '  if (pattern.length > MAX_REGEX_PATTERN_LENGTH) {',
          ])
          new_regex = '\n'.join([
              'function safeCompileRegex(pattern: string | undefined): RegExp | null {',
              '  if (pattern === undefined) return null;',
              '  if (pattern.length === 0) {',
              '    throw new Error("name_pattern cannot be empty; omit it only when no regex filter is intended.");',
              '  }',
              '  if (pattern.length > MAX_REGEX_PATTERN_LENGTH) {',
          ])
          if text.count(old_regex) != 1:
              raise SystemExit('Unexpected safeCompileRegex boundary')
          text = text.replace(old_regex, new_regex, 1)

          old_runtime = '\n'.join([
              '    }) {',
              '      const regex = safeCompileRegex(name_pattern);',
              '      const needle = name_contains?.toLowerCase() ?? null;',
              '      const parentScope = resolveOptionalGroupScope(parent_group);',
          ])
          new_runtime = '\n'.join([
              '    }) {',
              '      const regex = safeCompileRegex(name_pattern);',
              '      if (name_contains !== undefined && name_contains.length === 0) {',
              '        throw new Error("name_contains cannot be empty; omit it only when no substring filter is intended.");',
              '      }',
              '      const needle = name_contains?.toLowerCase() ?? null;',
              '      const parentScope = resolveOptionalGroupScope(parent_group);',
          ])
          if text.count(old_runtime) != 1:
              raise SystemExit('Unexpected discovery runtime anchor')
          text = text.replace(old_runtime, new_runtime, 1)

          old_filter = '        if (needle && !el.name.toLowerCase().includes(needle)) continue;'
          new_filter = '        if (needle !== null && !el.name.toLowerCase().includes(needle)) continue;'
          if text.count(old_filter) != 1:
              raise SystemExit('Unexpected name_contains filter condition')
          element_path.write_text(text.replace(old_filter, new_filter, 1), encoding='utf-8')

          test_path = Path('mcp/tests/p1-core-ownership.test.ts')
          test = test_path.read_text(encoding='utf-8')
          anchor = '  test("UUID wins before exact unique name and names never prefix-match", () => {\n'
          new_test = '\n'.join([
              '  test("optional explicit discovery name filters reject empty strings", () => {',
              '    expect(findElementsByCriteriaParameters.safeParse({ name_pattern: "" }).success).toBe(false);',
              '    expect(findElementsByCriteriaParameters.safeParse({ name_contains: "" }).success).toBe(false);',
              '    expect(findElementsByCriteriaParameters.safeParse({ name_pattern: "arm.*" }).success).toBe(true);',
              '    expect(findElementsByCriteriaParameters.safeParse({ name_contains: "arm" }).success).toBe(true);',
              '    expect(findElementsByCriteriaParameters.safeParse({}).success).toBe(true);',
              '  });',
              '',
          ]) + '\n'
          if test.count(anchor) != 1:
              raise SystemExit('Unexpected p1 core discovery-test anchor')
          test_path.write_text(test.replace(anchor, new_test + anchor, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          scope_note = 'Optional explicit Group scopes now reject the empty string for both `find_elements_by_criteria` and `select_all_of_type`. Only omission means no scope; an explicit empty value can no longer silently broaden discovery or selection to the full project. The shared Group resolver and scope behavior are otherwise unchanged.'
          filter_note = 'Optional explicit discovery name filters now follow the same omission boundary: `find_elements_by_criteria.name_pattern` and `name_contains` reject the empty string, while omission still means no corresponding filter. Runtime checks also distinguish `undefined` from explicit empty input, so an empty filter cannot silently broaden discovery. Regex safety limits and matching semantics are otherwise unchanged.'
          if next_text.count(scope_note) != 1:
              raise SystemExit('Group-scope continuity anchor not found')
          next_path.write_text(next_text.replace(scope_note, scope_note + '\n\n' + filter_note, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified discovery hardening and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-empty-discovery-filters.yml
          git add mcp/server/tools/element.ts mcp/tests/p1-core-ownership.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'fix: reject empty discovery name filters'
          git push origin HEAD:Local
