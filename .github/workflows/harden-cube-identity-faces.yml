name: Harden Cube Identity And Faces

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/harden-cube-identity-faces.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Harden deterministic Cube authoring inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shared_path = Path('mcp/lib/zodObjects.ts')
          shared = shared_path.read_text(encoding='utf-8')
          old_name = 'export const cubeSchema = z.object({\n  name: z.string(),'
          new_name = 'export const cubeSchema = z.object({\n  name: z.string().min(1).describe("Non-empty Cube name."),'
          if shared.count(old_name) != 1:
              raise SystemExit('Unexpected cubeSchema name shape')
          shared_path.write_text(shared.replace(old_name, new_name, 1), encoding='utf-8')

          cubes_path = Path('mcp/server/tools/cubes.ts')
          cubes = cubes_path.read_text(encoding='utf-8')
          cubes = cubes.replace('import { cubeSchema } from "@/lib/zodObjects";', 'import { cubeSchema, faceEnum } from "@/lib/zodObjects";', 1)
          cubes = cubes.replace('  name: z.string().optional().describe("New name of the cube."),', '  name: z.string().min(1).optional().describe("New non-empty Cube name."),', 1)

          simple_faces = '      z\n        .array(z.enum(["north", "south", "east", "west", "up", "down"]))\n        .describe("Array of faces to apply the texture to."),'
          simple_new = '      z\n        .array(faceEnum)\n        .max(6)\n        .refine((faces) => new Set(faces).size === faces.length, {\n          message: "Each Cube face may appear at most once.",\n        })\n        .describe("Unique Cube faces to apply the texture to."),'
          if cubes.count(simple_faces) != 1:
              raise SystemExit('Unexpected simple Cube face schema')
          cubes = cubes.replace(simple_faces, simple_new, 1)

          custom_start = '      z\n        .array(\n          z.object({\n            face: z\n              .enum(["north", "south", "east", "west", "up", "down"])\n              .describe("Face to apply the texture to."),\n            uv: z\n              .array(z.number()).length(4)\n              .describe("Custom UV mapping for the face."),\n          })\n        )\n        .describe("Array of faces with custom UV mapping."),'
          custom_new = '      z\n        .array(\n          z.object({\n            face: faceEnum.describe("Face to apply the texture to."),\n            uv: z\n              .array(z.number()).length(4)\n              .describe("Custom UV mapping for the face."),\n          })\n        )\n        .max(6)\n        .refine(\n          (entries) => new Set(entries.map((entry) => entry.face)).size === entries.length,\n          { message: "Each custom-UV Cube face may appear at most once." }\n        )\n        .describe("Unique Cube faces with custom UV mapping."),'
          if cubes.count(custom_start) != 1:
              raise SystemExit('Unexpected custom Cube face schema')
          cubes_path.write_text(cubes.replace(custom_start, custom_new, 1), encoding='utf-8')

          test_path = Path('mcp/tests/model-effectiveness-correction-accuracy.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = '  test("Cube authoring rejects finite endpoints that produce non-finite size", () => {'
          addition = '  test("Cube identity and face inputs remain deterministic", () => {\n    expect(\n      placeCubeParameters.safeParse({\n        elements: [{ name: "", from: [0, 0, 0], to: [1, 1, 1] }],\n      }).success\n    ).toBe(false);\n    expect(modifyCubeParameters.safeParse({ id: "cube", name: "" }).success).toBe(false);\n    expect(\n      placeCubeParameters.safeParse({\n        elements: [{ name: "cube", from: [0, 0, 0], to: [1, 1, 1] }],\n        faces: ["north", "north"],\n      }).success\n    ).toBe(false);\n    expect(\n      placeCubeParameters.safeParse({\n        elements: [{ name: "cube", from: [0, 0, 0], to: [1, 1, 1] }],\n        faces: [\n          { face: "north", uv: [0, 0, 1, 1] },\n          { face: "north", uv: [1, 1, 2, 2] },\n        ],\n      }).success\n    ).toBe(false);\n  });\n\n'
          if test.count(marker) != 1:
              raise SystemExit('Unexpected Cube correction test insertion point')
          test_path.write_text(test.replace(marker, addition + marker, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = 'Filesystem path ownership is now consistent across model export and texture-set import: both require an absolute POSIX, Windows-drive, or UNC path before filesystem access. The shared check is a small pure helper reused by the two existing callers; no filesystem abstraction/framework was introduced.'
          extra = '\n\nCube authoring inputs now keep identity and face writes deterministic: create/rename Cube names cannot be empty, simple face lists contain at most the six native faces without duplicates, and custom-UV face lists cannot write the same face twice in one request. Empty face lists remain allowed because they are not inherently invalid authored geometry; no arbitrary Cube-batch size cap was added.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected filesystem continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-cube-identity-faces.yml
          git add mcp/lib/zodObjects.ts mcp/server/tools/cubes.ts mcp/tests/model-effectiveness-correction-accuracy.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'fix: make Cube identity and face inputs deterministic'
          git push origin HEAD:Local
