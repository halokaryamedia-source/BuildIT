name: Repo Hygiene Audit

on:
  push:
    branches: [Local]
    paths:
      - '.github/scripts/repo_hygiene_audit.py'
      - '.github/workflows/repo-hygiene-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - name: Run repository hygiene audit
        run: python3 .github/scripts/repo_hygiene_audit.py
      - name: Remove audit helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/repo_hygiene_audit.py .github/workflows/repo-hygiene-audit.yml
          git commit -m 'ci: remove repo hygiene audit helper'
          git push origin HEAD:Local
