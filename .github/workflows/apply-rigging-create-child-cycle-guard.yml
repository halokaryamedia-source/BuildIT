name: Apply Rig Create Child Cycle Guard

on:
  push:
    paths:
      - ".github/workflows/apply-rigging-create-child-cycle-guard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reject cyclic child adoption during bone create
        run: |
          python3 - <<'PY'
          from pathlib import Path

          animation_path = Path("mcp/server/tools/animation.ts")
          text = animation_path.read_text(encoding="utf-8")

          old_create_children = "\n".join([
              "          if (",
              "            new Set(childElements.map((element) => element.uuid)).size !==",
              "            childElements.length",
              "          ) {",
              "            throw new Error(\"children contains the same Outliner element more than once.\");",
              "          }",
              "          if (bone_data.ik_enabled) {",
          ])
          new_create_children = "\n".join([
              "          if (",
              "            new Set(childElements.map((element) => element.uuid)).size !==",
              "            childElements.length",
              "          ) {",
              "            throw new Error(\"children contains the same Outliner element more than once.\");",
              "          }",
              "          if (parentBone instanceof Group) {",
              "            const createParentByUuid = new Map<string, string | null>(",
              "              Group.all.map((group: Group) =>",
              "                [",
              "                  group.uuid,",
              "                  group.parent instanceof Group ? group.parent.uuid : null,",
              "                ] as [string, string | null]",
              "              )",
              "            );",
              "            childElements.forEach((child) => {",
              "              if (",
              "                child instanceof Group &&",
              "                wouldCreateRigHierarchyCycle(",
              "                  child.uuid,",
              "                  parentBone.uuid,",
              "                  createParentByUuid",
              "                )",
              "              ) {",
              "                throw new Error(",
              "                  `Cannot create bone \"${bone_data.name}\" under \"${parentBone.name}\" while adopting child Group \"${child.name}\" because that child is the parent itself, an ancestor of the parent, or the parent chain is already cyclic.`",
              "                );",
              "              }",
              "            });",
              "          }",
              "          if (bone_data.ik_enabled) {",
          ])
          if text.count(old_create_children) != 1:
              raise SystemExit("Unexpected bone create child preflight shape")
          text = text.replace(old_create_children, new_create_children, 1)

          old_description = "      \"Creates or edits Group bones with preflighted explicit targets. Create/rename/mirror preserve case-insensitive bone-name uniqueness required by Bedrock animation matching; `parent` rejects self/descendant hierarchy cycles before Undo; `set_pivot` requires origin and preserves visual contents; `mirror` requires an axis and preflights its derived bone name; `set_ik` requires an explicit IK field and preserves the existing enabled state when only the target is changed. Missing/ambiguous targets fail before mutation. The tool does not infer joints, pivots, rotation, or hierarchy from appearance.\"," 
          new_description = "      \"Creates or edits Group bones with preflighted explicit targets. Create/rename/mirror preserve case-insensitive bone-name uniqueness required by Bedrock animation matching; create also rejects explicit child adoption that would cycle through its chosen parent; `parent` rejects self/descendant hierarchy cycles before Undo; `set_pivot` requires origin and preserves visual contents; `mirror` requires an axis and preflights its derived bone name; `set_ik` requires an explicit IK field and preserves the existing enabled state when only the target is changed. Missing/ambiguous targets fail before mutation. The tool does not infer joints, pivots, rotation, or hierarchy from appearance.\"," 
          if text.count(old_description) != 1:
              raise SystemExit("Unexpected bone rigging tool description")
          animation_path.write_text(text.replace(old_description, new_description, 1), encoding="utf-8")

          test_path = Path("mcp/tests/animation-mutation-contract.test.ts")
          test = test_path.read_text(encoding="utf-8")
          addition = "\n".join([
              "",
              "  test(\"bone create child adoption rejects parent/ancestor cycles before Undo\", async () => {",
              "    const hierarchy = new Map<string, string | null>([",
              "      [\"root-bone\", null],",
              "      [\"mid-bone\", \"root-bone\"],",
              "      [\"leaf-bone\", \"mid-bone\"],",
              "    ]);",
              "    expect(",
              "      wouldCreateRigHierarchyCycle(\"root-bone\", \"leaf-bone\", hierarchy)",
              "    ).toBe(true);",
              "    expect(",
              "      wouldCreateRigHierarchyCycle(\"leaf-bone\", \"root-bone\", hierarchy)",
              "    ).toBe(false);",
              "",
              "    const source = await Bun.file(\"server/tools/animation.ts\").text();",
              "    expect(source).toContain(\"const createParentByUuid = new Map<string, string | null>\");",
              "    expect(source).toContain(\"child instanceof Group &&\");",
              "    expect(source).toContain(\"child.uuid,\");",
              "    expect(source).toContain(\"parentBone.uuid,\");",
              "  });",
          ])
          close_marker = "});\n"
          position = test.rfind(close_marker)
          if position == -1:
              raise SystemExit("Animation mutation test closing marker not found")
          test = test[:position] + addition + "\n" + test[position:]
          test_path.write_text(test, encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          old_note = "A bounded GitHub-only rigging contract correction now rejects empty `set_ik` updates, prevents target-only IK edits from implicitly forcing `ik_enabled=false`, rejects parent operations whose self/descendant/existing parent chain would create or extend a hierarchy cycle before Undo, and keeps create/rename/mirror bone identities unique under the case-insensitive matching used by Bedrock animation import. Mirror derives and validates its intended counterpart name before duplication; exact no-op renames are rejected while case-only self renames remain valid. Omitted `ik_enabled` preserves the existing authored state. IK target resolution and local runtime proof requirements are unchanged."
          new_note = "A bounded GitHub-only rigging contract correction now rejects empty `set_ik` updates, prevents target-only IK edits from implicitly forcing `ik_enabled=false`, rejects parent operations whose self/descendant/existing parent chain would create or extend a hierarchy cycle before Undo, rejects bone-create child adoption when a requested child is the chosen parent/ancestor of that parent, and keeps create/rename/mirror bone identities unique under the case-insensitive matching used by Bedrock animation import. Mirror derives and validates its intended counterpart name before duplication; exact no-op renames are rejected while case-only self renames remain valid. Omitted `ik_enabled` preserves the existing authored state. IK target resolution and local runtime proof requirements are unchanged."
          if next_text.count(old_note) != 1:
              raise SystemExit("Unexpected rigging continuity note")
          next_path.write_text(next_text.replace(old_note, new_note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit create child cycle guard and remove temporary workflow
        run: |
          git rm .github/workflows/apply-rigging-create-child-cycle-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: reject cyclic child adoption during bone create"
          git push origin HEAD:Local
