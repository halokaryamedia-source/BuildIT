name: Local Geometry Recovery

on:
  push:
    branches:
      - Rework
    paths:
      - ".github/scripts/apply_local_geometry_recovery.py"
      - ".github/scripts/fix_local_geometry_recovery.py"
      - ".github/workflows/local-geometry-recovery.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/apply_local_geometry_recovery.py"
      - ".github/scripts/fix_local_geometry_recovery.py"
      - ".github/workflows/local-geometry-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-geometry-recovery-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Rework
        uses: actions/checkout@v4
        with:
          ref: Rework
          fetch-depth: 0

      - name: Patch recovery script
        run: |
          set +e
          python .github/scripts/fix_local_geometry_recovery.py > geometry-recovery-patch.log 2>&1
          code=$?
          cat geometry-recovery-patch.log
          exit $code

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-recovery-patch
          path: geometry-recovery-patch.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Apply Geometry P0 recovery
        run: python .github/scripts/apply_local_geometry_recovery.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: mcp-blockbench
        run: bun install --frozen-lockfile

      - name: Synchronize production skill adapters
        working-directory: mcp-blockbench
        run: bun run skills:sync

      - name: Verify synchronized skills
        working-directory: mcp-blockbench
        run: bun run skills:check

      - name: Typecheck
        working-directory: mcp-blockbench
        run: |
          set +e
          bun run typecheck > ../geometry-recovery-typecheck.log 2>&1
          code=$?
          cat ../geometry-recovery-typecheck.log
          exit $code

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-recovery-typecheck
          path: geometry-recovery-typecheck.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Run full test suite
        working-directory: mcp-blockbench
        run: |
          set +e
          bun test > ../geometry-recovery-test.log 2>&1
          code=$?
          cat ../geometry-recovery-test.log
          exit $code

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-recovery-test
          path: geometry-recovery-test.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Build canonical plugin
        working-directory: mcp-blockbench
        run: bun run build

      - name: Verify final bundle
        working-directory: mcp-blockbench
        run: |
          bun -e 'const pkg = await Bun.file("package.json").json(); const text = await Bun.file("dist/mcp.js").text(); for (const marker of [`/* v${pkg.version} */`, `version:\"${pkg.version}\"`, "verify_primary_form_ready", "save_canonical_project", "GEOMETRY_PRIMARY_FORM_NOT_READY", "UNAVAILABLE_STRUCTURAL_FALLBACK", "STABLE_FULL_LIBRARY", "ACTIVE_PROFILE_GUARDED"]) { if (!text.includes(marker)) throw new Error(`Missing Geometry recovery bundle marker: ${marker}`); }'

      - name: Commit verified recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f mcp-blockbench/dist/mcp.js
          if git diff --cached --quiet; then
            echo "Geometry recovery already applied."
            exit 0
          fi
          git commit -m "fix: enforce primary form and recover local Blockbench workflow"
          git push origin HEAD:Rework
