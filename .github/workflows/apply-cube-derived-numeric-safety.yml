name: Apply Cube Derived Numeric Safety

on:
  push:
    paths:
      - ".github/workflows/apply-cube-derived-numeric-safety.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Harden Cube derived numeric state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cubes_path = Path("mcp/server/tools/cubes.ts")
          cubes = cubes_path.read_text(encoding="utf-8")

          finite_marker = "\n".join([
              "const finiteVec3Schema = z.tuple([",
              "  z.number().finite(),",
              "  z.number().finite(),",
              "  z.number().finite(),",
              "]);",
              "",
          ])
          finite_helpers = "\n".join([
              "function hasFiniteCubeSpan(",
              "  from: readonly number[],",
              "  to: readonly number[]",
              "): boolean {",
              "  return (",
              "    from.length === 3 &&",
              "    to.length === 3 &&",
              "    from.every(Number.isFinite) &&",
              "    to.every(Number.isFinite) &&",
              "    to.every((entry, axis) => Number.isFinite(entry - from[axis]))",
              "  );",
              "}",
              "",
              "function requireFiniteCubeSpan(",
              "  from: readonly number[],",
              "  to: readonly number[],",
              "  context: string",
              "): void {",
              "  if (!hasFiniteCubeSpan(from, to)) {",
              "    throw new Error(",
              "      `${context} would produce a non-finite Cube size. Use finite from/to coordinates whose per-axis difference is also finite.`",
              "    );",
              "  }",
              "}",
              "",
          ])
          if cubes.count(finite_marker) != 1:
              raise SystemExit("Unexpected finite Vec3 insertion point")
          cubes = cubes.replace(finite_marker, finite_marker + finite_helpers, 1)

          old_place_end = "\n".join([
              "  .refine(",
              "    (element) =>",
              "      !hasNonZeroRotation(element.rotation) || element.origin !== undefined,",
              "    {",
              "      message:",
              "        \"A rotated Cube requires an explicit origin/pivot. Do not rely on an automatic [0,0,0] pivot for non-zero rotation.\",",
              "      path: [\"origin\"],",
              "    }",
              "  );",
          ])
          new_place_end = old_place_end[:-2] + "\n" + "\n".join([
              "  .refine((element) => hasFiniteCubeSpan(element.from, element.to), {",
              "    message:",
              "      \"Cube from/to must produce a finite per-axis size; finite endpoints that overflow during subtraction are rejected.\",",
              "    path: [\"to\"],",
              "  });",
          ])
          if cubes.count(old_place_end) != 1:
              raise SystemExit("Unexpected place Cube refinement shape")
          cubes = cubes.replace(old_place_end, new_place_end, 1)

          old_modify_end = "\n".join([
              "}).refine(",
              "  (update) =>",
              "    Object.entries(update).some(",
              "      ([key, value]) => key !== \"id\" && value !== undefined",
              "    ),",
              "  {",
              "    message:",
              "      \"modify_cube requires at least one authored field change in addition to id. Inspect the target and send the intended correction; an id-only request is not progress.\",",
              "  }",
              ");",
          ])
          new_modify_end = old_modify_end[:-2] + "\n" + "\n".join([
              ".superRefine((update, ctx) => {",
              "  if (",
              "    update.from !== undefined &&",
              "    update.to !== undefined &&",
              "    !hasFiniteCubeSpan(update.from, update.to)",
              "  ) {",
              "    ctx.addIssue({",
              "      code: z.ZodIssueCode.custom,",
              "      message:",
              "        \"Cube from/to must produce a finite per-axis size; finite endpoints that overflow during subtraction are rejected.\",",
              "      path: [\"to\"],",
              "    });",
              "  }",
              "});",
          ])
          if cubes.count(old_modify_end) != 1:
              raise SystemExit("Unexpected modify Cube refinement shape")
          cubes = cubes.replace(old_modify_end, new_modify_end, 1)

          old_final = "\n".join([
              "function finalCubeState(cube: Cube) {",
              "  return {",
              "    uuid: cube.uuid,",
              "    name: cube.name,",
              "    from: [...cube.from] as [number, number, number],",
              "    to: [...cube.to] as [number, number, number],",
              "    size: [",
              "      cube.to[0] - cube.from[0],",
              "      cube.to[1] - cube.from[1],",
              "      cube.to[2] - cube.from[2],",
              "    ] as [number, number, number],",
          ])
          new_final = "\n".join([
              "function finalCubeState(cube: Cube) {",
              "  const from = [...cube.from] as [number, number, number];",
              "  const to = [...cube.to] as [number, number, number];",
              "  requireFiniteCubeSpan(from, to, `Cube ${cube.name} (${cube.uuid})`);",
              "  const size = [",
              "    to[0] - from[0],",
              "    to[1] - from[1],",
              "    to[2] - from[2],",
              "  ] as [number, number, number];",
              "",
              "  return {",
              "    uuid: cube.uuid,",
              "    name: cube.name,",
              "    from,",
              "    to,",
              "    size,",
          ])
          if cubes.count(old_final) != 1:
              raise SystemExit("Unexpected finalCubeState shape")
          cubes = cubes.replace(old_final, new_final, 1)

          old_center = "\n".join([
              "function cubeStateCenter(state: CubeAuthoredState): [number, number, number] {",
              "  return [",
              "    (state.from[0] + state.to[0]) / 2,",
              "    (state.from[1] + state.to[1]) / 2,",
              "    (state.from[2] + state.to[2]) / 2,",
              "  ];",
              "}",
          ])
          new_center = "\n".join([
              "function cubeStateCenter(state: CubeAuthoredState): [number, number, number] {",
              "  return [",
              "    state.from[0] + state.size[0] / 2,",
              "    state.from[1] + state.size[1] / 2,",
              "    state.from[2] + state.size[2] / 2,",
              "  ];",
              "}",
          ])
          if cubes.count(old_center) != 1:
              raise SystemExit("Unexpected Cube center shape")
          cubes = cubes.replace(old_center, new_center, 1)

          single_marker = "\n".join([
              "    cubes.forEach((cube) =>",
              "      requireIntentionalRotationActivation(cube, rotation, origin)",
              "    );",
              "",
          ])
          single_addition = "\n".join([
              "    requireFiniteCubeSpan(",
              "      from ?? cubes[0].from,",
              "      to ?? cubes[0].to,",
              "      `Cube ${cubes[0].name} (${cubes[0].uuid}) update`",
              "    );",
              "",
          ])
          if cubes.count(single_marker) != 1:
              raise SystemExit("Unexpected single Cube preflight insertion point")
          cubes = cubes.replace(single_marker, single_marker + single_addition, 1)

          batch_marker = "\n".join([
              "      requireIntentionalRotationActivation(",
              "        cube,",
              "        update.rotation,",
              "        update.origin",
              "      );",
              "",
          ])
          batch_addition = "\n".join([
              "      requireFiniteCubeSpan(",
              "        update.from ?? cube.from,",
              "        update.to ?? cube.to,",
              "        `Cube ${cube.name} (${cube.uuid}) batch update`",
              "      );",
              "",
          ])
          if cubes.count(batch_marker) != 1:
              raise SystemExit("Unexpected batch Cube preflight insertion point")
          cubes = cubes.replace(batch_marker, batch_marker + batch_addition, 1)
          cubes_path.write_text(cubes, encoding="utf-8")

          inspection_path = Path("mcp/server/tools/element-inspection.ts")
          inspection = inspection_path.read_text(encoding="utf-8")
          old_size = "\n".join([
              "function cubeSize(cube: Cube): [number, number, number] {",
              "  return [",
              "    cube.to[0] - cube.from[0],",
              "    cube.to[1] - cube.from[1],",
              "    cube.to[2] - cube.from[2],",
              "  ];",
              "}",
              "",
              "function inspectCube(cube: Cube) {",
              "  return {",
          ])
          new_size = "\n".join([
              "function cubeSize(cube: Cube): [number, number, number] {",
              "  const size = [",
              "    cube.to[0] - cube.from[0],",
              "    cube.to[1] - cube.from[1],",
              "    cube.to[2] - cube.from[2],",
              "  ] as [number, number, number];",
              "  if (size.some((value) => !Number.isFinite(value))) {",
              "    throw new Error(",
              "      `Cube ${cube.name} (${cube.uuid}) has a non-finite derived size; exact authored correction state cannot be reported safely.`",
              "    );",
              "  }",
              "  return size;",
              "}",
              "",
              "function inspectCube(cube: Cube) {",
              "  const size = cubeSize(cube);",
              "  return {",
          ])
          if inspection.count(old_size) != 1:
              raise SystemExit("Unexpected inspect Cube size shape")
          inspection = inspection.replace(old_size, new_size, 1)
          inspection = inspection.replace("    size: cubeSize(cube),", "    size,", 1)
          old_inspect_center = "\n".join([
              "    center: [",
              "      (cube.from[0] + cube.to[0]) / 2,",
              "      (cube.from[1] + cube.to[1]) / 2,",
              "      (cube.from[2] + cube.to[2]) / 2,",
              "    ] as [number, number, number],",
          ])
          new_inspect_center = "\n".join([
              "    center: [",
              "      cube.from[0] + size[0] / 2,",
              "      cube.from[1] + size[1] / 2,",
              "      cube.from[2] + size[2] / 2,",
              "    ] as [number, number, number],",
          ])
          if inspection.count(old_inspect_center) != 1:
              raise SystemExit("Unexpected inspect Cube center shape")
          inspection_path.write_text(inspection.replace(old_inspect_center, new_inspect_center, 1), encoding="utf-8")

          test_path = Path("mcp/tests/model-effectiveness-correction-accuracy.test.ts")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace(
              "import { modifyCubeParameters } from \"@/server/tools/cubes\";",
              "import { modifyCubeParameters, placeCubeParameters } from \"@/server/tools/cubes\";",
              1,
          )
          marker = "  test(\"Cube correction results expose before/after structural effects\", async () => {\n"
          addition = "\n".join([
              "  test(\"Cube authoring rejects finite endpoints that produce non-finite size\", () => {",
              "    expect(() =>",
              "      placeCubeParameters.parse({",
              "        elements: [{ name: \"overflow\", from: [-1e308, 0, 0], to: [1e308, 1, 1] }],",
              "      })",
              "    ).toThrow();",
              "    expect(() =>",
              "      modifyCubeParameters.parse({",
              "        id: \"cube-1\",",
              "        from: [-1e308, 0, 0],",
              "        to: [1e308, 1, 1],",
              "      })",
              "    ).toThrow();",
              "  });",
              "",
          ])
          if test.count(marker) != 1:
              raise SystemExit("Unexpected correction test insertion point")
          test = test.replace(marker, addition + marker, 1)
          old_assertion = "    expect(inspection).toContain(\"center: [\");"
          new_assertions = "\n".join([
              "    expect(inspection).toContain(\"center: [\");",
              "    expect(cubes).toContain(\"requireFiniteCubeSpan(\");",
              "    expect(cubes).toContain(\"state.from[0] + state.size[0] / 2\");",
              "    expect(inspection).toContain(\"cube.from[0] + size[0] / 2\");",
              "    expect(inspection).toContain(\"non-finite derived size\");",
          ])
          if test.count(old_assertion) != 1:
              raise SystemExit("Unexpected correction source assertion")
          test_path.write_text(test.replace(old_assertion, new_assertions, 1), encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          anchor = "The current source slice has hardened **P1 — correction accuracy** by linking diagnosis to exact authored state, a declared structural invariant, and deterministic before/after mutation effects.\n"
          note = "\nA bounded GitHub-only correction contract hardening now rejects Cube from/to combinations whose finite endpoints produce a non-finite derived size, preflights partial single/batch updates against current authored endpoints before Undo, and derives Cube centers from validated spans so inspection/mutation evidence cannot silently serialize overflow as `null`.\n"
          if next_text.count(anchor) != 1:
              raise SystemExit("Unexpected correction-accuracy continuity anchor")
          next_path.write_text(next_text.replace(anchor, anchor + note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit Cube hardening and remove temporary workflow
        run: |
          git rm .github/workflows/apply-cube-derived-numeric-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: reject non-finite derived Cube geometry"
          git push origin HEAD:Local
