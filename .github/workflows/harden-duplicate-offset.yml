name: Harden Duplicate Offset Numeric Safety

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/harden-duplicate-offset.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Harden duplicate translation preflight
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mcp/server/tools/element.ts')
          text = path.read_text(encoding='utf-8')
          if text.count('const finiteGroupVector3Schema') != 1:
              raise SystemExit('Unexpected finite Group vector schema')
          text = text.replace('const finiteGroupVector3Schema', 'const finiteElementVector3Schema', 1)
          text = text.replace('finiteGroupVector3Schema', 'finiteElementVector3Schema')

          old = '  offset: vector3Schema.optional().default([0, 0, 0]),'
          new = '  offset: finiteElementVector3Schema.optional().default([0, 0, 0]).describe("Finite translation offset [x,y,z] applied to the duplicated Cube/Group subtree."),'
          if text.count(old) != 1:
              raise SystemExit('Unexpected duplicate offset schema')
          text = text.replace(old, new, 1)

          anchor = '\nexport function registerElementTools() {'
          helper = '\n'.join([
              '',
              'export function requireFiniteTranslatedElementVector3(',
              '  values: readonly number[],',
              '  offset: readonly number[],',
              '  context: string',
              '): [number, number, number] {',
              '  if (values.length !== 3 || offset.length !== 3) {',
              '    throw new Error(`${context} must be a 3D vector before duplication.`);',
              '  }',
              '  const translated: [number, number, number] = [',
              '    values[0] + offset[0],',
              '    values[1] + offset[1],',
              '    values[2] + offset[2],',
              '  ];',
              '  if (translated.some((value) => !Number.isFinite(value))) {',
              '    throw new Error(',
              '      `${context} plus the requested duplicate offset would produce a non-finite authored coordinate.`',
              '    );',
              '  }',
              '  return translated;',
              '}',
              '',
              'function preflightDuplicateTranslation(',
              '  element: unknown,',
              '  offset: readonly number[]',
              '): void {',
              '  if (element instanceof Cube) {',
              '    requireFiniteTranslatedElementVector3(element.from, offset, `Cube ${element.name} (${element.uuid}) from`);',
              '    requireFiniteTranslatedElementVector3(element.to, offset, `Cube ${element.name} (${element.uuid}) to`);',
              '    requireFiniteTranslatedElementVector3(element.origin, offset, `Cube ${element.name} (${element.uuid}) origin`);',
              '    return;',
              '  }',
              '  if (element instanceof Group) {',
              '    requireFiniteTranslatedElementVector3(element.origin, offset, `Group ${element.name} (${element.uuid}) origin`);',
              '    for (const child of element.children) {',
              '      preflightDuplicateTranslation(child, offset);',
              '    }',
              '    return;',
              '  }',
              '  throw new Error(',
              '    "The Bedrock Cuboid duplicate workflow supports only Cube/Group targets and Cube/Group descendants."',
              '  );',
              '}',
          ])
          if text.count(anchor) != 1:
              raise SystemExit('Unexpected registerElementTools anchor')
          text = text.replace(anchor, helper + anchor, 1)

          duplicate_start = text.index('createTool(elementToolDocs[3].name')
          undo = '      Undo.initEdit({ elements: [], outliner: true, collections: [] });'
          undo_pos = text.index(undo, duplicate_start)
          preflight = '      preflightDuplicateTranslation(element, offset);\n\n'
          text = text[:undo_pos] + preflight + text[undo_pos:]
          path.write_text(text, encoding='utf-8')

          test_path = Path('mcp/tests/prelocal-generic-semantics.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old_import = 'import { addGroupParameters } from "@/server/tools/element";'
          new_import = 'import { addGroupParameters, duplicateElementParameters, requireFiniteTranslatedElementVector3 } from "@/server/tools/element";'
          if test.count(old_import) != 1:
              raise SystemExit('Unexpected element-tool test import')
          test = test.replace(old_import, new_import, 1)
          anchor = '  test("model export exposes only Bedrock geometry and editable Blockbench project codecs", () => {\n'
          lines = [
              '  test("duplicate_element rejects non-finite or overflowing translated coordinates", async () => {',
              '    expect(duplicateElementParameters.safeParse({ id: "cube", offset: [0, Infinity, 0] }).success).toBe(false);',
              '    expect(requireFiniteTranslatedElementVector3([1, 2, 3], [4, 5, 6], "test")).toEqual([5, 7, 9]);',
              '    expect(() => requireFiniteTranslatedElementVector3([1e308, 0, 0], [1e308, 0, 0], "test")).toThrow("non-finite authored coordinate");',
              '    const sourceText = await source("server/tools/element.ts");',
              '    const duplicateStart = sourceText.indexOf("createTool(elementToolDocs[3].name");',
              '    const duplicateBlock = sourceText.slice(duplicateStart, sourceText.indexOf("createTool(elementToolDocs[4].name", duplicateStart));',
              '    expect(duplicateBlock).toContain("preflightDuplicateTranslation(element, offset)");',
              '    expect(duplicateBlock.indexOf("preflightDuplicateTranslation(element, offset)")).toBeLessThan(duplicateBlock.indexOf("Undo.initEdit"));',
              '  });',
              '',
          ]
          if test.count(anchor) != 1:
              raise SystemExit('Unexpected duplicate test anchor')
          test_path.write_text(test.replace(anchor, '\n'.join(lines) + anchor, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          anchor = '\n`capture_screenshot` is now a truthful current-editor-view read:'
          note = '\n`duplicate_element` translation is now numerically preflighted before Undo. Offset components must be finite, and every Cube from/to/origin plus Group origin in the duplicated subtree must remain finite after translation; finite operands whose sum overflows are rejected. Unsupported non-Cube/Group descendants also fail before duplication starts. Copy naming and hierarchy semantics are unchanged.\n'
          if next_text.count(anchor) != 1:
              raise SystemExit('Unexpected next-action duplicate anchor')
          next_path.write_text(next_text.replace(anchor, note + anchor, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified duplicate safety and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-duplicate-offset.yml
          git add mcp/server/tools/element.ts mcp/tests/prelocal-generic-semantics.test.ts mcp/docs/api.json mcp/docs/index.html docs/knowledge/next-action.md
          git commit -m 'fix: preflight duplicate translation coordinates'
          git push origin HEAD:Local
