          old_tail = '''\n\n  test("tool-routing safeguards remain active as sequencing work completes", async () => {\n    const next = await source("../docs/knowledge/next-action.md");\n    expect(next).toContain("tool-choice / context friction");\n    expect(next).toContain("texture and animation sequencing");\n    expect(next).not.toContain(\n      "The next bounded modelling problem is:\\n\\n```text\\nP1 — tool-choice / context friction"\n    );\n  });'''
          if text.count(old_tail) != 1:
              raise SystemExit('tool-routing continuity-only test anchor changed')
          path.write_text(text.replace(old_tail, '', 1), encoding='utf-8')

          # Continuity prose should have one test owner only.
          owners = []
          for path in Path('mcp/tests').glob('*.test.ts'):
              if '../docs/knowledge/next-action.md' in path.read_text(encoding='utf-8'):
                  owners.append(path.name)
          if owners != ['context-payload-cleanup.test.ts']:
              raise SystemExit(f'next-action remains coupled to unrelated tests: {owners}')
          PY

