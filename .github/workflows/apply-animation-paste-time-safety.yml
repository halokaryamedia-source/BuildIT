name: Apply Animation Paste Planned-Time Safety

on:
  push:
    paths:
      - ".github/workflows/apply-animation-paste-time-safety.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Preflight animation paste times
        run: |
          python3 - <<'PY'
          from pathlib import Path

          animation_path = Path("mcp/server/tools/animation.ts")
          text = animation_path.read_text(encoding="utf-8")

          register_marker = "export function registerAnimationTools() {\n"
          helper = "\n".join([
              "export function requireValidPlannedPasteChannelTimes(",
              "  channels: Readonly<Record<string, readonly number[]>>",
              "): void {",
              "  Object.entries(channels).forEach(([channel, times]) => {",
              "    requireValidPlannedKeyframeTimes(",
              "      times,",
              "      `Animation paste ${channel} channel`,",
              "      true",
              "    );",
              "  });",
              "}",
              "",
          ])
          if text.count(register_marker) != 1:
              raise SystemExit("Unexpected animation registration marker")
          text = text.replace(register_marker, helper + register_marker, 1)

          old_pre_undo = "\n".join([
              "          const timeOffset = target.time_offset ?? 0;",
              "",
              "          Undo.initEdit({",
          ])
          new_pre_undo = "\n".join([
              "          const timeOffset = target.time_offset ?? 0;",
              "          const plannedPasteTimesByChannel = Object.fromEntries(",
              "            Object.entries(",
              "              clipboardData.channels as Record<string, Array<{ time: number }>>",
              "            ).map(([channel, channelKeyframes]) => [",
              "              channel,",
              "              channelKeyframes.map((keyframe) =>",
              "                Timeline.snapTime(keyframe.time + timeOffset, tgtAnimation)",
              "              ),",
              "            ])",
              "          ) as Record<string, number[]>;",
              "          requireValidPlannedPasteChannelTimes(plannedPasteTimesByChannel);",
              "",
              "          Undo.initEdit({",
          ])
          if text.count(old_pre_undo) != 1:
              raise SystemExit("Unexpected animation paste pre-Undo shape")
          text = text.replace(old_pre_undo, new_pre_undo, 1)

          old_loop = "\n".join([
              "              ([channel, keyframes]: [string, any[]]) => {",
              "                keyframes.forEach((kfData) => {",
              "                  const values = [...kfData.values];",
          ])
          new_loop = "\n".join([
              "              ([channel, keyframes]: [string, any[]]) => {",
              "                keyframes.forEach((kfData, index) => {",
              "                  const values = [...kfData.values];",
          ])
          if text.count(old_loop) != 1:
              raise SystemExit("Unexpected animation paste keyframe loop")
          text = text.replace(old_loop, new_loop, 1)

          old_target_time = "\n".join([
              "                  const targetTime = Timeline.snapTime(",
              "                    kfData.time + timeOffset,",
              "                    tgtAnimation",
              "                  );",
          ])
          new_target_time = "                  const targetTime = plannedPasteTimesByChannel[channel][index];\n"
          if text.count(old_target_time) != 1:
              raise SystemExit("Unexpected animation paste target time calculation")
          text = text.replace(old_target_time, new_target_time, 1)

          old_description = "      \"Copies and pastes animation data between bones or animations with action-specific source/target preflight. Copy requires at least one matching keyframe, paste rejects an empty clipboard before Undo, and mirror_paste requires an explicit mirror axis.\"," 
          new_description = "      \"Copies and pastes animation data between bones or animations with action-specific source/target preflight. Copy requires at least one matching keyframe; paste rejects an empty clipboard and preflights its own snapped times against the native 0..10000 range plus same-channel internal collapse before Undo; mirror_paste requires an explicit mirror axis. Existing-target overwrite semantics remain native paste behavior.\"," 
          if text.count(old_description) != 1:
              raise SystemExit("Unexpected animation copy/paste description")
          animation_path.write_text(text.replace(old_description, new_description, 1), encoding="utf-8")

          test_path = Path("mcp/tests/animation-mutation-contract.test.ts")
          test = test_path.read_text(encoding="utf-8")
          old_import = "\n".join([
              "  requireAvailableCreateKeyframeTimes,",
              "  requireValidPlannedKeyframeTimes,",
          ])
          if old_import in test:
              # The create-collision slice was intentionally not committed after stop-rule failure.
              raise SystemExit("Unexpected deferred create-collision helper is present in committed tests")

          old_import = "\n".join([
              "  manageKeyframesParameters,",
              "  requireValidPlannedKeyframeTimes,",
              "  resolveUniqueKeyframeMatchIndexes,",
          ])
          new_import = "\n".join([
              "  manageKeyframesParameters,",
              "  requireValidPlannedKeyframeTimes,",
              "  requireValidPlannedPasteChannelTimes,",
              "  resolveUniqueKeyframeMatchIndexes,",
          ])
          if test.count(old_import) != 1:
              raise SystemExit("Unexpected animation mutation import area")
          test = test.replace(old_import, new_import, 1)

          addition = "\n".join([
              "",
              "  test(\"paste planned times reject out-of-range and same-channel collapse before Undo\", async () => {",
              "    expect(() =>",
              "      requireValidPlannedPasteChannelTimes({",
              "        rotation: [0, 1, 2],",
              "        position: [0.5, 1.5],",
              "      })",
              "    ).not.toThrow();",
              "    expect(() =>",
              "      requireValidPlannedPasteChannelTimes({ rotation: [10000.001] })",
              "    ).toThrow(\"0..10000\");",
              "    expect(() =>",
              "      requireValidPlannedPasteChannelTimes({ rotation: [1, 1] })",
              "    ).toThrow(\"collapse multiple selected keyframes\");",
              "",
              "    const source = await Bun.file(\"server/tools/animation.ts\").text();",
              "    expect(source).toContain(\"requireValidPlannedPasteChannelTimes(plannedPasteTimesByChannel)\");",
              "    expect(source).toContain(\"plannedPasteTimesByChannel[channel][index]\");",
              "  });",
          ])
          close_marker = "});\n"
          position = test.rfind(close_marker)
          if position == -1:
              raise SystemExit("Animation mutation test closing marker not found")
          test = test[:position] + addition + "\n" + test[position:]
          test_path.write_text(test, encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          old_note = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload, rejects empty `manage_keyframes` requests, preserves existing interpolation on partial keyframe edits, requires every edit/delete/select time to resolve to exactly one existing keyframe before mutation/selection, requires an explicit `loop_mode` for the timeline loop mutation, rejects incomplete/effective no-op batch offset/scale requests, preflights batch offset/scale times against the native 0..10000 authored-time range and prevents selected-keyframe collapse during scale, prevents empty animation copy/paste clipboard operations, requires action-specific copy/paste source/target state, removes the implicit X-axis fallback from `mirror_paste`, and keeps the structured create result while compacting its duplicate text serialization. AnimationCodec behavior and playback semantics are unchanged."
          new_note = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload, rejects empty `manage_keyframes` requests, preserves existing interpolation on partial keyframe edits, requires every edit/delete/select time to resolve to exactly one existing keyframe before mutation/selection, requires an explicit `loop_mode` for the timeline loop mutation, rejects incomplete/effective no-op batch offset/scale requests, preflights batch offset/scale times against the native 0..10000 authored-time range and prevents selected-keyframe collapse during scale, prevents empty animation copy/paste clipboard operations, requires action-specific copy/paste source/target state, removes the implicit X-axis fallback from `mirror_paste`, and preflights pasted data against the native authored-time range plus same-channel internal snapped-time collapse before Undo. Existing-target overwrite semantics are unchanged. The structured create result remains compact; AnimationCodec behavior and playback semantics are unchanged."
          if next_text.count(old_note) != 1:
              raise SystemExit("Unexpected animation continuity note")
          next_path.write_text(next_text.replace(old_note, new_note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit paste time safety and remove temporary workflow
        run: |
          git rm .github/workflows/apply-animation-paste-time-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: preflight animation paste authored times"
          git push origin HEAD:Local
