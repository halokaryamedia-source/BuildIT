name: Harden Project Export Lifecycle

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/harden-project-export-lifecycle.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Harden project/export lifecycle ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project_path = Path('mcp/server/tools/project.ts')
          project = project_path.read_text(encoding='utf-8')

          old_desc = '      "Returns read-only project identity/format, texture resolution, Cube/Group/Texture counts, and top-level Group summaries.",'
          new_desc = '      "Returns read-only project lifecycle identity/path/save state, format, texture resolution, Cube/Group/Texture counts, and top-level Group summaries.",'
          if project.count(old_desc) != 1:
              raise SystemExit('Unexpected get_project_info description')
          project = project.replace(old_desc, new_desc, 1)

          register_marker = '\nexport function registerProjectTools() {'
          lifecycle_helper = '\n'.join([
              '',
              'function currentProjectLifecycle() {',
              '  if (!Project) {',
              '    throw new Error("No project is open.");',
              '  }',
              '',
              '  return {',
              '    name: Project.name,',
              '    uuid: Project.uuid,',
              '    save_path: Project.save_path ?? null,',
              '    export_path: Project.export_path ?? null,',
              '    export_codec: Project.export_codec ?? null,',
              '    saved: Project.saved === true,',
              '  };',
              '}',
              '',
              'export function registerProjectTools() {',
          ])
          if project.count(register_marker) != 1:
              raise SystemExit('Unexpected project registration marker')
          project = project.replace(register_marker, '\n' + lifecycle_helper, 1)

          old_create = '\n'.join([
              '      Project!.name = name;',
              '',
              '      return `Created project with name "${name}" (UUID: ${Project?.uuid}) and format "${format}".`;',
          ])
          new_create = '\n'.join([
              '      Project!.name = name;',
              '      const result = {',
              '        project: currentProjectLifecycle(),',
              '        format: { id: format },',
              '      };',
              '',
              '      return {',
              '        content: [',
              '          {',
              '            type: "text" as const,',
              '            text: `Created Bedrock project "${result.project.name}" (${result.project.uuid}).`,',
              '          },',
              '        ],',
              '        structuredContent: result,',
              '      };',
          ])
          if project.count(old_create) != 1:
              raise SystemExit('Unexpected create_project result block')
          project = project.replace(old_create, new_create, 1)

          old_info_project = '\n'.join([
              '          project: {',
              '            name: Project.name,',
              '            uuid: Project.uuid,',
              '            save_path: (Project as { save_path?: string }).save_path ?? null,',
              '          },',
          ])
          new_info_project = '          project: currentProjectLifecycle(),'
          if project.count(old_info_project) != 1:
              raise SystemExit('Unexpected get_project_info lifecycle block')
          project = project.replace(old_info_project, new_info_project, 1)
          project_path.write_text(project, encoding='utf-8')

          export_path = Path('mcp/server/tools/export.ts')
          export = export_path.read_text(encoding='utf-8')

          old_codec_tail = '\n'.join([
              '  fileName?: () => string;',
              '  support_partial_export?: boolean;',
              '};',
          ])
          new_codec_tail = '\n'.join([
              '  fileName?: () => string;',
              '  afterSave?: (path: string) => void;',
              '  support_partial_export?: boolean;',
              '};',
          ])
          if export.count(old_codec_tail) != 1:
              raise SystemExit('Unexpected BlockITCodec tail')
          export = export.replace(old_codec_tail, new_codec_tail, 1)

          codec_registry_marker = '\nfunction codecRegistry(): Record<string, BlockITCodec> {'
          export_lifecycle_helper = '\n'.join([
              '',
              'function currentExportProjectLifecycle() {',
              '  return {',
              '    name: Project!.name,',
              '    uuid: Project!.uuid,',
              '    save_path: Project!.save_path ?? null,',
              '    export_path: Project!.export_path ?? null,',
              '    export_codec: Project!.export_codec ?? null,',
              '    saved: Project!.saved === true,',
              '  };',
              '}',
              '',
              'function codecRegistry(): Record<string, BlockITCodec> {',
          ])
          if export.count(codec_registry_marker) != 1:
              raise SystemExit('Unexpected export codec registry marker')
          export = export.replace(codec_registry_marker, '\n' + export_lifecycle_helper, 1)

          old_write_post = '\n'.join([
              '          if (!writtenStat.isFile() || writtenStat.size !== byteLength) {',
              '            throw new Error(',
              '              `Export write verification failed for ${path}: expected a regular file of ${byteLength} bytes, got ${writtenStat.isFile() ? `${writtenStat.size} bytes` : "a non-file target"}. The path may exist, but export_model will not report it as a verified artifact.`',
              '            );',
              '          }',
              '          wrote_to_path = path;',
          ])
          new_write_post = '\n'.join([
              '          if (!writtenStat.isFile() || writtenStat.size !== byteLength) {',
              '            throw new Error(',
              '              `Export write verification failed for ${path}: expected a regular file of ${byteLength} bytes, got ${writtenStat.isFile() ? `${writtenStat.size} bytes` : "a non-file target"}. The path may exist, but export_model will not report it as a verified artifact.`',
              '            );',
              '          }',
              '          if (typeof codec.afterSave !== "function") {',
              '            throw new Error(',
              '              `Export artifact was written to ${path}, but codec "${codec_id}" has no native afterSave() lifecycle owner. Project path/save state was not reported as synchronized.`',
              '            );',
              '          }',
              '          codec.afterSave(path);',
              '          const lifecycle = currentExportProjectLifecycle();',
              '          const lifecycleMatches =',
              '            codec_id === "project"',
              '              ? lifecycle.save_path === path && lifecycle.saved',
              '              : lifecycle.export_path === path &&',
              '                lifecycle.export_codec === codec_id &&',
              '                lifecycle.saved;',
              '          if (!lifecycleMatches) {',
              '            throw new Error(',
              '              `Export artifact was written to ${path}, but native codec lifecycle state did not synchronize to that path.`',
              '            );',
              '          }',
              '          wrote_to_path = path;',
          ])
          if export.count(old_write_post) != 1:
              raise SystemExit('Unexpected export write postcondition block')
          export = export.replace(old_write_post, new_write_post, 1)

          old_result_tail = '\n'.join([
              '          wrote_to_path,',
              '          truncated,',
              '          content: returnedContent,',
          ])
          new_result_tail = '\n'.join([
              '          wrote_to_path,',
              '          project: currentExportProjectLifecycle(),',
              '          truncated,',
              '          content: returnedContent,',
          ])
          if export.count(old_result_tail) != 1:
              raise SystemExit('Unexpected export result tail')
          export = export.replace(old_result_tail, new_result_tail, 1)
          export_path.write_text(export, encoding='utf-8')

          test_path = Path('mcp/tests/asset-authoring-usage-slimming.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = '    expect(exportSource).toContain("must end in .${expectedExtension}");'
          addition = '\n'.join([
              marker,
              '    expect(exportSource).toContain("codec.afterSave(path)");',
              '    expect(exportSource).toContain("currentExportProjectLifecycle()");',
              '    expect(exportSource).toContain("lifecycle.export_codec === codec_id");',
              '    expect(exportSource).toContain("project: currentExportProjectLifecycle()");',
          ])
          if test.count(marker) != 1:
              raise SystemExit('Unexpected export lifecycle test marker')
          test_path.write_text(test.replace(marker, addition, 1), encoding='utf-8')

          core_path = Path('mcp/tests/p1-core-ownership.test.ts')
          core = core_path.read_text(encoding='utf-8')
          old_read = '\n'.join([
              '    const [cubes, elements] = await Promise.all([',
              '      readFile(new URL("../server/tools/cubes.ts", import.meta.url), "utf8"),',
              '      readFile(new URL("../server/tools/element.ts", import.meta.url), "utf8"),',
              '    ]);',
          ])
          new_read = '\n'.join([
              '    const [cubes, elements, project] = await Promise.all([',
              '      readFile(new URL("../server/tools/cubes.ts", import.meta.url), "utf8"),',
              '      readFile(new URL("../server/tools/element.ts", import.meta.url), "utf8"),',
              '      readFile(new URL("../server/tools/project.ts", import.meta.url), "utf8"),',
              '    ]);',
          ])
          if core.count(old_read) != 1:
              raise SystemExit('Unexpected core mutation source read block')
          core = core.replace(old_read, new_read, 1)
          core_marker = '    expect(elements).toContain("group: {");'
          core_addition = '\n'.join([
              core_marker,
              '    expect(project).toContain("structuredContent: result");',
              '    expect(project).toContain("currentProjectLifecycle()");',
              '    expect(project).toContain("export_path: Project.export_path ?? null");',
              '    expect(project).toContain("export_codec: Project.export_codec ?? null");',
              '    expect(project).toContain("saved: Project.saved === true");',
          ])
          if core.count(core_marker) != 1:
              raise SystemExit('Unexpected core mutation assertion marker')
          core_path.write_text(core.replace(core_marker, core_addition, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          insertion = '\n`create_project` / `get_project_info` / `export_model` now expose one consistent compact project lifecycle view: name/UUID, save path, export path/codec, and saved state. After a verified filesystem export, BlockIT reuses the native codec `afterSave(path)` lifecycle owner and verifies the project points at the written artifact before reporting synchronized success. Compile-only export does not mutate path/save lifecycle state. No project lifecycle state machine or parallel save framework was added.\n'
          anchor = '\n`create_texture` now follows the same deterministic filesystem rule for image-file inputs:'
          if next_text.count(anchor) != 1:
              raise SystemExit('Unexpected next-action lifecycle insertion anchor')
          next_path.write_text(next_text.replace(anchor, insertion + anchor, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified lifecycle change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-project-export-lifecycle.yml
          git add mcp/server/tools/project.ts mcp/server/tools/export.ts mcp/tests/asset-authoring-usage-slimming.test.ts mcp/tests/p1-core-ownership.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'fix: synchronize project export lifecycle state'
          git push origin HEAD:Local