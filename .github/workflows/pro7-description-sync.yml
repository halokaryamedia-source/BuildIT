name: PRO-7 Description Sync

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/pro7-description-sync.yml"

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Install dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Apply description sync
        run: python3 .github/scripts/pro7_inspection_description.py
      - name: Regenerate API docs
        working-directory: mcp
        run: bun run docs:build
      - name: Verify retained gates
        working-directory: mcp
        run: |
          bun run typecheck
          bun run test
          bun run measure:surface
          bun run build
          bun run docs:check
      - name: Commit retained sync and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pro7-description-sync.yml
          git rm -f .github/scripts/pro7_inspection_description.py
          git add -A
          git commit -m "docs: align sound effect inspection contract"
          git push origin HEAD:Local
