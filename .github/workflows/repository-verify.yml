name: Repository Verify

on:
  push:
    branches:
      - Local
    paths:
      - "AGENTS.md"
      - "GITHUB_RULES.md"
      - "CONTEXT.md"
      - "README.md"
      - ".agents/skills/**"
      - "docs/foundation/**"
      - "docs/knowledge/**"
      - "workspace/README.md"
      - "mcp/AGENTS.md"
      - "mcp/README.md"
      - "mcp/tests/repository-github-discipline.test.ts"
      - "mcp/tests/repository-supply-chain.test.ts"
      - "mcp/prompts/blockbench_code_eval_safety.md"
      - "mcp/prompts/blockbench_native_apis.md"
      - "Experimental/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - Local
      - main
    paths:
      - "AGENTS.md"
      - "GITHUB_RULES.md"
      - "CONTEXT.md"
      - "README.md"
      - ".agents/skills/**"
      - "docs/foundation/**"
      - "docs/knowledge/**"
      - "workspace/README.md"
      - "mcp/AGENTS.md"
      - "mcp/README.md"
      - "mcp/tests/repository-github-discipline.test.ts"
      - "mcp/tests/repository-supply-chain.test.ts"
      - "mcp/prompts/blockbench_code_eval_safety.md"
      - "mcp/prompts/blockbench_native_apis.md"
      - "Experimental/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Static repository contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Verify repository routing and policy
        run: |
          bun test \
            tests/repository-github-discipline.test.ts \
            tests/repository-supply-chain.test.ts \
            tests/experimental-authoring-contract.test.ts \
            tests/static-footprint-budget.test.ts \
            tests/documentation-handoff.test.ts \
            tests/active-routing-integrity.test.ts \
            tests/asset-authoring-usage-slimming.test.ts \
            tests/asset-tool-routing.test.ts \
            tests/reference-generator-buildability.test.ts \
            tests/model-effectiveness-*.test.ts \
            tests/prelocal-prompt-skill-surface.test.ts \
            tests/prelocal-usage-optimization.test.ts
