name: "Audit Final Pre-local Cleanup V2"

on:
  push:
    branches: [Local]
    paths:
      - ".github/workflows/audit-final-cleanup-v2.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - name: Audit coupling and stale prose
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patterns = {
            'NEXT_ACTION_TEST_COUPLING': ['next-action.md', 'const next ='],
            'STATUS_LITERALS': [
              'NON_LOCAL_PRELOCAL_READINESS_COMPLETE_LOCAL_ACCEPTANCE_REQUIRED',
              'MCP_TOOL_EXPOSURE_WIRE_AUDIT_COMPLETE_LOCAL_DEFERRED_LOADING_PROOF_REQUIRED',
            ],
            'NEXT_ACTION_ASSERTIONS': ['expect(next).toContain', 'expect(next).not.toContain'],
            'STALE_CONTINUATION': [
              'If continuing non-local', 'continue non-local', 'Next Allowed Step',
              'LOCAL — reference-fidelity acceptance scenarios',
            ],
            'MEASUREMENT_WORDING': [
              'Current actual', 'current source', 'current-source', 'Final pinned-SDK',
              'final GitHub-only', 'final pre-local', 'final line',
            ],
            'POLICY_DUPLICATION': [
              'custom tool router', 'additional MCP profile', 'readiness state machine',
              'efficiency mode', 'capability slice', 'invent another modelling framework',
            ],
          }

          roots = [Path('mcp/tests'), Path('docs/knowledge'), Path('.agents/skills'), Path('mcp/prompts')]
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.exists():
                  files.extend(p for p in root.rglob('*') if p.is_file() and p.suffix in {'.md', '.ts', '.json'})

          for title, needles in patterns.items():
              print(f'=== {title} ===')
              for path in sorted(set(files)):
                  try:
                      lines = path.read_text(encoding='utf-8').splitlines()
                  except UnicodeDecodeError:
                      continue
                  for number, line in enumerate(lines, 1):
                      if any(needle in line for needle in needles):
                          print(f'{path}:{number}:{line.strip()}')

          print('=== NEXT_ACTION_HEADINGS ===')
          path = Path('docs/knowledge/next-action.md')
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              if line.startswith('#'):
                  print(f'{number}:{line}')

          print('=== NEXT_ACTION_SIZE ===')
          text = path.read_text(encoding='utf-8')
          print(f'lines={len(text.splitlines())} chars={len(text)}')

          print('=== SUSPICIOUS_RESIDUE_FILES ===')
          for path in Path('.').rglob('*'):
              if not path.is_file():
                  continue
              name = path.name.lower()
              if name.endswith('.bak') or name.endswith('.tmp') or name.startswith('.measure-') or name.startswith('.final-'):
                  print(path)
          PY

      - name: Remove audit workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-final-cleanup-v2.yml
          git commit -m 'ci: remove final cleanup v2 helper'
          git push origin HEAD:Local
