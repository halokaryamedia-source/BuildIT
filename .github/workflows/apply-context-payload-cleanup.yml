name: Apply Context Payload Cleanup

on:
  push:
    paths:
      - ".github/workflows/apply-context-payload-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validate cleanup helper
        run: python3 -m py_compile mcp/scripts/apply-context-payload-cleanup.py
      - name: Apply bounded cleanup
        run: python3 mcp/scripts/apply-context-payload-cleanup.py
      - name: Compact prompt and preserve routing anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          prompt_path = Path('mcp/prompts/bedrock_entity_workflow.md')
          prompt = prompt_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''## Product boundary\n\n- Use Blockbench format ID `bedrock`, not `bedrock_block` or another format.\n- Cubes are the normal geometry primitive; Groups are bones/organization when needed.\n- The user brief and approved reference are the modelling authority.\n- Tool success, valid coordinates, connected Cubes, or a validator pass are not visual proof.\n- Preserve native Bedrock Entity capability. Do not replace unsupported native features with generic Mesh, UI automation, risky evaluation, or another format.\n''',
                  '''## Product boundary\n\nUse format `bedrock`. Cubes are the normal geometry primitive and Groups are bones/organization when needed. The approved brief/reference is the modelling authority; tool success, coordinates, connectivity, or validator success are not visual proof. Preserve native Bedrock capability and never fake unsupported native features with generic Mesh, UI automation, risky evaluation, or another format.\n''',
              ),
              (
                  '''Treat the reference as one 3D object. For material width/height/depth, primary placement, orientation/slope, or visible contact claims, keep the smallest useful evidence state:\n\n```text\nSUPPORTED | PROVISIONAL | CONFLICTING | UNAVAILABLE\n```\n\n- **SUPPORTED**: relevant reference view(s) directly constrain the claim.\n- **PROVISIONAL**: a temporary working value is needed but evidence is incomplete.\n- **CONFLICTING**: relevant views materially disagree.\n- **UNAVAILABLE**: required evidence cannot be observed.\n\nDo not transfer confidence between axes. A front-view match cannot certify depth. Conflicting primary-form evidence must not be averaged into invented geometry; if the brief/user intent cannot resolve a material conflict, use `BLOCKED`.\n\nBefore exact Cube transforms, keep a compact Primary Form Hypothesis: primary masses, relative size/placement, important orientation/contact, and only material uncertainty. Expand it only for genuinely ambiguous/complex references.\n''',
                  '''Treat the reference as one 3D object. Keep material 3D claims in the smallest useful state:\n\n```text\nSUPPORTED | PROVISIONAL | CONFLICTING | UNAVAILABLE\n```\n\nSUPPORTED is directly constrained; PROVISIONAL is a needed working value; CONFLICTING means relevant views disagree; UNAVAILABLE means the claim cannot be observed. Do not transfer confidence between axes. A front-view match cannot certify depth. Never average material conflicts into invented geometry; unresolved primary-form conflict becomes `BLOCKED`. Before exact transforms, keep a compact Primary Form Hypothesis covering primary masses, relative placement/orientation/contact, and material uncertainty only.\n''',
              ),
              (
                  '''## BLOCKED is a workflow outcome\n\n`FAIL / UNVERIFIED / PASS` describe visual evidence. `BLOCKED` means the task cannot validly continue with current evidence/capability without guessing or repeating failed work.\n\nUse `BLOCKED` for unresolved material cross-view conflict, required observation that remains unavailable after one useful controlled retry, repeated same-cause correction failure, unavailable required supported capability, or any situation where continuing would require presenting provisional geometry as verified.\n\nA blocker report states the blocker, concrete evidence/error, affected claim, bounded attempts already made, and exactly what new evidence/user decision/capability is needed. Do not keep changing coordinates merely to avoid reporting a blocker.\n''',
                  '''## BLOCKED is a workflow outcome\n\n`FAIL / UNVERIFIED / PASS` describe visual evidence; `BLOCKED` means valid continuation would require guessing or repeated failed work. Use it for unresolved material view conflict, required observation still unavailable after one useful retry, repeated same-cause correction failure, unavailable required capability, or any attempt to present provisional geometry as verified. Report the concrete blocker/evidence, affected claim, bounded attempts, and exact evidence/decision/capability needed; do not keep changing coordinates to avoid the blocker.\n''',
              ),
              (
                  '''## Locator / Null Object authored state\n\nUse `list_locator_elements` for identity discovery and `inspect_element` for focused authored state. `manage_locator` owns native Bedrock Locator parent/position/rotation/`ignore_inherited_scale`; `manage_null_object` owns the supported Null Object parent/position slice. Use `rename_element` / `remove_element` for rename/delete. Do not replace Locator/Null Object state with arbitrary Cubes or UI automation.\n\n## Protected Native Capability Gaps\n\nCurrent protected native Bedrock gaps include TextureMesh authoring/inspection, native visible bounding-box fields, animation controllers, animation sound/timeline effects, animated-texture authoring, and bone-binding expressions.\n\nWhen a requested protected capability lacks a direct MCP owner, preserve existing authored data, state the gap, and keep work bounded to supported operations. A broad resource such as `nodes://` is observability, not authored native support.\n\nNative Bedrock PBR and per-face `material_instance` are **not** gaps; use the dedicated tools when needed.\n''',
                  '''## Locator / Null Object authored state\n\nUse `list_locator_elements` for discovery and `inspect_element` for focused state. `manage_locator` owns supported native Locator fields; `manage_null_object` owns the supported Null Object parent/position slice. Rename/delete through `rename_element` / `remove_element`; never substitute arbitrary Cubes or UI automation.\n\n## Protected Native Capability Gaps\n\nProtected gaps include TextureMesh authoring/inspection, native visible bounding-box fields, animation controllers, animation sound/timeline effects, animated-texture authoring, and bone-binding expressions. If no direct owner exists, preserve authored data, state the gap, and stay within supported operations; `nodes://` is observability, not authored native support. Native Bedrock PBR and per-face `material_instance` are **not** gaps.\n''',
              ),
              (
                  '''project/orient → coarse Cube/Group build → relevant views\n→ exact inspect/correct only on diagnosed mismatch\n→ downstream specialist only after prerequisite gate\n→ export only when requested\n''',
                  '''get_project_info → place_cube/Group build → capture_model_views\n→ inspect_element + modify_cube only on diagnosed mismatch\n→ downstream specialist only after prerequisite gate\n→ export_model only when requested\n''',
              ),
          ]
          for old, new in replacements:
              if prompt.count(old) != 1:
                  raise SystemExit(f'Unexpected compact prompt shape: {old[:80]!r}')
              prompt = prompt.replace(old, new, 1)
          prompt_path.write_text(prompt, encoding='utf-8')

          element_path = Path('mcp/server/tools/element.ts')
          element = element_path.read_text(encoding='utf-8')
          element_replacements = [
              (
                  '"Duplicates one explicit Cube/Group by UUID or unique exact name, with optional offset/name. Use only for already-established repetition/symmetry, not to decide primary form."',
                  '"Duplicates one explicit Cube/Group by UUID or unique exact name, with optional offset/name. Use only for established repetition/symmetry; duplication is not a shortcut for deciding primary geometry."',
              ),
              (
                  '"Selection helper for workflows that require editor selection, mainly texture/Paint. Geometry inspection/mutation should use explicit identities. Optional parent scope must resolve uniquely."',
                  '"Selection helper for workflows that require editor selection, mainly texture/Paint. It is not a normal geometry-targeting path; use explicit identities for geometry. Optional parent scope must resolve uniquely."',
              ),
              (
                  '"Returns current Cube/Group selection plus active Texture. Use only when editor selection state matters; geometry decisions should prefer explicit UUIDs and focused inspection."',
                  '"Returns current Cube/Group selection plus active Texture. Normal geometry inspection and mutation should prefer explicit UUIDs and focused inspection; use this only when editor selection state matters."',
              ),
          ]
          for old, new in element_replacements:
              if element.count(old) != 1:
                  raise SystemExit(f'Unexpected element routing shape: {old[:80]!r}')
              element = element.replace(old, new, 1)
          element_path.write_text(element, encoding='utf-8')
          PY
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Measure post-cleanup payload
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          api = json.loads(Path('mcp/docs/api.json').read_text(encoding='utf-8'))
          tools = api.get('tools', [])
          tool_chars = sum(len(json.dumps(tool, separators=(',', ':'))) for tool in tools)
          prompt_chars = len(Path('mcp/prompts/bedrock_entity_workflow.md').read_text(encoding='utf-8'))
          print('POST_TOOLS', len(tools))
          print('POST_TOOL_JSON_CHARS', tool_chars)
          print('POST_PROMPT_CHARS', prompt_chars)
          print('POST_PROMPTS', len(api.get('prompts', [])))
          print('POST_RESOURCES', len(api.get('resources', [])))
          if len(tools) != 72:
              raise SystemExit(f'Unexpected tool-count change: {len(tools)}')
          if len(api.get('prompts', [])) != 3 or len(api.get('resources', [])) != 8:
              raise SystemExit('Unexpected prompt/resource-count change')
          if tool_chars >= 118000:
              raise SystemExit(f'Tool metadata did not shrink enough: {tool_chars}')
          if prompt_chars >= 10000:
              raise SystemExit(f'Canonical prompt is still too large: {prompt_chars}')
          PY
      - name: Diff hygiene
        run: git diff --check
      - name: Commit cleanup
        run: |
          git rm mcp/scripts/apply-context-payload-cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No context/payload changes"; exit 1; }
          git commit -m "refactor: reduce BlockIT MCP context payload"
          git push origin HEAD:Local
