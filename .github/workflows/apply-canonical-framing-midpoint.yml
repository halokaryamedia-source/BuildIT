name: Apply Overflow Safe Framing Midpoint

on:
  push:
    paths:
      - ".github/workflows/apply-canonical-framing-midpoint.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fix explicit framing midpoint arithmetic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          camera_path = Path("mcp/server/tools/camera.ts")
          camera = camera_path.read_text(encoding="utf-8")
          old = "\n".join([
              "  const center: Vec3 = [",
              "    (min[0] + max[0]) / 2,",
              "    (min[1] + max[1]) / 2,",
              "    (min[2] + max[2]) / 2,",
              "  ];",
          ])
          new = "\n".join([
              "  const center: Vec3 = [",
              "    min[0] + size[0] / 2,",
              "    min[1] + size[1] / 2,",
              "    min[2] + size[2] / 2,",
              "  ];",
          ])
          if camera.count(old) != 1:
              raise SystemExit("Unexpected explicit framing center shape")
          camera_path.write_text(camera.replace(old, new, 1), encoding="utf-8")

          test_path = Path("mcp/tests/camera-framing-contract.test.ts")
          test = test_path.read_text(encoding="utf-8")
          marker = "describe(\"capture_model_views explicit framing contract\", () => {\n"
          addition = "\n".join([
              "  test(\"uses overflow-safe midpoint math for accepted explicit envelopes\", async () => {",
              "    const cameraSource = await Bun.file(new URL(\"../server/tools/camera.ts\", import.meta.url)).text();",
              "    expect(cameraSource).toContain(\"min[0] + size[0] / 2\");",
              "    expect(cameraSource).toContain(\"min[1] + size[1] / 2\");",
              "    expect(cameraSource).toContain(\"min[2] + size[2] / 2\");",
              "    expect(cameraSource).not.toContain(\"(min[0] + max[0]) / 2\");",
              "  });",
              "",
          ])
          if test.count(marker) != 1:
              raise SystemExit("Unexpected camera framing test insertion point")
          test_path.write_text(test.replace(marker, marker + addition, 1), encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          old_note = "A bounded GitHub-only **canonical framing input hardening** now rejects non-finite explicit target-envelope coordinates and finite endpoints whose subtraction would produce a non-finite span before camera math runs. This closes an MCP boundary defect without changing canonical camera behavior, framing policy, or the local visual-proof requirement."
          new_note = "A bounded GitHub-only **canonical framing input hardening** now rejects non-finite explicit target-envelope coordinates and finite endpoints whose subtraction would produce a non-finite span before camera math runs, then derives the target center from that validated span instead of summing endpoints so accepted finite envelopes cannot overflow during midpoint calculation. This closes the MCP framing boundary defect without changing canonical camera behavior, framing policy, or the local visual-proof requirement."
          if next_text.count(old_note) != 1:
              raise SystemExit("Unexpected canonical framing continuity note")
          next_path.write_text(next_text.replace(old_note, new_note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit midpoint fix and remove temporary workflow
        run: |
          git rm .github/workflows/apply-canonical-framing-midpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: avoid explicit framing midpoint overflow"
          git push origin HEAD:Local
