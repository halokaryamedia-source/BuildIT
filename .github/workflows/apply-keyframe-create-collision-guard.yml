name: Apply Keyframe Create Collision Guard

on:
  push:
    paths:
      - ".github/workflows/apply-keyframe-create-collision-guard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Preflight create keyframe collisions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          animation_path = Path("mcp/server/tools/animation.ts")
          text = animation_path.read_text(encoding="utf-8")

          register_marker = "export function registerAnimationTools() {\n"
          helper = "\n".join([
              "export function requireAvailableCreateKeyframeTimes(",
              "  existingTimes: readonly number[],",
              "  plannedTimes: readonly number[],",
              "  tolerance = 0.0001",
              "): void {",
              "  requireValidPlannedKeyframeTimes(",
              "    plannedTimes,",
              "    \"Create keyframes\",",
              "    true",
              "  );",
              "  if (!existingTimes.every(Number.isFinite)) {",
              "    throw new Error(\"Existing keyframe times must be finite before create preflight.\");",
              "  }",
              "  if (!Number.isFinite(tolerance) || tolerance <= 0) {",
              "    throw new Error(\"Create keyframe collision tolerance must be finite and greater than 0.\");",
              "  }",
              "",
              "  for (let index = 0; index < plannedTimes.length; index++) {",
              "    const plannedTime = plannedTimes[index];",
              "    for (let otherIndex = index + 1; otherIndex < plannedTimes.length; otherIndex++) {",
              "      if (Math.abs(plannedTimes[otherIndex] - plannedTime) < tolerance) {",
              "        throw new Error(",
              "          `Create keyframe requests ${index} and ${otherIndex} resolve to colliding effective times near ${plannedTime}.`",
              "        );",
              "      }",
              "    }",
              "    if (",
              "      existingTimes.some(",
              "        (existingTime) => Math.abs(existingTime - plannedTime) < tolerance",
              "      )",
              "    ) {",
              "      throw new Error(",
              "        `Create keyframe request ${index} resolves to ${plannedTime}, which collides with an existing keyframe. Use edit for an existing keyframe or choose another time.`",
              "      );",
              "    }",
              "  }",
              "}",
              "",
          ])
          if text.count(register_marker) != 1:
              raise SystemExit("Unexpected animation registration marker")
          text = text.replace(register_marker, helper + register_marker, 1)

          old_target_line = "      const targetKeyframes = action === \"create\" ? [] : resolveRequestedTargets();\n\n      Undo.initEdit({"
          new_target_line = "\n".join([
              "      const targetKeyframes = action === \"create\" ? [] : resolveRequestedTargets();",
              "      const plannedCreateTimes =",
              "        action === \"create\"",
              "          ? keyframes.map((keyframe) => Timeline.snapTime(keyframe.time, animation))",
              "          : [];",
              "      if (action === \"create\") {",
              "        const existingChannelTimes =",
              "          existingAnimator?.[channel]?.map((keyframe: _Keyframe) => keyframe.time) ?? [];",
              "        requireAvailableCreateKeyframeTimes(",
              "          existingChannelTimes,",
              "          plannedCreateTimes",
              "        );",
              "      }",
              "",
              "      Undo.initEdit({",
          ])
          if text.count(old_target_line) != 1:
              raise SystemExit("Unexpected manage keyframe target/pre-Undo shape")
          text = text.replace(old_target_line, new_target_line, 1)

          old_create_loop = "\n".join([
              "          case \"create\":",
              "            keyframes.forEach((kf) => {",
              "              const keyframe = animator!.addKeyframe({",
              "                channel,",
              "                data_points: [{}],",
              "                time: Timeline.snapTime(kf.time, animation),",
              "                interpolation: kf.interpolation ?? \"linear\",",
          ])
          new_create_loop = "\n".join([
              "          case \"create\":",
              "            keyframes.forEach((kf, index) => {",
              "              const keyframe = animator!.addKeyframe({",
              "                channel,",
              "                data_points: [{}],",
              "                time: plannedCreateTimes[index],",
              "                interpolation: kf.interpolation ?? \"linear\",",
          ])
          if text.count(old_create_loop) != 1:
              raise SystemExit("Unexpected create keyframe loop shape")
          text = text.replace(old_create_loop, new_create_loop, 1)

          old_replace = "              keyframe.replaceOthers([]);\n"
          if text.count(old_replace) != 1:
              raise SystemExit("Unexpected replaceOthers create behavior")
          text = text.replace(old_replace, "", 1)

          old_description = "      \"Creates, deletes, edits, or selects explicit keyframe targets for one bone/channel. Edit omission preserves existing interpolation; non-create actions require each requested time to resolve uniquely before Undo/selection.\"," 
          new_description = "      \"Creates, deletes, edits, or selects explicit keyframe targets for one bone/channel. Create preflights snapped times and rejects collisions instead of replacing existing keyframes; edit omission preserves existing interpolation; non-create actions require each requested time to resolve uniquely before Undo/selection.\"," 
          if text.count(old_description) != 1:
              raise SystemExit("Unexpected manage_keyframes description")
          animation_path.write_text(text.replace(old_description, new_description, 1), encoding="utf-8")

          test_path = Path("mcp/tests/animation-mutation-contract.test.ts")
          test = test_path.read_text(encoding="utf-8")
          old_import = "\n".join([
              "  manageKeyframesParameters,",
              "  requireValidPlannedKeyframeTimes,",
          ])
          new_import = "\n".join([
              "  manageKeyframesParameters,",
              "  requireAvailableCreateKeyframeTimes,",
              "  requireValidPlannedKeyframeTimes,",
          ])
          if test.count(old_import) != 1:
              raise SystemExit("Unexpected animation mutation import area")
          test = test.replace(old_import, new_import, 1)

          addition = "\n".join([
              "",
              "  test(\"create keyframes reject snapped-time replacement collisions before Undo\", async () => {",
              "    expect(() =>",
              "      requireAvailableCreateKeyframeTimes([0, 1], [2, 3])",
              "    ).not.toThrow();",
              "    expect(() =>",
              "      requireAvailableCreateKeyframeTimes([0, 1], [1])",
              "    ).toThrow(\"collides with an existing keyframe\");",
              "    expect(() =>",
              "      requireAvailableCreateKeyframeTimes([], [1, 1.00005])",
              "    ).toThrow(\"colliding effective times\");",
              "    expect(() =>",
              "      requireAvailableCreateKeyframeTimes([], [-0.1])",
              "    ).toThrow(\"0..10000\");",
              "",
              "    const source = await Bun.file(\"server/tools/animation.ts\").text();",
              "    expect(source).toContain(\"time: plannedCreateTimes[index]\");",
              "    expect(source).not.toContain(\"keyframe.replaceOthers([])\");",
              "  });",
          ])
          close_marker = "});\n"
          position = test.rfind(close_marker)
          if position == -1:
              raise SystemExit("Animation mutation test closing marker not found")
          test = test[:position] + addition + "\n" + test[position:]
          test_path.write_text(test, encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          old_note = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload, rejects empty `manage_keyframes` requests, preserves existing interpolation on partial keyframe edits, requires every edit/delete/select time to resolve to exactly one existing keyframe before mutation/selection, requires an explicit `loop_mode` for the timeline loop mutation, rejects incomplete/effective no-op batch offset/scale requests, preflights batch offset/scale times against the native 0..10000 authored-time range and prevents selected-keyframe collapse during scale, prevents empty animation copy/paste clipboard operations, requires action-specific copy/paste source/target state, removes the implicit X-axis fallback from `mirror_paste`, and keeps the structured create result while compacting its duplicate text serialization. AnimationCodec behavior and playback semantics are unchanged."
          new_note = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload, rejects empty `manage_keyframes` requests, preflights snapped create times so create cannot silently replace existing/colliding keyframes, preserves existing interpolation on partial keyframe edits, requires every edit/delete/select time to resolve to exactly one existing keyframe before mutation/selection, requires an explicit `loop_mode` for the timeline loop mutation, rejects incomplete/effective no-op batch offset/scale requests, preflights batch offset/scale times against the native 0..10000 authored-time range and prevents selected-keyframe collapse during scale, prevents empty animation copy/paste clipboard operations, requires action-specific copy/paste source/target state, removes the implicit X-axis fallback from `mirror_paste`, and keeps the structured create result while compacting its duplicate text serialization. AnimationCodec behavior and playback semantics are unchanged."
          if next_text.count(old_note) != 1:
              raise SystemExit("Unexpected animation continuity note")
          next_path.write_text(next_text.replace(old_note, new_note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit create collision guard and remove temporary workflow
        run: |
          git rm .github/workflows/apply-keyframe-create-collision-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: reject keyframe create collisions before mutation"
          git push origin HEAD:Local
