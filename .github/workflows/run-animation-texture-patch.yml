name: Run Retained Animation Texture Patch

on:
  push:
    paths:
      - ".github/workflows/run-animation-texture-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
      - name: Apply patch script
        run: python .github/scripts/patch_animation_texture.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/server/tools/animation.ts mcp/server/tools/texture.ts
          git diff --cached --check
          git commit -m "fix: align retained Bedrock Animation and Texture types"
          git push origin Local
