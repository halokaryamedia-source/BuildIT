name: Narrow Face Material Instance Read

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/narrow-face-material-instance-read.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Keep face material-instance read semantically focused
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mcp/server/tools/material-instances.ts')
          text = path.read_text(encoding='utf-8')
          old_desc = "      \"Gets material-instance metadata from Bedrock cube faces. Blockbench's Bedrock geometry codec preserves this field on per-face UV data.\","
          new_desc = '      "Gets native Bedrock material-instance names from explicit Cube faces. Texture selection is intentionally not reported here because Bedrock Entity is single_texture; use texture tools for active/default texture state.",'
          if text.count(old_desc) != 1:
              raise SystemExit('Unexpected get_face_material_instances description')
          text = text.replace(old_desc, new_desc, 1)

          old_result = '\n'.join([
              '        const result: Record<string, { material_name: string; texture: string | null }> = {};',
              '',
              '        for (const faceDir of facesToCheck) {',
              '          const face = cube.faces[faceDir];',
              '          if (face) {',
              '            const faceTexture = face.getTexture();',
              '            result[faceDir] = {',
              '              material_name: face.material_name || "",',
              '              texture: face.texture',
              '                ? (faceTexture ? faceTexture.name : face.texture.toString())',
              '                : null,',
              '            };',
              '          }',
              '        }',
              '',
              '        return JSON.stringify({',
              '          cube: {',
              '            name: cube.name,',
              '            uuid: cube.uuid,',
              '          },',
              '          faces: result,',
              '        }, null, 2);',
          ])
          new_result = '\n'.join([
              '        const result: Record<string, { material_name: string }> = {};',
              '',
              '        for (const faceDir of facesToCheck) {',
              '          const face = cube.faces[faceDir];',
              '          if (face) {',
              '            result[faceDir] = {',
              '              material_name: face.material_name || "",',
              '            };',
              '          }',
              '        }',
              '',
              '        return JSON.stringify({',
              '          cube: {',
              '            name: cube.name,',
              '            uuid: cube.uuid,',
              '          },',
              '          faces: result,',
              '        });',
          ])
          if text.count(old_result) != 1:
              raise SystemExit('Unexpected face material read block')
          path.write_text(text.replace(old_result, new_result, 1), encoding='utf-8')

          test_path = Path('mcp/tests/context-payload-cleanup.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = '    const sourceText = await source("server/tools/material-instances.ts");'
          addition = '\n'.join([
              '    const readStart = sourceText.indexOf("materialInstanceToolDocs[0].name");',
              '    const setStart = sourceText.indexOf("materialInstanceToolDocs[1].name", readStart);',
              '    const readBlock = sourceText.slice(readStart, setStart);',
              '    expect(readBlock).toContain("material_name: face.material_name");',
              '    expect(readBlock).not.toContain("face.getTexture()");',
              '    expect(readBlock).not.toContain("texture:");',
              '    expect(readBlock).not.toContain("null, 2");',
              '',
              marker,
          ])
          if test.count(marker) != 1:
              raise SystemExit('Unexpected material-instance source marker')
          test_path.write_text(test.replace(marker, addition, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = 'Material-instance payload/mutation contracts are also bounded: empty face arrays are rejected before mutation, and `list_material_instances` now returns names + usage counts by default. Explicit `include_usages=true` returns at most 100 locations per instance by default (raiseable to 1000) with `usages_truncated` indicating omitted locations. No pagination/state framework was added.'
          extra = '\n\n`get_face_material_instances` is now a focused native read: it returns only per-face `material_name` plus Cube identity and uses compact JSON. The previous mixed `texture` field was removed because it combined raw `face.texture` with effective `Face.getTexture()` semantics that do not own texture selection in Bedrock `single_texture`; texture state remains owned by the dedicated texture tools.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected material-instance continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/narrow-face-material-instance-read.yml
          git add mcp/server/tools/material-instances.ts mcp/tests/context-payload-cleanup.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'refactor: narrow face material-instance reads'
          git push origin HEAD:Local