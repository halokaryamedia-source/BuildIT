name: Fix Codex Optimization Indentation

on:
  push:
    paths:
      - ".github/workflows/fix-codex-optimization-indentation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Indent only the touched blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def indent_after_first(path: str, start_marker: str, end_marker: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start == -1 or end == -1 or end <= start:
                  raise SystemExit(f"Could not isolate formatting block in {path}")
              block = text[start:end]
              lines = block.splitlines(keepends=True)
              if len(lines) < 2:
                  raise SystemExit(f"Formatting block too small in {path}")
              normalized = lines[0] + "".join(
                  ("  " + line if line.strip() else line)
                  for line in lines[1:]
              )
              file.write_text(text[:start] + normalized + text[end:], encoding="utf-8")

          indent_after_first(
              "mcp/server/tools/element.ts",
              "  createTool(elementToolDocs[0].name, {\n",
              "  createTool(elementToolDocs[1].name, {\n",
          )
          indent_after_first(
              "mcp/tests/bedrock-locator-coverage.test.ts",
              '  test("generic remove_element snapshots direct or recursive deletion state before Undo", async () => {\n',
              '  test("inspect_element exposes authored Locator and Null Object state", async () => {\n',
          )
          indent_after_first(
              "mcp/tests/asset-authoring-usage-slimming.test.ts",
              '  test("asset authoring bypasses repository-development boot and development-brief", async () => {\n',
              '  test("normal authoring skill stack remains compact while hard gates stay present", async () => {\n',
          )
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit indentation correction and remove workflow
        run: |
          git rm .github/workflows/fix-codex-optimization-indentation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "style: fix Codex optimization indentation"
          git push origin HEAD:Local
