name: Record P1.2 Family Gates Completion

on:
  push:
    paths:
      - ".github/workflows/advance-p1-family-gates-doc.yml"

permissions:
  contents: write

jobs:
  update-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - name: Advance next-action snapshot
        env:
          P12_B64: ""
          P13_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("docs/knowledge/next-action.md")
          text = path.read_text()

          old_intro = "P0.1–P0.5 and P1.1 are complete for their source/repository boundaries. The active source boundary is now **P1.2 — family gates**."
          new_intro = "P0.1–P0.5, P1.1, and P1.2 are complete for their source/repository boundaries. The active source boundary is now **P1.3 — core-only resolver/mutation/result consolidation**."
          if text.count(old_intro) != 1:
              raise SystemExit("Expected P1.2 active intro exactly once")
          text = text.replace(old_intro, new_intro, 1)

          old_status = "`MCP_P1_DEFAULT_BEDROCK_PROFILE_COMPLETE_FAMILY_GATES_NEXT`"
          new_status = "`MCP_P1_FAMILY_GATES_COMPLETE_CORE_OWNERSHIP_NEXT`"
          if text.count(old_status) != 1:
              raise SystemExit("Expected P1.2 status exactly once")
          text = text.replace(old_status, new_status, 1)

          p12_section = base64.b64decode(os.environ["P12_B64"]).decode()
          marker = "# Current Work Order\n"
          if text.count(marker) != 1:
              raise SystemExit("Expected Current Work Order marker exactly once")
          text = text.replace(marker, p12_section + marker, 1)

          old_order = "P1.1  default Bedrock Entity registration profile COMPLETE\nP1.2  family gates                               ← ACTIVE NEXT SLICE\nP1.3  core-only resolver/mutation/result consolidation\nP1.4  transport/session future decision\nP1.5  local end-to-end core acceptance"
          new_order = "P1.1  default Bedrock Entity registration profile COMPLETE\nP1.2  family gates                               COMPLETE\nP1.3  core-only resolver/mutation/result consolidation ← ACTIVE NEXT SLICE\nP1.4  transport/session future decision\nP1.5  local end-to-end core acceptance"
          if text.count(old_order) != 1:
              raise SystemExit("Expected P1 work order block exactly once")
          text = text.replace(old_order, new_order, 1)

          next_marker = "# Next Step — P1.2 Family Gates Only"
          if text.count(next_marker) != 1:
              raise SystemExit("Expected P1.2 next-step marker exactly once")
          prefix = text.split(next_marker, 1)[0]
          p13_next = base64.b64decode(os.environ["P13_B64"]).decode()
          path.write_text(prefix + p13_next)
          PY

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/knowledge/next-action.md
          git diff --cached --check
          git commit -m "docs: advance MCP stabilization to core ownership"
          git push origin Local
