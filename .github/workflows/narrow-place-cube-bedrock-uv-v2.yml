name: Narrow Place Cube Bedrock UV V2

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/narrow-place-cube-bedrock-uv-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reuse validated place_cube transform and update ownership regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/narrow-place-cube-bedrock-uv.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n", start)
          embedded = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          exec(compile(script, 'reused-place-cube-transform.py', 'exec'))

          test_path = Path('mcp/tests/p1-core-ownership.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old = '\n'.join([
              '    expect(cubes).toContain("resolveCoreCube, resolveCoreGroup, resolveCoreTexture");',
              '    expect(cubes).toContain("return resolveCoreGroup(");',
              '    expect(cubes).toContain("return resolveCoreTexture(");',
          ])
          new = '\n'.join([
              '    expect(cubes).toContain("resolveCoreCube, resolveCoreGroup");',
              '    expect(cubes).toContain("return resolveCoreGroup(");',
              '    expect(cubes).not.toContain("resolveCoreTexture");',
          ])
          if test.count(old) != 1:
              raise SystemExit('Unexpected Cube core ownership regression')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Measure current callable tools-list
        working-directory: mcp
        run: |
          cat > .measure-place-cube.ts <<'TS'
          import { McpServer } from "@modelcontextprotocol/sdk/server/mcp.js";
          import { WebStandardStreamableHTTPServerTransport } from "@modelcontextprotocol/sdk/server/webStandardStreamableHttp.js";
          import { registerToolsOnServer } from "./lib/factories";
          import "./server/tools";
          const server = new McpServer({ name: "blockit-place-cube-audit", version: "1.0.0" });
          registerToolsOnServer(server);
          const transport = new WebStandardStreamableHTTPServerTransport({ sessionIdGenerator: undefined, enableJsonResponse: true });
          await server.connect(transport);
          try {
            const response = await transport.handleRequest(new Request("http://127.0.0.1:3000/bb-mcp", {
              method: "POST",
              headers: { accept: "application/json, text/event-stream", "content-type": "application/json", "mcp-protocol-version": "2025-06-18" },
              body: JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} }),
            }));
            const raw = await response.text();
            if (response.status !== 200) throw new Error(raw);
            const parsed = JSON.parse(raw) as { result?: { tools?: Array<{ name?: string; description?: string; inputSchema?: unknown }> } };
            const tools = parsed.result?.tools ?? [];
            const place = tools.find((tool) => tool.name === "place_cube");
            const placeSchema = JSON.stringify(place?.inputSchema ?? {});
            const metrics = {
              enabled_tools: tools.length,
              response_characters: raw.length,
              input_schema_characters: tools.reduce((sum, tool) => sum + JSON.stringify(tool.inputSchema ?? {}).length, 0),
              description_characters: tools.reduce((sum, tool) => sum + (tool.description ?? "").length, 0),
              place_cube_schema_characters: placeSchema.length,
              place_cube_has_texture: placeSchema.includes('"texture"'),
            };
            console.log(JSON.stringify(metrics));
            await Bun.write(".place-cube-wire.json", JSON.stringify(metrics));
            if (metrics.enabled_tools !== 63 || metrics.place_cube_has_texture) throw new Error(`Unexpected place_cube wire contract: ${JSON.stringify(metrics)}`);
          } finally {
            await server.close();
          }
          TS
          bun .measure-place-cube.ts
          rm .measure-place-cube.ts

      - name: Record current wire measurement
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          metrics = json.loads(Path('mcp/.place-cube-wire.json').read_text(encoding='utf-8'))
          Path('mcp/.place-cube-wire.json').unlink()

          next_path = Path('docs/knowledge/next-action.md')
          text = next_path.read_text(encoding='utf-8')
          prefix = 'The actual stateless MCP `tools/list` wire surface has been re-measured after Bedrock semantic containment: **63 enabled tools / '
          start = text.find(prefix)
          if start < 0:
              raise SystemExit('Current 63-tool wire paragraph not found')
          end = text.find('\n\n', start)
          new = f"The actual stateless MCP `tools/list` wire surface is currently **{metrics['enabled_tools']} enabled tools / {metrics['response_characters']:,} response characters**, including **{metrics['input_schema_characters']:,} characters of input schemas** and **{metrics['description_characters']:,} characters of tool descriptions**. `place_cube` itself is now {metrics['place_cube_schema_characters']:,} schema characters and no longer exposes a per-Cube `texture` field. Historical 65/64/63-tool byte totals remain source-state evidence, not a controlled performance benchmark. The next large usage lever still requires real Codex native lazy/deferred MCP tool loading proof before any BlockIT router/profile architecture."
          text = text[:start] + new + text[end:]
          next_path.write_text(text, encoding='utf-8')

          review_path = Path('docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md')
          review = review_path.read_text(encoding='utf-8')
          anchor = 'Historical byte totals are retained as evidence, not compared as a controlled performance benchmark across different source states.'
          extra = f"\n\nAfter narrowing `place_cube` to native Bedrock UV ownership, the callable surface remains **{metrics['enabled_tools']} tools**. Current wire size is **{metrics['response_characters']:,} response characters / {metrics['input_schema_characters']:,} input-schema characters / {metrics['description_characters']:,} description characters**, with `place_cube` at **{metrics['place_cube_schema_characters']:,} schema characters** and no per-Cube `texture` selector. This is semantic cleanup, not a new profile or tool-count optimization target."
          if review.count(anchor) != 1:
              raise SystemExit('Unexpected deferred-loading review measurement anchor')
          review_path.write_text(review.replace(anchor, anchor + extra, 1), encoding='utf-8')
          PY

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/narrow-place-cube-bedrock-uv.yml .github/workflows/narrow-place-cube-bedrock-uv-v2.yml
          git add mcp/server/tools/cubes.ts mcp/tests/model-effectiveness-correction-accuracy.test.ts mcp/tests/p1-core-ownership.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/reviews/mcp-prelocal-generic-semantics-audit-2026-08-10.md docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md docs/knowledge/next-action.md
          git commit -m 'refactor: narrow place_cube Bedrock UV semantics'
          git push origin HEAD:Local