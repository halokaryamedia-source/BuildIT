name: Reject Ambiguous PBR Sources

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/reject-ambiguous-pbr-sources.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reject PBR inputs whose native compile branch ignores part of the request
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mcp/server/tools/texture.ts')
          text = path.read_text(encoding='utf-8')

          create_start = text.index('export const createPbrMaterialParameters = z.object({')
          create_end = text.index('\n\nexport const configureMaterialParameters', create_start)
          create_block = text[create_start:create_end].rstrip()
          if not create_block.endswith('});'):
              raise SystemExit('Unexpected createPbrMaterialParameters tail')
          create_refine = '\n'.join([
              '}).superRefine((params, ctx) => {',
              '  if (params.color_texture !== undefined && params.color_value !== undefined) {',
              '    ctx.addIssue({ code: z.ZodIssueCode.custom, path: ["color_value"], message: "Choose either color_texture or color_value; native Bedrock export uses the texture when both exist." });',
              '  }',
              '  if (params.mer_texture !== undefined && params.mer_value !== undefined) {',
              '    ctx.addIssue({ code: z.ZodIssueCode.custom, path: ["mer_value"], message: "Choose either mer_texture or mer_value; native Bedrock export uses the MER texture when both exist." });',
              '  }',
              '  if (params.normal_texture !== undefined && params.height_texture !== undefined) {',
              '    ctx.addIssue({ code: z.ZodIssueCode.custom, path: ["height_texture"], message: "Choose normal_texture or height_texture, not both; native Bedrock export prefers normal when both exist." });',
              '  }',
              '});',
          ])
          create_block = create_block[:-3] + create_refine
          text = text[:create_start] + create_block + text[create_end:]

          configure_start = text.index('export const configureMaterialParameters = z.object({')
          configure_end = text.index('\n\nexport const listMaterialsParameters', configure_start)
          configure_block = text[configure_start:configure_end].rstrip()
          if not configure_block.endswith(');'):
              raise SystemExit('Unexpected configureMaterialParameters tail')
          configure_refine = '\n'.join([
              '.superRefine((params, ctx) => {',
              '  if (params.color_texture !== undefined && params.color_texture !== "none" && params.color_value !== undefined) {',
              '    ctx.addIssue({ code: z.ZodIssueCode.custom, path: ["color_value"], message: "Do not send color_value with an explicit color texture. Use color_texture=none when switching to uniform color." });',
              '  }',
              '  if (params.mer_texture !== undefined && params.mer_texture !== "none" && params.mer_value !== undefined) {',
              '    ctx.addIssue({ code: z.ZodIssueCode.custom, path: ["mer_value"], message: "Do not send mer_value with an explicit MER texture. Use mer_texture=none when switching to uniform MER values." });',
              '  }',
              '  const hasNormalTexture = params.normal_texture !== undefined && params.normal_texture !== "none";',
              '  const hasHeightTexture = params.height_texture !== undefined && params.height_texture !== "none";',
              '  if (hasNormalTexture && hasHeightTexture) {',
              '    ctx.addIssue({ code: z.ZodIssueCode.custom, path: ["height_texture"], message: "Configure normal_texture or height_texture as the active depth source, not both in one call." });',
              '  }',
              '});',
          ])
          configure_block = configure_block[:-1] + configure_refine
          text = text[:configure_start] + configure_block + text[configure_end:]

          old_create_desc = '      "Creates a uniquely named PBR material TextureGroup. Exact group-name collisions, ambiguous channel textures, and cross-channel Texture identity conflicts fail before Undo.",'
          new_create_desc = '      "Creates a uniquely named PBR material TextureGroup. Color and MER each accept one effective source (texture or uniform), and depth accepts normal or height; contradictory sources fail before Undo.",'
          old_config_desc = '      "Configures one explicit PBR material and requires at least one authored field change. Omitted channels stay unchanged; `none` removes/uses uniform values where supported. Material/Texture references must resolve uniquely before mutation, and one Texture cannot be assigned to multiple PBR channels in the same call.",'
          new_config_desc = '      "Configures one explicit PBR material with at least one authored change. Explicit texture + uniform conflicts and simultaneous normal+height sources fail at the MCP boundary; `none` remains the explicit switch to uniform/remove behavior.",'
          for old, new in [(old_create_desc, new_create_desc), (old_config_desc, new_config_desc)]:
              if text.count(old) != 1:
                  raise SystemExit('Unexpected PBR tool description')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('mcp/tests/pbr-channel-contract.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old_import = '  configureMaterialParameters,\n'
          new_import = '  configureMaterialParameters,\n  createPbrMaterialParameters,\n'
          if '  createPbrMaterialParameters,\n' not in test:
              if test.count(old_import) != 1:
                  raise SystemExit('Unexpected PBR test import anchor')
              test = test.replace(old_import, new_import, 1)

          marker = '  test("accepts distinct Texture identities across channels", () => {'
          addition = '\n'.join([
              '  test("PBR source combinations match the effective native Bedrock compile branches", () => {',
              '    expect(createPbrMaterialParameters.safeParse({ name: "mat", color_texture: "color", color_value: [255, 255, 255, 255] }).success).toBe(false);',
              '    expect(createPbrMaterialParameters.safeParse({ name: "mat", mer_texture: "mer", mer_value: [1, 2, 3] }).success).toBe(false);',
              '    expect(createPbrMaterialParameters.safeParse({ name: "mat", normal_texture: "normal", height_texture: "height" }).success).toBe(false);',
              '    expect(createPbrMaterialParameters.safeParse({ name: "mat", color_value: [255, 255, 255, 255], height_texture: "height" }).success).toBe(true);',
              '',
              '    expect(configureMaterialParameters.safeParse({ material: "mat", color_texture: "color", color_value: [255, 255, 255, 255] }).success).toBe(false);',
              '    expect(configureMaterialParameters.safeParse({ material: "mat", color_texture: "none", color_value: [255, 255, 255, 255] }).success).toBe(true);',
              '    expect(configureMaterialParameters.safeParse({ material: "mat", mer_texture: "mer", mer_value: [1, 2, 3] }).success).toBe(false);',
              '    expect(configureMaterialParameters.safeParse({ material: "mat", mer_texture: "none", mer_value: [1, 2, 3] }).success).toBe(true);',
              '    expect(configureMaterialParameters.safeParse({ material: "mat", normal_texture: "normal", height_texture: "height" }).success).toBe(false);',
              '    expect(configureMaterialParameters.safeParse({ material: "mat", normal_texture: "normal", height_texture: "none" }).success).toBe(true);',
              '  });',
              '',
          ])
          if test.count(marker) != 1:
              raise SystemExit('Unexpected PBR source test insertion point')
          test_path.write_text(test.replace(marker, addition + marker, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = 'A bounded GitHub-only PBR contract hardening now rejects one resolved Texture identity being assigned to multiple PBR channels in the same create/configure call before Undo and rejects identity-only `configure_material` calls that contain no authored change. Blockbench stores one `pbr_channel` per Texture, so sequential multi-channel assignment would otherwise leave only the last authored channel while the request could imply several succeeded. Existing channel replacement policy is unchanged.'
          extra = '\n\nPBR source selection now also matches native Bedrock compile precedence: create/configure reject simultaneous effective texture+uniform sources for color/MER and reject simultaneous normal+height texture sources. Explicit `none` + uniform values remains valid when switching a configured material back to uniform data. Native compile/mutation behavior is unchanged; only contradictory MCP requests are removed.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected PBR continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reject-ambiguous-pbr-sources.yml
          git add mcp/server/tools/texture.ts mcp/tests/pbr-channel-contract.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'fix: reject ambiguous PBR source combinations'
          git push origin HEAD:Local