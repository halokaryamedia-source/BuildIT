name: Local Generator Bundle

on:
  push:
    branches:
      - Local
    paths:
      - "mcp/**"
      - ".agents/**"
      - "docs/**"
      - "workspace/**"
      - "Experimental/**"
      - ".github/workflows/local-generator-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Stage generator runtime
        run: |
          mkdir -p .generator-bin
          cp "$(command -v bun)" .generator-bin/bun
          chmod +x .generator-bin/bun

      - name: Upload disposable generator checkout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blockit-local-generator-bundle
          path: mcp
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
