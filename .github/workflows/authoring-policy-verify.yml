name: Authoring Policy Verify

on:
  push:
    branches:
      - Local
    paths:
      - "AGENTS.md"
      - "CONTEXT.md"
      - ".agents/skills/blockbench-reference-generator/**"
      - ".agents/skills/blockit-bedrock-entity-mcp/**"
      - ".agents/skills/blockbench-bedrock-modelling/**"
      - ".agents/skills/blockit-bedrock-texturing/**"
      - ".agents/skills/blockit-bedrock-animation/**"
      - "docs/foundation/**"
      - "docs/knowledge/flow.md"
      - "docs/knowledge/implementation-map.md"
      - "docs/knowledge/operations/local-acceptance-runbook.md"
      - "workspace/README.md"
      - "workspace/active/README.md"
      - "mcp/tests/static-footprint-budget.test.ts"
      - "mcp/tests/*authoring*.test.ts"
      - "mcp/tests/asset-tool-routing.test.ts"
      - "mcp/tests/reference-generator-buildability.test.ts"
      - "mcp/tests/model-effectiveness-*.test.ts"
      - "mcp/tests/texture-design-reasoning.test.ts"
      - "mcp/tests/texture-production-discipline.test.ts"
      - "mcp/tests/texture-visual-convergence.test.ts"
      - "mcp/tests/animation-professional-reasoning.test.ts"
      - "mcp/tests/codex-agent-legibility-contract.test.ts"
      - "mcp/tests/prelocal-prompt-skill-surface.test.ts"
      - "mcp/tests/prelocal-usage-optimization.test.ts"
      - ".github/workflows/authoring-policy-verify.yml"
  pull_request:
    branches:
      - Local
      - main
    paths:
      - "AGENTS.md"
      - "CONTEXT.md"
      - ".agents/skills/blockbench-reference-generator/**"
      - ".agents/skills/blockit-bedrock-entity-mcp/**"
      - ".agents/skills/blockbench-bedrock-modelling/**"
      - ".agents/skills/blockit-bedrock-texturing/**"
      - ".agents/skills/blockit-bedrock-animation/**"
      - "docs/foundation/**"
      - "docs/knowledge/flow.md"
      - "docs/knowledge/implementation-map.md"
      - "docs/knowledge/operations/local-acceptance-runbook.md"
      - "workspace/README.md"
      - "workspace/active/README.md"
      - "mcp/tests/static-footprint-budget.test.ts"
      - "mcp/tests/*authoring*.test.ts"
      - "mcp/tests/asset-tool-routing.test.ts"
      - "mcp/tests/reference-generator-buildability.test.ts"
      - "mcp/tests/model-effectiveness-*.test.ts"
      - "mcp/tests/texture-design-reasoning.test.ts"
      - "mcp/tests/texture-production-discipline.test.ts"
      - "mcp/tests/texture-visual-convergence.test.ts"
      - "mcp/tests/animation-professional-reasoning.test.ts"
      - "mcp/tests/codex-agent-legibility-contract.test.ts"
      - "mcp/tests/prelocal-prompt-skill-surface.test.ts"
      - "mcp/tests/prelocal-usage-optimization.test.ts"
      - ".github/workflows/authoring-policy-verify.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Static authoring contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install runtime dependencies from lockfile
        run: bun install --frozen-lockfile --production

      - name: Verify authoring policy and routing
        run: |
          bun test \
            tests/static-footprint-budget.test.ts \
            tests/documentation-handoff.test.ts \
            tests/active-routing-integrity.test.ts \
            tests/*authoring*.test.ts \
            tests/asset-tool-routing.test.ts \
            tests/reference-generator-buildability.test.ts \
            tests/model-effectiveness-*.test.ts \
            tests/texture-design-reasoning.test.ts \
            tests/texture-production-discipline.test.ts \
            tests/texture-visual-convergence.test.ts \
            tests/animation-professional-reasoning.test.ts \
            tests/codex-agent-legibility-contract.test.ts \
            tests/prelocal-prompt-skill-surface.test.ts \
            tests/prelocal-usage-optimization.test.ts
