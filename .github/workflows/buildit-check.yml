name: BuildIT Check

on:
  pull_request:
    branches:
      - V1
  push:
    branches:
      - develop
      - V1

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
