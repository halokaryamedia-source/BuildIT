name: BuildIT Check

on:
  pull_request:
    branches:
      - V1
  push:
    branches:
      - develop
      - V1

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck engine
        run: npm run check:engine

      - name: Typecheck desktop
        run: |
          set +e
          npm run check:desktop > desktop-check.log 2>&1
          status=$?
          cat desktop-check.log
          exit $status

      - name: Upload desktop typecheck log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-check-log
          path: desktop-check.log

      - name: Build engine
        run: npm run build:engine

      - name: Build desktop
        run: npm run build:desktop
