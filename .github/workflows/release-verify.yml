name: Release Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Full release contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Require Local pull request source
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" || {
            echo "Stable release promotion must come from this repository's Local branch." >&2
            exit 1
          }
          test "$HEAD_REF" = "Local" || {
            echo "Stable release promotion must come from Local." >&2
            exit 1
          }

      - name: Require Local manual release source
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_NAME" = "Local" || {
            echo "Manual Release Verify must run against Local." >&2
            exit 1
          }

      - name: Checkout release candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require current main ancestry
        if: github.event_name != 'push'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "Local must contain current main ancestry before release promotion." >&2
            exit 1
          }

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Verify release contract
        run: bun run verify:release
