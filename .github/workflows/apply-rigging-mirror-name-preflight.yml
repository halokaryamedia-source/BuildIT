name: Apply Mirrored Bone Name Preflight

on:
  push:
    paths:
      - ".github/workflows/apply-rigging-mirror-name-preflight.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Preflight mirrored bone name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          animation_path = Path("mcp/server/tools/animation.ts")
          text = animation_path.read_text(encoding="utf-8")

          helper_marker = "export function hasCaseInsensitiveRigNameCollision(\n"
          helper = "\n".join([
              "export function deriveMirroredRigName(name: string): string {",
              "  if (name.includes(\"left\")) return name.replace(\"left\", \"right\");",
              "  if (name.includes(\"right\")) return name.replace(\"right\", \"left\");",
              "  return `${name}_mirrored`;",
              "}",
              "",
          ])
          if text.count(helper_marker) != 1:
              raise SystemExit("Unexpected rig name helper insertion point")
          text = text.replace(helper_marker, helper + helper_marker, 1)

          old_vars = "\n".join([
              "      let childElements: OutlinerElement[] = [];",
              "      let ikTarget: Group | undefined;",
          ])
          new_vars = "\n".join([
              "      let childElements: OutlinerElement[] = [];",
              "      let ikTarget: Group | undefined;",
              "      let mirroredBoneName: string | undefined;",
          ])
          if text.count(old_vars) != 1:
              raise SystemExit("Unexpected bone rigging local vars")
          text = text.replace(old_vars, new_vars, 1)

          old_mirror_preflight = "\n".join([
              "        case \"mirror\":",
              "          targetBone = resolveRigGroup(bone_data.name);",
              "          if (!bone_data.mirror_axis) {",
              "            throw new Error(",
              "              \"mirror_axis is required for mirror. No implicit axis is assumed.\"",
              "            );",
              "          }",
              "          break;",
          ])
          new_mirror_preflight = "\n".join([
              "        case \"mirror\":",
              "          targetBone = resolveRigGroup(bone_data.name);",
              "          if (!bone_data.mirror_axis) {",
              "            throw new Error(",
              "              \"mirror_axis is required for mirror. No implicit axis is assumed.\"",
              "            );",
              "          }",
              "          mirroredBoneName = deriveMirroredRigName(targetBone.name);",
              "          if (",
              "            hasCaseInsensitiveRigNameCollision(",
              "              Group.all,",
              "              mirroredBoneName",
              "            )",
              "          ) {",
              "            throw new Error(",
              "              `Mirroring \"${targetBone.name}\" would create bone name \"${mirroredBoneName}\", which collides case-insensitively with an existing Group. Rename the conflicting bone or source before mirroring.`",
              "            );",
              "          }",
              "          break;",
          ])
          if text.count(old_mirror_preflight) != 1:
              raise SystemExit("Unexpected mirror preflight shape")
          text = text.replace(old_mirror_preflight, new_mirror_preflight, 1)

          old_mirror_name = "\n".join([
              "            mirroredBone.name = targetBone!.name.includes(\"left\")",
              "              ? targetBone!.name.replace(\"left\", \"right\")",
              "              : targetBone!.name.includes(\"right\")",
              "              ? targetBone!.name.replace(\"right\", \"left\")",
              "              : targetBone!.name + \"_mirrored\";",
          ])
          new_mirror_name = "            mirroredBone.name = mirroredBoneName!;"
          if text.count(old_mirror_name) != 1:
              raise SystemExit("Unexpected mirrored bone naming shape")
          text = text.replace(old_mirror_name, new_mirror_name, 1)

          old_description = "      \"Creates or edits Group bones with preflighted explicit targets. Create/rename preserve case-insensitive bone-name uniqueness required by Bedrock animation matching; `parent` rejects self/descendant hierarchy cycles before Undo; `set_pivot` requires origin and preserves visual contents; `mirror` requires an axis; `set_ik` requires an explicit IK field and preserves the existing enabled state when only the target is changed. Missing/ambiguous targets fail before mutation. The tool does not infer joints, pivots, rotation, or hierarchy from appearance.\"," 
          new_description = "      \"Creates or edits Group bones with preflighted explicit targets. Create/rename/mirror preserve case-insensitive bone-name uniqueness required by Bedrock animation matching; `parent` rejects self/descendant hierarchy cycles before Undo; `set_pivot` requires origin and preserves visual contents; `mirror` requires an axis and preflights its derived bone name; `set_ik` requires an explicit IK field and preserves the existing enabled state when only the target is changed. Missing/ambiguous targets fail before mutation. The tool does not infer joints, pivots, rotation, or hierarchy from appearance.\"," 
          if text.count(old_description) != 1:
              raise SystemExit("Unexpected rig tool description")
          animation_path.write_text(text.replace(old_description, new_description, 1), encoding="utf-8")

          test_path = Path("mcp/tests/animation-mutation-contract.test.ts")
          test = test_path.read_text(encoding="utf-8")
          old_import = "\n".join([
              "  countAnimationClipboardKeyframes,",
              "  hasCaseInsensitiveRigNameCollision,",
          ])
          new_import = "\n".join([
              "  countAnimationClipboardKeyframes,",
              "  deriveMirroredRigName,",
              "  hasCaseInsensitiveRigNameCollision,",
          ])
          if test.count(old_import) != 1:
              raise SystemExit("Unexpected animation mutation import area")
          test = test.replace(old_import, new_import, 1)

          addition = "\n".join([
              "",
              "  test(\"mirror derives its bone name before mutation so identity collisions can be rejected\", async () => {",
              "    expect(deriveMirroredRigName(\"left_arm\")).toBe(\"right_arm\");",
              "    expect(deriveMirroredRigName(\"right_leg\")).toBe(\"left_leg\");",
              "    expect(deriveMirroredRigName(\"head\")).toBe(\"head_mirrored\");",
              "",
              "    const source = await Bun.file(\"server/tools/animation.ts\").text();",
              "    expect(source).toContain(\"mirroredBoneName = deriveMirroredRigName(targetBone.name)\");",
              "    expect(source).toContain(\"mirroredBone.name = mirroredBoneName!\");",
              "    expect(source).not.toContain(\"mirroredBone.name = targetBone!.name.includes\");",
              "  });",
          ])
          close_marker = "});\n"
          position = test.rfind(close_marker)
          if position == -1:
              raise SystemExit("Animation mutation test closing marker not found")
          test = test[:position] + addition + "\n" + test[position:]
          test_path.write_text(test, encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          old_note = "A bounded GitHub-only rigging contract correction now rejects empty `set_ik` updates, prevents target-only IK edits from implicitly forcing `ik_enabled=false`, rejects parent operations whose self/descendant/existing parent chain would create or extend a hierarchy cycle before Undo, and keeps create/rename bone identities unique under the case-insensitive matching used by Bedrock animation import. Exact no-op renames are rejected while case-only self renames remain valid. Omitted `ik_enabled` preserves the existing authored state. IK target resolution and local runtime proof requirements are unchanged."
          new_note = "A bounded GitHub-only rigging contract correction now rejects empty `set_ik` updates, prevents target-only IK edits from implicitly forcing `ik_enabled=false`, rejects parent operations whose self/descendant/existing parent chain would create or extend a hierarchy cycle before Undo, and keeps create/rename/mirror bone identities unique under the case-insensitive matching used by Bedrock animation import. Mirror derives and validates its intended counterpart name before duplication; exact no-op renames are rejected while case-only self renames remain valid. Omitted `ik_enabled` preserves the existing authored state. IK target resolution and local runtime proof requirements are unchanged."
          if next_text.count(old_note) != 1:
              raise SystemExit("Unexpected rigging continuity note")
          next_path.write_text(next_text.replace(old_note, new_note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit mirror guard and remove temporary workflow
        run: |
          git rm .github/workflows/apply-rigging-mirror-name-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: preflight mirrored rig bone names"
          git push origin HEAD:Local
