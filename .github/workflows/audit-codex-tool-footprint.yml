name: Audit Codex MCP Tool Footprint

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/audit-codex-tool-footprint.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Measure default tool footprint
        working-directory: mcp
        run: |
          cat > .audit-tool-footprint.ts <<'TS'
          import { zodToJsonSchema } from "zod-to-json-schema";
          import "./server/tools.ts";
          import { getEnabledToolDefinitions } from "./lib/factories.ts";
          import { toolManifest } from "./build/docs-manifest.ts";

          const defs = getEnabledToolDefinitions() as Record<string, any>;
          const categoryByName = new Map<string, string>();
          for (const group of toolManifest) {
            for (const tool of group.tools) categoryByName.set(tool.name, group.category);
          }

          const compact = (value: unknown) => JSON.stringify(value);
          const rows = Object.entries(defs).map(([name, def]) => {
            const schema = zodToJsonSchema(def.parameterSchema, {
              $refStrategy: "none",
              errorMessages: true,
              markdownDescription: false,
            });
            const schemaChars = compact(schema).length;
            const descriptionChars = String(def.description ?? "").length;
            return {
              name,
              category: categoryByName.get(name) ?? "Uncategorized",
              schemaChars,
              descriptionChars,
              combinedChars: schemaChars + descriptionChars + name.length,
            };
          }).sort((a, b) => b.combinedChars - a.combinedChars);

          const total = rows.reduce((acc, row) => {
            acc.schema += row.schemaChars;
            acc.description += row.descriptionChars;
            acc.combined += row.combinedChars;
            return acc;
          }, { schema: 0, description: 0, combined: 0 });

          const categories = new Map<string, { tools: number; schema: number; description: number; combined: number }>();
          for (const row of rows) {
            const current = categories.get(row.category) ?? { tools: 0, schema: 0, description: 0, combined: 0 };
            current.tools += 1;
            current.schema += row.schemaChars;
            current.description += row.descriptionChars;
            current.combined += row.combinedChars;
            categories.set(row.category, current);
          }

          console.log("=== DEFAULT TOOL FOOTPRINT SUMMARY ===");
          console.log(JSON.stringify({ toolCount: rows.length, ...total }));
          console.log("\n=== CATEGORY AGGREGATES ===");
          for (const [category, value] of [...categories.entries()].sort((a, b) => b[1].combined - a[1].combined)) {
            console.log(JSON.stringify({ category, ...value }));
          }
          console.log("\n=== TOP 25 TOOLS ===");
          for (const row of rows.slice(0, 25)) console.log(JSON.stringify(row));

          const descFrequency = new Map<string, { count: number; chars: number; tools: Set<string> }>();
          function collectDescriptions(value: unknown, toolName: string): void {
            if (!value || typeof value !== "object") return;
            if (Array.isArray(value)) {
              for (const entry of value) collectDescriptions(entry, toolName);
              return;
            }
            const obj = value as Record<string, unknown>;
            if (typeof obj.description === "string" && obj.description.length >= 24) {
              const entry = descFrequency.get(obj.description) ?? { count: 0, chars: obj.description.length, tools: new Set<string>() };
              entry.count += 1;
              entry.tools.add(toolName);
              descFrequency.set(obj.description, entry);
            }
            for (const child of Object.values(obj)) collectDescriptions(child, toolName);
          }
          for (const [name, def] of Object.entries(defs)) {
            const schema = zodToJsonSchema(def.parameterSchema, { $refStrategy: "none", errorMessages: true, markdownDescription: false });
            collectDescriptions(schema, name);
          }
          console.log("\n=== REPEATED PARAMETER DESCRIPTIONS ===");
          for (const [description, value] of [...descFrequency.entries()]
            .filter(([, value]) => value.count >= 3)
            .sort((a, b) => (b[1].chars * (b[1].count - 1)) - (a[1].chars * (a[1].count - 1)))
            .slice(0, 20)) {
            console.log(JSON.stringify({ count: value.count, charsEach: value.chars, repeatedChars: value.chars * (value.count - 1), tools: [...value.tools], description }));
          }
          TS
          bun .audit-tool-footprint.ts
          rm .audit-tool-footprint.ts
      - name: Remove temporary audit workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-codex-tool-footprint.yml
          git commit -m 'chore: remove temporary tool footprint audit'
          git push origin HEAD:Local
