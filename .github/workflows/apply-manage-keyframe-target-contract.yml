name: Apply Strict Manage Keyframe Target Contract

on:
  push:
    paths:
      - ".github/workflows/apply-manage-keyframe-target-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Harden manage keyframe partial edit and targeting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          animation_path = Path("mcp/server/tools/animation.ts")
          text = animation_path.read_text(encoding="utf-8")

          old_import = "  loopModeEnum,\n  keyframeDataSchema,\n} from \"@/lib/zodObjects\";"
          new_import = "  loopModeEnum,\n} from \"@/lib/zodObjects\";"
          if text.count(old_import) != 1:
              raise SystemExit("Unexpected keyframeDataSchema import shape")
          text = text.replace(old_import, new_import, 1)

          old_manage_schema = "\n".join([
              "const manageKeyframeDataSchema = keyframeDataSchema.extend({",
              "  bezier_handles: z",
              "    .object({",
              "      left_time: vector3Schema.optional(),",
              "      left_value: vector3Schema.optional(),",
              "      right_time: vector3Schema.optional(),",
              "      right_value: vector3Schema.optional(),",
              "    })",
              "    .optional()",
              "    .describe(",
              "      \"Per-axis Bezier handle offsets [x,y,z] matching Blockbench keyframe vectors.\"",
              "    ),",
              "});",
              "",
              "export const manageKeyframesParameters = z.object({",
              "  animation_id: animationIdOptionalSchema,",
              "  action: z",
              "    .enum([\"create\", \"delete\", \"edit\", \"select\"])",
              "    .describe(\"Action to perform on keyframes.\"),",
              "  bone_name: boneNameSchema.describe(\"Exact Group UUID or exact unique Group name to manage keyframes for.\"),",
              "  channel: animationChannelEnum.describe(\"Animation channel to modify.\"),",
              "  keyframes: z",
              "    .array(manageKeyframeDataSchema)",
              "    .min(1)",
              "    .describe(\"One or more keyframes for the action; empty mutation/selection requests are rejected.\"),",
              "});",
          ])
          new_manage_schema = "\n".join([
              "const manageKeyframeDataSchema = z.object({",
              "  time: z",
              "    .number()",
              "    .finite()",
              "    .min(0)",
              "    .describe(\"Finite non-negative keyframe time in seconds.\"),",
              "  values: z",
              "    .union([finiteCreateAnimationVector3Schema, z.number().finite()])",
              "    .optional()",
              "    .describe(\"Finite [x,y,z] values, or a finite uniform scalar.\"),",
              "  interpolation: interpolationEnum",
              "    .optional()",
              "    .describe(\"Optional interpolation change. Omit on edit to preserve the existing interpolation.\"),",
              "  bezier_handles: z",
              "    .object({",
              "      left_time: finiteCreateAnimationVector3Schema.optional(),",
              "      left_value: finiteCreateAnimationVector3Schema.optional(),",
              "      right_time: finiteCreateAnimationVector3Schema.optional(),",
              "      right_value: finiteCreateAnimationVector3Schema.optional(),",
              "    })",
              "    .optional()",
              "    .describe(",
              "      \"Finite per-axis Bezier handle offsets [x,y,z]; set interpolation=bezier when authoring handles.\"",
              "    ),",
              "});",
              "",
              "export const manageKeyframesParameters = z",
              "  .object({",
              "    animation_id: animationIdOptionalSchema,",
              "    action: z",
              "      .enum([\"create\", \"delete\", \"edit\", \"select\"])",
              "      .describe(\"Action to perform on keyframes.\"),",
              "    bone_name: boneNameSchema.describe(\"Exact Group UUID or exact unique Group name to manage keyframes for.\"),",
              "    channel: animationChannelEnum.describe(\"Animation channel to modify.\"),",
              "    keyframes: z",
              "      .array(manageKeyframeDataSchema)",
              "      .min(1)",
              "      .describe(\"One or more keyframes for the action; empty mutation/selection requests are rejected.\"),",
              "  })",
              "  .superRefine((params, ctx) => {",
              "    params.keyframes.forEach((keyframe, index) => {",
              "      if (",
              "        params.action === \"edit\" &&",
              "        keyframe.values === undefined &&",
              "        keyframe.interpolation === undefined &&",
              "        keyframe.bezier_handles === undefined",
              "      ) {",
              "        ctx.addIssue({",
              "          code: z.ZodIssueCode.custom,",
              "          path: [\"keyframes\", index],",
              "          message:",
              "            \"edit requires values, interpolation, and/or Bezier handles in addition to the target time.\"",
              "        });",
              "      }",
              "",
              "      if (",
              "        (params.action === \"create\" || params.action === \"edit\") &&",
              "        keyframe.bezier_handles !== undefined &&",
              "        keyframe.interpolation !== \"bezier\"",
              "      ) {",
              "        ctx.addIssue({",
              "          code: z.ZodIssueCode.custom,",
              "          path: [\"keyframes\", index, \"interpolation\"],",
              "          message:",
              "            \"Bezier handles require interpolation=bezier so the authored handle change is effective.\"",
              "        });",
              "      }",
              "    });",
              "  });",
          ])
          if text.count(old_manage_schema) != 1:
              raise SystemExit("Unexpected manage keyframe schema block")
          text = text.replace(old_manage_schema, new_manage_schema, 1)

          register_marker = "export function registerAnimationTools() {\n"
          helper = "\n".join([
              "export function resolveUniqueKeyframeMatchIndexes(",
              "  existingTimes: readonly number[],",
              "  requestedTimes: readonly number[],",
              "  tolerance = 0.001",
              "): number[] {",
              "  if (!Number.isFinite(tolerance) || tolerance <= 0) {",
              "    throw new Error(\"Keyframe match tolerance must be finite and greater than 0.\");",
              "  }",
              "  if (!existingTimes.every(Number.isFinite) || !requestedTimes.every(Number.isFinite)) {",
              "    throw new Error(\"Keyframe matching requires finite existing and requested times.\");",
              "  }",
              "",
              "  const claimedIndexes = new Set<number>();",
              "  return requestedTimes.map((requestedTime) => {",
              "    const matches: number[] = [];",
              "    existingTimes.forEach((existingTime, index) => {",
              "      if (Math.abs(existingTime - requestedTime) < tolerance) matches.push(index);",
              "    });",
              "",
              "    if (matches.length === 0) {",
              "      throw new Error(`No existing keyframe matches requested time ${requestedTime}.`);",
              "    }",
              "    if (matches.length > 1) {",
              "      throw new Error(",
              "        `Requested time ${requestedTime} ambiguously matches ${matches.length} existing keyframes.`",
              "      );",
              "    }",
              "",
              "    const matchedIndex = matches[0];",
              "    if (claimedIndexes.has(matchedIndex)) {",
              "      throw new Error(",
              "        `Multiple requested times resolve to the same existing keyframe near ${requestedTime}.`",
              "      );",
              "    }",
              "    claimedIndexes.add(matchedIndex);",
              "    return matchedIndex;",
              "  });",
              "}",
              "",
          ])
          if text.count(register_marker) != 1:
              raise SystemExit("Unexpected animation registration marker")
          text = text.replace(register_marker, helper + register_marker, 1)

          old_pre_select = "\n".join([
              "      if (action === \"select\") {",
              "        if (animation !== AnimationItem.selected) {",
              "          throw new Error(",
              "            `Cannot select keyframes from animation \"${animation.name}\" because it is not the selected Blockbench animation.`",
              "          );",
              "        }",
              "        if (!existingAnimator || !existingAnimator[channel]?.length) {",
              "          throw new Error(`No keyframes found for ${group.name}.${channel}`);",
              "        }",
              "",
              "        Undo.initSelection({ timeline: true });",
          ])
          new_pre_select = "\n".join([
              "      const resolveRequestedTargets = (): _Keyframe[] => {",
              "        if (!existingAnimator || !existingAnimator[channel]?.length) {",
              "          throw new Error(`No keyframes found for ${group.name}.${channel}`);",
              "        }",
              "        const channelKeyframes = existingAnimator[channel] as _Keyframe[];",
              "        const matchedIndexes = resolveUniqueKeyframeMatchIndexes(",
              "          channelKeyframes.map((keyframe) => keyframe.time),",
              "          keyframes.map((keyframe) => keyframe.time)",
              "        );",
              "        return matchedIndexes.map((index) => channelKeyframes[index]);",
              "      };",
              "",
              "      if (action === \"select\") {",
              "        if (animation !== AnimationItem.selected) {",
              "          throw new Error(",
              "            `Cannot select keyframes from animation \"${animation.name}\" because it is not the selected Blockbench animation.`",
              "          );",
              "        }",
              "        const targetKeyframes = resolveRequestedTargets();",
              "",
              "        Undo.initSelection({ timeline: true });",
          ])
          if text.count(old_pre_select) != 1:
              raise SystemExit("Unexpected manage keyframe select preflight")
          text = text.replace(old_pre_select, new_pre_select, 1)

          old_select_loop = "\n".join([
              "          keyframes.forEach((kf) => {",
              "            const keyframe = existingAnimator[channel]?.find(",
              "              (candidate: _Keyframe) => Math.abs(candidate.time - kf.time) < 0.001",
              "            );",
              "            if (keyframe) {",
              "              keyframe.selected = true;",
              "              if (!Timeline.selected.includes(keyframe)) {",
              "                Timeline.selected.push(keyframe);",
              "              }",
              "            }",
              "          });",
          ])
          new_select_loop = "\n".join([
              "          targetKeyframes.forEach((keyframe) => {",
              "            keyframe.selected = true;",
              "            if (!Timeline.selected.includes(keyframe)) {",
              "              Timeline.selected.push(keyframe);",
              "            }",
              "          });",
          ])
          if text.count(old_select_loop) != 1:
              raise SystemExit("Unexpected manage keyframe select loop")
          text = text.replace(old_select_loop, new_select_loop, 1)

          old_post_select = "\n".join([
              "        Animator.preview();",
              "        return `Successfully performed ${action} on ${keyframes.length} keyframes for ${bone_name}.${channel}`;",
              "      }",
              "",
              "      if (action !== \"create\" && (!existingAnimator || !existingAnimator[channel]?.length)) {",
              "        throw new Error(`No keyframes found for ${group.name}.${channel}`);",
              "      }",
              "",
              "      Undo.initEdit({",
          ])
          new_post_select = "\n".join([
              "        Animator.preview();",
              "        return `Successfully performed ${action} on ${targetKeyframes.length} keyframes for ${bone_name}.${channel}`;",
              "      }",
              "",
              "      const targetKeyframes = action === \"create\" ? [] : resolveRequestedTargets();",
              "",
              "      Undo.initEdit({",
          ])
          if text.count(old_post_select) != 1:
              raise SystemExit("Unexpected manage keyframe post-select preflight")
          text = text.replace(old_post_select, new_post_select, 1)

          old_create_interpolation = "                interpolation: kf.interpolation,"
          new_create_interpolation = "                interpolation: kf.interpolation ?? \"linear\","
          if text.count(old_create_interpolation) != 1:
              raise SystemExit("Unexpected create keyframe interpolation assignment")
          text = text.replace(old_create_interpolation, new_create_interpolation, 1)

          old_delete = "\n".join([
              "          case \"delete\":",
              "            keyframes.forEach((kf) => {",
              "              const keyframe = animator![channel]?.find(",
              "                (candidate: _Keyframe) => Math.abs(candidate.time - kf.time) < 0.001",
              "              );",
              "              if (keyframe) {",
              "                keyframe.remove();",
              "              }",
              "            });",
              "            break;",
          ])
          new_delete = "\n".join([
              "          case \"delete\":",
              "            targetKeyframes.forEach((keyframe) => keyframe.remove());",
              "            break;",
          ])
          if text.count(old_delete) != 1:
              raise SystemExit("Unexpected delete keyframe loop")
          text = text.replace(old_delete, new_delete, 1)

          old_edit_start = "\n".join([
              "          case \"edit\":",
              "            keyframes.forEach((kf) => {",
              "              const keyframe = animator![channel]?.find(",
              "                (candidate: _Keyframe) => Math.abs(candidate.time - kf.time) < 0.001",
              "              );",
              "              if (keyframe) {",
              "                applyValues(keyframe, kf.values);",
          ])
          new_edit_start = "\n".join([
              "          case \"edit\":",
              "            keyframes.forEach((kf, index) => {",
              "              const keyframe = targetKeyframes[index];",
              "              applyValues(keyframe, kf.values);",
          ])
          if text.count(old_edit_start) != 1:
              raise SystemExit("Unexpected edit keyframe loop start")
          text = text.replace(old_edit_start, new_edit_start, 1)

          old_edit_end = "\n".join([
              "                  if (kf.bezier_handles.right_value)",
              "                    keyframe.bezier_right_value = toArrayVector3(kf.bezier_handles.right_value);",
              "                }",
              "              }",
              "            });",
              "            break;",
          ])
          new_edit_end = "\n".join([
              "                  if (kf.bezier_handles.right_value)",
              "                    keyframe.bezier_right_value = toArrayVector3(kf.bezier_handles.right_value);",
              "                }",
              "            });",
              "            break;",
          ])
          if text.count(old_edit_end) != 1:
              raise SystemExit("Unexpected edit keyframe loop end")
          text = text.replace(old_edit_end, new_edit_end, 1)

          old_description = "      \"Creates, deletes, or edits keyframes in the animation timeline for specific bones and channels.\"," 
          new_description = "      \"Creates, deletes, edits, or selects explicit keyframe targets for one bone/channel. Edit omission preserves existing interpolation; non-create actions require each requested time to resolve uniquely before Undo/selection.\"," 
          if text.count(old_description) != 1:
              raise SystemExit("Unexpected manage_keyframes tool description")
          animation_path.write_text(text.replace(old_description, new_description, 1), encoding="utf-8")

          test_path = Path("mcp/tests/animation-mutation-contract.test.ts")
          test = test_path.read_text(encoding="utf-8")
          old_import_test = "\n".join([
              "  manageKeyframesParameters,",
              "  wouldCreateRigHierarchyCycle,",
          ])
          new_import_test = "\n".join([
              "  manageKeyframesParameters,",
              "  resolveUniqueKeyframeMatchIndexes,",
              "  wouldCreateRigHierarchyCycle,",
          ])
          if test.count(old_import_test) != 1:
              raise SystemExit("Unexpected animation mutation test import tail")
          test = test.replace(old_import_test, new_import_test, 1)

          addition = "\n".join([
              "",
              "  test(\"manage_keyframes preserves partial edit intent and validates target times\", async () => {",
              "    const parsedEdit = manageKeyframesParameters.parse({",
              "      action: \"edit\",",
              "      bone_name: \"root\",",
              "      channel: \"rotation\",",
              "      keyframes: [{ time: 1, values: [10, 20, 30] }],",
              "    });",
              "    expect(parsedEdit.keyframes[0].interpolation).toBeUndefined();",
              "    expect(",
              "      manageKeyframesParameters.safeParse({",
              "        action: \"edit\",",
              "        bone_name: \"root\",",
              "        channel: \"rotation\",",
              "        keyframes: [{ time: 1 }],",
              "      }).success",
              "    ).toBe(false);",
              "    expect(",
              "      manageKeyframesParameters.safeParse({",
              "        action: \"create\",",
              "        bone_name: \"root\",",
              "        channel: \"rotation\",",
              "        keyframes: [{ time: -0.1, values: [0, 0, 0] }],",
              "      }).success",
              "    ).toBe(false);",
              "    expect(",
              "      manageKeyframesParameters.safeParse({",
              "        action: \"edit\",",
              "        bone_name: \"root\",",
              "        channel: \"rotation\",",
              "        keyframes: [{ time: 1, bezier_handles: { left_time: [-0.1, 0, 0] } }],",
              "      }).success",
              "    ).toBe(false);",
              "",
              "    expect(resolveUniqueKeyframeMatchIndexes([0, 1, 2], [1])).toEqual([1]);",
              "    expect(resolveUniqueKeyframeMatchIndexes([0, 1, 2], [1.0005])).toEqual([1]);",
              "    expect(() => resolveUniqueKeyframeMatchIndexes([0, 1, 2], [3])).toThrow(",
              "      \"No existing keyframe matches requested time 3\"",
              "    );",
              "    expect(() =>",
              "      resolveUniqueKeyframeMatchIndexes([1, 1.0005], [1.00025])",
              "    ).toThrow(\"ambiguously matches\");",
              "    expect(() => resolveUniqueKeyframeMatchIndexes([1], [1, 1.0005])).toThrow(",
              "      \"same existing keyframe\"",
              "    );",
              "",
              "    const source = await Bun.file(\"server/tools/animation.ts\").text();",
              "    expect(source).toContain(\"interpolation: kf.interpolation ?? \\\"linear\\\"\");",
              "    expect(source).toContain(\"const targetKeyframes = action === \\\"create\\\" ? [] : resolveRequestedTargets()\");",
              "  });",
          ])
          close_marker = "});\n"
          position = test.rfind(close_marker)
          if position == -1:
              raise SystemExit("Animation mutation test closing marker not found")
          test = test[:position] + addition + "\n" + test[position:]
          test_path.write_text(test, encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          old_note = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload, rejects empty `manage_keyframes` requests, requires an explicit `loop_mode` for the timeline loop mutation, rejects incomplete/effective no-op batch offset/scale requests, prevents empty animation copy/paste clipboard operations, requires action-specific copy/paste source/target state, removes the implicit X-axis fallback from `mirror_paste`, and keeps the structured create result while compacting its duplicate text serialization. AnimationCodec behavior and playback semantics are unchanged."
          new_note = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload, rejects empty `manage_keyframes` requests, preserves existing interpolation on partial keyframe edits, requires every edit/delete/select time to resolve to exactly one existing keyframe before mutation/selection, requires an explicit `loop_mode` for the timeline loop mutation, rejects incomplete/effective no-op batch offset/scale requests, prevents empty animation copy/paste clipboard operations, requires action-specific copy/paste source/target state, removes the implicit X-axis fallback from `mirror_paste`, and keeps the structured create result while compacting its duplicate text serialization. AnimationCodec behavior and playback semantics are unchanged."
          if next_text.count(old_note) != 1:
              raise SystemExit("Unexpected animation continuity note")
          next_path.write_text(next_text.replace(old_note, new_note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit keyframe contract and remove temporary workflow
        run: |
          git rm .github/workflows/apply-manage-keyframe-target-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: preserve keyframe edit intent and target identity"
          git push origin HEAD:Local
