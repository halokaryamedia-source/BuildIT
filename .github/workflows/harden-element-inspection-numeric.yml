name: Harden Element Inspection Numeric Evidence

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/harden-element-inspection-numeric.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Refuse non-finite inspection evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mcp/server/tools/element-inspection.ts')
          text = path.read_text(encoding='utf-8')
          anchor = 'function cubeSize(cube: Cube): [number, number, number] {\n'
          helper = '\n'.join([
              'export function requireFiniteInspectableVector3(',
              '  values: readonly number[],',
              '  context: string',
              '): [number, number, number] {',
              '  if (values.length !== 3 || values.some((value) => !Number.isFinite(value))) {',
              '    throw new Error(',
              '      `${context} contains a non-finite authored transform and cannot be reported safely.`',
              '    );',
              '  }',
              '  return [values[0], values[1], values[2]];',
              '}',
              '',
          ])
          if 'export function requireFiniteInspectableVector3' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('Unexpected inspect_element numeric anchor')
              text = text.replace(anchor, helper + anchor, 1)

          old_cube_size = '\n'.join([
              'function cubeSize(cube: Cube): [number, number, number] {',
              '  const size = [',
              '    cube.to[0] - cube.from[0],',
              '    cube.to[1] - cube.from[1],',
              '    cube.to[2] - cube.from[2],',
              '  ] as [number, number, number];',
          ])
          new_cube_size = '\n'.join([
              'function cubeSize(cube: Cube): [number, number, number] {',
              '  const from = requireFiniteInspectableVector3(cube.from, `Cube ${cube.name} (${cube.uuid}) from`);',
              '  const to = requireFiniteInspectableVector3(cube.to, `Cube ${cube.name} (${cube.uuid}) to`);',
              '  const size = [',
              '    to[0] - from[0],',
              '    to[1] - from[1],',
              '    to[2] - from[2],',
              '  ] as [number, number, number];',
          ])
          if text.count(old_cube_size) != 1:
              raise SystemExit('Unexpected Cube size inspection block')
          text = text.replace(old_cube_size, new_cube_size, 1)

          replacements = [
              ('    from: [...cube.from] as [number, number, number],', '    from: requireFiniteInspectableVector3(cube.from, `Cube ${cube.name} (${cube.uuid}) from`),'),
              ('    to: [...cube.to] as [number, number, number],', '    to: requireFiniteInspectableVector3(cube.to, `Cube ${cube.name} (${cube.uuid}) to`),'),
              ('    origin: [...cube.origin] as [number, number, number],', '    origin: requireFiniteInspectableVector3(cube.origin, `Cube ${cube.name} (${cube.uuid}) origin`),'),
              ('    rotation: [...cube.rotation] as [number, number, number],', '    rotation: requireFiniteInspectableVector3(cube.rotation, `Cube ${cube.name} (${cube.uuid}) rotation`),'),
              ('    origin: [...group.origin] as [number, number, number],', '    origin: requireFiniteInspectableVector3(group.origin, `Group ${group.name} (${group.uuid}) origin`),'),
              ('    rotation: [...group.rotation] as [number, number, number],', '    rotation: requireFiniteInspectableVector3(group.rotation, `Group ${group.name} (${group.uuid}) rotation`),'),
              ('    position: [...locator.position] as [number, number, number],', '    position: requireFiniteInspectableVector3(locator.position, `Locator ${locator.name} (${locator.uuid}) position`),'),
              ('    rotation: [...locator.rotation] as [number, number, number],', '    rotation: requireFiniteInspectableVector3(locator.rotation, `Locator ${locator.name} (${locator.uuid}) rotation`),'),
              ('    position: [...element.position] as [number, number, number],', '    position: requireFiniteInspectableVector3(element.position, `Null Object ${element.name} (${element.uuid}) position`),'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Unexpected inspection vector field: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('mcp/tests/model-effectiveness-correction-accuracy.test.ts')
          test = test_path.read_text(encoding='utf-8')
          import_anchor = 'import { modifyCubeParameters, placeCubeParameters } from "@/server/tools/cubes";\n'
          if 'requireFiniteInspectableVector3' not in test:
              if test.count(import_anchor) != 1:
                  raise SystemExit('Unexpected correction accuracy import anchor')
              test = test.replace(import_anchor, import_anchor + 'import { requireFiniteInspectableVector3 } from "@/server/tools/element-inspection";\n', 1)
          marker = '  test("Cube authoring rejects finite endpoints that produce non-finite size", () => {'
          addition = '\n'.join([
              '  test("focused element inspection refuses non-finite transform evidence", () => {',
              '    expect(requireFiniteInspectableVector3([1, 2, 3], "test")).toEqual([1, 2, 3]);',
              '    expect(() => requireFiniteInspectableVector3([Infinity, 0, 0], "test")).toThrow("non-finite authored transform");',
              '    expect(() => requireFiniteInspectableVector3([0, 0], "test")).toThrow("non-finite authored transform");',
              '  });',
              '',
          ])
          if test.count(marker) != 1:
              raise SystemExit('Unexpected correction accuracy insertion point')
          test_path.write_text(test.replace(marker, addition + marker, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = 'Locator/Null Object authored transforms now require finite 3D coordinates at the MCP boundary. Their resulting/read state also refuses to serialize a pre-existing non-finite position/rotation, preventing `JSON.stringify` from silently turning poisoned numeric state into `null`. Parent, Undo, serialization, and family ownership are unchanged.'
          extra = '\n\n`inspect_element` now applies the same truthful numeric evidence rule across Cube, Group, Locator, and Null Object transforms. Pre-existing non-finite authored coordinates cause an explicit inspection error instead of being serialized as JSON `null`; identity resolution and inspection payload shape are otherwise unchanged.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected Locator numeric continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-element-inspection-numeric.yml
          git add mcp/server/tools/element-inspection.ts mcp/tests/model-effectiveness-correction-accuracy.test.ts docs/knowledge/next-action.md
          git commit -m 'fix: keep element inspection numeric evidence truthful'
          git push origin HEAD:Local