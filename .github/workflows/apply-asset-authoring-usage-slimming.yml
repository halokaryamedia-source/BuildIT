name: Apply Asset Authoring Usage Slimming

on:
  push:
    paths:
      - ".github/workflows/apply-asset-authoring-usage-slimming.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Measure before
        run: |
          wc -c AGENTS.md
          wc -c .agents/skills/blockit-bedrock-entity-mcp/SKILL.md
          wc -c .agents/skills/blockbench-bedrock-modelling/SKILL.md

      - name: Apply bounded slimming
        run: python3 mcp/scripts/apply-asset-authoring-usage-slimming.py

      - name: Measure after and enforce context budget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          limits = {
              'AGENTS.md': 8000,
              '.agents/skills/blockit-bedrock-entity-mcp/SKILL.md': 8000,
              '.agents/skills/blockbench-bedrock-modelling/SKILL.md': 13000,
          }
          for path, limit in limits.items():
              size = len(Path(path).read_text(encoding='utf-8'))
              print(path, size)
              if size >= limit:
                  raise SystemExit(f'{path} still too large: {size} >= {limit}')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Surface invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          api = json.loads(Path('mcp/docs/api.json').read_text(encoding='utf-8'))
          print('TOOLS', len(api.get('tools', [])))
          print('PROMPTS', len(api.get('prompts', [])))
          print('RESOURCES', len(api.get('resources', [])))
          if len(api.get('tools', [])) != 72:
              raise SystemExit('Tool count changed')
          if len(api.get('prompts', [])) != 3:
              raise SystemExit('Prompt count changed')
          if len(api.get('resources', [])) != 8:
              raise SystemExit('Resource count changed')
          PY

      - name: Diff hygiene
        run: git diff --check

      - name: Commit slimming
        run: |
          git rm mcp/scripts/apply-asset-authoring-usage-slimming.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No usage-slimming changes"; exit 1; }
          git commit -m "refactor: slim BlockIT asset authoring usage"
          git push origin HEAD:Local
