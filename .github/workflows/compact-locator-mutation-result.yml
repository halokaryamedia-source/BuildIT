name: Compact Locator Mutation Result

on:
  push:
    paths:
      - ".github/workflows/compact-locator-mutation-result.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Remove duplicate text whitespace only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          locator_path = Path("mcp/server/tools/locators.ts")
          text = locator_path.read_text(encoding="utf-8")
          old = "text: JSON.stringify(state, null, 2),"
          new = "text: JSON.stringify(state),"
          if text.count(old) != 1:
              raise SystemExit("Unexpected locator structuredResult serialization shape")
          locator_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("mcp/tests/asset-authoring-usage-slimming.test.ts")
          test = test_path.read_text(encoding="utf-8")
          marker = '    for (const text of files) expect(text).not.toContain("JSON.stringify(result, null, 2)");\n'
          addition = '''    const locatorSource = files[4];
          expect(locatorSource).not.toContain("JSON.stringify(state, null, 2)");
          expect(locatorSource).toContain("JSON.stringify(state)");
          '''
          if test.count(marker) != 1:
              raise SystemExit("Unexpected compact-output regression marker")
          test_path.write_text(test.replace(marker, marker + addition, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit compact result and remove workflow
        run: |
          git rm .github/workflows/compact-locator-mutation-result.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "refactor: compact locator mutation result text"
          git push origin HEAD:Local
