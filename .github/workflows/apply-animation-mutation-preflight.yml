name: Apply Animation Mutation Preflight

on:
  push:
    paths:
      - ".github/workflows/apply-animation-mutation-preflight.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Harden animation mutation inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          animation_path = Path("mcp/server/tools/animation.ts")
          text = animation_path.read_text(encoding="utf-8")

          old_keyframes = "\n".join([
              "  keyframes: z",
              "    .array(manageKeyframeDataSchema)",
              "    .describe(\"Keyframe data for the action.\"),",
          ])
          new_keyframes = "\n".join([
              "  keyframes: z",
              "    .array(manageKeyframeDataSchema)",
              "    .min(1)",
              "    .describe(\"One or more keyframes for the action; empty mutation/selection requests are rejected.\"),",
          ])
          if text.count(old_keyframes) != 1:
              raise SystemExit("Unexpected manage_keyframes array shape")
          text = text.replace(old_keyframes, new_keyframes, 1)

          old_timeline_tail = "\n".join([
              "  range: animationTimelineRangeSchema",
              "    .optional()",
              "    .describe(\"Inclusive time range for select_range.\"),",
              "});",
          ])
          new_timeline_tail = "\n".join([
              "  range: animationTimelineRangeSchema",
              "    .optional()",
              "    .describe(\"Inclusive time range for select_range.\"),",
              "}).refine(",
              "  (params) => params.action !== \"loop\" || params.loop_mode !== undefined,",
              "  {",
              "    message: \"loop_mode is required for the loop action.\",",
              "    path: [\"loop_mode\"],",
              "  }",
              ");",
          ])
          if text.count(old_timeline_tail) != 1:
              raise SystemExit("Unexpected animation timeline schema tail")
          text = text.replace(old_timeline_tail, new_timeline_tail, 1)

          old_loop = "\n".join([
              "        case \"loop\":",
              "          if (loop_mode && loop_mode !== animation.loop) {",
          ])
          new_loop = "\n".join([
              "        case \"loop\":",
              "          if (loop_mode === undefined) {",
              "            throw new Error(\"Loop mode parameter required for loop action.\");",
              "          }",
              "          if (loop_mode !== animation.loop) {",
          ])
          if text.count(old_loop) != 1:
              raise SystemExit("Unexpected animation loop action shape")
          animation_path.write_text(text.replace(old_loop, new_loop, 1), encoding="utf-8")

          test_path = Path("mcp/tests/animation-mutation-contract.test.ts")
          if test_path.exists():
              raise SystemExit("animation mutation contract test already exists")
          test_lines = [
              'import { describe, expect, test } from "bun:test";',
              'import {',
              '  animationTimelineParameters,',
              '  manageKeyframesParameters,',
              '} from "@/server/tools/animation";',
              '',
              'describe("animation mutation contract", () => {',
              '  test("manage_keyframes rejects an empty target list", () => {',
              '    const result = manageKeyframesParameters.safeParse({',
              '      action: "create",',
              '      bone_name: "root",',
              '      channel: "rotation",',
              '      keyframes: [],',
              '    });',
              '    expect(result.success).toBe(false);',
              '  });',
              '',
              '  test("timeline loop requires an explicit loop mode", () => {',
              '    expect(animationTimelineParameters.safeParse({ action: "loop" }).success).toBe(false);',
              '    expect(',
              '      animationTimelineParameters.safeParse({ action: "loop", loop_mode: "loop" }).success',
              '    ).toBe(true);',
              '  });',
              '});',
          ]
          test_path.write_text("\n".join(test_lines) + "\n", encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          old_note = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload instead of dropping it through a truthiness check. AnimationCodec behavior and playback semantics are unchanged."
          new_note = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload, rejects empty `manage_keyframes` requests, and requires an explicit `loop_mode` for the timeline loop mutation. AnimationCodec behavior and playback semantics are unchanged."
          if next_text.count(old_note) != 1:
              raise SystemExit("Unexpected animation continuity note")
          next_path.write_text(next_text.replace(old_note, new_note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit preflight and remove temporary workflow
        run: |
          git rm .github/workflows/apply-animation-mutation-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: reject incomplete animation mutations"
          git push origin HEAD:Local
