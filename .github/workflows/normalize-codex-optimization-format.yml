name: Normalize Codex Optimization Formatting

on:
  push:
    paths:
      - ".github/workflows/normalize-codex-optimization-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Normalize touched source and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          element_path = Path("mcp/server/tools/element.ts")
          element = element_path.read_text(encoding="utf-8")
          start = element.find("  createTool(elementToolDocs[0].name, {")
          end = element.find("  createTool(elementToolDocs[1].name, {", start)
          if start == -1 or end == -1 or end <= start:
              raise SystemExit("Could not isolate remove_element registration")
          registration = '''  createTool(elementToolDocs[0].name, {
            ...elementToolDocs[0],
            async execute({ id }) {
              const element = resolveUniqueDestructiveElement(id);
              const deleteElements: OutlinerElement[] = [];
              const deleteGroups: Group[] = [];

              if (element instanceof Group) {
                deleteGroups.push(element);
                element.forEachChild((child: any) => {
                  if (child instanceof Group) {
                    deleteGroups.push(child);
                  } else {
                    deleteElements.push(child as OutlinerElement);
                  }
                });
              } else {
                deleteElements.push(element);
              }

              const deletedNodeUuids = new Set([
                ...deleteGroups.map((group) => group.uuid),
                ...deleteElements.map((deletedElement) => deletedElement.uuid),
              ]);
              const deleteAnimations: _Animation[] = AnimationItem.all.filter(
                (animation) =>
                  Object.keys(animation.animators ?? {}).some((animatorUuid) =>
                    deletedNodeUuids.has(animatorUuid)
                  )
              );

              Undo.initEdit({
                elements: deleteElements,
                groups: deleteGroups,
                outliner: true,
                selection: true,
                animations: deleteAnimations,
                collections: [],
              });

              try {
                if (element instanceof Group) {
                  element.remove(false);
                  deleteGroups.length = 0;
                } else {
                  element.remove();
                }
                deleteElements.length = 0;
                Undo.finishEdit("Agent removed element");
              } catch (error) {
                Undo.cancelEdit(true);
                Canvas.updateAll();
                throw error;
              }

              Canvas.updateAll();
              return `Removed element with ID ${id}`;
            },
          }, elementToolDocs[0].status);

          '''
          element_path.write_text(element[:start] + registration + element[end:], encoding="utf-8")

          locator_path = Path("mcp/tests/bedrock-locator-coverage.test.ts")
          locator = locator_path.read_text(encoding="utf-8")
          start = locator.find('  test("generic remove_element snapshots direct or recursive deletion state before Undo", async () => {')
          end = locator.find('  test("inspect_element exposes authored Locator and Null Object state", async () => {', start)
          if start == -1 or end == -1 or end <= start:
              raise SystemExit("Could not isolate generic removal regression test")
          test_block = '''  test("generic remove_element snapshots direct or recursive deletion state before Undo", async () => {
            const elementSource = await source("server/tools/element.ts");
            const start = elementSource.indexOf("createTool(elementToolDocs[0].name");
            const end = elementSource.indexOf("createTool(elementToolDocs[1].name", start);
            expect(start).toBeGreaterThan(-1);
            expect(end).toBeGreaterThan(start);
            const removeBlock = elementSource.slice(start, end);

            expect(removeBlock).toContain("const deleteElements: OutlinerElement[] = [];");
            expect(removeBlock).toContain("const deleteGroups: Group[] = [];");
            expect(removeBlock).toContain("element.forEachChild");
            expect(removeBlock).toContain("const deletedNodeUuids = new Set");
            expect(removeBlock).toContain("animations: deleteAnimations");
            expect(removeBlock).toContain("selection: true");
            expect(removeBlock).toContain("element.remove(false)");
            expect(removeBlock).toContain("deleteGroups.length = 0");
            expect(removeBlock).toContain("deleteElements.length = 0");
            expect(removeBlock.indexOf("const deleteAnimations")).toBeLessThan(
              removeBlock.indexOf("Undo.initEdit({")
            );
          });

          '''
          locator_path.write_text(locator[:start] + test_block + locator[end:], encoding="utf-8")

          usage_path = Path("mcp/tests/asset-authoring-usage-slimming.test.ts")
          usage = usage_path.read_text(encoding="utf-8")
          start = usage.find('  test("asset authoring bypasses repository-development boot and development-brief", async () => {')
          end = usage.find('  test("normal authoring skill stack remains compact while hard gates stay present", async () => {', start)
          if start == -1 or end == -1 or end <= start:
              raise SystemExit("Could not isolate asset authoring fast-path test")
          usage_block = '''  test("asset authoring bypasses repository-development boot and development-brief", async () => {
            const agents = await source("../AGENTS.md");
            expect(agents).toContain("### Asset Authoring");
            expect(agents).toContain("do not automatically load");
            expect(agents).toContain("Asset authoring is not software **Developing**");
            expect(agents).toContain("Do not route it through `development-brief`");

            const readme = await source("../README.md");
            expect(readme).toContain("## Session Boot");
            expect(readme).toContain("Task Class First");
            expect(readme).toContain("Do not automatically load `CONTEXT.md`");
            expect(readme).not.toContain("## Mandatory Session Boot");
          });

          '''
          usage_path.write_text(usage[:start] + usage_block + usage[end:], encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit formatting correction and remove workflow
        run: |
          git rm .github/workflows/normalize-codex-optimization-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "style: normalize Codex optimization changes"
          git push origin HEAD:Local
