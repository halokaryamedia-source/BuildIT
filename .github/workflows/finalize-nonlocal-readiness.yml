name: "Finalize Non-local Readiness"

on:
  push:
    branches: [Local]
    paths:
      - ".github/workflows/finalize-nonlocal-readiness.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Measure actual tools-list
        working-directory: mcp
        run: |
          cat > .measure-final-readiness.ts <<'TS'
          import { McpServer } from "@modelcontextprotocol/sdk/server/mcp.js";
          import { WebStandardStreamableHTTPServerTransport } from "@modelcontextprotocol/sdk/server/webStandardStreamableHttp.js";
          import { registerToolsOnServer } from "./lib/factories";
          import "./server/tools";

          const server = new McpServer({ name: "blockit-final-readiness", version: "1.0.0" });
          registerToolsOnServer(server);
          const transport = new WebStandardStreamableHTTPServerTransport({
            sessionIdGenerator: undefined,
            enableJsonResponse: true,
          });
          await server.connect(transport);
          try {
            const response = await transport.handleRequest(new Request("http://127.0.0.1:3000/bb-mcp", {
              method: "POST",
              headers: {
                accept: "application/json, text/event-stream",
                "content-type": "application/json",
                "mcp-protocol-version": "2025-06-18",
              },
              body: JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} }),
            }));
            const raw = await response.text();
            if (response.status !== 200) throw new Error(raw);
            const parsed = JSON.parse(raw) as { result?: { tools?: Array<{ name?: string; description?: string; inputSchema?: unknown }> } };
            const tools = parsed.result?.tools ?? [];
            const names = tools.map((tool) => tool.name ?? "");
            const metrics = {
              enabled_tools: tools.length,
              response_characters: raw.length,
              input_schema_characters: tools.reduce((sum, tool) => sum + JSON.stringify(tool.inputSchema ?? {}).length, 0),
              description_characters: tools.reduce((sum, tool) => sum + (tool.description ?? "").length, 0),
              export_model_exposed: names.includes("export_model"),
              list_export_formats_exposed: names.includes("list_export_formats"),
              apply_texture_exposed: names.includes("apply_texture"),
              filter_by_material_exposed: names.includes("filter_by_material"),
            };
            if (metrics.enabled_tools !== 62) throw new Error(`Expected 62 enabled tools, got ${metrics.enabled_tools}`);
            if (!metrics.export_model_exposed) throw new Error("export_model must remain exposed");
            if (metrics.list_export_formats_exposed || metrics.apply_texture_exposed || metrics.filter_by_material_exposed) {
              throw new Error("Contained generic/redundant tools unexpectedly re-entered the default surface");
            }
            await Bun.write("../.final-readiness-metrics.json", JSON.stringify(metrics));
          } finally {
            await server.close();
          }
          TS
          bun .measure-final-readiness.ts
          rm .measure-final-readiness.ts

      - name: Sync readiness status and evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          metrics_path = Path('.final-readiness-metrics.json')
          m = json.loads(metrics_path.read_text())
          metrics_path.unlink()
          def n(value): return f'{value:,}'

          old_status_plain = 'MCP_TOOL_EXPOSURE_WIRE_AUDIT_COMPLETE_LOCAL_DEFERRED_LOADING_PROOF_REQUIRED'
          new_status_plain = 'NON_LOCAL_PRELOCAL_READINESS_COMPLETE_LOCAL_ACCEPTANCE_REQUIRED'

          next_path = Path('docs/knowledge/next-action.md')
          text = next_path.read_text(encoding='utf-8')
          old_status = f'`{old_status_plain}`'
          new_status = f'`{new_status_plain}`'
          if text.count(old_status) != 1:
            raise SystemExit('next-action current-status anchor changed')
          text = text.replace(old_status, new_status, 1)

          pattern = re.compile(
            r'The final GitHub-only pinned-SDK `tools/list` measurement for the current source state is \*\*\d+ enabled tools / [\d,]+ response characters\*\*, including \*\*[\d,]+ characters of input schemas\*\* and \*\*[\d,]+ characters of tool descriptions\*\*\.'
          )
          replacement = (
            f'The final GitHub-only pinned-SDK `tools/list` measurement for the current source state is '
            f'**{m["enabled_tools"]} enabled tools / {n(m["response_characters"])} response characters**, including '
            f'**{n(m["input_schema_characters"])} characters of input schemas** and '
            f'**{n(m["description_characters"])} characters of tool descriptions**.'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit('next-action wire measurement anchor changed')

          proof_anchor = '**Proof boundary:** modelling-effectiveness CI tests are source/contract regression proof. They are not behavioral proof that Codex follows the workflow, and they are not visual proof that a live model resembles its reference.'
          readiness = '''## Non-local Pre-local Readiness\n\nThe bounded repository-wide non-local audit is complete. Source-provable discovery numeric/range errors, omission-vs-empty identity fallbacks, project/animation/texturing redundant-preflight routing, Bedrock Group/create semantics, Cube/export lifecycle correctness, and default-surface containment have been addressed and verified. No additional source-only change is currently justified without reopening a stopped causal slice or inventing architecture.\n\nThe remaining acceptance questions require local evidence: native Codex deferred/tool-search exposure and representative domain reachability; actual prompt/skill co-loading; whether duplicated text plus `structuredContent` can be reduced without losing client-visible evidence; live reference-fidelity/correction behavior; and Blockbench save/reopen/export plus Locator/Null Object runtime round-trip. Stopped Animation/Paint/material-instance/`nodes://` slices are not reopened by readiness status; they require genuinely new evidence or an explicit product requirement.\n\nNo custom tool router, additional MCP profile, output framework, readiness state machine, or capability pruning was introduced.\n\n'''
          if text.count(proof_anchor) != 1:
            raise SystemExit('proof-boundary insertion anchor changed')
          text = text.replace(proof_anchor, readiness + proof_anchor, 1)
          next_path.write_text(text, encoding='utf-8')

          review_path = Path('docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md')
          review = review_path.read_text(encoding='utf-8')
          review_pattern = re.compile(
            r'Final pinned-SDK measurement after the later Cube/project/export cleanup, Bedrock `add_group` narrowing, and duplicate translation hardening: \*\*\d+ tools / [\d,]+ response characters / [\d,]+ input-schema characters / [\d,]+ description characters\*\*\.'
          )
          review_replacement = (
            f'Final pinned-SDK measurement after the complete non-local pre-local cleanup: '
            f'**{m["enabled_tools"]} tools / {n(m["response_characters"])} response characters / '
            f'{n(m["input_schema_characters"])} input-schema characters / '
            f'{n(m["description_characters"])} description characters**.'
          )
          review, count = review_pattern.subn(review_replacement, review, count=1)
          if count != 1:
            raise SystemExit('deferred-loading review measurement anchor changed')
          review_path.write_text(review, encoding='utf-8')

          status_files = []
          for test_path in sorted(Path('mcp/tests').glob('*.test.ts')):
            test = test_path.read_text(encoding='utf-8')
            if old_status_plain not in test:
              continue
            test_path.write_text(test.replace(old_status_plain, new_status_plain), encoding='utf-8')
            status_files.append(str(test_path))
          if len(status_files) != 3:
            raise SystemExit(f'Expected 3 stale readiness-status test files, found {status_files}')

          test_path = Path('mcp/tests/model-effectiveness-minimum-evidence.test.ts')
          test = test_path.read_text(encoding='utf-8')
          local_anchor = '    expect(next).toContain("LOCAL — reference-fidelity acceptance scenarios");\n'
          local_checks = '''    expect(next).toContain("Non-local Pre-local Readiness");\n    expect(next).toContain("native Codex deferred/tool-search exposure");\n    expect(next).toContain("No custom tool router");\n'''
          if test.count(local_anchor) != 1:
            raise SystemExit('local-boundary regression anchor changed')
          test_path.write_text(test.replace(local_anchor, local_anchor + local_checks, 1), encoding='utf-8')

          print(json.dumps({**m, 'updated_status_tests': status_files}, indent=2))
          PY

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit readiness and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-nonlocal-readiness.yml
          git add docs/knowledge/next-action.md docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md mcp/tests/model-effectiveness-minimum-evidence.test.ts mcp/tests/context-payload-cleanup.test.ts mcp/tests/asset-authoring-usage-slimming.test.ts
          git commit -m 'docs: mark non-local pre-local readiness complete'
          git push origin HEAD:Local
