name: Run Retained Paint Patch

on:
  push:
    paths:
      - ".github/workflows/run-retained-paint-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
      - name: Apply retained Paint patch
        run: python .github/scripts/patch_paint_retained.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/server/tools/paint.ts
          git diff --cached --check
          git commit -m "fix: align retained Blockbench Paint APIs"
          git push origin Local
