name: Correct Inspect Element Exposure Audit

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/correct-inspect-element-exposure-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Correct high-frequency description and audit evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('mcp/server/tools/element-inspection.ts')
          source = source_path.read_text(encoding='utf-8')
          old = '      "Returns focused read-only authored state for one explicit Bedrock Cube, Group, Locator, or Null Object in the active project. Cube output includes from/to, size, center, origin, rotation, parent, and visibility so a local correction can be derived from exact current authored state. Locator output includes parent, position, rotation, ignore_inherited_scale, and visibility. Null Object output includes parent, position, current IK editor references, lock_ik_target_rotation, and visibility. Exact names must be unique; UUID is preferred. This tool does not modify selection/model state or return visual PASS/FAIL.",'
          new = '      "Returns focused read-only authored state for one explicit Bedrock Cube, Group, Locator, or Null Object. UUID is preferred and exact names must be unique. Includes the type-specific transform, parent, and visibility state needed for precise correction; it does not modify selection/model state or return visual PASS/FAIL.",'
          if source.count(old) != 1:
              raise SystemExit('Unexpected inspect_element description shape')
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          review_path = Path('docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md')
          review = review_path.read_text(encoding='utf-8')
          old_paragraph = 'Only two tool descriptions exceeded 400 characters. This slice shortens `bone_rigging` and `animation_copy_paste` while preserving routing and critical mutation-safety signals; detailed field requirements remain owned by their input schemas and runtime validation.'
          new_paragraph = 'The first footprint ranking did not enumerate every description-length outlier, so the earlier inference that only two descriptions exceeded 400 characters was incorrect. A follow-up full-catalog description audit found `inspect_element` at 614 characters and `bone_rigging` at 410 after its first compaction; the next longest descriptions were below 400. `inspect_element` is a high-frequency geometry-lane read, so its description is now compacted while preserving target types, UUID/unique-name identity, correction-state purpose, read-only behavior, and the visual-verdict boundary. This correction changes the measurement conclusion, not the tool payload or capability.'
          if review.count(old_paragraph) != 1:
              raise SystemExit('Unexpected deferred-loading description audit paragraph')
          review = review.replace(old_paragraph, new_paragraph, 1)
          review_path.write_text(review, encoding='utf-8')

          test_path = Path('mcp/tests/context-payload-cleanup.test.ts')
          test = test_path.read_text(encoding='utf-8')
          import_anchor = 'import { inspectAnimationParameters } from "@/server/tools/animation-inspection";\n'
          import_add = import_anchor + 'import { elementInspectionToolDocs } from "@/server/tools/element-inspection";\n'
          if 'elementInspectionToolDocs' not in test:
              if test.count(import_anchor) != 1:
                  raise SystemExit('Unexpected payload cleanup import anchor')
              test = test.replace(import_anchor, import_add, 1)
          marker = '  test("context cleanup changes payload, not Bedrock capability/profile architecture", async () => {'
          addition = '  test("high-frequency inspect_element routing prose stays compact", () => {\n    const description = elementInspectionToolDocs[0].description;\n    expect(description.length).toBeLessThan(350);\n    expect(description).toContain("UUID is preferred");\n    expect(description).toContain("exact names must be unique");\n    expect(description).toContain("read-only");\n    expect(description).toContain("PASS/FAIL");\n  });\n\n'
          if test.count(marker) != 1:
              raise SystemExit('Unexpected payload cleanup test insertion point')
          test_path.write_text(test.replace(marker, addition + marker, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = 'A follow-up default-registration footprint ranking confirms that schema size is concentrated in real downstream capability rather than obvious metadata waste: Animation + Paint account for approximately **25,034 / 51,357 (~48.7%)** of the compact Zod-derived schema ranking. Only `bone_rigging` and `animation_copy_paste` were clear description-length outliers (>400 characters), so only those descriptions were compacted. Mass schema trimming, default capability removal, and a BlockIT-side geometry profile remain rejected; local A/B exposure proof should use Codex client-side `enabled_tools` against the unchanged full surface.'
          replacement = 'A follow-up default-registration footprint ranking confirms that schema size is concentrated in real downstream capability rather than obvious metadata waste: Animation + Paint account for approximately **25,034 / 51,357 (~48.7%)** of the compact Zod-derived schema ranking. A later full-catalog description audit corrected the initial outlier inference: `inspect_element` was still 614 characters and has now been compacted because it is a high-frequency geometry-lane read; `bone_rigging` remains the next >400-character description after its earlier compaction. Mass schema trimming, default capability removal, and a BlockIT-side geometry profile remain rejected; local A/B exposure proof should use Codex client-side `enabled_tools` against the unchanged full surface.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected next-action exposure audit marker')
          next_path.write_text(next_text.replace(marker, replacement, 1), encoding='utf-8')
          PY
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified correction and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/correct-inspect-element-exposure-audit.yml
          git add mcp/server/tools/element-inspection.ts mcp/tests/context-payload-cleanup.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md docs/knowledge/next-action.md
          git commit -m 'refactor: compact inspect element routing prose'
          git push origin HEAD:Local
