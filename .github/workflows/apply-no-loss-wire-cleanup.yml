name: Apply No-Loss MCP Wire Cleanup

on:
  push:
    paths:
      - ".github/workflows/apply-no-loss-wire-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply no-loss output cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cubes_path = Path('mcp/server/tools/cubes.ts')
          cubes = cubes_path.read_text(encoding='utf-8')
          for old in [
              '      cube: after,\n',
              '      cubes: effects.map(({ after }) => after),\n',
          ]:
              if cubes.count(old) != 1:
                  raise SystemExit(f'Unexpected Cube duplicate shape: {old!r}')
              cubes = cubes.replace(old, '', 1)
          cubes_path.write_text(cubes, encoding='utf-8')

          history_path = Path('mcp/server/tools/history.ts')
          history = history_path.read_text(encoding='utf-8')
          history = history.replace(',\n        null,\n        2\n      )', '\n      )')
          history = history.replace('JSON.stringify(summarizeHistory(limit), null, 2)', 'JSON.stringify(summarizeHistory(limit))')
          history_path.write_text(history, encoding='utf-8')

          integration_path = Path('mcp/tests/p1-stateless-net-integration.test.ts')
          integration = integration_path.read_text(encoding='utf-8')
          old_comment = '''// The raw-net integration test is deliberately transport-owned. Register one\n// runtime-independent MCP fixture through BlockIT's real factory registry rather\n// than importing the full Bedrock profile, whose Paint family correctly expects\n// live Blockbench globals such as Painter during registration.\n'''
          new_comment = '''// This transport test keeps one tiny fixture so protocol assertions stay focused.\n// The full default registry is independently import-tested outside Blockbench;\n// runtime-only globals such as Painter are resolved only during tool execution.\n'''
          if integration.count(old_comment) != 1:
              raise SystemExit('Unexpected stale transport comment shape')
          integration = integration.replace(old_comment, new_comment, 1)
          integration_path.write_text(integration, encoding='utf-8')

          test_path = Path('mcp/tests/asset-authoring-usage-slimming.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = '''  test("capability architecture is unchanged", async () => {\n'''
          addition = '''  test("correction and recovery outputs do not repeat identical state payloads", async () => {\n    const cubes = await source("server/tools/cubes.ts");\n    const history = await source("server/tools/history.ts");\n    expect(cubes).not.toContain("cube: after,");\n    expect(cubes).not.toContain("cubes: effects.map(({ after }) => after)");\n    expect(cubes).toContain("before,");\n    expect(cubes).toContain("after,");\n    expect(cubes).toContain("geometry_effect");\n    expect(history).toContain("JSON.stringify(summarizeHistory(limit))");\n  });\n\n'''
          if test.count(marker) != 1:
              raise SystemExit('Unexpected asset-authoring test insertion point')
          test = test.replace(marker, addition + marker, 1)
          test_path.write_text(test, encoding='utf-8')

          # Preserve continuation-state proof without requiring redundant aliases.
          core_test_path = Path('mcp/tests/p1-core-ownership.test.ts')
          core_test = core_test_path.read_text(encoding='utf-8')
          old_alias_assertion = '    expect(cubes).toContain("cube: after");\n'
          new_alias_assertion = '    expect(cubes).not.toContain("cube: after,");\n'
          if core_test.count(old_alias_assertion) != 1:
              raise SystemExit('Unexpected core ownership alias assertion')
          core_test = core_test.replace(old_alias_assertion, new_alias_assertion, 1)
          core_test_path.write_text(core_test, encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          old_status = 'MCP_ASSET_AUTHORING_USAGE_SLIMMING_SOURCE_COMPLETE_LOCAL_PROOF_REQUIRED'
          new_status = 'MCP_TOOL_EXPOSURE_WIRE_AUDIT_COMPLETE_LOCAL_DEFERRED_LOADING_PROOF_REQUIRED'
          if next_text.count(old_status) != 1:
              raise SystemExit('Unexpected next-action status')
          next_text = next_text.replace(old_status, new_status, 1)
          anchor = '''The final pre-local **Context & Payload Cleanup** keeps the same capability surface while reducing duplicated agent-facing prose: the canonical workflow prompt is compact, measured metadata hotspots are shortened without removing input constraints, panel descriptions use real tool descriptions, Texture resources no longer return raw `source`, and validator status is summary-only with lazy detail resources. Tool annotations were audited and already provide a read-vs-mutation hint across the full generated catalog, so no annotation churn was added. `nodes://` remains unchanged pending direct TextureMesh ownership.\n'''
          note = '''\nThe actual stateless MCP `tools/list` wire surface is now measured rather than inferred from generated docs: **65 enabled tools / 72,817 response characters**, including **48,119 characters of input schemas** and **11,786 characters of tool descriptions**. A geometry-only 15-tool lane would be much smaller, but it is **not** adopted as the default because it would remove texture/animation/Locator paths and therefore would not preserve the same end-to-end product result. The next large usage lever must be proven on the real Codex client as native lazy/deferred MCP tool loading (or an equivalent client-side mechanism) before BlockIT adds a custom router/profile.\n\nNo-loss wire cleanup also removes exact duplicate Cube correction aliases (`cube = after` and batch `cubes = effects[].after`) and keeps recovery JSON compact while preserving the authoritative `before` / `after` / `geometry_effect` data.\n'''
          if next_text.count(anchor) != 1:
              raise SystemExit('Unexpected next-action context cleanup anchor')
          next_text = next_text.replace(anchor, anchor + note, 1)
          next_path.write_text(next_text, encoding='utf-8')

          # Snapshot tests should protect invariants, not freeze a superseded status label.
          for rel in [
              'mcp/tests/model-effectiveness-minimum-evidence.test.ts',
              'mcp/tests/context-payload-cleanup.test.ts',
              'mcp/tests/asset-authoring-usage-slimming.test.ts',
          ]:
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  'expect(next).toContain("MCP_ASSET_AUTHORING_USAGE_SLIMMING_SOURCE_COMPLETE_LOCAL_PROOF_REQUIRED");',
                  'expect(next).toContain("MCP_TOOL_EXPOSURE_WIRE_AUDIT_COMPLETE_LOCAL_DEFERRED_LOADING_PROOF_REQUIRED");'
              )
              path.write_text(text, encoding='utf-8')
          PY
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit cleanup and remove temporary workflows
        run: |
          git rm .github/workflows/audit-tools-list-wire.yml .github/workflows/apply-no-loss-wire-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "refactor: trim duplicate MCP wire payload"
          git push origin HEAD:Local
