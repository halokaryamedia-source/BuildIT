name: Harden Texture Pixel Dimensions

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/harden-texture-pixel-dimensions.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Require integer texture pixel dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          texture_path = Path('mcp/server/tools/texture.ts')
          texture = texture_path.read_text(encoding='utf-8')
          old_dims = '    width: z.number().min(16).max(4096).default(16),\n    height: z.number().min(16).max(4096).default(16),'
          new_dims = '    width: z.number().int().min(16).max(4096).default(16),\n    height: z.number().int().min(16).max(4096).default(16),'
          if texture.count(old_dims) != 1:
              raise SystemExit('Unexpected create_texture pixel dimensions')
          texture_path.write_text(texture.replace(old_dims, new_dims, 1), encoding='utf-8')

          test_path = Path('mcp/tests/p1-core-ownership.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = '  test("required explicit references reject the empty string", () => {'
          addition = '  test("authored texture pixel dimensions are integer-valued", () => {\n    expect(\n      createTextureParameters.safeParse({ name: "skin", width: 16.5, height: 16 }).success\n    ).toBe(false);\n    expect(\n      createTextureParameters.safeParse({ name: "skin", width: 16, height: 32.25 }).success\n    ).toBe(false);\n    expect(\n      createTextureParameters.safeParse({ name: "skin", width: 16, height: 32 }).success\n    ).toBe(true);\n  });\n\n'
          if test.count(marker) != 1:
              raise SystemExit('Unexpected p1 ownership insertion point')
          test_path.write_text(test.replace(marker, addition + marker, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = '`create_texture` now follows the same deterministic filesystem rule for image-file inputs: inline `data:image/...` remains valid, while file inputs must resolve to an absolute POSIX/Windows/UNC path (directly or through `file://`). Relative paths and remote HTTP URLs are rejected before Blockbench file access.'
          extra = '\n\n`create_texture` pixel dimensions now require integer values within the existing 16..4096 range. Fractional pixel sizes are rejected at the MCP boundary; `create_project` is unchanged because it does not expose texture-dimension inputs, and no power-of-two restriction was added.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected texture source continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-texture-pixel-dimensions.yml
          git add mcp/server/tools/texture.ts mcp/tests/p1-core-ownership.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'fix: require integer texture dimensions'
          git push origin HEAD:Local
