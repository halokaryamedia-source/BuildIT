name: PRO-8 Controller Inspection

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/pro8-controller-inspection.yml"

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Install dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Apply bounded PRO-8 patch
        run: python3 .github/scripts/pro8_controller_inspection.py
      - name: Regenerate owners
        working-directory: mcp
        run: |
          bun run prompts:build
          bun run docs:build
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Measure default MCP surface
        working-directory: mcp
        run: bun run measure:surface
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Generated docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Commit retained PRO-8 state and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/pro8-controller-inspection.yml
          git rm -f .github/scripts/pro8_controller_inspection.py
          git add -A
          git commit -m "feat: inspect authored animation controllers"
          git push origin HEAD:Local
