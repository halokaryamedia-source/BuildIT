name: Audit Duplicate Structured Payloads

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/audit-duplicate-structured-payload.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - name: Find duplicated text and structured payloads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path('mcp/server/tools').glob('*.ts')):
              lines = path.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines):
                  if 'structuredContent' not in line:
                      continue
                  start = max(0, i - 24)
                  end = min(len(lines), i + 8)
                  block = '\n'.join(lines[start:end])
                  if 'JSON.stringify' in block:
                      print(f'--- {path}:{i+1} ---')
                      print(block)
          PY
      - name: Remove temporary audit workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-duplicate-structured-payload.yml
          git commit -m 'chore: remove temporary structured payload audit'
          git push origin HEAD:Local