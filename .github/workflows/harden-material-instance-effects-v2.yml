name: Harden Material Instance Effects V2

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/harden-material-instance-effects-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Make material-instance mutations deterministic and effect-based
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('mcp/server/tools/material-instances.ts')
          text = path.read_text(encoding='utf-8')

          faces_start = text.index('/** Faces array with default to all faces */')
          faces_end = text.index('/** Parameters for getting face material instances */', faces_start)
          text = text[:faces_start] + dedent('''
          const nonEmptyUniqueFacesSchema = z
            .array(faceEnum)
            .min(1)
            .refine((faces) => new Set(faces).size === faces.length, {
              message: "Each face may appear at most once in one material-instance face list.",
            });

          /** Faces array with default to all faces */
          export const facesArrayWithDefaultSchema = nonEmptyUniqueFacesSchema
            .optional()
            .default(faceEnum.options)
            .describe("Unique faces to set the material instance on. Defaults to all faces.");

          /** Faces array optional */
          export const facesArrayOptionalSchema = nonEmptyUniqueFacesSchema
            .optional()
            .describe("Specific unique non-empty face set to get/clear. If omitted, uses all faces.");

          ''') + text[faces_end:]

          assignment_start = text.index('/** Single material instance assignment */')
          assignment_end = text.index('/** Parameters for bulk setting material instances */', assignment_start)
          text = text[:assignment_start] + dedent('''
          /** Single material instance assignment */
          export const materialInstanceAssignmentSchema = z.object({
            cube_id: cubeIdSchema,
            faces: nonEmptyUniqueFacesSchema.describe(
              "Unique non-empty faces to set the material instance on."
            ),
            material_name: z.string().describe("Material instance name to assign."),
          });

          ''') + text[assignment_end:]

          helper_anchor = '// ============================================================================\n// Material Instance Tool Docs\n// ============================================================================'
          if text.count(helper_anchor) != 1:
              raise SystemExit('Unexpected material-instance tool docs anchor')
          helper = dedent('''
          export function requireUniqueResolvedMaterialInstanceWrites(
            assignments: readonly {
              cube_uuid: string;
              faces: readonly string[];
              material_name: string;
            }[]
          ): void {
            const materialByTarget = new Map<string, string>();
            for (const assignment of assignments) {
              for (const face of assignment.faces) {
                const key = `${assignment.cube_uuid}:${face}`;
                const previousMaterial = materialByTarget.get(key);
                if (previousMaterial !== undefined) {
                  const kind =
                    previousMaterial === assignment.material_name
                      ? "redundantly"
                      : "with conflicting material names";
                  throw new Error(
                    `Bulk material-instance request writes Cube ${assignment.cube_uuid} face ${face} more than once ${kind}. Merge each resolved Cube/face target into one assignment.`
                  );
                }
                materialByTarget.set(key, assignment.material_name);
              }
            }
          }

          ''')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          replacements = {
            '      "Sets material-instance metadata on one or more Bedrock cube faces using the face field preserved by Blockbench\'s Bedrock geometry codec.",': '      "Sets material-instance metadata only when the requested Bedrock Cube faces would actually change. Explicit face lists are unique; zero-change requests fail before Undo.",',
            '      "Sets material instance names on multiple cubes at once. Useful for assigning different material instances to different faces across the project.",': '      "Sets material-instance names across multiple explicit Cubes after resolving all identities. A resolved Cube/face may be written only once per call; conflicts, redundant duplicate targets, and all-no-op batches fail before Undo.",',
            '      "Clears (removes) material instance names from cube faces. Useful for resetting material assignments.",': '      "Clears material-instance names only from faces that currently contain one. Unique face lists and actual-change preflight prevent empty Undo/no-op success.",',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Unexpected material-instance description: {old[:32]}')
              text = text.replace(old, new, 1)

          def replace_tool(index, next_index, new_block):
              global text
              start = text.index(f'  createTool(\n    materialInstanceToolDocs[{index}].name')
              if next_index is None:
                  end = len(text) - 2 if text.endswith('\n}') else len(text)
              else:
                  end = text.index(f'\n\n  createTool(\n    materialInstanceToolDocs[{next_index}].name', start)
              text = text[:start] + dedent(new_block).rstrip() + text[end:]

          replace_tool(1, 2, '''
          createTool(
            materialInstanceToolDocs[1].name,
            {
              ...materialInstanceToolDocs[1],
              async execute({ cube_id, material_name, faces }) {
                const requestedCubes = cube_id ? [findCubeOrThrow(cube_id)] : Cube.selected;
                if (!requestedCubes.length) {
                  throw new Error(
                    "No cube specified and no cubes selected. Provide a cube_id or select cubes."
                  );
                }

                const cubesByUuid = new Map(
                  requestedCubes.map((cube) => [cube.uuid, cube] as const)
                );
                const changes: Array<{
                  cube: Cube;
                  faceDir: z.infer<typeof faceEnum>;
                }> = [];
                for (const cube of cubesByUuid.values()) {
                  for (const faceDir of faces) {
                    const face = cube.faces[faceDir];
                    if (face && (face.material_name || "") !== material_name) {
                      changes.push({ cube, faceDir });
                    }
                  }
                }
                if (!changes.length) {
                  throw new Error(
                    `No material-instance changes are required; all requested faces already use "${material_name}".`
                  );
                }

                const changedCubes = Array.from(
                  new Map(changes.map(({ cube }) => [cube.uuid, cube] as const)).values()
                );
                Undo.initEdit({ elements: changedCubes, uv_only: true });
                try {
                  for (const { cube, faceDir } of changes) {
                    cube.faces[faceDir].extend({ material_name });
                  }
                  Undo.finishEdit("Set material instances");
                } catch (error) {
                  Undo.cancelEdit(true);
                  Canvas.updateAll();
                  throw error;
                }
                Canvas.updateAll();

                const result = {
                  requested_cubes: cubesByUuid.size,
                  changed_cubes: changedCubes.length,
                  changed_faces: changes.length,
                  material_name,
                };
                return {
                  content: [{
                    type: "text" as const,
                    text: `Set material instance "${material_name}" on ${changes.length} changed face(s) across ${changedCubes.length} cube(s).`,
                  }],
                  structuredContent: result,
                };
              },
            },
            materialInstanceToolDocs[1].status
          );
          ''')

          replace_tool(3, 4, '''
          createTool(
            materialInstanceToolDocs[3].name,
            {
              ...materialInstanceToolDocs[3],
              async execute({ assignments }) {
                const resolvedAssignments = assignments.map((assignment) => ({
                  cube: findCubeOrThrow(assignment.cube_id),
                  faces: assignment.faces,
                  material_name: assignment.material_name,
                }));
                requireUniqueResolvedMaterialInstanceWrites(
                  resolvedAssignments.map((assignment) => ({
                    cube_uuid: assignment.cube.uuid,
                    faces: assignment.faces,
                    material_name: assignment.material_name,
                  }))
                );

                const changes: Array<{
                  cube: Cube;
                  faceDir: z.infer<typeof faceEnum>;
                  material_name: string;
                }> = [];
                for (const assignment of resolvedAssignments) {
                  for (const faceDir of assignment.faces) {
                    const face = assignment.cube.faces[faceDir];
                    if (face && (face.material_name || "") !== assignment.material_name) {
                      changes.push({
                        cube: assignment.cube,
                        faceDir,
                        material_name: assignment.material_name,
                      });
                    }
                  }
                }
                if (!changes.length) {
                  throw new Error(
                    "Bulk material-instance request has no authored effect; all resolved Cube/face targets already contain the requested values."
                  );
                }

                const changedCubes = Array.from(
                  new Map(changes.map(({ cube }) => [cube.uuid, cube] as const)).values()
                );
                Undo.initEdit({ elements: changedCubes, uv_only: true });
                try {
                  for (const { cube, faceDir, material_name } of changes) {
                    cube.faces[faceDir].extend({ material_name });
                  }
                  Undo.finishEdit("Bulk set material instances");
                } catch (error) {
                  Undo.cancelEdit(true);
                  Canvas.updateAll();
                  throw error;
                }
                Canvas.updateAll();

                const result = {
                  requested_assignments: assignments.length,
                  resolved_cubes: new Set(
                    resolvedAssignments.map((assignment) => assignment.cube.uuid)
                  ).size,
                  changed_cubes: changedCubes.length,
                  changed_faces: changes.length,
                };
                return {
                  content: [{
                    type: "text" as const,
                    text: `Applied ${assignments.length} material-instance assignment(s); changed ${changes.length} face(s) on ${changedCubes.length} cube(s).`,
                  }],
                  structuredContent: result,
                };
              },
            },
            materialInstanceToolDocs[3].status
          );
          ''')

          clear_start = text.index('  createTool(\n    materialInstanceToolDocs[4].name')
          clear_block = dedent('''
          createTool(
            materialInstanceToolDocs[4].name,
            {
              ...materialInstanceToolDocs[4],
              async execute({ cube_id, faces, all_cubes }) {
                const requestedCubes = all_cubes
                  ? Cube.all
                  : cube_id
                    ? [findCubeOrThrow(cube_id)]
                    : Cube.selected;
                if (!requestedCubes.length) {
                  throw new Error(
                    "No cubes to clear. Provide a cube_id, select cubes, or use all_cubes=true in a project with Cubes."
                  );
                }

                const cubesByUuid = new Map(
                  requestedCubes.map((cube) => [cube.uuid, cube] as const)
                );
                const facesToClear = faces || faceEnum.options;
                const changes: Array<{
                  cube: Cube;
                  faceDir: z.infer<typeof faceEnum>;
                }> = [];
                for (const cube of cubesByUuid.values()) {
                  for (const faceDir of facesToClear) {
                    const face = cube.faces[faceDir];
                    if (face?.material_name) changes.push({ cube, faceDir });
                  }
                }
                if (!changes.length) {
                  throw new Error(
                    "No material instances matched the requested Cube/face scope; clear would have no authored effect."
                  );
                }

                const changedCubes = Array.from(
                  new Map(changes.map(({ cube }) => [cube.uuid, cube] as const)).values()
                );
                Undo.initEdit({ elements: changedCubes, uv_only: true });
                try {
                  for (const { cube, faceDir } of changes) {
                    cube.faces[faceDir].extend({ material_name: "" });
                  }
                  Undo.finishEdit("Clear material instances");
                } catch (error) {
                  Undo.cancelEdit(true);
                  Canvas.updateAll();
                  throw error;
                }
                Canvas.updateAll();

                const result = {
                  requested_cubes: cubesByUuid.size,
                  changed_cubes: changedCubes.length,
                  changed_faces: changes.length,
                };
                return {
                  content: [{
                    type: "text" as const,
                    text: `Cleared material instances from ${changes.length} changed face(s) across ${changedCubes.length} cube(s).`,
                  }],
                  structuredContent: result,
                };
              },
            },
            materialInstanceToolDocs[4].status
          );
          ''').rstrip()
          text = text[:clear_start] + clear_block + '\n}'
          path.write_text(text, encoding='utf-8')

          test_path = Path('mcp/tests/context-payload-cleanup.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old_import = '  materialInstanceAssignmentSchema,\n} from "@/server/tools/material-instances";'
          new_import = '  materialInstanceAssignmentSchema,\n  requireUniqueResolvedMaterialInstanceWrites,\n} from "@/server/tools/material-instances";'
          if test.count(old_import) != 1:
              raise SystemExit('Unexpected material-instance test import')
          test = test.replace(old_import, new_import, 1)

          marker = '    const parsed = listMaterialInstancesParametersSchema.parse({});'
          extra = dedent('''
            expect(
              materialInstanceAssignmentSchema.safeParse({
                cube_id: "cube-uuid",
                faces: ["north", "north"],
                material_name: "detail",
              }).success
            ).toBe(false);
            expect(() =>
              requireUniqueResolvedMaterialInstanceWrites([
                { cube_uuid: "same-cube", faces: ["north"], material_name: "detail" },
                { cube_uuid: "same-cube", faces: ["north"], material_name: "detail" },
              ])
            ).toThrow("more than once redundantly");
            expect(() =>
              requireUniqueResolvedMaterialInstanceWrites([
                { cube_uuid: "same-cube", faces: ["north"], material_name: "detail" },
                { cube_uuid: "same-cube", faces: ["north"], material_name: "glass" },
              ])
            ).toThrow("conflicting material names");

          ''')
          if test.count(marker) != 1:
              raise SystemExit('Unexpected material-instance test marker')
          test = test.replace(marker, ''.join('    ' + line + '\n' if line else '\n' for line in extra.splitlines()) + marker, 1)

          source_marker = '    expect(listBlock).not.toContain("null, 2");'
          source_extra = dedent('''
            const bulkStart = sourceText.indexOf("materialInstanceToolDocs[3].name");
            const clearStart = sourceText.indexOf("materialInstanceToolDocs[4].name", bulkStart);
            const bulkBlock = sourceText.slice(bulkStart, clearStart);
            expect(bulkBlock).toContain("cube_uuid: assignment.cube.uuid");
            expect(bulkBlock).toContain("requireUniqueResolvedMaterialInstanceWrites");
            expect(bulkBlock).toContain("changed_faces: changes.length");
            expect(bulkBlock).not.toContain("cubeCache[assignment.cube_id]");
            expect(sourceText).toContain("all requested faces already use");
            expect(sourceText).toContain("clear would have no authored effect");
          ''')
          if test.count(source_marker) != 1:
              raise SystemExit('Unexpected material-instance source assertion marker')
          formatted_extra = ''.join('    ' + line + '\n' if line else '\n' for line in source_extra.splitlines())
          test_path.write_text(test.replace(source_marker, source_marker + '\n' + formatted_extra.rstrip(), 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = 'Material-instance payload/mutation contracts are also bounded: empty face arrays are rejected before mutation, and `list_material_instances` now returns names + usage counts by default. Explicit `include_usages=true` returns at most 100 locations per instance by default (raiseable to 1000) with `usages_truncated` indicating omitted locations. No pagination/state framework was added.'
          extra = '\n\nMaterial-instance mutations now use actual-effect preflight. Explicit face lists reject duplicates; bulk assignments resolve Cube identities first and reject any repeated resolved Cube UUID + face target, including alias-driven duplicates and conflicting last-write-wins requests. Set/bulk/clear compute changed faces before Undo, reject all-no-op requests, snapshot only Cubes with actual changes, and return compact actual changed-face/Cube counts.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected material-instance continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-material-instance-effects.yml .github/workflows/harden-material-instance-effects-v2.yml
          git add mcp/server/tools/material-instances.ts mcp/tests/context-payload-cleanup.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'fix: make material-instance effects deterministic'
          git push origin HEAD:Local