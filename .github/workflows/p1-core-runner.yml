name: Run P1.3 Core Ownership Payload

on:
  push:
    paths:
      - ".github/workflows/p1-core-runner.yml"

permissions:
  contents: write
  actions: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Extract reviewed payload from first harness
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/p1-core-ownership-once.yml").read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          payload_lines = source[start:end].splitlines()
          payload = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in payload_lines
          ) + "\n"
          Path("/tmp/p1_core_ownership.py").write_text(payload)
          PY
          python /tmp/p1_core_ownership.py

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Generated docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Commit P1.3 source and tests
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mcp/lib/coreIdentity.ts \
            mcp/lib/util.ts \
            mcp/server/tools/cubes.ts \
            mcp/server/tools/element.ts \
            mcp/server/tools/texture.ts \
            mcp/server/tools/animation.ts \
            mcp/tests/p1-core-ownership.test.ts
          git diff --cached --check
          git commit -m "refactor: consolidate Bedrock core identity ownership"
          git push origin Local

      - name: Trigger canonical MCP verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mcp-verify.yml --ref Local
