name: Harden Export Model Write

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/harden-export-model-write.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Harden export_model artifact writes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          export_path = Path('mcp/server/tools/export.ts')
          text = export_path.read_text(encoding='utf-8')

          old_desc = '      "Compiles the active Bedrock Entity project as Bedrock geometry JSON or editable `.bbmodel`; optional filesystem write requires Blockbench permission. Other model codecs are rejected.",'
          new_desc = '      "Compiles the active Bedrock Entity project as Bedrock geometry JSON or editable `.bbmodel`. Filesystem writes require Blockbench permission, verify the written artifact, and refuse existing Bedrock geometry files rather than bypass native multi-model overwrite semantics.",'
          if text.count(old_desc) != 1:
              raise SystemExit('Unexpected export_model description')
          text = text.replace(old_desc, new_desc, 1)

          old_annotation = '      destructiveHint: false,'
          if text.count(old_annotation) != 1:
              raise SystemExit('Unexpected export_model destructive annotation')
          text = text.replace(old_annotation, '      destructiveHint: true,', 1)

          codec_tail = '\n'.join([
              '  support_partial_export?: boolean;',
              '};',
          ])
          fs_type = '\n'.join([
              '  support_partial_export?: boolean;',
              '};',
              '',
              'type ExportFilesystem = {',
              '  existsSync: (path: string) => boolean;',
              '  writeFileSync: (path: string, data: string | Buffer) => void;',
              '  statSync: (path: string) => {',
              '    isFile: () => boolean;',
              '    size: number;',
              '  };',
              '};',
          ])
          if text.count(codec_tail) != 1:
              raise SystemExit('Unexpected BlockITCodec tail')
          text = text.replace(codec_tail, fs_type, 1)

          compile_anchor = '\n'.join([
              '        const effectiveOptions =',
              '          options ??',
              '          (typeof codec.getExportOptions === "function"',
              '            ? codec.getExportOptions()',
              '            : undefined);',
              '        const rawResult = codec.compile(effectiveOptions);',
          ])
          compile_replacement = '\n'.join([
              '        let exportFs: ExportFilesystem | null = null;',
              '        if (path) {',
              '          const expectedExtension = (',
              '            codec.extension ?? (codec_id === "project" ? "bbmodel" : "json")',
              '          ).toLowerCase();',
              '          if (!path.toLowerCase().endsWith(`.${expectedExtension}`)) {',
              '            throw new Error(',
              '              `Export path for ${codec_id} must end in .${expectedExtension}; received ${path}.`',
              '            );',
              '          }',
              '',
              '          // @ts-ignore - requireNativeModule is a Blockbench desktop global.',
              '          exportFs = requireNativeModule("fs", {',
              '            message: `BlockIT export_model requested write access to save ${codec_id} output to ${path}`,',
              '          }) as ExportFilesystem | null;',
              '          if (!exportFs) {',
              '            throw new Error(',
              '              "File system access was denied. Omit `path` to receive the compiled content in the MCP response."',
              '            );',
              '          }',
              '          if (codec_id === "bedrock" && exportFs.existsSync(path)) {',
              '            throw new Error(',
              '              `Refusing to overwrite existing Bedrock geometry file ${path}. Native Blockbench uses codec overwrite/merge semantics for existing multi-model geometry files; export_model will not bypass that behavior. Choose a new path or use native Blockbench export/save for the existing file.`',
              '            );',
              '          }',
              '        }',
              '',
              '        const effectiveOptions =',
              '          options ??',
              '          (typeof codec.getExportOptions === "function"',
              '            ? codec.getExportOptions()',
              '            : undefined);',
              '',
              '        let rawResult: unknown;',
              '        if (codec_id === "project" && path) {',
              '          const previousSavePath = Project!.save_path;',
              '          try {',
              '            // Native bbmodel export compiles relative asset paths against the target file.',
              '            Project!.save_path = path;',
              '            rawResult = codec.compile(effectiveOptions);',
              '          } finally {',
              '            Project!.save_path = previousSavePath;',
              '          }',
              '        } else {',
              '          rawResult = codec.compile(effectiveOptions);',
              '        }',
          ])
          if text.count(compile_anchor) != 1:
              raise SystemExit('Unexpected export compile block')
          text = text.replace(compile_anchor, compile_replacement, 1)

          byte_anchor = '\n'.join([
              '        const encoding: "utf-8" | "base64" = binaryBuffer ? "base64" : "utf-8";',
              '',
              '        let wrote_to_path: string | null = null;',
          ])
          byte_replacement = '\n'.join([
              '        const encoding: "utf-8" | "base64" = binaryBuffer ? "base64" : "utf-8";',
              '        if (byteLength === 0) {',
              '          throw new Error(',
              '            `BlockIT codec "${codec_id}" compiled an empty artifact; no file was written.`',
              '          );',
              '        }',
              '',
              '        let wrote_to_path: string | null = null;',
          ])
          if text.count(byte_anchor) != 1:
              raise SystemExit('Unexpected export byte-length block')
          text = text.replace(byte_anchor, byte_replacement, 1)

          old_write = '\n'.join([
              '        if (path) {',
              '          // @ts-ignore - requireNativeModule is a Blockbench desktop global.',
              '          const fs = requireNativeModule("fs", {',
              '            message: `BlockIT export_model requested write access to save ${codec_id} output to ${path}`,',
              '          });',
              '          if (!fs) {',
              '            throw new Error(',
              '              "File system access was denied. Omit `path` to receive the compiled content in the MCP response."',
              '            );',
              '          }',
              '          fs.writeFileSync(path, binaryBuffer ?? (text ?? ""));',
              '          wrote_to_path = path;',
              '        }',
          ])
          new_write = '\n'.join([
              '        if (path && exportFs) {',
              '          exportFs.writeFileSync(path, binaryBuffer ?? (text ?? ""));',
              '          const writtenStat = exportFs.statSync(path);',
              '          if (!writtenStat.isFile() || writtenStat.size !== byteLength) {',
              '            throw new Error(',
              '              `Export write verification failed for ${path}: expected a regular file of ${byteLength} bytes, got ${writtenStat.isFile() ? `${writtenStat.size} bytes` : "a non-file target"}. The path may exist, but export_model will not report it as a verified artifact.`',
              '            );',
              '          }',
              '          wrote_to_path = path;',
              '        }',
          ])
          if text.count(old_write) != 1:
              raise SystemExit('Unexpected export filesystem write block')
          text = text.replace(old_write, new_write, 1)
          export_path.write_text(text, encoding='utf-8')

          test_path = Path('mcp/tests/asset-authoring-usage-slimming.test.ts')
          test = test_path.read_text(encoding='utf-8')
          test_marker = '  test("filesystem export path must be platform-absolute", () => {'
          test_block = '\n'.join([
              '  test("filesystem export preserves native target semantics and verifies writes", async () => {',
              '    const exportSource = await source("server/tools/export.ts");',
              '    expect(exportSource).toContain(\'destructiveHint: true\');',
              '    expect(exportSource).toContain(\'codec_id === "bedrock" && exportFs.existsSync(path)\');',
              '    expect(exportSource).toContain("const previousSavePath = Project!.save_path");',
              '    expect(exportSource).toContain("Project!.save_path = path;");',
              '    expect(exportSource).toContain("Project!.save_path = previousSavePath;");',
              '    expect(exportSource).toContain("byteLength === 0");',
              '    expect(exportSource).toContain("exportFs.statSync(path)");',
              '    expect(exportSource).toContain("!writtenStat.isFile() || writtenStat.size !== byteLength");',
              '    expect(exportSource).toContain("must end in .${expectedExtension}");',
              '',
              '    const existingGuard = exportSource.indexOf(\'codec_id === "bedrock" && exportFs.existsSync(path)\');',
              '    const compileCall = exportSource.indexOf("codec.compile(effectiveOptions)");',
              '    const writeCall = exportSource.indexOf("exportFs.writeFileSync");',
              '    const statCall = exportSource.indexOf("exportFs.statSync(path)");',
              '    expect(existingGuard).toBeGreaterThan(-1);',
              '    expect(existingGuard).toBeLessThan(compileCall);',
              '    expect(writeCall).toBeGreaterThan(-1);',
              '    expect(writeCall).toBeLessThan(statCall);',
              '  });',
              '',
          ])
          if test.count(test_marker) != 1:
              raise SystemExit('Unexpected export test insertion point')
          test_path.write_text(test.replace(test_marker, test_block + test_marker, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          next_marker = 'Filesystem path ownership is now consistent across model export and texture-set import: both require an absolute POSIX, Windows-drive, or UNC path before filesystem access. The shared check is a small pure helper reused by the two existing callers; no filesystem abstraction/framework was introduced.'
          next_extra = '\n\n`export_model` filesystem writes are now artifact-truthful as well: `.bbmodel` compilation temporarily uses the requested target as `Project.save_path` so native relative asset paths are computed against the destination and then restores editor state; existing Bedrock geometry files are refused instead of bypassing Blockbench\'s native multi-model overwrite/merge path; target extensions must match the selected codec; empty compiled output is rejected; and a synchronous write is reported only after the target is a regular file with the exact compiled byte size. No merge framework, hash/readback layer, or save-state abstraction was added.'
          if next_text.count(next_marker) != 1:
              raise SystemExit('Unexpected next-action filesystem anchor')
          next_path.write_text(next_text.replace(next_marker, next_marker + next_extra, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-export-model-write.yml
          git add mcp/server/tools/export.ts mcp/tests/asset-authoring-usage-slimming.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'fix: harden export_model artifact writes'
          git push origin HEAD:Local
