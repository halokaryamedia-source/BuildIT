name: Full Pipeline Acceptance

on:
  push:
    branches:
      - Rework
    paths:
      - ".github/scripts/apply_full_pipeline_acceptance.py"
      - ".github/scripts/fix_full_pipeline_simulation_test.py"
      - ".github/workflows/full-pipeline-acceptance.yml"
      - "mcp-blockbench/src/lib/pipelineAcceptance.ts"
      - "mcp-blockbench/tests/giraffe-full-pipeline-simulation.test.ts"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/apply_full_pipeline_acceptance.py"
      - ".github/scripts/fix_full_pipeline_simulation_test.py"
      - ".github/workflows/full-pipeline-acceptance.yml"
      - "mcp-blockbench/src/lib/pipelineAcceptance.ts"
      - "mcp-blockbench/tests/giraffe-full-pipeline-simulation.test.ts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-pipeline-acceptance-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  simulate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Rework
        uses: actions/checkout@v4
        with:
          ref: Rework
          fetch-depth: 0

      - name: Integrate runtime acceptance validators
        run: python .github/scripts/apply_full_pipeline_acceptance.py

      - name: Fix simulation assertion
        run: python .github/scripts/fix_full_pipeline_simulation_test.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: mcp-blockbench
        run: bun install --frozen-lockfile

      - name: Synchronize production skills
        working-directory: mcp-blockbench
        run: bun run skills:sync

      - name: Verify synchronized skills
        working-directory: mcp-blockbench
        run: bun run skills:check

      - name: Typecheck
        working-directory: mcp-blockbench
        run: bun run typecheck

      - name: Run full tests and giraffe simulation
        working-directory: mcp-blockbench
        run: |
          set +e
          bun test > ../full-pipeline-test.log 2>&1
          code=$?
          cat ../full-pipeline-test.log
          exit $code

      - name: Upload simulation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-pipeline-simulation-log
          path: full-pipeline-test.log
          retention-days: 2
          if-no-files-found: ignore

      - name: Build canonical plugin
        working-directory: mcp-blockbench
        run: bun run build

      - name: Verify full-pipeline bundle markers
        working-directory: mcp-blockbench
        run: |
          bun -e 'const text = await Bun.file("dist/mcp.js").text(); for (const marker of ["ATLAS_DOWNGRADE_FORBIDDEN", "EYE_UV_BUDGET_INSUFFICIENT", "ANIMATION_SCALE_KEYFRAMES_FORBIDDEN", "ANIMATION_ROOT_MOTION_FORBIDDEN", "ANIMATION_LOOP_MODE_MISMATCH", "SNAP_RESIZE_ROTATE"]) { if (!text.includes(marker)) throw new Error(`Missing full-pipeline marker: ${marker}`); }'

      - name: Commit verified runtime integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp-blockbench/src/server/tools/workflow.ts
          git add mcp-blockbench/src/lib/pipelineAcceptance.ts
          git add mcp-blockbench/tests/giraffe-full-pipeline-simulation.test.ts
          git add .agents/skills .codex/skills
          git add -f mcp-blockbench/dist/mcp.js
          if git diff --cached --quiet; then
            echo "Full-pipeline acceptance already integrated."
            exit 0
          fi
          git commit -m "test: enforce smooth giraffe geometry texture animation pipeline"
          git pull --rebase origin Rework
          git push origin HEAD:Rework
