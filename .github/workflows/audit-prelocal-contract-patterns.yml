name: "Audit Pre-local Contract Patterns"

on:
  push:
    branches: [Local]
    paths:
      - ".github/workflows/audit-prelocal-contract-patterns.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - name: Print bounded source candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('mcp/server/tools'), Path('mcp/lib')]
          files = sorted(p for root in roots for p in root.glob('*.ts'))

          print('=== OPTIONAL_REFERENCE_SCHEMA_CALLERS ===')
          names = [
              'textureIdOptionalSchema', 'animationIdOptionalSchema',
              'groupIdOptionalSchema', 'cubeIdOptionalSchema',
              'meshIdOptionalSchema', 'faceKeysOptionalSchema',
          ]
          for name in names:
              print(f'-- {name}')
              for path in files:
                  for i, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      if name in line:
                          print(f'{path}:{i}:{line.strip()}')

          print('=== GENERIC_VECTOR3_CALLERS ===')
          for path in files:
              lines = path.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines, 1):
                  if 'vector3Schema' in line and 'import' not in line:
                      print(f'{path}:{i}:{line.strip()}')

          print('=== GENERIC_TIME_RANGE_CALLERS ===')
          for path in files:
              for i, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if 'timeRangeSchema' in line and 'import' not in line and 'export const timeRangeSchema' not in line:
                      print(f'{path}:{i}:{line.strip()}')

          print('=== PRETTY_JSON_OUTPUT ===')
          for path in files:
              text = path.read_text(encoding='utf-8')
              for m in re.finditer(r'JSON\.stringify\([^\n]*,\s*null,\s*2\)', text):
                  line = text.count('\n', 0, m.start()) + 1
                  print(f'{path}:{line}:{m.group(0)[:180]}')
              # multiline simple heuristic
              for i, line in enumerate(text.splitlines(), 1):
                  if ', null, 2)' in line or ', null, 2);' in line:
                      print(f'{path}:{i}:{line.strip()}')

          print('=== STRUCTURED_PLUS_JSON_TEXT ===')
          for path in files:
              text = path.read_text(encoding='utf-8')
              if 'structuredContent:' in text and ('text: JSON.stringify(result)' in text or 'text: JSON.stringify(' in text):
                  print(path)

          print('=== TRUTHY_OPTIONAL_TARGET_PATTERNS ===')
          patterns = [
              r'if \(!texture\)', r'cube_id \?', r'if \(!animation', r'if \(!reference\)',
              r'if \(.*_id\)', r'\? find.* : .*selected',
          ]
          for path in files:
              lines = path.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines, 1):
                  if any(re.search(pattern, line) for pattern in patterns):
                      print(f'{path}:{i}:{line.strip()}')

          print('=== OPTIONAL_STRING_WITHOUT_MIN_NEARBY ===')
          for path in files:
              lines = path.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines):
                  if '.string()' not in line:
                      continue
                  window = '\n'.join(lines[i:i+5])
                  if '.optional()' in window and '.min(1)' not in window and '.regex(' not in window:
                      print(f'{path}:{i+1}:{window.replace(chr(10), " | ")}')
          PY

      - name: Remove audit workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-prelocal-contract-patterns.yml
          git commit -m 'ci: remove pre-local contract audit helper'
          git push origin HEAD:Local
