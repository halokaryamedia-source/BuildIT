name: Apply Explicit Animation Copy Paste Contract

on:
  push:
    paths:
      - ".github/workflows/apply-animation-copy-paste-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Require explicit copy paste intent
        run: |
          python3 - <<'PY'
          from pathlib import Path

          animation_path = Path("mcp/server/tools/animation.ts")
          text = animation_path.read_text(encoding="utf-8")

          old_tail = "\n".join([
              "    })",
              "    .optional()",
              "    .describe(\"Target data for paste operation.\"),",
              "});",
              "",
              "export const animationToolDocs: ToolSpec[] = [",
          ])
          new_tail = "\n".join([
              "    })",
              "    .optional()",
              "    .describe(\"Target data for paste operation.\"),",
              "}).superRefine((params, ctx) => {",
              "  if (params.action === \"copy\" && params.source === undefined) {",
              "    ctx.addIssue({",
              "      code: z.ZodIssueCode.custom,",
              "      path: [\"source\"],",
              "      message: \"source is required for the copy action.\"",
              "    });",
              "  }",
              "",
              "  if (",
              "    (params.action === \"paste\" || params.action === \"mirror_paste\") &&",
              "    params.target === undefined",
              "  ) {",
              "    ctx.addIssue({",
              "      code: z.ZodIssueCode.custom,",
              "      path: [\"target\"],",
              "      message: \"target is required for paste and mirror_paste actions.\"",
              "    });",
              "  }",
              "",
              "  if (",
              "    params.action === \"mirror_paste\" &&",
              "    params.target !== undefined &&",
              "    params.target.mirror_axis === undefined",
              "  ) {",
              "    ctx.addIssue({",
              "      code: z.ZodIssueCode.custom,",
              "      path: [\"target\", \"mirror_axis\"],",
              "      message:",
              "        \"mirror_axis is required for mirror_paste; no implicit mirror axis is assumed.\"",
              "    });",
              "  }",
              "});",
              "",
              "export const animationToolDocs: ToolSpec[] = [",
          ])
          if text.count(old_tail) != 1:
              raise SystemExit("Unexpected animation copy/paste schema tail")
          text = text.replace(old_tail, new_tail, 1)

          old_axis = "\n".join([
              "          const mirrorAxis =",
              "            action === \"mirror_paste\" ? target.mirror_axis || \"x\" : null;",
          ])
          new_axis = "\n".join([
              "          const mirrorAxis =",
              "            action === \"mirror_paste\" ? target.mirror_axis! : null;",
          ])
          if text.count(old_axis) != 1:
              raise SystemExit("Unexpected mirror_paste axis fallback")
          text = text.replace(old_axis, new_axis, 1)

          old_description = "      \"Copies and pastes animation data between bones or animations. Copy requires at least one matching keyframe and paste rejects an empty clipboard before Undo.\"," 
          new_description = "      \"Copies and pastes animation data between bones or animations with action-specific source/target preflight. Copy requires at least one matching keyframe, paste rejects an empty clipboard before Undo, and mirror_paste requires an explicit mirror axis.\"," 
          if text.count(old_description) != 1:
              raise SystemExit("Unexpected copy/paste tool description")
          animation_path.write_text(text.replace(old_description, new_description, 1), encoding="utf-8")

          test_path = Path("mcp/tests/animation-mutation-contract.test.ts")
          test = test_path.read_text(encoding="utf-8")
          addition = "\n".join([
              "",
              "  test(\"copy/paste actions require their explicit source, target, and mirror axis\", async () => {",
              "    expect(animationCopyPasteParameters.safeParse({ action: \"copy\" }).success).toBe(false);",
              "    expect(animationCopyPasteParameters.safeParse({ action: \"paste\" }).success).toBe(false);",
              "    expect(",
              "      animationCopyPasteParameters.safeParse({",
              "        action: \"mirror_paste\",",
              "        target: { bone: \"arm\" },",
              "      }).success",
              "    ).toBe(false);",
              "    expect(",
              "      animationCopyPasteParameters.safeParse({",
              "        action: \"mirror_paste\",",
              "        target: { bone: \"arm\", mirror_axis: \"z\" },",
              "      }).success",
              "    ).toBe(true);",
              "",
              "    const source = await Bun.file(\"server/tools/animation.ts\").text();",
              "    expect(source).toContain(\"action === \\\"mirror_paste\\\" ? target.mirror_axis! : null\");",
              "    expect(source).not.toContain(\"target.mirror_axis || \\\"x\\\"\");",
              "  });",
          ])
          close_marker = "});\n"
          position = test.rfind(close_marker)
          if position == -1:
              raise SystemExit("Animation mutation test closing marker not found")
          test = test[:position] + addition + "\n" + test[position:]
          test_path.write_text(test, encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          old_note = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload, rejects empty `manage_keyframes` requests, requires an explicit `loop_mode` for the timeline loop mutation, rejects incomplete/effective no-op batch offset/scale requests, prevents empty animation copy/paste clipboard operations, and keeps the structured create result while compacting its duplicate text serialization. AnimationCodec behavior and playback semantics are unchanged."
          new_note = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload, rejects empty `manage_keyframes` requests, requires an explicit `loop_mode` for the timeline loop mutation, rejects incomplete/effective no-op batch offset/scale requests, prevents empty animation copy/paste clipboard operations, requires action-specific copy/paste source/target state, removes the implicit X-axis fallback from `mirror_paste`, and keeps the structured create result while compacting its duplicate text serialization. AnimationCodec behavior and playback semantics are unchanged."
          if next_text.count(old_note) != 1:
              raise SystemExit("Unexpected animation continuity note")
          next_path.write_text(next_text.replace(old_note, new_note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit copy paste contract and remove temporary workflow
        run: |
          git rm .github/workflows/apply-animation-copy-paste-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: require explicit animation copy paste intent"
          git push origin HEAD:Local
