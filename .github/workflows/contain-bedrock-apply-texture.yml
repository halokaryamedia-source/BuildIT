name: Contain Bedrock Apply Texture

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/contain-bedrock-apply-texture.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Contain generic per-face texture apply
        run: |
          python3 - <<'PY'
          from pathlib import Path

          texture_path = Path('mcp/server/tools/texture.ts')
          texture = texture_path.read_text(encoding='utf-8')
          old_desc = '      "Applies one explicit Texture to a Cube or Group scope; Group targets affect descendant Cubes. Element/Texture references must resolve uniquely before mutation. Generic Mesh is outside the Bedrock Entity surface.",'
          new_desc = '      "Legacy generic per-face Texture.apply wrapper. Disabled from the Bedrock Entity MCP surface because native Bedrock Entity is single_texture and Blockbench hides per-face apply actions there; use activate_texture for the active/default texture.",'
          if texture.count(old_desc) != 1:
              raise SystemExit('Unexpected apply_texture description')
          texture = texture.replace(old_desc, new_desc, 1)
          block_start = texture.index('  {\n    name: "apply_texture",')
          block_end = texture.index('\n  {\n    name: "add_texture_group",', block_start)
          block = texture[block_start:block_end]
          if block.count('    status: STATUS_STABLE,') != 1:
              raise SystemExit('Unexpected apply_texture status')
          block = block.replace('    status: STATUS_STABLE,', '    status: STATUS_EXPERIMENTAL,', 1)
          texture = texture[:block_start] + block + texture[block_end:]
          registration = '  }, textureToolDocs[1].status);'
          disabled_registration = '  }, textureToolDocs[1].status, false);'
          if texture.count(registration) != 1:
              raise SystemExit('Unexpected apply_texture registration')
          texture_path.write_text(texture.replace(registration, disabled_registration, 1), encoding='utf-8')

          skill_path = Path('.agents/skills/blockit-bedrock-texturing/SKILL.md')
          skill = skill_path.read_text(encoding='utf-8')
          if skill.count('- `apply_texture`\n') != 1:
              raise SystemExit('Unexpected apply_texture skill entry')
          skill = skill.replace('- `apply_texture`\n', '', 1)
          old_skill_line = '`apply_texture` targets Cube or Group scopes, not generic Mesh.'
          new_skill_lines = '\n'.join([
              '`apply_texture` is intentionally not enabled for Bedrock Entity. Native Bedrock Entity is a `single_texture` format, so use `activate_texture` to choose the active/default working texture. Use Painter operations for pixel changes and material-instance tools for native per-face material metadata.',
              '',
              'Do not route normal Bedrock work through generic per-face `Texture.apply()` semantics.',
          ])
          if skill.count(old_skill_line) != 1:
              raise SystemExit('Unexpected apply_texture skill guidance')
          skill_path.write_text(skill.replace(old_skill_line, new_skill_lines, 1), encoding='utf-8')

          generic_path = Path('docs/knowledge/reviews/mcp-prelocal-generic-semantics-audit-2026-08-10.md')
          generic = generic_path.read_text(encoding='utf-8')
          anchor = '### validator references\n'
          section = '\n'.join([
              '### `apply_texture`',
              '',
              '**DEFAULT-DISABLE** the inherited generic per-face `Texture.apply()` wrapper.',
              '',
              'Official Blockbench Bedrock Entity source defines `id: bedrock` with `single_texture: true`. The native Texture menu exposes face/blank/element apply actions only when `!Format.single_texture`, and `Face.getTexture()` resolves `Texture.getDefault()` for non-null faces when `Format.single_texture` is active. BlockIT already exposes `activate_texture`, which explicitly selects the intended Texture and therefore owns the active/default working texture without per-face apply or nested Undo.',
              '',
              'Keeping `apply_texture` enabled would add one generic tool to Codex, duplicate active-texture intent, retain ambient face-selection semantics for one mode, and invoke native `Texture.apply()` inside an outer BlockIT Undo edit. None of those are required Bedrock Entity capability. Source/catalog evidence remains for maintainers, but the tool is not callable from the enabled Bedrock MCP surface.',
              '',
          ])
          if generic.count(anchor) != 1:
              raise SystemExit('Unexpected generic semantics insertion point')
          generic_path.write_text(generic.replace(anchor, section + anchor, 1), encoding='utf-8')

          matrix_path = Path('docs/knowledge/reviews/bedrock-entity-capability-surface-matrix.md')
          matrix = matrix_path.read_text(encoding='utf-8')
          old_uv = '| Cube face UV / box UV / UV rotation | Cube face/UV fields in Cube tools + texture application | **Partial mapping** | Audit native `box_uv`, face UV rotation, mirror/offset semantics explicitly before any further UV reduction. Generic Mesh UV remains outside product scope. |'
          new_uv = '| Cube face UV / box UV / UV rotation | Cube face/UV fields in Cube tools | **Partial mapping** | Audit native `box_uv`, face UV rotation, mirror/offset semantics explicitly before any further UV reduction. Generic Mesh UV and generic per-face `Texture.apply()` remain outside the Bedrock Entity product path. |'
          old_texture = '| Texture creation/application/read | `create_texture`, `apply_texture`, `list_textures`, `get_texture`, `textures://{id}` | **Mapped** | Keep identity-strict texture targeting. |'
          new_texture = '| Texture creation/activation/read | `create_texture`, `activate_texture`, `list_textures`, `get_texture`, `textures://{id}` | **Mapped / narrowed** | Bedrock Entity is native `single_texture`; active/default texture selection is retained while generic per-face `apply_texture` is disabled. Paint, PBR, and `material_instance` retain their separate authored-state owners. |'
          if matrix.count(old_uv) != 1 or matrix.count(old_texture) != 1:
              raise SystemExit('Unexpected capability matrix texture rows')
          matrix = matrix.replace(old_uv, new_uv, 1).replace(old_texture, new_texture, 1)
          matrix_path.write_text(matrix, encoding='utf-8')

          default_test_path = Path('mcp/tests/default-registration-import-safe.test.ts')
          default_test = default_test_path.read_text(encoding='utf-8')
          anchor = '    expect(exposed.some((tool) => tool.name === "paint_with_brush")).toBe(true);'
          replacement = '\n'.join([
              anchor,
              '    expect(exposed.some((tool) => tool.name === "activate_texture")).toBe(true);',
              '    expect(exposed.some((tool) => tool.name === "apply_texture")).toBe(false);',
          ])
          if default_test.count(anchor) != 1:
              raise SystemExit('Unexpected default registration test anchor')
          default_test_path.write_text(default_test.replace(anchor, replacement, 1), encoding='utf-8')

          generic_test_path = Path('mcp/tests/prelocal-generic-semantics.test.ts')
          generic_test = generic_test_path.read_text(encoding='utf-8')
          marker = '  test("validator inferred element references declare their non-authoritative source", async () => {'
          addition = '\n'.join([
              '  test("generic per-face texture apply is disabled for Bedrock single-texture authoring", async () => {',
              '    const texture = await source("server/tools/texture.ts");',
              '    const skill = await source("../.agents/skills/blockit-bedrock-texturing/SKILL.md");',
              '    const audit = await source("../docs/knowledge/reviews/mcp-prelocal-generic-semantics-audit-2026-08-10.md");',
              '    expect(texture).toContain("textureToolDocs[1].status, false");',
              '    expect(texture).toContain("native Bedrock Entity is single_texture");',
              '    expect(skill).not.toContain("- `apply_texture`");',
              '    expect(skill).toContain("use `activate_texture` to choose the active/default working texture");',
              '    expect(audit).toContain("**DEFAULT-DISABLE** the inherited generic per-face `Texture.apply()` wrapper");',
              '  });',
              '',
          ])
          if generic_test.count(marker) != 1:
              raise SystemExit('Unexpected generic semantics test insertion point')
          generic_test_path.write_text(generic_test.replace(marker, addition + marker, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Measure actual default tools-list wire
        working-directory: mcp
        run: |
          cat > .measure-tools-list.ts <<'TS'
          import { McpServer } from "@modelcontextprotocol/sdk/server/mcp.js";
          import { WebStandardStreamableHTTPServerTransport } from "@modelcontextprotocol/sdk/server/webStandardStreamableHttp.js";
          import { registerToolsOnServer } from "./lib/factories";
          import "./server/tools";

          const server = new McpServer({ name: "blockit-wire-audit", version: "1.0.0" });
          registerToolsOnServer(server);
          const transport = new WebStandardStreamableHTTPServerTransport({
            sessionIdGenerator: undefined,
            enableJsonResponse: true,
          });
          await server.connect(transport);
          try {
            const response = await transport.handleRequest(new Request("http://127.0.0.1:3000/bb-mcp", {
              method: "POST",
              headers: {
                accept: "application/json, text/event-stream",
                "content-type": "application/json",
                "mcp-protocol-version": "2025-06-18",
              },
              body: JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} }),
            }));
            const text = await response.text();
            if (response.status !== 200) throw new Error(`tools/list status ${response.status}: ${text}`);
            const parsed = JSON.parse(text) as { result?: { tools?: Array<{ name?: string; description?: string; inputSchema?: unknown }> } };
            const tools = parsed.result?.tools ?? [];
            const metrics = {
              enabled_tools: tools.length,
              response_characters: text.length,
              input_schema_characters: tools.reduce((sum, tool) => sum + JSON.stringify(tool.inputSchema ?? {}).length, 0),
              description_characters: tools.reduce((sum, tool) => sum + (tool.description ?? "").length, 0),
              has_apply_texture: tools.some((tool) => tool.name === "apply_texture"),
              has_activate_texture: tools.some((tool) => tool.name === "activate_texture"),
            };
            console.log(JSON.stringify(metrics));
            await Bun.write(".wire-metrics.json", JSON.stringify(metrics));
            if (metrics.enabled_tools !== 64 || metrics.has_apply_texture || !metrics.has_activate_texture) {
              throw new Error(`Unexpected Bedrock tool surface: ${JSON.stringify(metrics)}`);
            }
          } finally {
            await server.close();
          }
          TS
          bun .measure-tools-list.ts
          rm .measure-tools-list.ts

      - name: Record measured exposure continuity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          metrics = json.loads(Path('mcp/.wire-metrics.json').read_text(encoding='utf-8'))
          Path('mcp/.wire-metrics.json').unlink()
          current_block = '\n'.join([
              f"{metrics['enabled_tools']} enabled tools",
              f"{metrics['response_characters']:,} response characters",
              f"{metrics['input_schema_characters']:,} input-schema characters",
              f"{metrics['description_characters']:,} tool-description characters",
          ])

          review_path = Path('docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md')
          review = review_path.read_text(encoding='utf-8')
          old_intro = 'A bounded GitHub CI audit ranked the **default 65 enabled tools** by compact Zod-derived schema and description footprint. This ranking is diagnostic, not a replacement for the already measured live `tools/list` baseline: the CI serializer is close enough to locate hotspots but is not byte-identical to the MCP SDK wire representation.'
          new_intro = 'A bounded GitHub CI audit originally ranked the **default 65 enabled tools** by compact Zod-derived schema and description footprint. That ranking is historical diagnostic evidence from before the later `apply_texture` containment; its category table is not rewritten as if it were a new measurement.'
          if review.count(old_intro) != 1:
              raise SystemExit('Unexpected deferred review footprint intro')
          review = review.replace(old_intro, new_intro, 1)
          old_baseline = '\n'.join([
              'Known actual stateless `tools/list` baseline remains:',
              '',
              '```text',
              '65 enabled tools',
              '72,817 response characters',
              '48,119 input-schema characters',
              '11,786 tool-description characters',
              '```',
          ])
          new_baseline = '\n'.join([
              'Historical actual stateless `tools/list` baseline before `apply_texture` containment:',
              '',
              '```text',
              '65 enabled tools',
              '72,817 response characters',
              '48,119 input-schema characters',
              '11,786 tool-description characters',
              '```',
              '',
              'Current actual stateless `tools/list` measurement after default-disabling generic per-face `apply_texture`:',
              '',
              '```text',
              current_block,
              '```',
              '',
              '`activate_texture` remains exposed; `apply_texture` is absent from the callable tools list. This is a Bedrock semantics correction, not a geometry benchmark profile or arbitrary context cut.',
          ])
          if review.count(old_baseline) != 1:
              raise SystemExit('Unexpected deferred review baseline block')
          review = review.replace(old_baseline, new_baseline, 1)
          review = review.replace('the full 65-tool BlockIT schema surface', 'the full current 64-tool BlockIT schema surface', 1)
          review = review.replace('existing full `tools/list` baseline of 65 enabled tools / 72,817 response characters', f"current full `tools/list` measurement of {metrics['enabled_tools']} enabled tools / {metrics['response_characters']:,} response characters", 1)
          review_path.write_text(review, encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          old_measure = 'The actual stateless MCP `tools/list` wire surface is now measured rather than inferred from generated docs: **65 enabled tools / 72,817 response characters**, including **48,119 characters of input schemas** and **11,786 characters of tool descriptions**. A geometry-only 15-tool lane would be much smaller, but it is **not** adopted as the default because it would remove texture/animation/Locator paths and therefore would not preserve the same end-to-end product result. The next large usage lever must be proven on the real Codex client as native lazy/deferred MCP tool loading (or an equivalent client-side mechanism) before BlockIT adds a custom router/profile.'
          new_measure = f"The actual stateless MCP `tools/list` wire surface has been re-measured after Bedrock semantic containment: **{metrics['enabled_tools']} enabled tools / {metrics['response_characters']:,} response characters**, including **{metrics['input_schema_characters']:,} characters of input schemas** and **{metrics['description_characters']:,} characters of tool descriptions**. The previous 65-tool / 72,817-character value remains historical evidence from before `apply_texture` was default-disabled. A geometry-only 15-tool lane is still **not** adopted as the default because it would remove retained texture/animation/Locator paths. The next large usage lever remains real Codex native lazy/deferred MCP tool loading proof before any BlockIT router/profile architecture."
          if next_text.count(old_measure) != 1:
              raise SystemExit('Unexpected next-action wire measurement paragraph')
          next_text = next_text.replace(old_measure, new_measure, 1)
          marker = 'Texture mutation/read payload ownership is now clearer: `create_texture` returns compact resulting metadata instead of embedding the created image bytes, while `get_texture` remains the explicit image-evidence path. `list_materials` and `get_material_info` also use compact JSON text without changing their data. Paint/PBR behavior and texture capability are unchanged.'
          extra = '\n\nGeneric `apply_texture` is now default-disabled from the Bedrock Entity MCP surface. Official Blockbench defines Bedrock Entity as `single_texture`, hides native per-face Texture.apply actions for that format, and resolves non-null face textures through `Texture.getDefault()`. `activate_texture` remains the explicit active/default texture owner. This removes one misleading generic tool and its nested-Undo path without removing Bedrock texture creation, painting, PBR, or material-instance capability.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected next-action texture continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/contain-bedrock-apply-texture.yml
          git add mcp/server/tools/texture.ts mcp/tests/default-registration-import-safe.test.ts mcp/tests/prelocal-generic-semantics.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json .agents/skills/blockit-bedrock-texturing/SKILL.md docs/knowledge/reviews/mcp-prelocal-generic-semantics-audit-2026-08-10.md docs/knowledge/reviews/bedrock-entity-capability-surface-matrix.md docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md docs/knowledge/next-action.md
          git commit -m 'refactor: contain generic texture apply from Bedrock surface'
          git push origin HEAD:Local