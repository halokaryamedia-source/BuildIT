name: Reference Studio Golden Sample Sync

on:
  push:
    branches:
      - Rework
    paths:
      - ".github/scripts/apply_reference_studio_golden_sync.py"
      - ".github/workflows/reference-studio-golden-sync.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/apply_reference_studio_golden_sync.py"
      - ".github/workflows/reference-studio-golden-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reference-studio-golden-sync-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  synchronize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Rework
        uses: actions/checkout@v4
        with:
          ref: Rework
          fetch-depth: 0

      - name: Apply synchronization patch
        run: python .github/scripts/apply_reference_studio_golden_sync.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: mcp-blockbench
        run: bun install --frozen-lockfile

      - name: Synchronize production skill adapters
        working-directory: mcp-blockbench
        run: bun run skills:sync

      - name: Verify synchronized skills
        working-directory: mcp-blockbench
        run: bun run skills:check

      - name: Typecheck
        working-directory: mcp-blockbench
        run: bun run typecheck

      - name: Test
        working-directory: mcp-blockbench
        run: bun test

      - name: Build canonical plugin
        working-directory: mcp-blockbench
        run: bun run build

      - name: Verify bundle identity
        working-directory: mcp-blockbench
        run: |
          bun -e 'const pkg = await Bun.file("package.json").json(); const text = await Bun.file("dist/mcp.js").text(); for (const marker of [`/* v${pkg.version} */`, `version:\"${pkg.version}\"`, "STABLE_FULL_LIBRARY", "ACTIVE_PROFILE_GUARDED", "current_session_continues", "right_side", "submit_geometry_for_review"]) { if (!text.includes(marker)) throw new Error(`Missing synchronized bundle marker: ${marker}`); }'

      - name: Commit verified synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f mcp-blockbench/dist/mcp.js
          if git diff --cached --quiet; then
            echo "Reference Studio and Golden Sample are already synchronized."
            exit 0
          fi
          git commit -m "docs: synchronize Reference Studio and Golden Sample"
          git push origin HEAD:Rework
