name: Apply Primary Geometry Hardening

on:
  push:
    paths:
      - ".github/workflows/apply-primary-geometry-hardening.yml"
      - "mcp/scripts/apply-primary-geometry-hardening.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply guarded patch
        run: python3 mcp/scripts/apply-primary-geometry-hardening.py
      - name: Install
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Tests
        working-directory: mcp
        run: bun run test
      - name: Build
        working-directory: mcp
        run: bun run build
      - name: Generate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .agents/skills/blockbench-bedrock-modelling/SKILL.md \
            docs/knowledge/decisions/reference-fidelity-loop.md \
            docs/knowledge/next-action.md \
            docs/knowledge/reviews/model-creation-effectiveness-audit-2026-08-10.md \
            mcp/server/tools/cubes.ts \
            mcp/prompts/bedrock_entity_workflow.md \
            mcp/prompts/manifest.json \
            mcp/tests/model-effectiveness-primary-geometry.test.ts \
            mcp/docs/api.json \
            mcp/docs/index.html
          git diff --cached --quiet && { echo "No hardening changes"; exit 1; }
          git commit -m "fix: separate Cube execution from visual approval"
          git push origin HEAD:Local
