name: "Audit Final Pre-local Cleanup"

on:
  push:
    branches: [Local]
    paths:
      - ".github/workflows/audit-final-cleanup.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - name: Audit current continuity and test coupling
        run: |
          echo '=== FILE SIZES ==='
          wc -l -c docs/knowledge/next-action.md \
            docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md \
            mcp/prompts/bedrock_entity_workflow.md \
            .agents/skills/blockit-bedrock-entity-mcp/SKILL.md \
            .agents/skills/blockbench-bedrock-modelling/SKILL.md \
            .agents/skills/blockit-bedrock-texturing/SKILL.md \
            .agents/skills/blockit-bedrock-animation/SKILL.md

          echo '=== NEXT-ACTION TEST COUPLING ==='
          rg -n 'next-action\.md|const next =|source\("\.\./docs/knowledge/next-action\.md"\)' mcp/tests || true

          echo '=== STATUS LITERALS ==='
          rg -n 'NON_LOCAL_PRELOCAL_READINESS_COMPLETE_LOCAL_ACCEPTANCE_REQUIRED|MCP_TOOL_EXPOSURE_WIRE_AUDIT_COMPLETE_LOCAL_DEFERRED_LOADING_PROOF_REQUIRED' . --glob '!mcp/dist/**' --glob '!mcp/docs/**' || true

          echo '=== NEXT-ACTION PHRASE ASSERTIONS ==='
          rg -n 'expect\(next\)\.toContain|expect\(next\)\.not\.toContain' mcp/tests || true

          echo '=== STALE NON-LOCAL CONTINUATION WORDING ==='
          rg -n 'If continuing non-local|continue non-local|Next Allowed Step|LOCAL — reference-fidelity acceptance scenarios' docs/knowledge/next-action.md || true

          echo '=== CURRENT/FINAL MEASUREMENT WORDING ==='
          rg -n 'Current actual|current source|current-source|Final pinned-SDK|final GitHub-only|final pre-local|final line' docs/knowledge/next-action.md docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md || true

          echo '=== DUPLICATED POLICY SIGNALS ==='
          rg -n 'Do not.*router|Do not.*profile|do \*\*not\*\* invent|No custom tool router|readiness state machine|efficiency mode|capability slice' docs/knowledge/next-action.md .agents/skills mcp/prompts/bedrock_entity_workflow.md || true

          echo '=== TEMP/RESIDUE FILES ==='
          find . -maxdepth 4 -type f \( -name '*tmp*' -o -name '*.bak' -o -name '*audit*helper*' -o -name '.final-*' -o -name '.measure-*' \) -print

      - name: Remove audit workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-final-cleanup.yml
          git commit -m 'ci: remove final cleanup audit helper'
          git push origin HEAD:Local
