name: Apply Animation No-op Mutation Guards

on:
  push:
    paths:
      - ".github/workflows/apply-animation-noop-preflight.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Harden animation no-op mutation contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          animation_path = Path("mcp/server/tools/animation.ts")
          text = animation_path.read_text(encoding="utf-8")

          old_batch = "\n".join([
              "export const batchKeyframeOperationsParameters = z.object({",
              "  selection: z",
              "    .enum([\"all\", \"selected\", \"range\", \"pattern\"])",
              "    .default(\"selected\")",
              "    .describe(\"Which keyframes to operate on.\"),",
              "  range: timeRangeSchema.optional().describe(\"Time range for keyframe selection.\"),",
              "  pattern: z",
              "    .object({",
              "      interval: z.number().describe(\"Time interval between keyframes.\"),",
              "      offset: z",
              "        .number()",
              "        .optional()",
              "        .default(0)",
              "        .describe(\"Time offset for the pattern.\"),",
              "    })",
              "    .optional()",
              "    .describe(\"Pattern-based selection.\"),",
              "  operation: z",
              "    .enum([\"offset\", \"scale\", \"reverse\", \"mirror\", \"smooth\", \"bake\"])",
              "    .describe(\"Operation to perform on keyframes.\"),",
              "  parameters: z",
              "    .object({",
              "      offset_time: z.number().optional().describe(\"Time offset to apply.\"),",
              "      offset_values: vector3Schema.optional().describe(\"Value offset to apply.\"),",
              "      scale_factor: z",
              "        .number()",
              "        .optional()",
              "        .describe(\"Scale factor for time or values.\"),",
              "      scale_pivot: z",
              "        .number()",
              "        .optional()",
              "        .describe(\"Pivot point for scaling.\"),",
              "      mirror_axis: axisEnum.optional().describe(\"Axis to mirror values across.\"),",
              "      bake_interval: z",
              "        .number()",
              "        .positive()",
              "        .optional()",
              "        .describe(\"Strictly positive interval in seconds for baking keyframes.\"),",
              "    })",
              "    .optional()",
              "    .describe(\"Operation-specific parameters.\"),",
              "});",
          ])
          new_batch = "\n".join([
              "export const batchKeyframeOperationsParameters = z",
              "  .object({",
              "    selection: z",
              "      .enum([\"all\", \"selected\", \"range\", \"pattern\"])",
              "      .default(\"selected\")",
              "      .describe(\"Which keyframes to operate on.\"),",
              "    range: timeRangeSchema.optional().describe(\"Time range for keyframe selection.\"),",
              "    pattern: z",
              "      .object({",
              "        interval: z",
              "          .number()",
              "          .finite()",
              "          .positive()",
              "          .describe(\"Finite positive time interval between keyframes.\"),",
              "        offset: z",
              "          .number()",
              "          .finite()",
              "          .optional()",
              "          .default(0)",
              "          .describe(\"Finite time offset for the pattern.\"),",
              "      })",
              "      .optional()",
              "      .describe(\"Pattern-based selection.\"),",
              "    operation: z",
              "      .enum([\"offset\", \"scale\", \"reverse\", \"mirror\", \"smooth\", \"bake\"])",
              "      .describe(\"Operation to perform on keyframes.\"),",
              "    parameters: z",
              "      .object({",
              "        offset_time: z.number().finite().optional().describe(\"Finite time offset to apply.\"),",
              "        offset_values: finiteCreateAnimationVector3Schema",
              "          .optional()",
              "          .describe(\"Finite value offset [x,y,z] to apply.\"),",
              "        scale_factor: z",
              "          .number()",
              "          .finite()",
              "          .optional()",
              "          .describe(\"Finite scale factor for keyframe time.\"),",
              "        scale_pivot: z",
              "          .number()",
              "          .finite()",
              "          .optional()",
              "          .describe(\"Finite pivot point for scaling.\"),",
              "        mirror_axis: axisEnum.optional().describe(\"Axis to mirror values across.\"),",
              "        bake_interval: z",
              "          .number()",
              "          .finite()",
              "          .positive()",
              "          .optional()",
              "          .describe(\"Strictly positive finite interval in seconds for baking keyframes.\"),",
              "      })",
              "      .optional()",
              "      .describe(\"Operation-specific parameters.\"),",
              "  })",
              "  .superRefine((params, ctx) => {",
              "    if (params.selection === \"range\" && params.range === undefined) {",
              "      ctx.addIssue({",
              "        code: z.ZodIssueCode.custom,",
              "        path: [\"range\"],",
              "        message: \"range is required when selection=range.\"",
              "      });",
              "    }",
              "    if (params.selection === \"pattern\" && params.pattern === undefined) {",
              "      ctx.addIssue({",
              "        code: z.ZodIssueCode.custom,",
              "        path: [\"pattern\"],",
              "        message: \"pattern is required when selection=pattern.\"",
              "      });",
              "    }",
              "",
              "    const operationParameters = params.parameters;",
              "    if (params.operation === \"mirror\" && operationParameters?.mirror_axis === undefined) {",
              "      ctx.addIssue({",
              "        code: z.ZodIssueCode.custom,",
              "        path: [\"parameters\", \"mirror_axis\"],",
              "        message: \"mirror_axis is required for the mirror operation.\"",
              "      });",
              "    }",
              "",
              "    if (params.operation === \"offset\") {",
              "      const timeDelta = operationParameters?.offset_time ?? 0;",
              "      const valueDelta = operationParameters?.offset_values ?? [0, 0, 0];",
              "      if (timeDelta === 0 && valueDelta.every((value) => value === 0)) {",
              "        ctx.addIssue({",
              "          code: z.ZodIssueCode.custom,",
              "          path: [\"parameters\"],",
              "          message: \"offset requires a non-zero offset_time or offset_values change.\"",
              "        });",
              "      }",
              "    }",
              "",
              "    if (params.operation === \"scale\") {",
              "      const factor = operationParameters?.scale_factor;",
              "      if (factor === undefined || factor === 1) {",
              "        ctx.addIssue({",
              "          code: z.ZodIssueCode.custom,",
              "          path: [\"parameters\", \"scale_factor\"],",
              "          message: \"scale requires an explicit scale_factor other than 1.\"",
              "        });",
              "      }",
              "    }",
              "  });",
          ])
          if text.count(old_batch) != 1:
              raise SystemExit("Unexpected batch keyframe schema shape")
          text = text.replace(old_batch, new_batch, 1)

          old_channels = "\n".join([
              "      channels: z",
              "        .array(animationChannelEnum)",
              "        .optional()",
              "        .default([\"rotation\", \"position\", \"scale\"])",
              "        .describe(\"Channels to copy.\"),",
          ])
          new_channels = "\n".join([
              "      channels: z",
              "        .array(animationChannelEnum)",
              "        .min(1)",
              "        .optional()",
              "        .default([\"rotation\", \"position\", \"scale\"])",
              "        .describe(\"One or more animation channels to copy.\"),",
          ])
          if text.count(old_channels) != 1:
              raise SystemExit("Unexpected copy channel schema shape")
          text = text.replace(old_channels, new_channels, 1)

          old_time_offset = "\n".join([
              "      time_offset: z",
              "        .number()",
              "        .optional()",
              "        .default(0)",
              "        .describe(\"Time offset for pasted keyframes.\"),",
          ])
          new_time_offset = "\n".join([
              "      time_offset: z",
              "        .number()",
              "        .finite()",
              "        .optional()",
              "        .default(0)",
              "        .describe(\"Finite time offset for pasted keyframes.\"),",
          ])
          if text.count(old_time_offset) != 1:
              raise SystemExit("Unexpected copy/paste time offset schema shape")
          text = text.replace(old_time_offset, new_time_offset, 1)

          registration_marker = "export function registerAnimationTools() {\n"
          helper = "\n".join([
              "export function countAnimationClipboardKeyframes(",
              "  channels: Record<string, readonly unknown[]>",
              "): number {",
              "  return Object.values(channels).reduce(",
              "    (count, keyframes) => count + keyframes.length,",
              "    0",
              "  );",
              "}",
              "",
          ])
          if text.count(registration_marker) != 1:
              raise SystemExit("Unexpected animation registration marker")
          text = text.replace(registration_marker, helper + registration_marker, 1)

          old_clipboard_write = "\n".join([
              "          // @ts-ignore",
              "          global.animationClipboard = copiedData;",
              "",
              "          return `Copied animation data from \"${source.bone}\" (${Object.keys(",
          ])
          new_clipboard_write = "\n".join([
              "          const copiedKeyframeCount = countAnimationClipboardKeyframes(",
              "            copiedData.channels",
              "          );",
              "          if (copiedKeyframeCount === 0) {",
              "            throw new Error(",
              "              `No keyframes matched the requested channels/time range for \"${source.bone}\". Clipboard was not changed.`",
              "            );",
              "          }",
              "",
              "          // @ts-ignore",
              "          global.animationClipboard = copiedData;",
              "",
              "          return `Copied animation data from \"${source.bone}\" (${Object.keys(",
          ])
          if text.count(old_clipboard_write) != 1:
              raise SystemExit("Unexpected animation clipboard write shape")
          text = text.replace(old_clipboard_write, new_clipboard_write, 1)

          old_clipboard_read = "\n".join([
              "          // @ts-ignore",
              "          const clipboardData = global.animationClipboard;",
              "          const mirrorAxis =",
          ])
          new_clipboard_read = "\n".join([
              "          // @ts-ignore",
              "          const clipboardData = global.animationClipboard;",
              "          if (countAnimationClipboardKeyframes(clipboardData.channels) === 0) {",
              "            throw new Error(",
              "              \"Animation clipboard contains no keyframe data. Copy a non-empty animation range first.\"",
              "            );",
              "          }",
              "          const mirrorAxis =",
          ])
          if text.count(old_clipboard_read) != 1:
              raise SystemExit("Unexpected animation clipboard read shape")
          text = text.replace(old_clipboard_read, new_clipboard_read, 1)

          old_batch_description = "    description: \"Performs batch operations on multiple keyframes at once.\"," 
          new_batch_description = "    description: \"Performs bounded batch keyframe operations and rejects incomplete or effective no-op offset/scale requests before mutation.\"," 
          if text.count(old_batch_description) != 1:
              raise SystemExit("Unexpected batch keyframe tool description")
          text = text.replace(old_batch_description, new_batch_description, 1)

          old_copy_description = "\n".join([
              "    description:",
              "      \"Copies and pastes animation data between bones or animations.\",",
          ])
          new_copy_description = "\n".join([
              "    description:",
              "      \"Copies and pastes animation data between bones or animations. Copy requires at least one matching keyframe and paste rejects an empty clipboard before Undo.\",",
          ])
          if text.count(old_copy_description) != 1:
              raise SystemExit("Unexpected animation copy/paste description")
          animation_path.write_text(text.replace(old_copy_description, new_copy_description, 1), encoding="utf-8")

          test_path = Path("mcp/tests/animation-mutation-contract.test.ts")
          test = test_path.read_text(encoding="utf-8")
          old_import = "\n".join([
              "import {",
              "  animationTimelineParameters,",
              "  manageKeyframesParameters,",
              "} from \"@/server/tools/animation\";",
          ])
          new_import = "\n".join([
              "import {",
              "  animationCopyPasteParameters,",
              "  animationTimelineParameters,",
              "  batchKeyframeOperationsParameters,",
              "  countAnimationClipboardKeyframes,",
              "  manageKeyframesParameters,",
              "} from \"@/server/tools/animation\";",
          ])
          if test.count(old_import) != 1:
              raise SystemExit("Unexpected animation mutation test import")
          test = test.replace(old_import, new_import, 1)

          addition = "\n".join([
              "",
              "  test(\"batch operations reject incomplete or effective no-op requests\", () => {",
              "    expect(",
              "      batchKeyframeOperationsParameters.safeParse({ operation: \"offset\" }).success",
              "    ).toBe(false);",
              "    expect(",
              "      batchKeyframeOperationsParameters.safeParse({",
              "        operation: \"offset\",",
              "        parameters: { offset_time: 0, offset_values: [0, 0, 0] },",
              "      }).success",
              "    ).toBe(false);",
              "    expect(",
              "      batchKeyframeOperationsParameters.safeParse({",
              "        operation: \"offset\",",
              "        parameters: { offset_time: 0.25 },",
              "      }).success",
              "    ).toBe(true);",
              "    expect(",
              "      batchKeyframeOperationsParameters.safeParse({ operation: \"scale\" }).success",
              "    ).toBe(false);",
              "    expect(",
              "      batchKeyframeOperationsParameters.safeParse({",
              "        operation: \"scale\",",
              "        parameters: { scale_factor: 1 },",
              "      }).success",
              "    ).toBe(false);",
              "    expect(",
              "      batchKeyframeOperationsParameters.safeParse({",
              "        operation: \"scale\",",
              "        parameters: { scale_factor: 1.5 },",
              "      }).success",
              "    ).toBe(true);",
              "    expect(",
              "      batchKeyframeOperationsParameters.safeParse({",
              "        selection: \"range\",",
              "        operation: \"reverse\",",
              "      }).success",
              "    ).toBe(false);",
              "    expect(",
              "      batchKeyframeOperationsParameters.safeParse({",
              "        selection: \"pattern\",",
              "        operation: \"reverse\",",
              "      }).success",
              "    ).toBe(false);",
              "  });",
              "",
              "  test(\"copy/paste contract rejects empty channel intent and detects empty clipboard data\", () => {",
              "    expect(",
              "      animationCopyPasteParameters.safeParse({",
              "        action: \"copy\",",
              "        source: { bone: \"root\", channels: [] },",
              "      }).success",
              "    ).toBe(false);",
              "    expect(",
              "      animationCopyPasteParameters.safeParse({",
              "        action: \"paste\",",
              "        target: { bone: \"root\", time_offset: Infinity },",
              "      }).success",
              "    ).toBe(false);",
              "    expect(countAnimationClipboardKeyframes({})).toBe(0);",
              "    expect(countAnimationClipboardKeyframes({ rotation: [], position: [] })).toBe(0);",
              "    expect(countAnimationClipboardKeyframes({ rotation: [{ time: 0 }] })).toBe(1);",
              "  });",
          ])
          close_marker = "});\n"
          position = test.rfind(close_marker)
          if position == -1:
              raise SystemExit("Animation mutation test closing marker not found")
          test = test[:position] + addition + "\n" + test[position:]
          test_path.write_text(test, encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          old_note = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload, rejects empty `manage_keyframes` requests, requires an explicit `loop_mode` for the timeline loop mutation, and keeps the structured create result while compacting its duplicate text serialization. AnimationCodec behavior and playback semantics are unchanged."
          new_note = "A bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload, rejects empty `manage_keyframes` requests, requires an explicit `loop_mode` for the timeline loop mutation, rejects incomplete/effective no-op batch offset/scale requests, prevents empty animation copy/paste clipboard operations, and keeps the structured create result while compacting its duplicate text serialization. AnimationCodec behavior and playback semantics are unchanged."
          if next_text.count(old_note) != 1:
              raise SystemExit("Unexpected animation continuity note")
          next_path.write_text(next_text.replace(old_note, new_note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit animation no-op guards and remove temporary workflow
        run: |
          git rm .github/workflows/apply-animation-noop-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: reject no-op animation batch and clipboard operations"
          git push origin HEAD:Local
