name: Align Export Target Identity

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/fix-export-target-identity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Align explicit export target identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          export_path = Path('mcp/server/tools/export.ts')
          export = export_path.read_text(encoding='utf-8')

          marker = '\nfunction toTextContent(raw: unknown): string {'
          helper = '\n'.join([
              '',
              'function filesystemFileName(path: string): string {',
              '  return path.split(/[\\\\/]/).pop() || path;',
              '}',
              '',
              'function filesystemStem(path: string): string {',
              '  return filesystemFileName(path).replace(/\\.[^.]+$/, "");',
              '}',
              '',
              'function toTextContent(raw: unknown): string {',
          ])
          if export.count(marker) != 1:
              raise SystemExit('Unexpected toTextContent marker')
          export = export.replace(marker, '\n' + helper, 1)

          old_compile = '\n'.join([
              '        if (codec_id === "project" && path) {',
              '          const previousSavePath = Project!.save_path;',
              '          try {',
              '            // Native bbmodel export compiles relative asset paths against the target file.',
              '            Project!.save_path = path;',
              '            rawResult = codec.compile(effectiveOptions);',
              '          } finally {',
              '            Project!.save_path = previousSavePath;',
              '          }',
              '        } else {',
          ])
          new_compile = '\n'.join([
              '        if (codec_id === "project" && path) {',
              '          const previousSavePath = Project!.save_path;',
              '          const previousName = Project!.name;',
              '          try {',
              '            // Native bbmodel export compiles relative assets and project identity against the target file.',
              '            Project!.save_path = path;',
              '            Project!.name = filesystemStem(path);',
              '            rawResult = codec.compile(effectiveOptions);',
              '          } finally {',
              '            Project!.save_path = previousSavePath;',
              '            Project!.name = previousName;',
              '          }',
              '        } else {',
          ])
          if export.count(old_compile) != 1:
              raise SystemExit('Unexpected project compile state block')
          export = export.replace(old_compile, new_compile, 1)

          old_file_name = '\n'.join([
              '          file_name:',
              '            typeof codec.fileName === "function" ? codec.fileName() : Project!.name,',
          ])
          new_file_name = '\n'.join([
              '          file_name:',
              '            path !== undefined',
              '              ? filesystemFileName(path)',
              '              : typeof codec.fileName === "function"',
              '                ? codec.fileName()',
              '                : Project!.name,',
          ])
          if export.count(old_file_name) != 1:
              raise SystemExit('Unexpected export result file_name block')
          export_path.write_text(export.replace(old_file_name, new_file_name, 1), encoding='utf-8')

          test_path = Path('mcp/tests/asset-authoring-usage-slimming.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = '    expect(exportSource).toContain("const previousSavePath = Project!.save_path");'
          addition = '\n'.join([
              marker,
              '    expect(exportSource).toContain("const previousName = Project!.name");',
              '    expect(exportSource).toContain("Project!.name = filesystemStem(path)");',
              '    expect(exportSource).toContain("Project!.name = previousName");',
              '    expect(exportSource).toContain("? filesystemFileName(path)");',
          ])
          if test.count(marker) != 1:
              raise SystemExit('Unexpected export test target marker')
          test_path.write_text(test.replace(marker, addition, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          old = '`create_project` / `get_project_info` / `export_model` now expose one consistent compact project lifecycle view: name/UUID, save path, export path/codec, and saved state. After a verified filesystem export, BlockIT reuses the native codec `afterSave(path)` lifecycle owner and verifies the project points at the written artifact before reporting synchronized success. Compile-only export does not mutate path/save lifecycle state. No project lifecycle state machine or parallel save framework was added.'
          new = old + ' Explicit `.bbmodel` path export also mirrors native pre-compile target identity by temporarily setting both `Project.save_path` and `Project.name`, then restoring them before verified write/lifecycle commit. When `path` is supplied, `file_name` now reports the actual path basename instead of a codec-suggested filename that may differ from the artifact written.'
          if next_text.count(old) != 1:
              raise SystemExit('Unexpected lifecycle continuity paragraph')
          next_path.write_text(next_text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified target identity change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-export-target-identity.yml
          git add mcp/server/tools/export.ts mcp/tests/asset-authoring-usage-slimming.test.ts docs/knowledge/next-action.md
          git commit -m 'fix: align export target file identity'
          git push origin HEAD:Local