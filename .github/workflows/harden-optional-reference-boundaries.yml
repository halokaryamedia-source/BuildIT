name: "Harden Optional Reference Boundaries"

on:
  push:
    branches: [Local]
    paths:
      - ".github/workflows/harden-optional-reference-boundaries.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Harden omission-only fallback references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          zod_path = Path('mcp/lib/zodObjects.ts')
          text = zod_path.read_text(encoding='utf-8')
          replacements = {
              '''export const textureIdOptionalSchema = z\n  .string()\n  .optional()\n  .describe("Texture ID or name. If not provided, uses selected texture.");''':
              '''export const textureIdOptionalSchema = z\n  .string()\n  .min(1)\n  .optional()\n  .describe("Non-empty Texture ID or name. Omit to use the selected/default texture.");''',
              '''export const animationIdOptionalSchema = z\n  .string()\n  .optional()\n  .describe("Animation UUID or name. If not provided, uses current animation.");''':
              '''export const animationIdOptionalSchema = z\n  .string()\n  .min(1)\n  .optional()\n  .describe("Non-empty Animation UUID or name. Omit to use the current animation where supported.");''',
              '''export const cubeIdOptionalSchema = z\n  .string()\n  .optional()\n  .describe("ID or name of the cube. If not provided, uses selected cube.");''':
              '''export const cubeIdOptionalSchema = z\n  .string()\n  .min(1)\n  .optional()\n  .describe("Non-empty Cube UUID or name. Omit to use the selected Cube(s) where supported.");''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'shared optional reference anchor changed: {old.splitlines()[0]}')
              text = text.replace(old, new, 1)
          zod_path.write_text(text, encoding='utf-8')

          texture_path = Path('mcp/server/tools/texture.ts')
          texture = texture_path.read_text(encoding='utf-8')
          old_layer = '''    layer_name: z\n      .string()\n      .optional()\n      .describe(\n        "Name of the texture layer. Required if fill_color is set."\n      ),'''
          new_layer = '''    layer_name: z\n      .string()\n      .min(1)\n      .optional()\n      .describe(\n        "Non-empty texture layer name. Required if fill_color is set."\n      ),'''
          if texture.count(old_layer) != 1:
              raise SystemExit('create_texture layer_name anchor changed')
          texture_path.write_text(texture.replace(old_layer, new_layer, 1), encoding='utf-8')

          test_path = Path('mcp/tests/p1-core-ownership.test.ts')
          test = test_path.read_text(encoding='utf-8')
          import_old = '''  boneNameSchema,\n  cubeIdSchema,\n  elementIdSchema,\n  textureIdSchema,\n} from "@/lib/zodObjects";'''
          import_new = '''  animationIdOptionalSchema,\n  boneNameSchema,\n  cubeIdOptionalSchema,\n  cubeIdSchema,\n  elementIdSchema,\n  textureIdOptionalSchema,\n  textureIdSchema,\n} from "@/lib/zodObjects";'''
          if test.count(import_old) != 1:
              raise SystemExit('p1 optional reference import anchor changed')
          test = test.replace(import_old, import_new, 1)

          anchor = '  test("UUID wins before exact unique name and names never prefix-match", () => {\n'
          new_test = '''  test("optional identity fallbacks require omission rather than empty references", () => {\n    for (const schema of [textureIdOptionalSchema, animationIdOptionalSchema, cubeIdOptionalSchema]) {\n      expect(schema.safeParse("").success).toBe(false);\n      expect(schema.safeParse(undefined).success).toBe(true);\n      expect(schema.safeParse("target").success).toBe(true);\n    }\n    expect(\n      createTextureParameters.safeParse({ name: "skin", fill_color: "#ffffff", layer_name: "" }).success\n    ).toBe(false);\n    expect(\n      createTextureParameters.safeParse({ name: "skin", fill_color: "#ffffff", layer_name: "base" }).success\n    ).toBe(true);\n  });\n\n'''
          if test.count(anchor) != 1:
              raise SystemExit('p1 optional reference test anchor changed')
          test_path.write_text(test.replace(anchor, new_test + anchor, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          anchor = '`find_elements_by_criteria` Cube-size filters now require finite components and reject contradictory per-axis `min_size > max_size` requests before discovery. Its `parent_group` wording, and the matching selection scope, now explicitly describe descendant-subtree behavior rather than implying direct-parent-only matching. Animation and texturing specialist preflight/verification also reuse lifecycle, identity, and mutation-returned state before issuing project/outline/material rereads; no cache, state tracker, capability gate, or new profile was added.'
          note = '\n\nShared optional Texture/Animation/Cube identity inputs now require non-empty strings when explicitly supplied; only omission activates the documented selected/current fallback. This closes empty-string fallback broadening in `get_texture`/Painter and material-instance targeting while leaving the fallback capability intact. `create_texture.layer_name` is also non-empty when supplied, so `fill_color` requests cannot satisfy the layer-name requirement with a value runtime would skip. No identity framework or mutation redesign was added.'
          if next_text.count(anchor) != 1:
              raise SystemExit('next-action optional reference anchor changed')
          next_path.write_text(next_text.replace(anchor, anchor + note, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit hardening and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-optional-reference-boundaries.yml
          git add mcp/lib/zodObjects.ts mcp/server/tools/texture.ts mcp/tests/p1-core-ownership.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'fix: require explicit optional references to be non-empty'
          git push origin HEAD:Local
