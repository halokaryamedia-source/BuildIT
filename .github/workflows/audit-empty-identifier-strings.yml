name: Audit Empty Identifier Strings

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/audit-empty-identifier-strings.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Find identity-like string fields without minLength
        working-directory: mcp
        run: |
          cat > .audit-empty-identifiers.ts <<'TS'
          import { zodToJsonSchema } from "zod-to-json-schema";
          import { toolManifest } from "./build/docs-manifest.ts";

          const identityKeys = /(^|_)(id|uuid|name|texture|group|material|animation|bone|element|project)(_|$)/i;

          function walk(value: unknown, path: string, tool: string): void {
            if (!value || typeof value !== "object") return;
            if (Array.isArray(value)) {
              value.forEach((entry, index) => walk(entry, `${path}[${index}]`, tool));
              return;
            }
            const obj = value as Record<string, unknown>;
            const properties = obj.properties as Record<string, unknown> | undefined;
            if (properties) {
              for (const [key, child] of Object.entries(properties)) {
                if (child && typeof child === "object" && !Array.isArray(child)) {
                  const c = child as Record<string, unknown>;
                  if (identityKeys.test(key) && c.type === "string" && c.minLength === undefined) {
                    console.log(JSON.stringify({ tool, path: `${path}.${key}`, description: c.description ?? "" }));
                  }
                }
                walk(child, `${path}.${key}`, tool);
              }
            }
            for (const key of ["anyOf", "oneOf", "allOf", "items", "additionalProperties"]) {
              if (obj[key] !== undefined) walk(obj[key], `${path}.${key}`, tool);
            }
          }

          for (const group of toolManifest) {
            for (const tool of group.tools) {
              const schema = zodToJsonSchema(tool.parameters, {
                $refStrategy: "none",
                errorMessages: true,
                markdownDescription: false,
              });
              walk(schema, "$", tool.name);
            }
          }
          TS
          bun .audit-empty-identifiers.ts
          rm .audit-empty-identifiers.ts
      - name: Remove temporary audit workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-empty-identifier-strings.yml
          git commit -m 'chore: remove temporary identifier audit'
          git push origin HEAD:Local
