name: Reject Texture Channel No-op

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/reject-texture-channel-noop.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reject exact no-op channel assignment before Undo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mcp/server/tools/texture.ts')
          text = path.read_text(encoding='utf-8')
          old_desc = '      "Assigns one explicit Texture to one PBR channel. Material/Texture references must resolve uniquely before Undo; existing textures on that channel are included in the edit.",'
          new_desc = '      "Assigns one explicit Texture to one PBR channel. Material/Texture references resolve before Undo; exact no-op assignments are rejected, while existing competing textures on that channel remain part of the native edit behavior.",'
          if text.count(old_desc) != 1:
              raise SystemExit('Unexpected assign_texture_channel description')
          text = text.replace(old_desc, new_desc, 1)

          anchor = '''      const resetTextures = existingTextures.filter(
        (existing: Texture) =>
          existing.pbr_channel === channel && existing.uuid !== tex.uuid
      );
      const undoTextures = [tex, ...resetTextures].filter('''
          replacement = '''      const resetTextures = existingTextures.filter(
        (existing: Texture) =>
          existing.pbr_channel === channel && existing.uuid !== tex.uuid
      );
      if (
        tex.group === textureGroup.uuid &&
        tex.pbr_channel === channel &&
        resetTextures.length === 0
      ) {
        throw new Error(
          `Texture "${tex.name}" is already the only ${channel} assignment on material "${textureGroup.name}"; no authored change is required.`
        );
      }
      const undoTextures = [tex, ...resetTextures].filter('''
          if text.count(anchor) != 1:
              raise SystemExit('Unexpected assign_texture_channel preflight anchor')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          test_path = Path('mcp/tests/pbr-channel-contract.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = '  test("rejects configure calls with no authored change", () => {'
          addition = '\n'.join([
              '  test("assign texture channel rejects an exact no-op before Undo", async () => {',
              '    const source = await Bun.file(new URL("../server/tools/texture.ts", import.meta.url)).text();',
              '    const start = source.indexOf("createTool(textureToolDocs[10].name");',
              '    const end = source.indexOf("createTool(textureToolDocs[11].name", start);',
              '    const block = source.slice(start, end);',
              '    expect(block).toContain("tex.group === textureGroup.uuid");',
              '    expect(block).toContain("tex.pbr_channel === channel");',
              '    expect(block).toContain("resetTextures.length === 0");',
              '    expect(block).toContain("no authored change is required");',
              '    expect(block.indexOf("resetTextures.length === 0")).toBeLessThan(block.indexOf("Undo.initEdit"));',
              '  });',
              '',
          ])
          if test.count(marker) != 1:
              raise SystemExit('Unexpected PBR test insertion point')
          test_path.write_text(test.replace(marker, addition + marker, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = 'A bounded GitHub-only PBR contract hardening now rejects one resolved Texture identity being assigned to multiple PBR channels in the same create/configure call before Undo and rejects identity-only `configure_material` calls that contain no authored change. Blockbench stores one `pbr_channel` per Texture, so sequential multi-channel assignment would otherwise leave only the last authored channel while the request could imply several succeeded. Existing channel replacement policy is unchanged.'
          extra = '\n\n`assign_texture_channel` now also rejects the exact runtime no-op where the requested Texture is already in the target material/channel and no competing Texture on that channel requires an edit. The guard runs before Undo; native replacement behavior for real channel changes is unchanged.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected PBR continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reject-texture-channel-noop.yml
          git add mcp/server/tools/texture.ts mcp/tests/pbr-channel-contract.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'fix: reject texture channel no-op assignments'
          git push origin HEAD:Local