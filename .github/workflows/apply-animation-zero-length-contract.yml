name: Apply Zero Length Animation Contract Fix

on:
  push:
    paths:
      - ".github/workflows/apply-animation-zero-length-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Preserve explicit zero animation length
        run: |
          python3 - <<'PY'
          from pathlib import Path

          animation_path = Path("mcp/server/tools/animation.ts")
          text = animation_path.read_text(encoding="utf-8")
          old = "        ...(animation_length && { animation_length }),"
          new = "        ...(animation_length !== undefined && { animation_length }),"
          if text.count(old) != 1:
              raise SystemExit("Unexpected create_animation length serialization shape")
          animation_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("mcp/tests/create-animation-contract.test.ts")
          if test_path.exists():
              raise SystemExit("create_animation contract test already exists")
          test_path.write_text("\n".join([
              'import { describe, expect, test } from "bun:test";',
              'import { createAnimationParameters } from "@/server/tools/animation";',
              '',
              'describe("create_animation contract", () => {',
              '  test("accepts explicit zero animation length", () => {',
              '    const result = createAnimationParameters.parse({',
              '      name: "idle",',
              '      animation_length: 0,',
              '      bones: {},',
              '    });',
              '    expect(result.animation_length).toBe(0);',
              '  });',
              '',
              '  test("serializer preserves accepted zero instead of treating it as omitted", async () => {',
              '    const source = await Bun.file(new URL("../server/tools/animation.ts", import.meta.url)).text();',
              '    expect(source).toContain("animation_length !== undefined && { animation_length }");',
              '    expect(source).not.toContain("animation_length && { animation_length }");',
              '  });',
              '});',
              '',
          ]), encoding="utf-8")

          next_path = Path("docs/knowledge/next-action.md")
          next_text = next_path.read_text(encoding="utf-8")
          anchor = "A bounded GitHub-only PBR contract hardening now rejects one resolved Texture identity being assigned to multiple PBR channels in the same create/configure call before Undo and rejects identity-only `configure_material` calls that contain no authored change. Blockbench stores one `pbr_channel` per Texture, so sequential multi-channel assignment would otherwise leave only the last authored channel while the request could imply several succeeded. Existing channel replacement policy is unchanged.\n"
          note = "\nA bounded GitHub-only animation contract correction now preserves an explicitly accepted `animation_length: 0` when constructing the Bedrock animation payload instead of dropping it through a truthiness check. AnimationCodec behavior and playback semantics are unchanged.\n"
          if next_text.count(anchor) != 1:
              raise SystemExit("Unexpected P2 continuity insertion point")
          next_path.write_text(next_text.replace(anchor, anchor + note, 1), encoding="utf-8")
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit contract fix and remove temporary workflow
        run: |
          git rm .github/workflows/apply-animation-zero-length-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: preserve explicit zero animation length"
          git push origin HEAD:Local
