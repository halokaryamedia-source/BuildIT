name: Contain Redundant Export Format Discovery

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/contain-export-format-discovery.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Default-disable redundant list_export_formats
        run: |
          python3 - <<'PY'
          from pathlib import Path

          export_path = Path('mcp/server/tools/export.ts')
          export = export_path.read_text(encoding='utf-8')
          old = '\n'.join([
              '    },',
              '    exportToolDocs[0].status',
              '  );',
              '',
              '  createTool(',
              '    exportToolDocs[1].name,',
          ])
          new = '\n'.join([
              '    },',
              '    exportToolDocs[0].status,',
              '    false',
              '  );',
              '',
              '  createTool(',
              '    exportToolDocs[1].name,',
          ])
          if export.count(old) != 1:
              raise SystemExit('Unexpected list_export_formats registration boundary')
          export_path.write_text(export.replace(old, new, 1), encoding='utf-8')

          test_path = Path('mcp/tests/prelocal-generic-semantics.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = '  test("generic full-app capture and editor-camera mutation are default-disabled", async () => {'
          addition = '\n'.join([
              '  test("fixed export-format discovery is default-disabled without removing export capability", async () => {',
              '    const exportSource = await source("server/tools/export.ts");',
              '    const skill = await source("../.agents/skills/blockit-bedrock-entity-mcp/SKILL.md");',
              '    expect(exportSource).toContain("exportToolDocs[0].status,\\n    false");',
              '    expect(exportSource).toContain("BLOCKIT_MODEL_CODEC_IDS = [\\\"bedrock\\\", \\\"project\\\"]");',
              '    expect(exportSource).toContain("const codec = registry[codec_id]");',
              '    expect(skill).toContain("`export_model` supports:");',
              '    expect(skill).not.toContain("list_export_formats");',
              '  });',
              '',
          ])
          if test.count(marker) != 1:
              raise SystemExit('Unexpected generic-semantics insertion point')
          test_path.write_text(test.replace(marker, addition + marker, 1), encoding='utf-8')

          audit_path = Path('docs/knowledge/reviews/mcp-prelocal-generic-semantics-audit-2026-08-10.md')
          audit = audit_path.read_text(encoding='utf-8')
          anchor = '\nDo not interpret this as animation reduction; Bedrock animations/controllers are owned by the separate native AnimationCodec and remain protected capability targets.\n'
          note = '\n`list_export_formats` is now **DEFAULT-DISABLED** from the normal callable surface. Its result only repeats the fixed `BLOCKIT_MODEL_CODEC_IDS` (`bedrock`, `project`) plus availability/compile metadata that `export_model` already validates at execution. The normal authoring skill calls `export_model` directly and does not consume the discovery tool. Source/catalog evidence is retained for maintainers; no export codec or artifact capability is removed.\n'
          if audit.count(anchor) != 1:
              raise SystemExit('Unexpected model-export audit anchor')
          audit_path.write_text(audit.replace(anchor, anchor + note, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Measure final callable surface and sync evidence
        working-directory: mcp
        run: |
          cat > .measure-export-discovery.ts <<'TS'
          import { McpServer } from "@modelcontextprotocol/sdk/server/mcp.js";
          import { WebStandardStreamableHTTPServerTransport } from "@modelcontextprotocol/sdk/server/webStandardStreamableHttp.js";
          import { registerToolsOnServer } from "./lib/factories";
          import "./server/tools";

          const server = new McpServer({ name: "blockit-export-discovery-audit", version: "1.0.0" });
          registerToolsOnServer(server);
          const transport = new WebStandardStreamableHTTPServerTransport({ sessionIdGenerator: undefined, enableJsonResponse: true });
          await server.connect(transport);
          try {
            const response = await transport.handleRequest(new Request("http://127.0.0.1:3000/bb-mcp", {
              method: "POST",
              headers: {
                accept: "application/json, text/event-stream",
                "content-type": "application/json",
                "mcp-protocol-version": "2025-06-18",
              },
              body: JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} }),
            }));
            const raw = await response.text();
            if (response.status !== 200) throw new Error(raw);
            const parsed = JSON.parse(raw) as { result?: { tools?: Array<{ name?: string; description?: string; inputSchema?: unknown }> } };
            const tools = parsed.result?.tools ?? [];
            const createProject = tools.find((tool) => tool.name === "create_project");
            const metrics = {
              enabled_tools: tools.length,
              response_characters: raw.length,
              input_schema_characters: tools.reduce((sum, tool) => sum + JSON.stringify(tool.inputSchema ?? {}).length, 0),
              description_characters: tools.reduce((sum, tool) => sum + (tool.description ?? "").length, 0),
              create_project_schema_characters: JSON.stringify(createProject?.inputSchema ?? {}).length,
              list_export_formats_exposed: tools.some((tool) => tool.name === "list_export_formats"),
              export_model_exposed: tools.some((tool) => tool.name === "export_model"),
            };
            if (metrics.list_export_formats_exposed || !metrics.export_model_exposed) {
              throw new Error(`Unexpected export exposure: ${JSON.stringify(metrics)}`);
            }
            await Bun.write("../.export-discovery-metrics.json", JSON.stringify(metrics));
          } finally {
            await server.close();
          }
          TS
          bun .measure-export-discovery.ts
          rm .measure-export-discovery.ts
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          import json

          metrics_path = Path('.export-discovery-metrics.json')
          m = json.loads(metrics_path.read_text())
          metrics_path.unlink()
          def n(value): return f'{value:,}'

          next_path = Path('docs/knowledge/next-action.md')
          text = next_path.read_text(encoding='utf-8')
          start = text.index('The final GitHub-only pinned-SDK `tools/list` measurement for the current source state is **')
          end = text.index('\n\n', start)
          paragraph = f'The final GitHub-only pinned-SDK `tools/list` measurement for the current source state is **{m["enabled_tools"]} enabled tools / {n(m["response_characters"])} response characters**, including **{n(m["input_schema_characters"])} characters of input schemas** and **{n(m["description_characters"])} characters of tool descriptions**. `create_project` remains **{n(m["create_project_schema_characters"])}** schema characters; `list_export_formats`, `apply_texture`, and `filter_by_material` are absent from the callable surface while `export_model` remains exposed. Historical wire totals remain source-state evidence, not a controlled performance benchmark. The next large usage lever still requires real Codex native lazy/deferred MCP tool loading proof before any BlockIT router/profile architecture.'
          note = '\n\n`list_export_formats` is default-disabled from the normal Bedrock surface because its fixed codec enumeration duplicates `export_model.codec_id` and its runtime availability checks. `export_model` remains the artifact owner, so this removes discovery/tool-choice overhead without removing Bedrock geometry or `.bbmodel` export capability.'
          next_path.write_text(text[:start] + paragraph + note + text[end:], encoding='utf-8')

          review_path = Path('docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md')
          review = review_path.read_text(encoding='utf-8')
          start = review.index('Final pinned-SDK measurement after the later Cube hardening and fixed `create_project.format` removal: **')
          end = review.index('\n\n', start)
          paragraph = f'Final pinned-SDK measurement after the later Cube/project cleanup and redundant export-format discovery containment: **{m["enabled_tools"]} tools / {n(m["response_characters"])} response characters / {n(m["input_schema_characters"])} input-schema characters / {n(m["description_characters"])} description characters**. `create_project` remains **{n(m["create_project_schema_characters"])}** schema characters; `list_export_formats`, `apply_texture`, and `filter_by_material` are absent while `export_model` remains exposed. This final line is the current-source measurement; earlier figures above are intentionally retained as historical source-state evidence.'
          review_path.write_text(review[:start] + paragraph + review[end:], encoding='utf-8')
          print(json.dumps(m))
          PY

      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified containment and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/contain-export-format-discovery.yml
          git add mcp/server/tools/export.ts mcp/tests/prelocal-generic-semantics.test.ts docs/knowledge/reviews/mcp-prelocal-generic-semantics-audit-2026-08-10.md docs/knowledge/reviews/codex-native-deferred-mcp-tool-loading-2026-08-11.md docs/knowledge/next-action.md
          git commit -m 'refactor: contain redundant export format discovery'
          git push origin HEAD:Local