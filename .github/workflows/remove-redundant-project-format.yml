name: Remove Redundant Project Format Parameter

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/remove-redundant-project-format.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Remove fixed create_project format input
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mcp/server/tools/project.ts')
          text = path.read_text(encoding='utf-8')
          old_schema = '''export const createProjectParameters = z.object({
  name: z.string().min(1).describe("Non-empty project name."),
  format: z
    .literal("bedrock")
    .optional()
    .default("bedrock")
    .describe(
      "BlockIT creates Minecraft Bedrock Entity projects only. The accepted format ID is `bedrock`; other Blockbench formats are outside the normal product surface."
    ),
});'''
          new_schema = '''export const createProjectParameters = z.object({
  name: z.string().min(1).describe("Non-empty project name."),
}).strict();'''
          if text.count(old_schema) != 1:
              raise SystemExit('Unexpected create_project schema')
          text = text.replace(old_schema, new_schema, 1)
          text = text.replace('    async execute({ name, format }) {', '    async execute({ name }) {', 1)
          text = text.replace('        format: { id: format },', '        format: { id: "bedrock" as const },', 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('mcp/tests/prelocal-generic-semantics.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old_test = '''  test("project creation accepts only the native Bedrock Entity format", () => {
    expect(createProjectParameters.parse({ name: "entity" }).format).toBe("bedrock");
    expect(createProjectParameters.safeParse({ name: "entity", format: "bedrock" }).success).toBe(true);
    expect(createProjectParameters.safeParse({ name: "entity", format: "java_block" }).success).toBe(false);
    expect(createProjectParameters.safeParse({ name: "entity", format: "bedrock_block" }).success).toBe(false);
  });'''
          new_test = '''  test("project creation has no redundant format selector", () => {
    expect(createProjectParameters.parse({ name: "entity" })).toEqual({ name: "entity" });
    expect(createProjectParameters.safeParse({ name: "entity", format: "bedrock" }).success).toBe(false);
    expect(createProjectParameters.safeParse({ name: "entity", format: "java_block" }).success).toBe(false);
    expect(createProjectParameters.safeParse({ name: "entity", format: "bedrock_block" }).success).toBe(false);
  });'''
          if test.count(old_test) != 1:
              raise SystemExit('Unexpected create_project semantics test')
          test_path.write_text(test.replace(old_test, new_test, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          anchor = '\nThe current source slice has hardened **P1 — tool-choice / context friction** with a stage-gated normal geometry lane.'
          note = '\n`create_project` no longer exposes a redundant `format` input. The normal BlockIT project format is a fixed product invariant (`bedrock`), so the removed literal/default field never changed runtime behavior and only added schema/tool-call noise. Project creation still uses native `newProject(Formats.bedrock)` and returns `format.id = bedrock`.\n'
          if next_text.count(anchor) != 1:
              raise SystemExit('Unexpected next-action tool-choice anchor')
          next_path.write_text(next_text.replace(anchor, note + anchor, 1), encoding='utf-8')
          PY

      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified schema cleanup and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-redundant-project-format.yml
          git add mcp/server/tools/project.ts mcp/tests/prelocal-generic-semantics.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'refactor: remove redundant project format input'
          git push origin HEAD:Local