name: Finalize MCP Generated Docs

on:
  push:
    paths:
      - ".github/workflows/finalize-mcp-docs.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frozen dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Regenerate committed MCP docs
        working-directory: mcp
        run: bun run docs:build

      - name: Full retained typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Generated docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Commit generated docs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/docs/api.json mcp/docs/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Generated docs already fresh."
            exit 0
          fi
          git commit -m "docs: refresh generated MCP reference"
          git push origin Local
