name: Harden Locator Numeric Safety

on:
  push:
    branches: [Local]
    paths:
      - '.github/workflows/harden-locator-numeric-safety.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reject non-finite Locator authored transforms
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mcp/server/tools/locators.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import { vector3Schema } from "@/lib/zodObjects";\n', '')
          anchor = 'const locatorCreateSchema = z\n'
          helper = '\n'.join([
              'const finiteLocatorVector3Schema = z.tuple([',
              '  z.number().finite(),',
              '  z.number().finite(),',
              '  z.number().finite(),',
              ']);',
              '',
          ])
          if 'const finiteLocatorVector3Schema' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('Unexpected Locator schema anchor')
              text = text.replace(anchor, helper + anchor, 1)
          count = text.count('vector3Schema')
          if count != 5:
              raise SystemExit(f'Expected 5 Locator vector3Schema uses, found {count}')
          text = text.replace('vector3Schema', 'finiteLocatorVector3Schema')

          state_anchor = 'function locatorState(locator: Locator) {\n'
          state_helper = '\n'.join([
              'function finiteAuthoredVector3(',
              '  values: readonly number[],',
              '  context: string',
              '): [number, number, number] {',
              '  if (values.length !== 3 || values.some((value) => !Number.isFinite(value))) {',
              '    throw new Error(',
              '      `${context} contains a non-finite authored transform and cannot be reported safely. Correct the project state before continuing.`',
              '    );',
              '  }',
              '  return [values[0], values[1], values[2]];',
              '}',
              '',
          ])
          if 'function finiteAuthoredVector3' not in text:
              if text.count(state_anchor) != 1:
                  raise SystemExit('Unexpected Locator state anchor')
              text = text.replace(state_anchor, state_helper + state_anchor, 1)
          old_position = '    position: [...locator.position] as [number, number, number],'
          new_position = '    position: finiteAuthoredVector3(locator.position, `Locator ${locator.name} (${locator.uuid}) position`),'
          if text.count(old_position) != 1:
              raise SystemExit('Unexpected Locator position state')
          text = text.replace(old_position, new_position, 1)
          old_rotation = '    rotation: [...locator.rotation] as [number, number, number],'
          new_rotation = '    rotation: finiteAuthoredVector3(locator.rotation, `Locator ${locator.name} (${locator.uuid}) rotation`),'
          if text.count(old_rotation) != 1:
              raise SystemExit('Unexpected Locator rotation state')
          text = text.replace(old_rotation, new_rotation, 1)
          old_null = '    position: [...element.position] as [number, number, number],'
          new_null = '    position: finiteAuthoredVector3(element.position, `Null Object ${element.name} (${element.uuid}) position`),'
          if text.count(old_null) != 1:
              raise SystemExit('Unexpected Null Object position state')
          path.write_text(text.replace(old_null, new_null, 1), encoding='utf-8')

          test_path = Path('mcp/tests/bedrock-locator-coverage.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = '  test("Null Object base mutation does not invent rotation or IK mutation", () => {'
          addition = '\n'.join([
              '  test("Locator and Null Object transforms reject non-finite authored coordinates", async () => {',
              '    expect(manageLocatorParameters.safeParse({ action: "create", name: "muzzle", parent: "bone", position: [Infinity, 0, 0] }).success).toBe(false);',
              '    expect(manageLocatorParameters.safeParse({ action: "update", id: "loc", rotation: [0, -Infinity, 0] }).success).toBe(false);',
              '    expect(manageNullObjectParameters.safeParse({ action: "update", id: "null", position: [0, 0, Infinity] }).success).toBe(false);',
              '',
              '    const locatorSource = await source("server/tools/locators.ts");',
              '    expect(locatorSource).toContain("finiteAuthoredVector3(locator.position");',
              '    expect(locatorSource).toContain("finiteAuthoredVector3(locator.rotation");',
              '    expect(locatorSource).toContain("finiteAuthoredVector3(element.position");',
              '    expect(locatorSource).not.toContain("vector3Schema");',
              '  });',
              '',
          ])
          if test.count(marker) != 1:
              raise SystemExit('Unexpected Locator test insertion point')
          test_path.write_text(test.replace(marker, addition + marker, 1), encoding='utf-8')

          next_path = Path('docs/knowledge/next-action.md')
          next_text = next_path.read_text(encoding='utf-8')
          marker = 'Locator and Null Object creation now share deterministic exact-name behavior: both reject an existing same-type exact name before Undo, matching their UUID-first / unique-exact-name resolvers. No cross-type naming restriction was added.'
          extra = '\n\nLocator/Null Object authored transforms now require finite 3D coordinates at the MCP boundary. Their resulting/read state also refuses to serialize a pre-existing non-finite position/rotation, preventing `JSON.stringify` from silently turning poisoned numeric state into `null`. Parent, Undo, serialization, and family ownership are unchanged.'
          if next_text.count(marker) != 1:
              raise SystemExit('Unexpected Locator continuity marker')
          next_path.write_text(next_text.replace(marker, marker + extra, 1), encoding='utf-8')
          PY
      - name: Install from lockfile
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck
      - name: Contract tests
        working-directory: mcp
        run: bun run test
      - name: Production build
        working-directory: mcp
        run: bun run build
      - name: Regenerate docs
        working-directory: mcp
        run: bun run docs:build
      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-locator-numeric-safety.yml
          git add mcp/server/tools/locators.ts mcp/tests/bedrock-locator-coverage.test.ts mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json docs/knowledge/next-action.md
          git commit -m 'fix: harden Locator numeric safety'
          git push origin HEAD:Local