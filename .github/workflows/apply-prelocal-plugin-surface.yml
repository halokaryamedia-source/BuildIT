name: Apply Pre-Local Plugin Surface

on:
  push:
    paths:
      - ".github/workflows/apply-prelocal-plugin-surface.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply guarded E patch
        run: python .github/prelocal_plugin_surface_patch.py

      - name: Install dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Tests
        working-directory: mcp
        run: bun run test

      - name: Build
        working-directory: mcp
        run: bun run build

      - name: Refresh generated MCP reference
        working-directory: mcp
        run: bun run docs:build

      - name: Docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit E narrowing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp docs/knowledge/reviews/bedrock-entity-capability-surface-matrix.md docs/knowledge/reviews/mcp-prelocal-generic-semantics-audit-2026-08-10.md
          git diff --cached --quiet && { echo "No E target changes to commit"; exit 1; }
          git commit -m "fix: narrow generic MCP semantics before local proof"
          git push origin HEAD:Local
