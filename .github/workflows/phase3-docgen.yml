name: Phase 3 Docs Regeneration

on:
  push:
    branches:
      - Local
    paths:
      - "mcp/server/tools/cubes.ts"
      - "mcp/tests/place-cube-creation-completeness.test.ts"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Regenerate MCP docs
        working-directory: mcp
        run: bun run docs:build

      - name: Commit generated docs
        run: |
          if git diff --quiet -- mcp/docs/api.json mcp/docs/index.html; then
            echo "Generated docs already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/docs/api.json mcp/docs/index.html
          git commit -m "docs: regenerate MCP API after place_cube completeness"
          git push origin HEAD:Local
