name: Rework Asymmetric Asset Hardening

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/apply_asymmetry_hardening.py"
      - ".github/scripts/fix_asymmetry_hardening.py"
      - ".github/workflows/rework-asymmetry-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rework-asymmetry-hardening
  cancel-in-progress: true

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Rework
        uses: actions/checkout@v4
        with:
          ref: Rework
          fetch-depth: 0

      - name: Apply asymmetric asset hardening
        run: |
          python .github/scripts/apply_asymmetry_hardening.py
          python .github/scripts/fix_asymmetry_hardening.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: mcp-blockbench
        run: bun install --frozen-lockfile

      - name: Synchronize production skills
        working-directory: mcp-blockbench
        run: bun run skills:sync

      - name: Verify synchronized skills
        id: skills
        continue-on-error: true
        working-directory: mcp-blockbench
        run: |
          set -o pipefail
          bun run skills:check 2>&1 | tee "$GITHUB_WORKSPACE/asymmetry-skills.log"

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        working-directory: mcp-blockbench
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee "$GITHUB_WORKSPACE/asymmetry-typecheck.log"

      - name: Test
        id: test
        continue-on-error: true
        working-directory: mcp-blockbench
        run: |
          set -o pipefail
          bun test 2>&1 | tee "$GITHUB_WORKSPACE/asymmetry-test.log"

      - name: Build canonical plugin
        id: build
        continue-on-error: true
        working-directory: mcp-blockbench
        run: |
          set -o pipefail
          bun run build 2>&1 | tee "$GITHUB_WORKSPACE/asymmetry-build.log"

      - name: Verify asymmetric runtime markers
        id: bundle
        continue-on-error: true
        working-directory: mcp-blockbench
        run: |
          set -o pipefail
          bun -e 'const text = await Bun.file("dist/mcp.js").text(); for (const marker of ["right_side", "geometry_right.png", "ASYMMETRIC", "symmetry_policy"]) { if (!text.includes(marker)) throw new Error(`Missing asymmetric runtime marker: ${marker}`); }' 2>&1 | tee "$GITHUB_WORKSPACE/asymmetry-bundle.log"

      - name: Capture diagnostics
        if: always()
        run: |
          git diff --binary > "$GITHUB_WORKSPACE/asymmetry.patch"
          tar -czf "$GITHUB_WORKSPACE/asymmetry-source.tar.gz" \
            engines/chatgpt/skills/blockbench-reference-studio \
            engines/shared/skills \
            engines/shared/profiles/stage-profiles.json \
            engines/shared/workflow/EVIDENCE_CONTRACT.md \
            mcp-blockbench/src \
            mcp-blockbench/tests \
            openspec/changes/codex-local-workflow-rework/tasks.md

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rework-asymmetry-diagnostics
          path: |
            asymmetry-*.log
            asymmetry.patch
            asymmetry-source.tar.gz
          retention-days: 3

      - name: Enforce verification
        if: always()
        env:
          SKILLS: ${{ steps.skills.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BUNDLE: ${{ steps.bundle.outcome }}
        run: |
          printf 'skills=%s\ntypecheck=%s\ntest=%s\nbuild=%s\nbundle=%s\n' \
            "$SKILLS" "$TYPECHECK" "$TEST" "$BUILD" "$BUNDLE"
          if [[ "$SKILLS" != "success" || \
                "$TYPECHECK" != "success" || \
                "$TEST" != "success" || \
                "$BUILD" != "success" || \
                "$BUNDLE" != "success" ]]; then
            exit 1
          fi

      - name: Commit verified asymmetric hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f mcp-blockbench/dist/mcp.js
          git commit -m "feat: validate asymmetric assets with right-side evidence"
          git push origin HEAD:Rework
