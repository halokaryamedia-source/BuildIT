name: PRO-6 Scalar Expression Fix

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/pro6-scalar-expression-fix.yml"

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Local
        uses: actions/checkout@v4
        with:
          ref: Local

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Apply scalar expression execution fix
        run: python3 .github/scripts/pro6_scalar_expression_fix.py

      - name: Typecheck
        working-directory: mcp
        run: bun run typecheck

      - name: Contract tests
        working-directory: mcp
        run: bun run test

      - name: Production build
        working-directory: mcp
        run: bun run build

      - name: Generated docs freshness
        working-directory: mcp
        run: bun run docs:check

      - name: Commit retained fix and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pro6-scalar-expression-fix.yml
          git rm .github/scripts/pro6_scalar_expression_fix.py
          git add -A
          git commit -m "fix: preserve scalar Molang keyframe values"
          git push origin HEAD:Local
