name: Prelocal E2E Hardening

on:
  push:
    branches:
      - Rework
    paths:
      - ".github/scripts/apply_prelocal_e2e_hardening.py"
      - ".github/workflows/prelocal-e2e-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prelocal-e2e-hardening
  cancel-in-progress: true

jobs:
  harden-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Rework
        uses: actions/checkout@v4
        with:
          ref: Rework
          fetch-depth: 0

      - name: Apply pre-local hardening
        run: python .github/scripts/apply_prelocal_e2e_hardening.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: mcp-blockbench
        run: bun install --frozen-lockfile

      - name: Synchronize production skill adapters
        working-directory: mcp-blockbench
        run: bun run skills:sync

      - name: Verify synchronized skills
        working-directory: mcp-blockbench
        run: bun run skills:check

      - name: Typecheck
        working-directory: mcp-blockbench
        run: bun run typecheck

      - name: Run full test suite
        working-directory: mcp-blockbench
        run: bun test

      - name: Build canonical plugin
        working-directory: mcp-blockbench
        run: bun run build

      - name: Verify committed bundle contract
        working-directory: mcp-blockbench
        run: |
          bun -e 'const pkg = await Bun.file("package.json").json(); const text = await Bun.file("dist/mcp.js").text(); for (const marker of [`/* v${pkg.version} */`, `version:\"${pkg.version}\"`, "STABLE_FULL_LIBRARY", "ACTIVE_PROFILE_GUARDED", "current_session_continues", "final_right.png", "resolveApprovedStageTransition", "submit_geometry_for_review"]) { if (!text.includes(marker)) throw new Error(`Missing pre-local bundle marker: ${marker}`); }'

      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f mcp-blockbench/dist/mcp.js
          if git diff --cached --quiet; then
            echo "Pre-local end-to-end hardening is already applied."
            exit 0
          fi
          git commit -m "fix: harden no-reconnect end-to-end production flow"
          git push origin HEAD:Rework
