name: Route 1 Docs Materialize

on:
  push:
    branches:
      - route1-geometry-evidence-ci

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Generate canonical MCP docs
        run: bun run docs:build

      - name: Publish generated docs as unreferenced Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          create_blob() {
            local file="$1"
            local payload="$RUNNER_TEMP/route1-blob.json"
            jq -Rs '{content: ., encoding: "utf-8"}' < "$file" > "$payload"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs" \
              --data-binary @"$payload" \
              | jq -r '.sha'
          }

          api_sha="$(create_blob docs/api.json)"
          html_sha="$(create_blob docs/index.html)"

          test -n "$api_sha" && test "$api_sha" != "null"
          test -n "$html_sha" && test "$html_sha" != "null"

          echo "ROUTE1_GENERATED_API_BLOB=$api_sha"
          echo "ROUTE1_GENERATED_HTML_BLOB=$html_sha"
