# BuildIT project defaults. Explicit user model selections may override the parent
# thread, but AGENTS.md routes substantive work to the locked custom agents below.
model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
model_reasoning_summary = "concise"
model_verbosity = "low"

[agents]
# One root/controller plus at most one active specialist. Avoid broad fan-out.
max_threads = 2
# Direct children only. Workers must never spawn additional workers.
max_depth = 1
# Avoid adding interruption text to worker context unless the user explicitly asks.
interrupt_message = false
