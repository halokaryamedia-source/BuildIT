schema: spec-driven

context: |
  Project: BuildIT is a local reference-to-production system containing one MCP Blockbench TypeScript/Bun plugin, ChatGPT Reference Studio, Codex orchestration, shared workflow governance, and local Asset workspaces.
  Bounded contexts: see CONTEXT-MAP.md and the context-specific CONTEXT.md glossaries.
  System foundation: docs/architecture/SYSTEM_FOUNDATION.md.
  Foundation audit: docs/architecture/FOUNDATION_AUDIT.md.
  Current foundation change: openspec/changes/buildit-system-foundation/.
  Existing production-flow implementation history: openspec/changes/codex-local-workflow-rework/.
  MCP package root: mcp-blockbench/ contains source, scripts, prompts, tests, package files, and generated dist output.
  Shared governance: engines/shared/workflow/GOVERNANCE.md.
  Asset-production Codex entry point: engines/codex/BOOTSTRAP.md.
  Repository-development Codex entry point: engines/codex/DEVELOPMENT_BOOTSTRAP.md.
  Workspace index: workspace/workspace.json selects one Asset and is not Runtime State.
  Runtime State: workspace/active/<asset>/mcp/state.json.
  Project identity and canonical paths: workspace/active/<asset>/mcp/project.json.
  User-facing Blockbench data: workspace/*/<asset>/blockbench/ contains the canonical .bbmodel, textures, reference images, and approved previews.
  MCP internal data: workspace/*/<asset>/mcp/ contains Runtime State, contracts, checkpoints, Evidence, reports, and temporary final staging.
  Completed Baselines: workspace/completed/<asset>/ retains the user package and frozen recovery metadata.
  Tool execution policy: engines/shared/profiles/tool-profiles.json and stage-profiles.json.
  Skill loading policy: engines/shared/skills/skill-profiles.json.
  Workspace lifecycle: engines/shared/workspace/WORKSPACE_CONTRACT.md.
  Normal Blockbench endpoint: http://localhost:3000/bb-mcp with Codex key blockbench; do not scan or create alternate Blockbench MCP keys.
  Current source facts: package version 1.7.0; runtime tool counts and installed Codex model/provider support must be verified rather than assumed.
  Product architecture: ChatGPT Reference Studio -> approved Reference Package -> Codex + MCP Blockbench -> completed user-facing package.
  Requirements domain: explicit user instruction and the active bounded OpenSpec change own requested outcomes, non-goals, and acceptance criteria.
  Scope/efficiency domain: Ponytail selects the smallest sufficient slice, resource budget, preservation boundary, and stop point.
  Engineering-method domain: Engineering Discipline owns domain modeling, deep-module design, TDD, reproducible debugging, architecture work, and separate Standards/Spec review.
  Context-intelligence domain: Code Review Graph may narrow repository source and blast radius, but every claim is confirmed against current source and diff.
  Model-execution domain: the deterministic Capability Gate determines eligibility and permissions; a replaceable Model Selector chooses only inside the Candidate Pool.
  Technical proof: current source, tests, typecheck, build, runtime behavior, rendered Evidence, and integrity hashes.
  BuildIT has no single linear authority hierarchy. Conflicts are resolved by question type and domain ownership.
  RouteLLM status: evaluation-only candidate Model Selector. Runtime adoption requires a proven Codex/provider seam, BuildIT calibration data, shadow acceptance, and a later explicit decision.
  Reference package: PRODUCTION_CONTEXT.md, one Reference Visual, GEOMETRY.md, TEXTURING.md, ANIMATION.md, VALIDATION.md, reference_manifest.json, and CODEX_REFERENCE_HANDOFF.md.
  User-visible production Stages: Geometry, Texture, optional Animation, and Final Validation.
  Internal passes, coordination, and validation are not additional user Review Gates.
  Production skill context: load blockbench-production plus exactly one active-stage skill; maximum 2.
  Repository development skill context: load engineering-discipline and optionally code-review-graph; maximum 2 and production skills are forbidden.
  Initial construction may use bounded multi-part batches; revision work targets one named issue or tightly related pair.
  Branch policy: keep active foundation and production-flow work on Rework until explicit integration approval.
  Verification policy: every bounded change must pass synchronized skills, typecheck, tests, build, bundle verification, Standards review, and Spec review. General production readiness additionally requires real Blockbench E2E and multi-archetype evidence.

# Per-artifact rules may be added under rules when required.
