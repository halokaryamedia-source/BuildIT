schema: spec-driven

context: |
  Project: BuildIT contains one MCP Blockbench TypeScript/Bun plugin package plus shared AI-engine orchestration.
  MCP package root: mcp-blockbench/ contains src/, scripts/, prompts/, tests/, package files, and generated dist/ output.
  Shared engine workflow: engines/shared/.
  Codex entry point: engines/codex/BOOTSTRAP.md.
  Governance: engines/shared/workflow/GOVERNANCE.md.
  Workspace index: workspace/workspace.json selects one active project and is not runtime authority.
  Runtime authority: workspace/active/<asset>/mcp/state.json.
  Project resume metadata: workspace/active/<asset>/mcp/project.json.
  User-facing Blockbench data: workspace/*/<asset>/blockbench/ contains the canonical .bbmodel, textures, reference PNGs, and approved previews.
  MCP internal data: workspace/*/<asset>/mcp/ contains state, technical contracts, checkpoints, evidence, and reports.
  Completed projects: workspace/completed/<asset>/ retains both separated areas so the model can be copied alone or reopened later without rediscovery.
  Tool-profile authority: engines/shared/profiles/tool-profiles.json.
  Skill-profile authority: engines/shared/skills/skill-profiles.json.
  Workspace lifecycle authority: engines/shared/workspace/WORKSPACE_CONTRACT.md.
  Documentation: authored documentation lives in docs/; generated MCP API output lives only in docs/api/.
  Default and only normal Blockbench endpoint: http://localhost:3000/bb-mcp with the Codex key blockbench; do not scan or fall back to alternate ports.
  Current source facts: package version 1.7.0; runtime tool counts must be verified rather than assumed.
  Guardrails: do not create a second Blockbench MCP server, parallel source root, versioned folder, duplicate canonical model, or unrelated agent framework.
  Active workflow change: openspec/changes/codex-local-workflow-rework/.
  OpenSpec responsibility: preserve approved goal, scope, non-goals, stages, decisions, blockers, deferred items, and acceptance criteria so the agent does not forget or overdevelop.
  Ponytail responsibility: select the smallest safe action required now, reuse existing work, limit tools/evidence, preserve accepted areas, and stop when the active requirement is met.
  Engineering Discipline responsibility: govern repository implementation quality through public-seam TDD, reproducible debugging, architecture care, and separate Standards/Spec review; it must not create a second planning or approval authority.
  Code Review Graph responsibility: provide optional local minimal-context navigation, dependency/blast-radius analysis, and affected-test discovery for repository development; graph output is evidence for selecting files, never specification or correctness authority.
  Repository development authority order: OpenSpec -> Ponytail -> engineering-discipline -> code-review-graph when available -> direct source and deterministic verification.
  Repository development fallback: when code-review-graph is unavailable, stale, or incomplete, continue with direct repository search and source inspection.
  Reference package: PRODUCTION_CONTEXT.md, one Reference Visual, GEOMETRY.md, TEXTURING.md, ANIMATION.md, VALIDATION.md, reference_manifest.json, and CODEX_REFERENCE_HANDOFF.md.
  User-visible production stages: Geometry, Texture, optional Animation, and Final Validation.
  Internal passes do not require separate routine approval.
  Each completed user-visible stage must produce preview evidence and wait for user approval or targeted revision feedback.
  Initial construction may use bounded multi-part batches; one-issue-per-cycle applies to revision work.
  Production skill context: load blockbench-production plus exactly one active-stage skill; maximum loaded production skills is 2.
  Repository development skill context: load engineering-discipline and optionally code-review-graph; maximum support skills is 2 and production skills remain forbidden.
  Repository development must not load production skills.
  Mandatory local procedure: engines/codex/BOOTSTRAP.md and the active-stage contract under engines/shared/.
  Active modelling category: Bedrock Entity and Bedrock Block unless explicitly overridden.
  UV default: use Per-face UV for custom Bedrock projects unless the approved reference package explicitly says otherwise.
  Branch policy: keep all active workflow rework isolated on Rework until the user explicitly approves final integration.
  CI policy: continuous integration, PR-preview deployment, and release verification are deferred until workflow implementation is stable and the user opens the final verification stage.

# Per-artifact rules may be added under rules when required.