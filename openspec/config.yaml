schema: spec-driven

context: |
  Project: BuildIT contains one MCP Blockbench TypeScript/Bun plugin package plus shared AI-engine orchestration.
  MCP package root: mcp-blockbench/ contains src/, scripts/, prompts/, tests/, package files, and generated dist/ output.
  Shared engine workflow: engines/shared/.
  Codex entry point: engines/codex/BOOTSTRAP.md.
  Governance: engines/shared/workflow/GOVERNANCE.md.
  Runtime authority: workspace/sessions/<asset>/state.json.
  Documentation: authored documentation lives in docs/; generated MCP API output lives only in docs/api/.
  Default and only normal MCP endpoint: http://localhost:3000/bb-mcp with the Codex key blockbench; do not scan or fall back to alternate ports.
  Current source facts: package version 1.6.0; runtime tool counts must be verified rather than assumed.
  Guardrails: do not create a second MCP server, parallel source root, versioned folder, or unrelated agent framework.
  Active workflow change: openspec/changes/codex-local-workflow-rework/.
  OpenSpec responsibility: preserve approved goal, scope, non-goals, stages, decisions, blockers, deferred items, and acceptance criteria so the agent does not forget or overdevelop.
  Ponytail responsibility: select the smallest safe action required now, reuse existing work, limit tools/evidence, preserve accepted areas, and stop when the active requirement is met.
  Reference package: PRODUCTION_CONTEXT.md, one Reference Visual, GEOMETRY.md, TEXTURING.md, ANIMATION.md, VALIDATION.md, reference_manifest.json, and CODEX_REFERENCE_HANDOFF.md.
  User-visible production stages: Geometry, Texture, optional Animation, and Final Validation.
  Internal passes do not require separate routine approval.
  Each completed user-visible stage must produce preview evidence and wait for user approval or targeted revision feedback.
  Initial construction may use bounded multi-part batches; one-issue-per-cycle applies to revision work.
  Modelling context: use the installed blockbench-use skill and only the active-stage skill/tool profile.
  Mandatory procedure: docs/workflow/mandatory-blockbench-mcp-procedure.md.
  Active modelling category: Bedrock Entity and Bedrock Block unless explicitly overridden.
  UV default: use Per-face UV for custom Bedrock projects unless the approved reference package explicitly says otherwise.
  Branch policy: keep all active workflow rework isolated on Rework until the user explicitly approves final integration.
  CI policy: continuous integration, PR-preview deployment, and release verification are deferred until workflow implementation is stable and the user opens the final verification stage.

# Per-artifact rules may be added under rules when required.
