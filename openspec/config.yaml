schema: spec-driven

context: |
  Project: MCP Blockbench, a TypeScript/Bun Blockbench plugin exposing tools, prompts, and resources through MCP.
  Existing architecture: preserve the current plugin source, server/ MCP glue, generated docs/api.json, and Blockbench settings endpoint.
  Default MCP endpoint: http://localhost:3000/bb-mcp; multiple Blockbench windows may use later ports and must be verified.
  Current source facts: package version 1.6.0; generated API docs report 109 tools, 7 prompts, and 12 resources.
  Guardrails: do not create a new MCP server, add dependencies, replace architecture, invent tools, or introduce unrelated agent frameworks.
  Codex workflow: use direct Streamable HTTP first, fall back to mcp-remote only if direct HTTP cannot list tools.
  Review: run Ponytail anti-overengineering review when available; otherwise perform the same manual review.
  Modelling context: Minecraft / Blockbench workflows must use the SourceDocument/modeling context pack and the installed blockbench-use skill before modelling.
  Mandatory modelling procedure: SourceDocument/modeling/mandatory-blockbench-mcp-procedure.md controls phase gates, required skills, MCP readiness, session rules, and user approval before any Blockbench edit.
  Required production phases: Reference Collection, Main Geometry, Geometry Detailing, UV Texture, Base Texturing, Detail Texturing, Polish, and Final Review. Do not skip or merge phases without explicit user approval.
  Active modelling category: Bedrock Entity only, unless explicitly overridden.
  UV default: use Per-face UV for Bedrock Entity projects.
  Reference sample: use SourceDocument/modeling/bedrock-mcp-modeling-focus.md for lessons from the Ninja Weapon Academy resource pack.

